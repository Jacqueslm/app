# Builds the Play Store app shell (.aab) from TurnSomeDayIntoOneday/twa/
# so nobody needs an Android toolchain on their own machine.
#
# Output is UNSIGNED on purpose: the signing key must never live in a public
# repo. The unsigned bundle is pushed to the `twa-build` branch; a session
# downloads it, signs it with Jacques's upload key, and hands him the file.
name: Build the Play app (.aab)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Point bubblewrap at the runner's JDK and Android SDK
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME_17_X64" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      # Every run of this workflow ever - six, counting three on 17 Aug - died
      # with "The provided androidSdk isn't correct". Read from bubblewrap's own
      # source (core/lib/androidSdk/AndroidSdkTools.js): validatePath demands a
      # `tools/` or `bin/` folder directly under androidSdkPath, the pre-2021
      # command-line-tools layout, and installBuildTools later looks for
      # `tools/bin/sdkmanager`. The runner's SDK keeps sdkmanager under
      # `cmdline-tools/latest/bin`, so the check can never pass on a stock
      # ANDROID_HOME. One symlink gives bubblewrap the old name for the new
      # place and satisfies every path it builds. Licenses are accepted so
      # gradle may fetch anything else; build-tools 36.1.0 is what this
      # bubblewrap pins (BUILD_TOOLS_VERSION) and the image already ships it -
      # the install is a no-op safety net for future slimmer images.
      - name: Give bubblewrap the legacy SDK layout it validates
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "build-tools;36.1.0" > /dev/null
          ln -sfn "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools" \
            || sudo ln -sfn "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          ls "$ANDROID_HOME" "$ANDROID_HOME/tools/bin" | head -30

      # bubblewrap update fetches manifest.json from the live site, and a push
      # to the deploy branch minutes before a build - the natural sequence -
      # restarts the site for ~a minute. Runs 5 and 8 both died in exactly that
      # window with a 502. Wait for the site instead of racing it.
      - name: Wait for the live site to answer (a fresh deploy 502s briefly)
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://www.turnsomedayintodayone.com/manifest.json)
            [ "$code" = "200" ] && { echo "site is up (attempt $i)"; exit 0; }
            echo "attempt $i: got $code, waiting 10s"
            sleep 10
          done
          echo "site did not come up within 5 minutes"; exit 1

      - name: Regenerate the Android project (pulls current billing library)
        working-directory: TurnSomeDayIntoOneday/twa
        # --skipVersionUpgrade: CI has no keyboard; use the version already in
        # twa-manifest.json (1.0.1 / code 2) instead of prompting for one.
        run: bubblewrap update --skipVersionUpgrade

      - name: Build unsigned bundle
        working-directory: TurnSomeDayIntoOneday/twa
        run: |
          bubblewrap build --skipSigning --skipPwaValidation
          ls -la *.aab *.apk 2>/dev/null || true

      - name: Push the bundle to the twa-build branch
        run: |
          set -e
          # A signed build drops the .aab in the project root; --skipSigning
          # leaves it where gradle wrote it. Look in both, root first.
          AAB=$(ls TurnSomeDayIntoOneday/twa/*.aab 2>/dev/null | head -1)
          test -n "$AAB" || AAB=$(ls TurnSomeDayIntoOneday/twa/app/build/outputs/bundle/release/*.aab | head -1)
          test -n "$AAB"
          mkdir -p /tmp/out && cp "$AAB" /tmp/out/
          cp TurnSomeDayIntoOneday/twa/twa-manifest.json /tmp/out/
          cd /tmp/out
          git init -q -b twa-build
          git config user.name "twa-build"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Unsigned .aab built from twa-manifest.json ($GITHUB_SHA)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" twa-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
