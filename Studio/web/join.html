<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0c29">
<title>Join the list</title>
<style>
:root{
  --brand:#0f0c29;--accent:#534AB7;--green:#7ee8a2;
  --f:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--brand);font-family:var(--f)}
body{display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:400px;text-align:center;color:#fff}
.logo{width:64px;height:64px;background:var(--accent);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;border:3px solid var(--green);font-size:26px}
h1{font-size:24px;font-weight:600;margin-bottom:10px;line-height:1.3}
p{font-size:14px;color:#c0caff;margin-bottom:24px;line-height:1.6}
.input{width:100%;background:rgba(255,255,255,0.08);border:0.5px solid rgba(255,255,255,0.15);border-radius:12px;padding:14px 16px;font-size:15px;color:#fff;margin-bottom:12px;font-family:var(--f);outline:none}
.input::placeholder{color:#6672a0}
.input:focus{border-color:var(--green)}
.btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:500;cursor:pointer;font-family:var(--f)}
.btn:disabled{opacity:0.6;cursor:default}
.msg{margin-top:14px;font-size:13px;min-height:18px}
.msg.ok{color:var(--green)}
.msg.err{color:#f38b8a}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.done{display:none}
</style>
</head>
<body>
<div class="card">
  <div id="form-view">
    <div class="logo">🎵</div>
    <h1>Get new music first</h1>
    <p>No spam, no noise — just a note when something new drops.</p>
    <input class="input" id="email" type="email" placeholder="you@example.com" autocomplete="email">
    <input class="hp" id="hp" tabindex="-1" autocomplete="off">
    <button class="btn" id="go">Join the list</button>
    <p class="msg" id="msg"></p>
  </div>
  <div id="done-view" class="done">
    <div class="logo">✓</div>
    <h1>You're on the list</h1>
    <p>Thanks for signing up — you'll hear about new releases first.</p>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
$('#go').onclick = async () => {
  const email = $('#email').value.trim();
  const msg = $('#msg');
  msg.textContent = ''; msg.className = 'msg';
  if (!EMAIL_RE.test(email)) { msg.textContent = 'Enter a valid email address.'; msg.className = 'msg err'; return; }
  $('#go').disabled = true;
  $('#go').textContent = 'Joining…';
  try {
    const res = await fetch('/api/join', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, hp: $('#hp').value, source: 'join.html' }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { msg.textContent = data.error || 'Something went wrong.'; msg.className = 'msg err'; $('#go').disabled = false; $('#go').textContent = 'Join the list'; return; }
    $('#form-view').style.display = 'none';
    $('#done-view').style.display = 'block';
  } catch (e) {
    msg.textContent = 'Could not reach the server. Check your connection and try again.';
    msg.className = 'msg err';
    $('#go').disabled = false;
    $('#go').textContent = 'Join the list';
  }
};
$('#email').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#go').click(); });
</script>
</body>
</html>
