<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stats — Turn Someday Into Day One</title>
<meta name="robots" content="noindex,nofollow">
<style>
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:#12111c;color:#e8e8f0;margin:0;padding:20px;line-height:1.5}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:15px;margin:26px 0 8px;color:#9aa0c8;text-transform:uppercase;letter-spacing:.08em}
.meta{font-size:12px;color:#7e86b8;margin-bottom:8px}
table{border-collapse:collapse;width:100%;font-size:13px;margin-bottom:8px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid #2b2a3d}
th{color:#9aa0c8;font-weight:600;font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;border-top:2px solid #444258;border-bottom:none}
.cards{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.card{background:#1c1b2a;border:1px solid #2b2a3d;border-radius:8px;padding:12px 16px;min-width:120px}
.card .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.card .l{font-size:11px;color:#7e86b8;margin-top:2px}
.note{font-size:12px;color:#7e86b8;margin-top:6px}
.err{background:#3a1f24;border:1px solid #6b3540;border-radius:8px;padding:14px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Stats</h1>
  <div class="meta" id="meta">Loading…</div>
  <div id="out"></div>
</div>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function table(cols,rows,totalRow){
  let h='<table><tr>'+cols.map(c=>`<th class="${c.n?'n':''}">${esc(c.label)}</th>`).join('')+'</tr>';
  if(!rows.length)h+=`<tr><td colspan="${cols.length}" style="color:#7e86b8">No rows yet.</td></tr>`;
  rows.forEach(r=>{h+='<tr>'+cols.map(c=>`<td class="${c.n?'n':''}">${esc(r[c.key])}</td>`).join('')+'</tr>';});
  if(totalRow)h+='<tr class="tot">'+cols.map(c=>`<td class="${c.n?'n':''}">${esc(totalRow[c.key])}</td>`).join('')+'</tr>';
  return h+'</table>';
}
function sum(rows,key){return rows.reduce((a,r)=>a+(r[key]||0),0);}
fetch('/api/admin/stats').then(async r=>{
  const d=await r.json();
  if(!r.ok){
    document.getElementById('meta').textContent='';
    document.getElementById('out').innerHTML=`<div class="err">${esc(d.error||'Could not load stats.')}</div>`;
    return;
  }
  document.getElementById('meta').textContent='Generated '+new Date(d.generated_at).toLocaleString();
  const t=d.totals,u=d.usage;
  let h='';
  h+='<h2>Totals</h2><div class="cards">'+
    [['Accounts',t.signups]]
      .map(([l,n])=>`<div class="card"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`).join('')+'</div>'+
    '<div class="note">Trial starts, paid accounts, conversion rates and lead totals were shown here until 5 Oct 2026. They went with the billing columns and the mailing list: there is nothing on sale and no list of addresses, so every one of those numbers was counting something that no longer exists.</div>';

  // The Play listing block sat here until 5 Oct 2026. The listing is
  // unpublished, the /play counter behind it is gone, and this is a personal
  // app, so there is no number left to report.

  // The letter funnel. Three numbers, in the order they happen: somebody sent
  // the hardest thing they had to say, somebody read it, somebody came in
  // because of it. The last one is the only referral number in the app that
  // means anything.
  if(d.letters){
    const L=d.letters;
    h+='<h2>Letters</h2><div class="cards">'+
      [['Letters sent',L.letter_sent],['Opened',L.letter_opened],['Accounts from a letter',L.account_created_from_letter]]
        .map(([l,n])=>`<div class="card"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`).join('')+'</div>';
    h+='<div class="note">Opened counts a letter a real person actually opened at least once. '+
       'Accounts counts the recipient making their own side — the only referral that costs nobody anything.</div>';
    if(L.by_side&&L.by_side.length){
      h+=table([{key:'side',label:'Sent by'},{key:'letter_sent',label:'Sent',n:1},
                {key:'letter_opened',label:'Opened',n:1},{key:'account_created_from_letter',label:'Accounts',n:1}],
        L.by_side.map(r=>({side:{recovering:'Person in recovery',partner:'Supporter',both:'Carrying both'}[r.side]||r.side,
          letter_sent:r.letter_sent,letter_opened:r.letter_opened,account_created_from_letter:r.account_created_from_letter})),
        {side:'All',letter_sent:sum(L.by_side,'letter_sent'),letter_opened:sum(L.by_side,'letter_opened'),
         account_created_from_letter:sum(L.by_side,'account_created_from_letter')});
    }
    if(L.by_week&&L.by_week.length){
      h+=table([{key:'week',label:'Week of'},{key:'letter_sent',label:'Sent',n:1},
                {key:'letter_opened',label:'Opened',n:1},{key:'account_created_from_letter',label:'Accounts',n:1}],L.by_week);
    }
  }

  // The funnel that used to print here went with the trials and the paid step.
  // Retention is the half of it that was never about money, and it stays.
  if(d.retention){
    const r=d.retention, cell=x=>x.pct===null?`— <span style="color:#7e86b8">(${esc(x.kept)}/${esc(x.eligible)})</span>`:`${esc(x.pct)}% <span style="color:#7e86b8">(${esc(x.kept)}/${esc(x.eligible)})</span>`;
    h+='<h2>Retention</h2><div class="cards">'+
      [['Day 1',r.d1],['Day 7',r.d7],['Day 30',r.d30]]
        .map(([l,x])=>`<div class="card"><div class="n" style="font-size:17px">${cell(x)}</div><div class="l">${esc(l)} — still active</div></div>`).join('')+
      '</div><div class="note">Of the accounts old enough to reach each day, how many were still doing something in the app by then. Anchored to each person\'s own start date, so a new cohort cannot dilute Day 30. Shown once '+esc(r.min_sample)+' accounts are eligible.</div>';
  }

  // By UTM source and Leads by page sat here until 5 Oct 2026. Both grouped
  // people by the advert or the page that brought them in, and the pages, the
  // campaigns and the utm columns all went the same day. Nothing tags a visit
  // now, so there is no source column left to group by.

  const wkCols=[{key:'week',label:'Week of'},{key:'signups',label:'Accounts',n:1}];
  h+='<h2>By week</h2>'+table(wkCols,d.by_week,{week:'TOTAL',signups:sum(d.by_week,'signups')});
  h+='<div class="note">Week starts Monday.</div>';

  h+='<h2>Friendly usage (free tier)</h2><div class="cards">'+
    [['Avg chats / active free user / day',u.avg_chats_per_active_free_user_per_day],
     ['Free users hitting the daily cap',u.users_hitting_daily_cap],
     ['Active free user-days',u.active_free_user_days]]
      .map(([l,n])=>`<div class="card"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`).join('')+'</div>'+
    `<div class="note">Last ${esc(u.cap_window_days)} days. Current free limit is <b>${esc(u.free_chat_limit)}</b>/day. The average divides total chats by user-days with activity, not calendar days, so someone who chats twice a week is not averaged down by their quiet days.</div>`;
  document.getElementById('out').innerHTML=h;
  loadBackups();
}).catch(()=>{
  document.getElementById('meta').textContent='';
  document.getElementById('out').innerHTML='<div class="err">Could not reach the stats endpoint.</div>';
});
// ─── BACKUPS ─────────────────────────────────────────────────────────────────
// The whole point is the Download button: one tap puts a copy of the database
// on Jacques's own machine, off this server, where no hosting failure reaches it.
function loadBackups(){
  fetch('/api/backup/status').then(r=>r.json()).then(d=>{
    if(d.error){return;}
    const s=d.snapshots||[];
    let h='<h2>Database backups</h2>';
    h+='<div class="note">A copy is taken automatically every day and emailed to '
      +esc(d.emailedTo||'you')+'. The last '+esc(d.keep)+' are kept on the server. '
      +'The server copies do not survive the server itself being lost \u2014 the emailed copy and the download below are the ones that do.</div>';
    h+='<div style="margin:10px 0"><button onclick="downloadBackup()">Download latest backup</button> '
      +'<button onclick="runBackup(this)">Back up now</button></div>';
    h+='<div id="bk-msg" class="note"></div>';
    h+='<div class="note" style="margin-top:16px"><b>Put a backup back</b><br>'
      +'Pick a <code>.sqlite</code> file \u2014 one of the daily ones out of your email, or a download from above \u2014 '
      +'and it becomes the database. Everything in the app right now is replaced. '
      +'The copy it replaces is kept on the server first, so a wrong file is not the end of it.</div>';
    h+='<div style="margin:10px 0"><input type="file" id="bk-file" accept=".sqlite,.db"> '
      +'<button onclick="restoreBackup(this)">Restore</button></div>';
    h+='<div id="bk-rmsg" class="note"></div>';
    if(!s.length)h+='<div class="note">No backup taken yet. Tap <b>Back up now</b>.</div>';
    else h+=s.map(x=>`<div class="card" style="text-align:left;max-width:none;margin-bottom:6px">
      <div><b>${esc(x.name)}</b></div><div class="l">${esc(x.mb)} MB \u00b7 ${esc(new Date(x.at).toLocaleString())}</div></div>`).join('');
    const el=document.createElement('div');el.innerHTML=h;document.getElementById('out').appendChild(el);
  }).catch(()=>{});
}
function downloadBackup(){ window.location='/api/backup/download'; }
// The other half of Download, added 9 Sep 2026 after a day spent finding out the
// app could make backups and had no way to take one back. It asks twice, because
// from here there is no undo: the file replaces every account at once.
function restoreBackup(btn){
  const msg=document.getElementById('bk-rmsg');
  const f=document.getElementById('bk-file').files[0];
  if(!f){msg.innerHTML='<span class="err">Pick a file first.</span>';return;}
  if(prompt('This replaces every account in the app with the contents of '+f.name+'.\n\nType RESTORE to go ahead.')!=='RESTORE'){
    msg.textContent='Cancelled. Nothing was changed.';return;
  }
  btn.disabled=true;btn.textContent='Restoring\u2026';
  f.arrayBuffer().then(b=>fetch('/api/backup/restore',{
    method:'POST',headers:{'Content-Type':'application/octet-stream'},body:b
  })).then(r=>r.json()).then(d=>{
    if(d.error){msg.innerHTML='<span class="err">'+esc(d.error)+'</span>';return;}
    msg.innerHTML='Restored \u2014 <b>'+esc(d.users)+'</b> accounts are back. '
      +'The app is restarting itself; wait a few seconds and reload this page.'
      +(d.replaced?'<br>What it replaced was kept as '+esc(d.replaced)+'.':'');
  }).catch(()=>{
    msg.textContent='The connection dropped, which is what happens \u2014 the app restarts the second it finishes. Wait a few seconds, reload, and check the numbers.';
  }).finally(()=>{btn.disabled=false;btn.textContent='Restore';});
}
function runBackup(btn){
  const msg=document.getElementById('bk-msg');
  btn.disabled=true;btn.textContent='Backing up\u2026';
  fetch('/api/backup/run',{method:'POST'}).then(r=>r.json()).then(d=>{
    if(d.error){msg.innerHTML='<span class="err">'+esc(d.error)+'</span>';return;}
    msg.textContent=d.emailed
      ? `Done \u2014 ${d.name} (${d.mb} MB), and a copy is on its way to your inbox.`
      : `Saved on the server \u2014 ${d.name} (${d.mb} MB) \u2014 but it was NOT emailed (${d.emailProblem}). Use Download to get a copy off this machine.`;
  }).catch(()=>{msg.innerHTML='<span class="err">Could not reach the server.</span>';})
   .finally(()=>{btn.disabled=false;btn.textContent='Back up now';});
}
</script>
</body>
</html>
