<!DOCTYPE html>
<html lang="en">

<style>
  :root{
    --bg:#07060d; --ink:#ece9f5; --dim:#a29cbb; --dimmer:#6f6890;
    --line:rgba(255,255,255,.10); --card:rgba(255,255,255,.035); --card2:rgba(255,255,255,.055);
    --rose:#f0919f; --teal:#5fd9c4; --gold:#e8c07a; --good:#5fd9c4; --bad:#f0919f;
    --serif:ui-serif,Georgia,"Iowan Old Style","Times New Roman",serif;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --r:18px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; min-height:100dvh; background:var(--bg); color:var(--ink);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center;
    padding:calc(env(safe-area-inset-top,0px) + 22px) 18px calc(env(safe-area-inset-bottom,0px) + 34px);
  }
  .wrap{width:100%; max-width:560px}
  .hdr{display:flex; align-items:center; gap:12px; margin-bottom:18px}
  .back{
    flex:0 0 38px; width:38px; height:38px; border-radius:12px; display:flex;
    align-items:center; justify-content:center; text-decoration:none; cursor:pointer;
    color:var(--dim); background:var(--card); border:1px solid var(--line); font-size:1.0625rem;
  }
  .back:hover{color:var(--ink)}
  /* The seal in the header: the way from any lesson, any test and the
     examination to the certificate they are all for (13 Oct 2026). */
  .back.seal{color:var(--gold)}
  .back svg{width:17px; height:17px; display:block; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
  .htxt{flex:1 1 auto; min-width:0}
  h1{margin:0; font-family:var(--serif); font-size:1.3125rem; font-weight:500; line-height:1.15}
  .hdr p{margin:3px 0 0; color:var(--dimmer); font-size:.75rem}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px 15px; margin:0 0 12px}
  .card h2{margin:0 0 6px; font-family:var(--serif); font-size:1.0625rem; font-weight:500}
  .card p{margin:0 0 9px; color:var(--dim); font-size:.8438rem; line-height:1.62}
  .card p:last-child{margin-bottom:0}
  .lead h2{color:var(--gold)}
  .fine{margin:12px 0 0; color:var(--dimmer); font-size:.75rem; line-height:1.6}
  .kicker{font-size:.6875rem; letter-spacing:.12em; text-transform:uppercase; color:var(--dimmer); margin:20px 0 8px}

  a.card{display:block; text-decoration:none; color:inherit; transition:background .16s ease, border-color .16s ease, transform .16s ease}
  a.card:hover{background:var(--card2); border-color:rgba(255,255,255,.18); transform:translateY(-1px)}
  a.card:active{transform:translateY(0) scale(.995)}
  .card.herb{--accent:var(--teal); --tint:rgba(95,217,196,.13)}
  .card.fit{--accent:var(--rose); --tint:rgba(240,145,159,.13)}
  a.card.herb, a.card.fit{border-color:rgba(255,255,255,.12)}
  .rowtop{display:flex; align-items:center; gap:12px}
  .glyph{flex:0 0 42px; width:42px; height:42px; border-radius:13px; display:flex; align-items:center; justify-content:center; color:var(--accent); background:var(--tint)}
  .glyph svg{width:22px; height:22px; display:block; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
  .tname{margin:0; font-family:var(--serif); font-size:1.0625rem; font-weight:500}
  .tsub{margin:3px 0 0; color:var(--dim); font-size:.8125rem}
  .bar{height:7px; border-radius:999px; background:rgba(255,255,255,.08); margin:13px 0 7px; overflow:hidden}
  .bar > i{display:block; height:100%; background:var(--accent); border-radius:999px}
  .meta{display:flex; justify-content:space-between; color:var(--dimmer); font-size:.75rem}

  /* The certificate's own record of the lessons: one line each, a tick when the
     thing is done. */
  .recs{margin:10px 0 2px}
  .rec{display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid var(--line); font-size:.8125rem; color:var(--dim)}
  .recs .rec:first-child{border-top:0; padding-top:0}
  .rec > b{font-weight:500; color:var(--dim); text-align:right}
  .rec > b.yes{color:var(--good)}

  .daylist{display:grid; gap:8px}
  .day{
    display:flex; align-items:center; gap:12px; text-align:left; width:100%; cursor:pointer;
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 13px; color:inherit; font:inherit;
  }
  .day:hover{background:var(--card2)}
  .day .num{flex:0 0 34px; width:34px; text-align:center; font-family:var(--serif); color:var(--dimmer); font-size:.9375rem}
  .day .txt{flex:1 1 auto; min-width:0}
  .day .t{margin:0; font-size:.9375rem; line-height:1.3}
  .day .s{margin:3px 0 0; color:var(--dimmer); font-size:.75rem}
  .tick{flex:0 0 auto; font-size:.8125rem; color:var(--dimmer)}
  .tick.done{color:var(--good)}
  .day.done{border-color:rgba(95,217,196,.35)}
  .day.locked{opacity:.5}

  .test{display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer; font:inherit;
    background:rgba(232,192,122,.07); border:1px solid rgba(232,192,122,.32); border-radius:14px; padding:14px 14px; color:inherit; margin:4px 0}
  .test:hover{background:rgba(232,192,122,.12)}
  .test.locked{opacity:.55; cursor:default; border-color:var(--line); background:var(--card)}
  .test .badge{flex:0 0 auto; font-size:.6875rem; letter-spacing:.1em; text-transform:uppercase; color:var(--gold)}
  .test .tt{margin:0; font-family:var(--serif); font-size:1rem}
  .test .ts{margin:3px 0 0; color:var(--dimmer); font-size:.75rem}

  .q{margin:0 0 16px}
  .qp{margin:0 0 9px; font-size:.9375rem; line-height:1.5}
  .opts{display:grid; gap:7px}
  .opt{
    display:flex; align-items:center; gap:11px; text-align:left; width:100%; cursor:pointer; color:inherit; font:inherit;
    background:rgba(0,0,0,.22); border:1px solid var(--line); border-radius:12px; padding:12px 13px; font-size:.875rem; line-height:1.4;
  }
  .opt:hover{border-color:rgba(255,255,255,.24)}
  .opt .mark{flex:0 0 auto; color:var(--dimmer); font-size:.75rem}
  .opt.pick{border-color:rgba(232,192,122,.6); background:rgba(232,192,122,.10)}
  .opt.right{border-color:rgba(95,217,196,.65); background:rgba(95,217,196,.12)}
  .opt.wrong{border-color:rgba(240,145,159,.6); background:rgba(240,145,159,.10)}
  .why{margin:9px 0 0; color:var(--dim); font-size:.8125rem; line-height:1.55}
  .why b{color:var(--ink); font-weight:600}

  .btn{width:100%; padding:15px 14px; font:inherit; font-size:.9375rem; font-weight:600; color:#1a1408; background:var(--gold); border:0; border-radius:12px; cursor:pointer; margin-top:6px}
  .btn:active{transform:translateY(1px)}
  .btn.quiet{background:none; border:1px solid var(--line); color:var(--dim); font-weight:500}
  .btn.row{display:flex; gap:10px; margin-top:10px}
  .btn.row > button{flex:1 1 auto}
  /* The plant cards a lesson names (13 Oct 2026): each is a door onto that
     herb's own card in the library, so the row reads as a shelf of names. */
  .plantcards{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 2px}
  .plantcard{display:inline-block; padding:9px 13px; font-size:.8125rem; font-weight:600; color:var(--gold);
    background:rgba(232,192,122,.08); border:1px solid rgba(232,192,122,.32); border-radius:999px; text-decoration:none}
  .plantcard:hover{background:rgba(232,192,122,.16)}
  .tickline{margin:10px 0 0; font-size:.8125rem; color:var(--good); min-height:1.1em}

  /* Read aloud (13 Oct 2026): the phone's own voice reads a lesson, the way the
     Herb Library reads a plant and The Key reads a reading. */
  .sayrow{display:flex; align-items:center; gap:10px; margin:12px 0 2px}
  .saysaid{margin:0; flex:0 0 auto; font-size:.6875rem; letter-spacing:.1em; text-transform:uppercase; color:var(--dimmer)}
  .saybtn{flex:1 1 auto; padding:13px 14px; font:inherit; font-size:.875rem; font-weight:600; color:var(--gold);
    background:rgba(232,192,122,.08); border:1px solid rgba(232,192,122,.32); border-radius:12px; cursor:pointer}
  .saybtn:hover{background:rgba(232,192,122,.16)}
  .saybtn.stop{flex:0 0 auto; color:var(--dim); background:none; border-color:var(--line)}

  ol.plan{margin:0; padding-left:20px; color:var(--dim); font-size:.8438rem; line-height:1.7}

  .cert{position:relative; text-align:center; padding:28px 20px 26px; border:1px solid rgba(232,192,122,.5); border-radius:var(--r);
    background:radial-gradient(120% 90% at 50% 0%, rgba(232,192,122,.10), rgba(255,255,255,.02)); overflow:hidden}
  .cert .seal{width:56px; height:56px; margin:0 auto 12px; color:var(--gold)}
  .cert .seal svg{width:100%; height:100%; display:block; fill:none; stroke:currentColor; stroke-width:1.6}
  .cert .over{font-size:.6875rem; letter-spacing:.24em; text-transform:uppercase; color:var(--dimmer)}
  .cert h2{margin:8px 0 4px; font-family:var(--serif); font-size:1.5rem; font-weight:500; color:var(--ink)}
  .cert .for{margin:14px 0 2px; color:var(--dim); font-size:.8125rem}
  .cert .who{margin:2px 0 10px; font-family:var(--serif); font-size:1.75rem; color:var(--gold); line-height:1.2}
  .cert .line{margin:12px auto; width:60%; height:1px; background:rgba(232,192,122,.4)}
  .cert .what{margin:0; color:var(--dim); font-size:.8438rem; line-height:1.6}
  .cert .when{margin:14px 0 0; color:var(--dimmer); font-size:.75rem}

  [hidden]{display:none !important}
  footer{margin-top:22px; color:var(--dimmer); font-size:.75rem; line-height:1.6; text-align:center}
  @media (prefers-reduced-motion:reduce){ a.card,.day,.test{transition:none} a.card:hover{transform:none} }
  @media print{
    body{background:#fff; color:#161020}
    .hdr,footer,.noprint{display:none !important}
    .cert{border-color:#b9902f}
    .cert h2,.cert .who{color:#8a6a1f}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hdr">
    <button class="back" id="back" title="Back">&#8592;</button>
    <div class="htxt">
      <h1 id="title">The Certification</h1>
      <p id="subtitle">Two trainings, ninety days each</p>
    </div>
    <button class="back seal" id="certlink" title="Your certificate" aria-label="Your certificate" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9.5" r="5.5"/><path d="M8.6 14.4 6 21l6-2.6L18 21l-2.6-6.6"/></svg>
    </button>
  </header>

  <main id="view"></main>

  <footer id="foot">Private. Kept on this phone.</footer>
</div>

<script>
(function(){
"use strict";

/* ========================================================================
   THE CERTIFICATION

   Two ninety-day trainings, each one lesson a day, each lesson with a short
   quiz of its own, a block test after day thirty and after day sixty, and an
   ultimate examination at the end of the ninety days that issues a
   certificate for the track.

   THE HERBALIST track is study in clinical herbalism: the tradition the two
   source books describe, materia medica, pharmacy, energetics, safety,
   interactions, case-taking, scope of practice and ethics.

   THE TRAINER track is study in personal and group fitness instruction. Its
   practical spine is the by-10, and the by-10 is a method rather than a
   programme: two to five sets, a dumbbell light enough to pump repetitions out
   with rather than the heaviest the person can lift, each set taken to as many
   good repetitions as they have and never more than twenty, ten seconds
   between one move and the next, and a week that can run every day as long as
   the days rotate. The exercises it is applied to are P90X's -
   the rotation the Trainer page shows - so a session trained this way is P90X
   rearranged around those rules, which is how he actually trains. The rest is
   the standard accreditation ground every entry-level certification tests:
   anatomy, physiology, biomechanics, screening, assessment, program design,
   coaching technique, special populations, group instruction, safety, ethics
   and professional practice.

   NOTHING IS SENT ANYWHERE. Every answer, every score and the name on the
   certificate stay on this phone, in this browser. There is no account and no
   server behind this page, and it works with no signal.

   THIS IS A CERTIFICATE OF COMPLETION. It is not a licence, and no US state
   licenses an herbalist or a personal trainer. It is not AHG registration,
   nor a NASM, ACE, ACSM, NSCA, ISSA, AFAA or NETA credential. What the real
   credentials require is stated plainly at the foot of each track.

   13 OCT 2026, at Jacques's word: "link lessons to certificate, add reload,
   export certificate." So the certificate is reachable from the lessons the
   whole way through and not only at the end of them - the seal in the header
   opens it from any day, any test and the examination itself, every day carries
   its own link at the foot, and the track's button is there from day one and
   says plainly what is still owed instead of hiding until it is earned. The
   certificate view carries the record of the ninety lessons and the two tests,
   a reload, and two honest ways out of it: Print, and Save as image - drawn on
   a canvas here rather than photographed off the screen, so the export needs
   no library, no server and no permission, and the line about what this is not
   travels on the image itself.
   ======================================================================== */

/* ---------- the two tracks' lessons ---------- */

var HERB_DAYS = [
{d:1,t:"What clinical herbalism is",s:"The ground under the whole course",
 p:["Clinical herbalism is the practice of matching a plant to a person, on purpose, with a reason that can be written down and checked next time. It asks what the body is doing, what the tradition says about it, and which plant the books and the evidence point to.","This course is ninety days of that. The two source books, African Holistic Health and Nutricide by Llaila O. Afrika, are the tradition it works inside; everything else is this page saying plainly what a plant does and where the caution sits.","One rule travels through all ninety days and it is the first rule: food first, a plant second, and a doctor's line over both of them."],
 q:[{q:"What is herbalism about?",a:["Selling plants to anybody","Growing a garden","Matching a plant to a person, on purpose","Replacing a doctor"],k:2,w:"You match a plant to a person, on purpose, and you write down why."},
    {q:"Which two books does this course use?",a:["Two cookbooks","A dictionary","No books at all","African Holistic Health and Nutricide"],k:3,w:"Both are by Llaila O. Afrika."},
    {q:"What comes first?",a:["Food","A strong herb","A pill","A fast"],k:0,w:"Food first, a plant second, and a doctor's line over both."},
    {q:"Why write down why you chose a plant?",a:["To fill a page","So you can check it next time","Because it is the law","You do not need to"],k:1,w:"A reason you can check is what makes it clinical instead of casual."},
    {q:"Whose line sits over the food and the plant?",a:["A neighbour's","A shop's","A doctor's","A book's"],k:2,w:"It is the first rule of all ninety days."}]},

{d:2,t:"The three books, and how they are quoted",s:"Where the words come from",
 p:["The two books are not science papers and are not treated as such here. Where a line is theirs it is printed as theirs, with the claim left in their voice rather than dressed up as fact.","That distinction is the whole reason the library is worth reading. A book's claim can be studied, argued with, and followed or not followed; a claim passed off as the page's own could not be.","So there are two kinds of sentence on this page. The books say this, and this page says that. A careful student can always tell which one they are reading.","A third book joined in October 2026: Melanin: What Makes Black People Black!, by the same author, Llaila O. Afrika. It is quoted the same way. What it says about melanin, the pineal gland and the races is printed as its claim, and this page's own lines are never built on top of it."],
 q:[{q:"How are the books' words given on this page?",a:["In the book's own voice, as its claim","As proven fact","With no name on them","As this page's opinion"],k:0,w:"A claim is printed as a claim, not dressed up as fact."},
    {q:"How many kinds of sentence does this page use?",a:["One","Two - what the books say, and what this page says","Three","None"],k:1,w:"And you can always tell which one you are reading."},
    {q:"Why does that matter?",a:["It looks better","It is the law","You can only judge a claim you can see as a claim","It does not matter"],k:2,w:"A claim passed off as fact cannot be weighed."},
    {q:"Are the two books science papers?",a:["Yes","They are laws","They are recipes","No, and they are not treated as ones"],k:3,w:"They are a tradition, read as a tradition."},
    {q:"Can you tell which sentence you are reading?",a:["Yes, every time","No","Only sometimes","Never"],k:0,w:"That is the whole reason the page keeps the two apart."}]},

{d:3,t:"Read a body first",s:"The order the tradition works in",
 p:["The book's order is not the one most people expect: nothing is given until the body has been read. The skin is read as the chart, the body in three parts, upper, middle and lower, each part holding its organs.","Then there is pressure - two to four pounds on the skin over the organ's field - and what runs out of a body, tears and sweat and blood, read as carrying information. None of this comes with a test behind it; it is here because the book is here.","One idea from the chapter does travel into practice: food makes a mood. Carbohydrates for calm, proteins for alertness, fruit and vegetables to steady the energy."],
 q:[{q:"What happens before anything is given?",a:["A blood test","A price is agreed","The body is read","A fast"],k:2,w:"Reading the body comes first, and the treatment follows it."},
    {q:"How is the body divided when it is read?",a:["Left and right","Front and back","Inside and outside","Upper, middle and lower"],k:3,w:"Three parts, each holding its own organs."},
    {q:"Which idea from this day is used in practice?",a:["Food makes a mood","The skin cannot be read","Pressure is never used","Blood says nothing"],k:0,w:"Carbohydrates for calm, protein for being awake."},
    {q:"What food is for calm, in the book?",a:["Meat","Carbohydrates","Salt","Sugar"],k:1,w:"Fruit and vegetables steady the energy."},
    {q:"What food is for being awake and alert?",a:["Sugar","Fruit juice","Protein","Salt"],k:2,w:"That is the one idea from the chapter that travels into practice."}]},

{d:4,t:"The doctrine of signatures",s:"Why a plant looks the way it looks",
 p:["This is the oldest idea in the books, and the one the rest of them stands on: the sign of what a plant is for is written on the plant, in its shape, colour, texture, taste and smell.","The leaves say it. Lobed leaves for the lung, wrinkled leaves for the skin, smooth leaves for the organs inside. Where it grows says it too: a short plant is rich in minerals, a tall one is for breathing, a vine for the nerves.","Taste and colour carry it as well: bitter closes and dries, sweet opens and moistens. Read it as a way of remembering a tradition, not as a rule that decides a dose."],
 q:[{q:"What is the doctrine of signatures?",a:["A plant's use is written on the plant itself","Every plant needs a Latin name","The oldest plant works best","You must sign for a plant"],k:0,w:"Shape, colour, texture, taste and smell are the sign."},
    {q:"Wrinkled leaves are read as being for what?",a:["The lung","The skin","The bone","The blood"],k:1,w:"Lobed leaves for the lung, wrinkled leaves for the skin."},
    {q:"Lobed leaves are read as being for what?",a:["The bone","The skin","The lung","The ear"],k:2,w:"Where it grows says something too: a vine for the nerves."},
    {q:"What does a bitter taste do?",a:["It opens and moistens","It warms","It cools","It closes and dries"],k:3,w:"Sweet does the other thing."},
    {q:"What does a sweet taste do?",a:["It opens and moistens","It closes and dries","It cuts a fever","It dries the skin"],k:0,w:"Read it as a way of remembering, not as a rule for a dose."}]},

{d:5,t:"Botanical names and plant families",s:"The one name that travels",
 p:["A plant has one botanical name and any number of common ones. Meadowsweet, queen of the meadow and bridewort are the same plant; Filipendula ulmaria is that plant and no other.","The name is two words, a genus and a species, and it is the only safe way to buy an herb, order a seed or look one up. Common names collide across countries and across families.","Families group plants by shared structure, and they are useful because kin often share chemistry. The mint family is aromatic and often calming; the rose family is astringent; the carrot family holds both gentle kitchen herbs and some of the deadliest plants in Europe."],
 q:[{q:"How many botanical names does a plant have?",a:["Two","None","One","One for each country"],k:2,w:"Any number of common names, and exactly one botanical name."},
    {q:"Why is the botanical name the safe one to buy by?",a:["It is shorter","It is the law","It sounds nicer","Common names get mixed up"],k:3,w:"Meadowsweet and bridewort are the same plant; Filipendula ulmaria is that plant and no other."},
    {q:"What two words make a botanical name?",a:["A genus and a species","A colour and a size","A place and a year","A taste and a smell"],k:0,w:"Knowing the name is the only safe way to buy or look a plant up."},
    {q:"Which family holds gentle kitchen herbs and deadly ones?",a:["The mint family","The carrot family","The rose family","The grass family"],k:1,w:"Which is why kin share chemistry in both directions."},
    {q:"What is the mint family usually like?",a:["Sour","Deadly","Aromatic and calming","Dry and hard"],k:2,w:"A family is a clue, not a guarantee."}]},

{d:6,t:"Parts used, and when they are picked",s:"The part decides the preparation",
 p:["The part of a plant is the first thing to know, because it decides both the preparation and the dose. Leaf, flower, seed, root, bark and berry are not interchangeable, and a book that says root is not talking about the leaf.","The traditions time the picking: aerial parts at flowering, roots after the tops die back, bark in the dormant season, seed when it is ripe, berries fully coloured. The point is that a plant's chemistry moves through its year.","Fresh is strongest in the books' view - picked the same day - and dried is weaker, and in some cases the book says it does not act at all."],
 q:[{q:"What decides how a plant is prepared and how much you take?",a:["The part of the plant","The price","The colour of the bottle","The country it came from"],k:0,w:"Leaf, flower, seed, root, bark and berry are not interchangeable."},
    {q:"When are roots picked?",a:["At flowering","After the tops die back","Before the seed forms","In midsummer"],k:1,w:"Roots after the tops die back, bark in the dormant season."},
    {q:"When are leaves and flowers picked?",a:["In winter","After the frost","At flowering","At night"],k:2,w:"A plant's chemistry moves through its year."},
    {q:"Which does the book call stronger?",a:["Dried","A capsule","Frozen","Fresh, picked the same day"],k:3,w:"And in some cases it says dried does not act at all."},
    {q:"Are leaf, root and bark used the same way?",a:["No, they are not interchangeable","Yes, always","Only in tea","Only dried"],k:0,w:"The part decides the preparation and the dose."}]},

{d:7,t:"Identifying a plant, and the look-alikes",s:"The day that keeps you out of trouble",
 p:["No plant is used on the strength of a guess. Whoever picks an herb for medicine identifies it to the species, and knows the dangerous plants that wear the same clothes.","The examples to carry: wild carrot and the deadly hemlock of the same family; nettle and the mints it is confused with; comfrey and the foxgloves that share a leaf shape; sweet fennel and the bitter hemlock that is fatal in small amounts.","The rule is plain. If you cannot identify it to the species with complete certainty, it is not your medicine - and a plant bought dried is bought by its botanical name, never by a common one."],
 q:[{q:"What do you do with a plant you are not sure of?",a:["Taste a little","Use the leaves only","Leave it alone - it is not your medicine","Cook it well"],k:2,w:"Certainty is the standard, and doubt is never a small risk."},
    {q:"Which family holds sweet fennel and deadly hemlock?",a:["The rose family","The mint family","The grass family","The carrot family"],k:3,w:"Wild carrot and hemlock are neighbours too."},
    {q:"How is a dried herb bought safely?",a:["By its botanical name","By its common name","By its colour","By its smell alone"],k:0,w:"A common name can be two different plants in two shops."},
    {q:"Nettle is often mixed up with what?",a:["Hemlock","The mints","Foxglove","Fennel"],k:1,w:"Comfrey and the foxgloves share a leaf shape as well."},
    {q:"Is a guess good enough to pick a medicine?",a:["Yes, if you are hungry","Yes, for teas","No, never","Only in summer"],k:2,w:"Identify it to the species, or leave it."}]},

{d:8,t:"Drying, storing, and judging quality",s:"A good herb spoiled is a bad herb",
 p:["Drying is done in the dark, in moving air, and quickly. A herb dried slowly in the sun loses its colour, its smell and much of what it was worth.","Storing is dark glass, a cool cupboard, a tight lid, and a date on the jar. Heat, light and air are the three things that take a herb apart, and a year is a fair life for most dried leaf.","Quality is judged with the senses first: colour, smell, texture, and the taste on the tongue. A faded, dusty herb with no scent is a herb whose chemistry has already left; a dried herb sold under the wrong name is a different problem and a worse one."],
 q:[{q:"How is a herb dried?",a:["In the dark, in moving air, fast","In the sun, slowly","In water","In a closed box"],k:0,w:"Slow drying in the sun costs colour, smell and much of the herb's worth."},
    {q:"What three things spoil a stored herb?",a:["Water, salt and sugar","Heat, light and air","Glass, wood and metal","Cold and quiet"],k:1,w:"Dark glass, a cool cupboard and a tight lid answer all three."},
    {q:"How is a herb kept?",a:["A clear jar in the sun","A paper bag","Dark glass, a cool cupboard, a tight lid, and a date","A warm drawer"],k:2,w:"A year is a fair life for most dried leaf."},
    {q:"How is quality judged first?",a:["By the price","By the label","By the country","With the senses - colour, smell, texture, taste"],k:3,w:"A faded, dusty herb with no scent has already lost what you were buying."},
    {q:"A faded herb with no smell has done what?",a:["Lost what you were buying","Got stronger","Kept its power","Become fresh"],k:0,w:"The chemistry has already left it."}]},

{d:9,t:"Water: the infusion and the decoction",s:"The oldest two preparations",
 p:["A tea is one teaspoon of herb to a cup of water. Leaves and flowers are an infusion: the water comes off the boil, the herb goes in, and it steeps, covered, for ten to thirty minutes.","Roots, barks and seeds are a decoction: they go into cold water, come to a simmer, and are held there for twenty to thirty minutes, because their chemistry is held tighter and heat is what releases it.","Lid on, both of them. Much of what a herb gives up is volatile, and an open cup steeping on a bench is a cup losing the part that does the work."],
 q:[{q:"How much herb goes in a cup of tea?",a:["A handful","An ounce","One teaspoon","A cupful"],k:2,w:"One teaspoon of herb to a cup of water."},
    {q:"What is an infusion?",a:["Roots boiled hard","An alcohol extract","A cloth on the skin","Leaves and flowers steeped in water off the boil"],k:3,w:"Ten to thirty minutes, covered."},
    {q:"What is a decoction?",a:["Roots, bark or seed simmered in water","Leaves in cold water","A syrup","An oil"],k:0,w:"Cold water, brought to a simmer and held there."},
    {q:"How long do roots and bark simmer?",a:["Two minutes","20 to 30 minutes","Four hours","They are not heated"],k:1,w:"Their chemistry is held tighter, and heat is what releases it."},
    {q:"Why keep the lid on the cup?",a:["It looks tidy","It cools faster","The good part is in the steam","There is no reason"],k:2,w:"An open cup is losing the part that does the work."}]},

{d:10,t:"Sun tea, cold infusions and syrups",s:"Water without a flame",
 p:["Sun tea is the herbs in water, left in the sun for several hours, so warmth draws out the plant with no flame at all. A cold infusion is the same idea overnight, and it is the way to take a plant whose goodness heat would spoil.","A syrup is a decoction or infusion simmered with honey, grain syrup or molasses until it thickens, then bottled. The sweetness is not only taste - a syrup keeps because sugar holds water away from what would spoil it.","Two cautions join this day. A syrup is not given to a baby, and honey is not given to a child under one. And a syrup made for a cough is not a reason to keep a cough for a fortnight: a cough that stays needs looking at."],
 q:[{q:"How is sun tea made?",a:["Herbs in water left in the sun for hours","Boiled hard for an hour","Steeped in alcohol","Fried in oil"],k:0,w:"Warmth draws the plant out with no flame at all."},
    {q:"What is a cold infusion?",a:["Boiling herbs","The same idea left overnight","A syrup","An oil"],k:1,w:"It is the way to take a plant whose goodness heat would spoil."},
    {q:"What does the sugar in a syrup do besides sweeten?",a:["Makes it stronger","Removes the herb","Keeps it from spoiling","Nothing"],k:2,w:"Which is why a syrup keeps on a shelf and a tea does not."},
    {q:"Who must never be given honey?",a:["A grown-up","A teenager","Anybody over ninety","A child under one"],k:3,w:"And a syrup is not given to a baby."},
    {q:"A cough that will not go needs what?",a:["Looking at","More syrup","More honey","Nothing"],k:0,w:"Syrup or no syrup, a cough that stays needs looking at."}]},

{d:11,t:"Oils, salves and liniments",s:"The preparations for the skin",
 p:["An infused oil is the herb in a good carrier oil, gently warmed or left to steep for weeks, then strained. A salve is that oil set with beeswax - sixteen ounces of herb to the oils and the wax, simmered and strained, in the book's own figure.","A poultice is different again: the herb mixed with water, spread on a cloth, laid on oiled skin, and covered. It is the oldest external preparation there is, and it is used warm.","A liniment is the herbs in rubbing alcohol, steeped and strained. It goes on the skin and never inside the body, and it is kept away from the eyes and from broken skin. Wash the hands after handling any of these."],
 q:[{q:"What turns an infused oil into a salve?",a:["Water","Sugar","Beeswax","Alcohol"],k:2,w:"The oil is set with wax."},
    {q:"How does a poultice go on?",a:["Swallowed with water","Steeped for two weeks","Rubbed into the scalp","Warm, on oiled skin, covered with a cloth"],k:3,w:"It is the oldest external preparation there is."},
    {q:"What is a liniment?",a:["Herbs in rubbing alcohol, for the skin only","A tea","A syrup","A pill"],k:0,w:"It goes on the skin and never inside the body."},
    {q:"Where must a liniment never go?",a:["On the arms","Inside the body, in the eyes, or on broken skin","On the legs","On a cloth"],k:1,w:"Wash your hands after handling any of these."},
    {q:"What do you do with your hands afterwards?",a:["Lick them","Wrap them","Wash them","Nothing"],k:2,w:"They have been on a preparation that does not belong in your eyes."}]},

{d:12,t:"Tinctures: alcohol, glycerine, vinegar",s:"The menusstrum decides the medicine",
 p:["A tincture is the herb steeped in a liquid that draws it out and then holds it. Alcohol is the strongest and the most common: two weeks of steeping, then strained, in the book's order.","The liquid is the menstrum, and it is chosen for the plant. Alcohol and water together take out both the resinous and the water-soluble parts; glycerine is gentler and sweet, and suits a child's preparation and a plant taken long; vinegar is the traditional menstrum for minerals and for the sour herbs.","The strength is written as a ratio, one part herb to five parts liquid, and the alcohol as a percentage. Both matter, because a tincture without its ratio is a bottle nobody can dose."],
 q:[{q:"What is the menstrum?",a:["The liquid the herb is steeped in","The herb","The bottle","The dose"],k:0,w:"It is chosen for the plant, and it is what carries the medicine."},
    {q:"How long does the book steep a tincture?",a:["An hour","Two weeks","A year","It is not steeped"],k:1,w:"Then it is strained and kept in dark glass."},
    {q:"Which menstrum is strongest and most common?",a:["Vinegar","Water","Alcohol","Honey"],k:2,w:"Alcohol and water together take out both kinds of part."},
    {q:"Which menstrum is gentle and sweet, and suits a child?",a:["Alcohol","Vinegar","Salt","Glycerine"],k:3,w:"It also suits a plant taken for a long time."},
    {q:"Which menstrum is the old one for minerals and sour herbs?",a:["Vinegar","Alcohol","Glycerine","Oil"],k:0,w:"The menstrum is chosen for the plant."}]},

{d:13,t:"Ratios, menstrum and dosage forms",s:"Why a bottle has to say how strong it is",
 p:["Every preparation has a strength, and the strength is written as a ratio: one part herb to five parts liquid is 1:5, one to two is 1:2, and a dry herb weight to a liquid volume is written the same way.","A dose in drops is meaningless without it. Twenty drops of a 1:2 tincture and twenty drops of a 1:5 tincture are different amounts of plant, and a book that gives one and not the other has only half given the instruction.","The forms carry different practical advantages. A tincture keeps for years and travels; a tea is quick and weak; a syrup is pleasant and short-lived; a capsule is tasteless and hides the taste of a bitter root. Choose the form for the person, not for the habit."],
 q:[{q:"What does the ratio 1:5 tell you?",a:["The price","The shelf life","One part herb to five parts liquid","The colour"],k:2,w:"The strength is written as a ratio."},
    {q:"Why does the ratio matter for a dose?",a:["It only changes the taste","It only changes the colour","It does not matter","Twenty drops of 1:2 and of 1:5 are different amounts of plant"],k:3,w:"A bottle that gives the drops and not the ratio has given half an instruction."},
    {q:"Which form keeps for years and travels?",a:["A tincture","A tea","A syrup","A poultice"],k:0,w:"A syrup is pleasant and short-lived; a tea is quick and weak."},
    {q:"Which form is quick and weak?",a:["A tincture","A tea","A capsule","A salve"],k:1,w:"Choose the form for the person, not for the habit."},
    {q:"Which form hides a bitter taste?",a:["A tea","A syrup","A capsule","A poultice"],k:2,w:"A capsule is tasteless and hides a bitter root."}]},

{d:14,t:"The twenty classes, one to five",s:"What a class is",
 p:["The book sorts herbs into twenty classes. A class is what a plant does; it is not a dose, and it is not a plant's whole story. These are the first five.","Alternatives slow the action of a curative herb so the body is not shocked - spikenard root, sarsaparilla, echinacea, garlic, ginger. Anthelmintics remove worms from the gut - garlic, horseradish, wild violet. Antiperiodics reduce seizures from fever or a nervous disorder - vervain, arnica, red raspberry.","Anti-inflammatories work against inflammation in a disease state - arnica, cayenne, garlic, chaparral. Antipyretics bring a temperature down - eucalyptus, feverfew. Five classes, and every plant named in one came off the book's own list."],
 q:[{q:"What does an alternative do?",a:["It slows a strong herb so the body is not shocked","It cures everything","It brings a fever down","It removes worms"],k:0,w:"It paces the curing herb rather than doing the curing."},
    {q:"Which class removes worms?",a:["Nervines","Anthelmintics","Diuretics","Antipyretics"],k:1,w:"Garlic, horseradish and wild violet are the ones named."},
    {q:"Which class brings a temperature down?",a:["Astringents","Emollients","Antipyretics","Stimulants"],k:2,w:"Eucalyptus and feverfew, on the list."},
    {q:"Which class works against swelling and soreness?",a:["Anthelmintics","Nervines","Refrigerants","Anti-inflammatories"],k:3,w:"Arnica, cayenne, garlic and chaparral are named."},
    {q:"Which plants does the list name for worms?",a:["Garlic, horseradish and wild violet","Aloe and senna","Ginger and thyme","Valerian and catnip"],k:0,w:"Every plant named in a class came off the book's own list."}]},

{d:15,t:"The twenty classes, six to ten",s:"The second five",
 p:["Antiseptics and disinfectants work against harmful bacteria - anise, myrrh, thyme, garlic. Astringents contract tissue and tighten skin and mucous membrane - alum root, which the book also calls cranesbill, and witch hazel.","Bitter tonics help digestion and wake the appetite - chamomile and dandelion. Calmatives bring relaxation and a sense of well-being - chamomile and valerian.","Cathartics are laxatives, for constipation - cascara sagrada and senna. Senna is the one that is a medicine rather than a morning drink: a week at most, and its own card carries the rest."],
 q:[{q:"Which class tightens skin and the lining of the mouth?",a:["Cathartics","Demulcents","Astringents","Calmatives"],k:2,w:"Alum root and witch hazel are the names given."},
    {q:"Senna is in which class?",a:["Astringents","Sedatives","Stimulants","Cathartics"],k:3,w:"A cathartic is a strong mover of the bowel."},
    {q:"How long does the book let senna be used?",a:["A week at most","Every morning forever","One cup a year","Six months"],k:0,w:"Senna is a medicine rather than a morning drink."},
    {q:"Chamomile is in which two classes here?",a:["A cathartic and a diuretic","A bitter tonic and a calmative","An antiseptic and a vulnerary","A nervine and a stimulant"],k:1,w:"A bitter tonic for digestion and a calmative for relaxing."},
    {q:"What is a calmative used for?",a:["Wounds","Wind","Relaxing","Fever"],k:2,w:"One plant can sit in more than one class."}]},

{d:16,t:"The twenty classes, eleven to fifteen",s:"The third five",
 p:["Demulcents soothe and protect the organs inside - licorice, marshmallow, oatmeal. Diaphoretics raise a sweat, to carry impurities out - ginger, sage, yarrow. Diuretics move water and flush it out - buchu and parsley.","Emollients soften and soothe, outside and inside - comfrey and marshmallow. Comfrey is the one on this shelf never taken internally, and its card says so plainly.","Expectorants bring phlegm up out of the chest - elecampane and mullein. Fifteen classes walked, and the same rule holds for every one: the class says what a plant does and says nothing about how far to take it."],
 q:[{q:"What does a diaphoretic do?",a:["Raises a sweat","Stops a sweat","Brings phlegm up","Tightens tissue"],k:0,w:"Ginger, sage and yarrow, on the list."},
    {q:"Which class soothes and protects inside?",a:["Diuretics","Demulcents","Cathartics","Refrigerants"],k:1,w:"Licorice, marshmallow and oatmeal."},
    {q:"Which demulcents does the book name?",a:["Garlic and ginger","Senna and aloe","Licorice, marshmallow and oatmeal","Thyme and sage"],k:2,w:"A demulcent coats and protects as it goes down."},
    {q:"Comfrey is in two classes, and what hard rule comes with it?",a:["It is only for children","It is boiled for an hour","It is only for burns on the feet","It is never taken inside the body"],k:3,w:"Its card says never internally, and names it beside goldenseal for babies."},
    {q:"Which class cools a hot body?",a:["Refrigerants","Stimulants","Nervines","Cathartics"],k:0,w:"A class is what a plant does, not how far to take it."}]},

{d:17,t:"The twenty classes, sixteen to twenty",s:"The last five",
 p:["Nervines relax the nervous system - valerian and catnip. Stimulants raise nerve reaction and energise - coffee bean and guarana. Refrigerants cool the body - mints and eucalyptus.","Sedatives calm pain and anxiety - chamomile and cramp bark. Vulneraries heal wounds and the skin - aloe vera and comfrey.","That is all twenty. If a plant in this library carries a class line, that line came off this list rather than off the page's own opinion."],
 q:[{q:"Which class relaxes the nerves?",a:["Stimulants","Refrigerants","Nervines","Vulneraries"],k:2,w:"Valerian and catnip."},
    {q:"What is a vulnerary for?",a:["A sweat","Worms","Sleep","Wounds and the skin"],k:3,w:"Aloe vera and comfrey."},
    {q:"Which vulneraries does the book name?",a:["Aloe vera and comfrey","Ginger and thyme","Senna and kelp","Valerian and catnip"],k:0,w:"A vulnerary helps a wound."},
    {q:"Which class wakes a body up?",a:["Nervines","Stimulants","Sedatives","Demulcents"],k:1,w:"It is the opposite of a sedative."},
    {q:"How many classes are in the book's list?",a:["Five","Twelve","Twenty","Thirty"],k:2,w:"Where a plant carries a class here, the class came off that list."}]},

{d:18,t:"One plant, two classes, and the caution",s:"The rule under the list",
 p:["Comfrey is a demulcent and an emollient on the book's list. It is also the herb on this shelf never taken internally, and it is named beside goldenseal for babies.","That is the whole lesson of the four days just gone. A class tells you what a plant does. It does not tell you how far to take it, how long to take it for, or who must not take it at all.","So a plant is read in two halves: what it does, which is the class and the old use, and the caution that travels with it, which is the line under Caution on its card and is never softened by how good the class sounds."],
 q:[{q:"What does a class tell you about a herb?",a:["What it does","How much to take","Who must never take it","How long to take it for"],k:0,w:"The class is the action; the caution is a separate line."},
    {q:"Which herb is never taken inside the body here?",a:["Chamomile","Comfrey","Ginger","Valerian"],k:1,w:"Its own card carries it."},
    {q:"What are the two halves of reading a plant?",a:["The price and the colour","The Latin name and the common one","What it does, and the caution that comes with it","The taste and the smell"],k:2,w:"Both halves are read before anything is decided."},
    {q:"Does a good class make a caution softer?",a:["Yes, a little","Yes, a lot","Only in tea","No, never"],k:3,w:"The caution is never softened by how good the class sounds."},
    {q:"Which herb is named beside comfrey for babies?",a:["Goldenseal","Kelp","Fennel","Thyme"],k:0,w:"Its own card names it too."}]},

{d:19,t:"Energetics: hot and cold, wet and dry",s:"How a tradition describes an action",
 p:["Energetics is a language for what a plant does to a body rather than a list of diseases it treats. Warming herbs move heat outward and get things going; cooling herbs settle heat and slow things down. Drying herbs take moisture away; moistening herbs hold it.","The pairs cross. Ginger is warm and drying, marshmallow cool and moistening, cayenne hot and drying, chickweed cool and moistening. Learn a plant's place in the pair and you can often predict what it was used for before you read the use.","It is a tradition's shorthand, and it is worth knowing for the same reason a gardener knows the seasons: it is how the old books organise themselves, and reading them without it is reading a map upside down."],
 q:[{q:"What is energetics a language for?",a:["Naming diseases","Setting prices","What a plant does to a body","Latin names"],k:2,w:"It describes the action rather than the disease."},
    {q:"How is marshmallow placed?",a:["Warm and drying","Hot and drying","Warm and moistening","Cool and moistening"],k:3,w:"Ginger is warm and drying; cayenne hot and drying."},
    {q:"What does a warming herb do?",a:["Moves heat outward and gets things going","Cools a body down","Dries a wound","Adds water"],k:0,w:"Cooling herbs settle heat and slow things down."},
    {q:"What does a cooling herb do?",a:["Warms the skin","Settles heat and slows things down","Thickens the blood","Wakes a body up"],k:1,w:"The pairs cross: ginger is warm and drying."},
    {q:"How is ginger placed?",a:["Cool and wet","Cold and dry","Warm and drying","Hot and wet"],k:2,w:"Chickweed is the cool and moistening one."}]},

{d:20,t:"The Male and Female principles",s:"The two branches of the chart",
 p:["Nutricide draws its whole chart on two directions a thing moves a body in, and the book calls them the Male principle and the Female principle. They are directions and not kinds of person, which is the first thing to fix in the mind.","The Male principle is the contractive direction: it gathers, tightens, hardens and draws inward. The Female principle is the expansive direction: it spreads, softens, loosens and moves outward. Meat and salt and sugar sit on the contractive side; fruit and most vegetables sit on the expansive side.","You have already met the idea without the name. The book's account of sugar as something a body has to expand and dilute to survive it is the chart in action, and so is the whole argument for fruit in the morning."],
 q:[{q:"What are the two principles?",a:["Two directions a thing moves a body in","Two kinds of person","Two books","Two doses"],k:0,w:"Directions, not kinds of person - that is the first thing to fix in the mind."},
    {q:"Which principle is the contractive one?",a:["The Female principle","The Male principle","Neither","Both"],k:1,w:"It gathers, tightens, hardens and draws inward."},
    {q:"What does contractive mean?",a:["Spreading and softening","Cooling and wetting","Gathering, tightening, drawing in","Warming and drying"],k:2,w:"The Female principle is the expansive one."},
    {q:"Which of these sits on the contractive side?",a:["Fruit","Most vegetables","Water","Salt and sugar"],k:3,w:"Meat, salt and sugar together - the same three it calls drugs."},
    {q:"Which side is fruit on?",a:["The expansive, Female side","The contractive, Male side","Neither","Both"],k:0,w:"Which is why the book argues for fruit in the morning."}]},

{d:21,t:"Vitamins, in the book's words",s:"What the book says they do",
 p:["The book's framing is short and worth carrying: vitamins energise the body, and minerals stabilise it. A vitamin is not a food and not a fuel; it is what lets the body use what it has.","The food medicine chart is the book's own, and it maps a vitamin or a compound to the foods that carry it: vitamin C to citrus and the peppers, lycopene to tomatoes and red grapefruit, the B group to the whole grains and the greens. The chart is printed on the shelf tab, row for row, as the book has it.","This page's own line is the one that matters in practice. A plate with colour in it - the dark greens, the deep orange, the red - carries more of these than a shelf of bottles, and a bottle is the book's answer to a body fighting something rather than to an ordinary day.","The third book names its own list of what melanin is built from, and its vitamins are A, the B-complex, C, D and E. That is its list and not a dose: the plate is still this page's answer, and the library's own days on melanin print the list as the book's."],
 q:[{q:"In the book, what do vitamins do?",a:["Steady the body","Build bone","Give the body energy","Cool the body"],k:2,w:"Vitamins give energy, minerals steady."},
    {q:"What do minerals do, in the book?",a:["Give energy","Warm the body","Clean the blood","Steady the body"],k:3,w:"Vitamins give energy, minerals steady."},
    {q:"Lycopene is in which two foods?",a:["Tomatoes and red grapefruit","Tea and berries","Parsley and citrus","Cabbage and sprouts"],k:0,w:"The chart is the book's own, printed row for row."},
    {q:"Which two foods carry vitamin C, on the chart?",a:["Tea and berries","Citrus and the peppers","Cabbage and sprouts","Kelp and salt"],k:1,w:"The B group comes off the whole grains and the greens."},
    {q:"What is this page's own line about a plate?",a:["A bottle beats the plate","Colour means nothing","A plate with colour in it carries more than a shelf of bottles","Only pills work"],k:2,w:"A bottle is for a body fighting something, not for an ordinary day."}]},

{d:22,t:"Minerals, in the book's words",s:"The stabilisers",
 p:["Minerals stabilise. Where a vitamin lets the body work, a mineral is part of the structure and the signalling: calcium and magnesium in bone and nerve, iron in the blood's oxygen, zinc in healing, iodine in the thyroid, selenium among the body's defences.","The book's food medicine chart carries them the same way it carries the vitamins, food by food, and its seasoning rows put a mineral in the kitchen: kelp for the thyroid and for goiter is the one most often met.","The practical caution is on this page. Iron, iodine, selenium and zinc are all things where more is not better, and iron in particular is a supplement not to take on a guess. Where a body is short of a mineral that matters, that is a blood test and a doctor, not a shelf.","The third book's mineral list for melanin is copper, magnesium, zinc, selenium and iron: the same minerals this day has just met, with the same caution on every one of them. It is a book's list of what a substance is built from, not an amount for anybody to take."],
 q:[{q:"Which seasoning does the book give for the thyroid?",a:["Kelp","Basil","Vanilla","Dill"],k:0,w:"One of the kitchen rows on the chart."},
    {q:"Which mineral is named as one not to take on a guess?",a:["Calcium","Iron","Potassium","Sodium"],k:1,w:"A body short of a mineral that matters is a blood test, not a shelf."},
    {q:"Which mineral carries oxygen in the blood?",a:["Zinc","Iodine","Iron","Calcium"],k:2,w:"Iron, iodine, selenium and zinc are all things where more is not better."},
    {q:"Which two are named for bone and nerve?",a:["Iron and zinc","Iodine and selenium","Kelp and salt","Calcium and magnesium"],k:3,w:"Zinc is for healing and iodine for the thyroid."},
    {q:"A body short of a mineral that matters needs what?",a:["A blood test","A bigger dose","A fast","A tea"],k:0,w:"That is a doctor's ground, not a shelf."}]},

{d:23,t:"Amino acids, enzymes and trace elements",s:"The rest of the shelf",
 p:["The book's nutritional approach puts the whole foods first because they carry more than any one named thing: the amino acids a body builds from, the enzymes that come with a live plant, and the trace elements nobody lists on a label.","Its line on processed food is that the processing takes exactly those out - the vitamins, the minerals, the trace elements, the fiber and the amino acids - and leaves a long shelf life where a whole food has a short one. That is the book's claim, and it is the one its whole nutritional argument rests on.","For this course the point is narrower. A food is more than the sum of what its label names, which is why the plate keeps winning over the bottle, and why a course of study on herbs begins with food."],
 q:[{q:"What does the book say processing takes out?",a:["Only water","Only colour","Vitamins, minerals, trace elements, fiber and amino acids","Nothing"],k:2,w:"And leaves a long shelf life where a whole food has a short one."},
    {q:"What does a live plant carry that a label does not list?",a:["Only sugar","Only water","Nothing","Enzymes and trace elements"],k:3,w:"A food is more than the sum of what its label names."},
    {q:"Which lasts longer on a shelf?",a:["A processed food","A whole food","A fresh leaf","A berry"],k:0,w:"That is the book's claim, and the whole of its food argument rests on it."},
    {q:"Why does a course on herbs begin with food?",a:["It is cheaper","The plate keeps winning over the bottle","The book demands it","Herbs do not work"],k:1,w:"Food first, a plant second, is the course's first rule."},
    {q:"Is a food only what its label names?",a:["Yes","Only if it is raw","No, it carries more","Only for fruit"],k:2,w:"The amino acids and enzymes come with the plant."}]},

{d:24,t:"The glandular system and the brain",s:"The book's map of the body's regulators",
 p:["The book treats the glands as the body's regulators, with the pituitary and the pineal at the top and the thyroid, the adrenals and the pancreas below them, and it gives each its own chapter and its own herbs.","Its pineal ideas are its own and are printed as its own: that the gland secretes melanin, that the secretion is sunlight dependent, and that artificial light, sunglasses, screens and fluorescent light work against it. Read them as a tradition's claim, in a book that is describing a whole way of seeing a body.","For practice, two things from the chapter are worth keeping. The thyroid's mineral is iodine, which is why kelp keeps coming up. And a glandular problem that is real - a thyroid that has been measured, a diabetes that has been diagnosed - is a doctor's ground, not an herb's.","The third book goes further than this one on the pineal: it calls the pineal the master gland and the pituitary a mistake, and it gives the pineal two hormones, serotonin for the daylight and melatonin for after sundown. That is its claim, in its own book, and it is printed as its claim."],
 q:[{q:"How does this course treat the book's pineal claims?",a:["As the book's own claims","As proven fact","As this page's findings","As unimportant"],k:0,w:"They are a tradition's claim inside a book describing a whole way of seeing a body."},
    {q:"Which mineral is the thyroid's, in the book?",a:["Iron","Iodine","Zinc","Calcium"],k:1,w:"Which is why kelp keeps coming up on the seasoning rows."},
    {q:"A measured thyroid problem belongs with whom?",a:["A stronger herb","A fast","A doctor","A poultice"],k:2,w:"A glandular problem that is real is a doctor's ground, not an herb's."},
    {q:"Which two glands does the book put at the top?",a:["The thyroid and the pancreas","The adrenals and the liver","The kidney and the heart","The pituitary and the pineal"],k:3,w:"Each gland gets its own chapter and its own herbs."},
    {q:"Is a diagnosed diabetes an herb's ground?",a:["No","Yes","Only with tea","Only in winter"],k:0,w:"A diagnosis belongs to a doctor, and this page says so."}]},

{d:25,t:"Reading a plant: the two halves of a card",s:"The habit that makes the library useful",
 p:["Every plant in the library is read in the same two halves. The top of the card is what it does: its classes, its old use, its energetics, its preparations. The bottom is the caution: who must not, how long, and what it clashes with.","The habit is to read the caution first when the plant is new, and the use first when you already know the plant. Either way both halves are read before anything is decided, which is the whole difference between a student and a shopper.","Your own notes are the third half. Each card has a box for what your book says, and the notes collect them. Write the reason you chose a plant and the result you saw, because a case you cannot look back on teaches nothing the second time."],
 q:[{q:"What are the two halves of a plant's card?",a:["The price and the weight","The Latin and common name","What it does, and the caution","The colour and the smell"],k:2,w:"Both halves are read before anything is decided."},
    {q:"Which half do you read first for a new plant?",a:["The use","The name","Neither","The caution"],k:3,w:"And the use first when the plant is already familiar."},
    {q:"Which half do you read first for a plant you know?",a:["The use","The caution","The price","Neither"],k:0,w:"Either way, both halves get read."},
    {q:"What is the third half?",a:["The price","Your own notes","The Latin name","The shelf"],k:1,w:"Each card has a box for what your book says."},
    {q:"What do you write in your notes?",a:["The price","The colour","Why you chose the plant and what you saw","The weather"],k:2,w:"A case you cannot look back on teaches nothing the second time."}]},

{d:26,t:"Ten foundations, one: ginger, garlic, chamomile, peppermint, thyme",s:"The kitchen five",
 p:["Ginger is warm and drying, a diaphoretic and an anti-inflammatory, used for a cold coming on, for nausea and for a sluggish digestion. Garlic is an antiseptic, an alternative, an anti-inflammatory and an anthelmintic all at once, and the book uses it everywhere.","Chamomile is a calmative, a bitter tonic and a sedative; peppermint is a refrigerant and a carminative, for the gut and for a blocked nose; thyme is an antiseptic and an expectorant, the herb for a chest.","These five are the kitchen shelf, and they are the safest ground in the whole library. One caution joins them: garlic thins the blood a little, and a person on a blood thinner or facing an operation should say so before using it in quantity."],
 q:[{q:"Which five herbs are the kitchen shelf?",a:["Ginger, garlic, chamomile, peppermint, thyme","Aloe, comfrey, senna, kelp, pau d'arco","Valerian, catnip, fennel, dandelion, kelp","Sage, yarrow, licorice, marshmallow and echinacea"],k:0,w:"They are the safest ground in the library, and they are in the cupboard."},
    {q:"What is ginger used for?",a:["The liver","A cold coming on, and a sick stomach","The eyes","The skin only"],k:1,w:"It is warm and drying, and it is for a cold and for nausea."},
    {q:"What is thyme for?",a:["The liver","The kidneys","The chest","The blood"],k:2,w:"An antiseptic and an expectorant, the herb for a chest."},
    {q:"What is the caution on garlic?",a:["It is fatal in small amounts","It is only for babies","It is never used","It thins the blood a little"],k:3,w:"A person on a blood thinner or facing an operation should say so first."},
    {q:"When do you tell somebody about garlic?",a:["Before an operation, or if you take a blood thinner","Never","Only at the shop","Only in winter"],k:0,w:"And when the amount used is a lot."}]},

{d:27,t:"Ten foundations, two: echinacea, licorice, marshmallow, yarrow, sage",s:"Five more of the safest",
 p:["Echinacea is an alternative and an antiseptic, taken at the first tickle of a cold rather than in the middle of one. Licorice is a demulcent and a mild expectorant, and its caution is real: it raises blood pressure and depletes potassium, so it is not a long course for someone with high blood pressure.","Marshmallow is the demulcent and emollient that soothes and protects, inside and out. Yarrow is a diaphoretic and an astringent, the herb of a fever that wants to break. Sage is an astringent and a diaphoretic, the gargle for a sore throat and the tea for a sweat.","Licorice is the caution of the five, and it is worth knowing by heart: it is the herb that looks mild, tastes sweet, and quietly moves a blood pressure. That contrast - a gentle taste and a real caution - is the shape of half the mistakes in a herb practice."],
 q:[{q:"When is echinacea taken?",a:["In the middle of a cold","Every day","At the first sign of a cold","Only with a fever"],k:2,w:"Rather than once a cold has taken hold."},
    {q:"What is licorice's real caution?",a:["It is fatal","It is for babies","It hurts the liver","It raises blood pressure"],k:3,w:"It also depletes potassium, which is why it is not a long course."},
    {q:"What does marshmallow do?",a:["Soothes and protects, inside and out","Wakes you up","Brings a fever down","Removes worms"],k:0,w:"It is a demulcent and an emollient."},
    {q:"What is yarrow for?",a:["A bruise","A fever that wants to break","A cough","Sleep"],k:1,w:"It is a diaphoretic and an astringent."},
    {q:"What is sage used for?",a:["The liver","The kidneys","A sore throat and a sweat","The eyes"],k:2,w:"It is the gargle for a sore throat and the tea for a sweat."}]},

{d:28,t:"Ten foundations, three: valerian, catnip, fennel, dandelion, kelp",s:"Nerves, gut and mineral",
 p:["Valerian and catnip are nervines: valerian the stronger sedative, catnip the gentler one that suits a child's sleepless evening. Neither is a strong medicine and both are used in the evening rather than the morning.","Fennel is a carminative for wind and a gentle digestive; dandelion is a bitter tonic and a diuretic, its root the bitter and its leaf the flush. Kelp is the mineral food the book gives for the thyroid and for goiter.","Two cautions. Dandelion as a diuretic is not a substitute for looking at why a body is holding water, and kelp is iodine, so it is a supplement not to take in quantity without knowing the thyroid's state. Where a thyroid is already being treated, kelp belongs to the doctor's list."],
 q:[{q:"Which is the gentler one for a child's sleepless evening?",a:["Catnip","Valerian","Fennel","Kelp"],k:0,w:"Valerian is the stronger sedative."},
    {q:"When are valerian and catnip taken?",a:["In the morning","In the evening","At noon","With every meal"],k:1,w:"They are evening herbs, not morning ones."},
    {q:"Which part of dandelion is the bitter?",a:["The leaf","The flower","The root","The seed"],k:2,w:"Its root the bitter, its leaf the flush."},
    {q:"What is fennel for?",a:["Sleep","A fever","The eyes","Wind and a gentle digestion"],k:3,w:"It is a carminative."},
    {q:"What is the caution on kelp?",a:["It is iodine, so not in quantity","It is a poison","It is for babies","It is never used"],k:0,w:"Where a thyroid is already treated, kelp belongs to the doctor's list."}]},

{d:29,t:"Ten foundations, four: aloe, comfrey, witch hazel, senna, pau d'arco",s:"The five with real cautions",
 p:["Aloe vera is a vulnerary for the skin, and the latex inside the leaf is a strong laxative that is not the same thing at all. Comfrey is a demulcent and an emollient, for the outside only - never swallowed, and named beside goldenseal for babies.","Witch hazel is an astringent, the lotion for a bruise and a vein. Senna is a cathartic and a week is its limit, not a habit. Pau d'arco is the book's answer to the yeast it says causes sugar cravings.","This is the day to notice the pattern of the whole shelf. The five strongest-looking herbs here are the five with the sharpest limits, and every one of them is more useful known than used."],
 q:[{q:"Which of these is never taken inside the body?",a:["Aloe","Witch hazel","Comfrey","Senna"],k:2,w:"Its card says never internally, beside goldenseal for babies."},
    {q:"What is aloe vera's latex?",a:["A calmative","A fever herb","A sleep herb","A strong laxative"],k:3,w:"And it is not the same thing as the gel in the leaf."},
    {q:"What is witch hazel for?",a:["A bruise and a vein","A cold","A cough","Sleep"],k:0,w:"It is an astringent, the lotion for a bruise and a vein."},
    {q:"How long is senna's limit?",a:["A year","A week","Forever","One cup"],k:1,w:"Not a habit - it is a medicine rather than a morning drink."},
    {q:"What is pau d'arco the book's answer to?",a:["A fever","A bruise","The yeast it says causes sugar cravings","A cough"],k:2,w:"One line in the book ties yeast and the craving together."}]},

{d:30,t:"Ten foundations, five: gymnema, bilberry, guggul, chickweed, goldenseal",s:"The sugar shelf, and a caution",
 p:["Gymnema sylvestre is the one the book stars as most effective against the sugar craving. Bilberry is its herb for the eyes and, in its words, for increasing the insulin used in diabetes and healing the pancreas. Guggulipid is named against the craving too, and chickweed is a gentle cooling demulcent.","Goldenseal is an astringent and an antiseptic with a standing caution: it is not for pregnancy, not for babies, and not for a long course, because its alkaloid accumulates. It is the herb most often sold for everything and least suited to that use.","Two of these five are herbs a person on diabetes medicine must raise with their doctor before using, because both are described as affecting the same ground. That is not a reason to avoid them; it is a reason to say so first."],
 q:[{q:"Which herb does the book star against the sugar craving?",a:["Gymnema sylvestre","Chickweed","Pau d'arco","Bilberry"],k:0,w:"Guggulipid is named on the same list."},
    {q:"What is goldenseal's standing caution?",a:["It has none","Not in pregnancy, not for babies, not for long","It is fatal in one cup","It only grows in one country"],k:1,w:"Its alkaloid builds up, which is why it is not a long course."},
    {q:"Which herb is the book's for the eyes?",a:["Senna","Thyme","Bilberry","Fennel"],k:2,w:"In its words it is also for the insulin used in diabetes."},
    {q:"Why tell a doctor before taking gymnema or bilberry?",a:["They are poisons","They cost too much","They are not herbs","Both work on the same ground as sugar medicine"],k:3,w:"Not a reason to avoid them - a reason to say so first."},
    {q:"What is chickweed?",a:["A gentle cooling demulcent","A strong laxative","A nerve herb","A blood herb"],k:0,w:"It is the mild one of the five."}]},
{d:31,t:"Food first: the nutritional approach",s:"What the books put on the plate",
 p:["The books' nutritional approach is short. Raw whole food - fruit, vegetables, grains and beans - eaten fresh and raw where they can be; cooked whole grains and lightly steamed vegetables; and dark green leaves, generously, with their juice.","Off the table: no dairy products, and no fried food. And where the book names a diet for a body, it names the plate rather than a bottle, which is the same argument the whole course has been making.","This page keeps the plate and parts company with the absolutes. A diet that removes a whole food group for everybody is a claim, and where the book removes dairy and fried food this page reads it as its claim, printed in its voice."],
 q:[{q:"What two things does the book take off the table?",a:["Fruit and grains","Water and tea","Dairy and fried food","Herbs and spices"],k:2,w:"Its nutritional approach covers the rest of the day."},
    {q:"What does the book put first?",a:["A supplement","A strong herb","A fast","Raw whole food"],k:3,w:"Fruit, vegetables, grains and beans, fresh and raw where they can be."},
    {q:"Which four go on the plate?",a:["Fruit, vegetables, grains and beans","Meat, cheese, bread and milk","Salt, sugar, oil and flour","Tea, coffee, juice and soda"],k:0,w:"Cooked whole grains and lightly steamed vegetables are in too."},
    {q:"How does this page treat the book's absolutes?",a:["As its own rules","As the book's claims, not rules","As proven","As unimportant"],k:1,w:"A diet that removes a whole food group for everybody is a claim."},
    {q:"What is kept from this day?",a:["Dairy is a poison","Fried food is fine","The plate comes before the bottle","Fruit is bad"],k:2,w:"That is the same argument the whole course has been making."}]},

{d:32,t:"White sugar, in the book's words",s:"The book's classification of energy",
 p:["The book does not treat white sugar as a food with a downside. It names it as a drug, and puts it on the same shelf as table salt and meat. All three are called contractive: things a body has to expand and dilute to survive them.","Its account of what happens next is the part to read twice. The biochemistry expands to neutralise them, and the rush of that work is felt as a lift - so the lift is the body's reaction, not the sugar. The book's words are blunt: the drugs and the meat are not stimulants but destructive depressive immune retardants.","Then the sugar itself, in its own sequence: white sugar raises the blood sugar, overstimulates the liver and the pancreas, and causes an oversecretion of insulin. Too much insulin turns sugar into fat, or is what it calls sugar diabetes. The swing the other way leaves too little blood sugar, and its name for that is hypoglycemia, with fatigue."],
 q:[{q:"How does the book class white sugar, salt and meat?",a:["As contractive, and as drugs","As harmless food","As proteins","As the safest things on the shelf"],k:0,w:"The body expands to dilute them, and the rush of that work feels like a lift."},
    {q:"Where does the lift from sugar come from, in the book?",a:["The sugar itself","The body's own reaction","The caffeine","The fat"],k:1,w:"Its own line is that the lift is the body's reaction, not the sugar."},
    {q:"What does the book say too much insulin does?",a:["Nothing","Cools the body","Turns sugar into fat","Builds bone"],k:2,w:"Or it is what the book calls sugar diabetes."},
    {q:"What does the book call low blood sugar?",a:["Diabetes","Anemia","A fever","Hypoglycemia"],k:3,w:"And it names tiredness with it."},
    {q:"What comes with low blood sugar, in the book?",a:["Tiredness","A rash","A cough","A fever"],k:0,w:"The swing the other way from the sugar's lift."}]},

{d:33,t:"The craving, and the book's own shelf for it",s:"Nutricide, the sugar craving remedy",
 p:["The book does not leave a craving without an answer. It gives a short page called the sugar craving remedy, and it is a list rather than a recipe: gymnema sylvestre, starred as the most effective; chickweed; bilberry, for the pancreas in its words; guggulipid; vanadium as vanadyl sulfate; chromium for energy and to stabilise blood sugar.","Then one line underneath that ties two things together: yeast causes desires for sugar, and its remedy for that is pau d'arco. Every name on the page already has its own entry and its own caution in this library.","Two things this page adds to the book's. A finding comes before a herb: a body that has been thirsty, tired and losing weight, or that has sugar in the urine, needs that looked at first. And the craving itself is beaten by the plate far more than by any bottle, which is what the last third of this course is about."],
 q:[{q:"What does the book say causes sugar desires?",a:["Salt","Milk","Yeast","Starch"],k:2,w:"And pau d'arco is its answer to that."},
    {q:"What is the book's answer to that?",a:["Senna","Kelp","Sage","Pau d'arco"],k:3,w:"One line in the book ties the two together."},
    {q:"How is the remedy given in the book?",a:["As a list, not a recipe","As one herb","As a recipe","As a fast"],k:0,w:"Six names in a short page."},
    {q:"What must come before a herb, on this page?",a:["A bigger dose","A finding first - thirst, weight loss and sugar in the urine need looking at","A fast","A bottle"],k:1,w:"That ground is a doctor's before it is a plant's."},
    {q:"What beats the bottle for a craving, on this page?",a:["A tincture","A capsule","The plate","A fast"],k:2,w:"Which is what the last third of the course is about."}]},

{d:34,t:"Mucus, in the book's words",s:"What the book means by congestion",
 p:["Mucus is the book's own word and it means something specific by it: the slime that cooked, starchy, greasy, fiberless food leaves behind as it is eaten and not fully moved on.","Its account of the body is that there are ordinary ways out - the bowel, the kidneys and the urine, and the breath - and that when those cannot keep pace, the body uses the routes it has left. The skin, the nose, the throat and the lungs start moving things out instead.","That is the hinge of a great deal of the book. What it says is happening in a cold, in a runny nose, in a cough that brings something up, is the body clearing, and its own name for the process is a cleansing, where the rest of the world says illness."],
 q:[{q:"In the book, what is mucus?",a:["What cooked, starchy food leaves behind","A virus","A mineral","An infection"],k:0,w:"The book has its own name for what the body then does about it."},
    {q:"Which are the ordinary ways out, in the book?",a:["The fingers and toes","The bowel, the kidneys and the breath","Only the skin","The hair"],k:1,w:"When those cannot keep pace, the body uses the routes it has left."},
    {q:"What does the book call a runny nose and a cough that clears?",a:["A contagion","A weakness","A cleansing","A shortage"],k:2,w:"This page takes the idea and not the whole step."},
    {q:"Which routes does the body use when the others cannot keep pace?",a:["The eyes","The ears","The bones","The skin, nose, throat and lungs"],k:3,w:"That is the hinge of a great deal of the book."},
    {q:"Does this page take the whole idea?",a:["No - it takes the idea and not the whole step","Yes, all of it","Only the food part","Only the water part"],k:0,w:"The next day says where the page stops."}]},

{d:35,t:"Where this page stops",s:"The step that does not travel",
 p:["The book's further step is that, if the trouble is the body clearing itself, it is therefore not passed from person to person. That step does not travel to this page, and it is worth being plain about why.","Nothing on this shelf answers an infection. That is the oldest and most important line in the whole library: an infection, a fever that will not come down, a chest that is filling - those are not a herb's ground, whatever a book says about a cleansing.","What is left is the part a person can use, and it is a real part. What goes in decides how much there is to clear. Read the chapter for the food and the water and the rest; do not read it for a reason to wait on a chest.","The third book carries claims of the same kind that stay with it too: its six race types, its reading of two brains, and its charge that the lab values were built on a white body. Each is printed as the book's claim, and this page builds no dose, no test and no judgement of a person on any of them."],
 q:[{q:"Which claim does this page leave in the book?",a:["That food matters","That water matters","That a cold is not passed from person to person","That sleep helps"],k:2,w:"The idea is taken; the whole step is not."},
    {q:"What does this page say about an infection?",a:["Try oregano oil","Give it three days","Take goldenseal","No plant here touches it"],k:3,w:"An infection, a fever that will not come down, a chest that is filling."},
    {q:"What part of the chapter does travel?",a:["What goes in decides how much there is to clear","The whole claim","Nothing","Only the sugar"],k:0,w:"A real part, and a usable one."},
    {q:"A fever that will not come down is what?",a:["A cleansing","Not a herb's ground","A small thing","A fast's job"],k:1,w:"Waiting on a chest is the one thing this page will not do."},
    {q:"What is the oldest line in the library?",a:["Food first","Fresh is best","Nothing on this shelf answers an infection","Read the label"],k:2,w:"Read the chapter for the food and the water, not for a reason to wait."}]},

{d:36,t:"Food combining",s:"The book's rule about what goes with what",
 p:["Food combining is the book's argument that certain foods eaten together sit worse than either eaten alone, and its chief example is starch and sugar.","Its reason, in its own words, is that sugar makes the starches spoil: the sugar ferments and the starch is held behind it, which the book reads as the beginning of the mucus it talks about.","This page prints the rule as the book's and adds one of its own: a person who eats simply, sits down to eat, and does not eat late is already doing most of what food combining is for. The rule is a fine frame and a poor worry."],
 q:[{q:"What is the book's chief example?",a:["Starch and sugar","Water and salt","Herbs and food","Fruit and water"],k:0,w:"The one the book draws its argument from."},
    {q:"Why does the book say not to combine them?",a:["It costs more","Sugar makes the starches spoil","It tastes bad","It is hard to chew"],k:1,w:"Its words: the sugar ferments and the starch is held behind it."},
    {q:"What does this page add?",a:["Never eat fruit","Only eat starch","Eat simply and not late, and you are doing most of it","Eat quickly"],k:2,w:"The rule is a frame, not a fear."},
    {q:"In the book, what does the sugar do?",a:["It warms the food","It adds protein","It cleans the gut","It ferments and holds the starch behind it"],k:3,w:"Which the book reads as the beginning of the mucus it talks about."},
    {q:"Is the rule a frame or a fear, on this page?",a:["A frame","A fear","A law","A cure"],k:0,w:"A good frame and a poor worry."}]},

{d:37,t:"The twenty-four hour cycle",s:"The book's clock",
 p:["The book reads the day as three phases: a cleansing phase from about four in the morning to noon, when the body is emptying; a phase of eating and digestion from noon to about seven in the evening; and a phase of rest and assimilation from seven in the evening to four in the morning.","Its African breakfast follows from the clock. Fruit is the morning food because the morning is the cleansing phase, and fruit moves quickly. The evening is the resting phase, so the heavier plate sits earlier rather than last thing.","The clock is the book's own and is printed as its claim. What is usable in it is plain and does not depend on the clock being right: eat when the body is awake to digest, and let the last hours before sleep be quiet ones.","The third book reads the same hours from the other end. Its serotonin is stimulated by daylight and polymerises into melanin, and its melatonin is secreted after sundown and highest around ten at night - which lands in the same place as this day's quiet last hours, said in its own chemistry."],
 q:[{q:"Which hours are the cleansing phase, in the book?",a:["Noon to seven in the evening","Seven in the evening to four","Four in the morning to noon","Midnight to six"],k:2,w:"Which is why its African breakfast is fruit."},
    {q:"Which hours are for eating and digesting?",a:["Four in the morning to noon","Seven at night to four","Midnight to six","Noon to about seven in the evening"],k:3,w:"The book reads the day as three phases."},
    {q:"Which phase is the evening?",a:["Rest and assimilation","Cleansing","Eating and digesting","None"],k:0,w:"So the heavier plate sits earlier rather than last thing."},
    {q:"Why is fruit the morning food, in the book?",a:["Fruit is cheap","The morning is the cleansing phase and fruit moves quickly","Fruit has no sugar","It is cold"],k:1,w:"The clock is the book's own claim."},
    {q:"What does this page call usable?",a:["The exact hours","Nothing","Eat when the body is awake to digest, and let the last hours be quiet","Only the fruit"],k:2,w:"It does not depend on the clock being right."}]},

{d:38,t:"Salt, white flour and white rice",s:"The rest of the contractive shelf",
 p:["The book puts table salt on the same contractive shelf as sugar and meat, and blames it for water held in the tissues and for raised pressure. White flour and white rice it treats as refined carbohydrates: the same argument as white sugar, wearing a plainer coat.","Its answer is the whole grain and the unrefined salt, in the amount the food needs rather than the amount the tongue wants.","The page's own addition is practical. Salt is not the enemy, its quantity is, and the salt that arrives in a packet of anything is the salt nobody counted. Read a label's sodium line and the whole chapter becomes a habit rather than a worry."],
 q:[{q:"On which shelf does the book put table salt?",a:["The contractive one, with sugar and meat","The expansive one","Neither","The mineral shelf only"],k:0,w:"And it blames it for water held in the tissues and for higher pressure."},
    {q:"How does the book treat white flour and white rice?",a:["As whole grains","As refined carbohydrates","As proteins","As herbs"],k:1,w:"The same argument as white sugar, in a plainer coat."},
    {q:"What does the book blame salt for?",a:["A fever","A cough","Water held in the tissues and higher pressure","A rash"],k:2,w:"Its answer is the whole grain and the unrefined salt."},
    {q:"What is this page's practical line?",a:["Salt is the enemy","Salt is a herb","Labels do not matter","The salt in a packet is the salt nobody counted"],k:3,w:"Read the sodium line and the chapter becomes a habit rather than a worry."},
    {q:"What should you read on a label?",a:["The sodium line","The colour","The price","The brand"],k:0,w:"Salt is not the enemy; its quantity is."}]},

{d:39,t:"What blunts a herb",s:"The three the book names",
