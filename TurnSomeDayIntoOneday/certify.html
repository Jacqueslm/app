 p:["A practice is not one person; it is a small map of people who can hold the ground a herbalist cannot. The American Herbalists Guild asks exactly this of its registered members: a network of licensed practitioners, named and real.","A workable network is short and specific: a general practitioner, a pharmacist for the interaction questions, a dietitian, a physiotherapist or a trainer for movement, a mental-health clinician, and somebody for the conditions the practice sees most. Each name is written down with a note of what they are good for.","And the network is used rather than admired. The habit that keeps it alive is sending a person with a note of what was found and asking for a note back, so that the next case starts from a fuller picture than this one did."],
 q:[{q:"What does AHG ask its registered members for?",a:["A network of licensed practitioners, named and real","A shop","A licence","A degree"],k:0,w:"A practice is a small map of people who can hold the ground a herbalist cannot."},
    {q:"Who is on the network for the interaction questions?",a:["A trainer","A pharmacist","A dietitian","A poet"],k:1,w:"Short and specific is the shape of a workable network."},
    {q:"What keeps the network alive?",a:["Listing it","Nothing","Sending a person with a note and asking for one back","Advertising"],k:2,w:"So the next case starts from a fuller picture."},
    {q:"What shape is a workable network?",a:["Long and vague","Private","Anonymous","Short and specific"],k:3,w:"A few names you actually use."},
    {q:"Why keep a network?",a:["So the next case starts from a fuller picture","For the price","For style","It is the law"],k:0,w:"Then the case goes to the right person."}]},

{d:83,t:"Common herbs under scrutiny",s:"The four that are always asked about",
 p:["Four herbs come up in every conversation about safety, and each one teaches a different lesson. St John's wort: the interaction herb, changing how the liver handles a long list of medicines. Ginkgo: the blood-thinning herb, mild alone and not mild beside a thinner or an operation.","Comfrey: the herb never swallowed, because its alkaloid is a liver burden, and still used on the skin. Kava: the calming herb with a liver caution, taken short and never beside alcohol or a liver already struggling.","The lesson under all four is the same and it is the course's lesson. A herb is not safe or unsafe on its own; it is safe or unsafe in a person, at an amount, for a duration. Every one of these four is useful known and dangerous guessed."],
 q:[{q:"Which herb is the interaction herb?",a:["Ginkgo","Comfrey","St John's wort","Kava"],k:2,w:"It changes how the liver handles a long list of medicines."},
    {q:"Which herb is never swallowed, and still used on the skin?",a:["Ginkgo","Kava","Senna","Comfrey"],k:3,w:"Its alkaloid is a liver burden."},
    {q:"What is the lesson under all four?",a:["A herb is safe or unsafe in a person, at an amount, for a duration","Herbs are always safe","Herbs are never safe","Safety is about the price"],k:0,w:"Every one of these four is useful known and dangerous guessed."},
    {q:"Which of the four carries a liver caution?",a:["Chamomile","Kava","Ginger","Sage"],k:1,w:"And comfrey sits on the same ground."},
    {q:"What is each of the four?",a:["Useless","Safe in any amount","Useful known and dangerous guessed","A food"],k:2,w:"Which is why the caution is read as quickly as the use."}]},

{d:84,t:"Reading a label and a certificate of analysis",s:"What a packet can and cannot tell you",
 p:["A label carries the botanical name, the part used, the batch, the form and the amount per dose, and where it is done well it also carries the ratio for a tincture or the extraction for a powder. Where the botanical name is absent, or the part is absent, the label has told you it cannot be checked.","A certificate of analysis is the document behind the label. It names what was tested for - identity, and often the marker compounds, the heavy metals, the microbes and the pesticides - and it belongs to a batch rather than to a brand, so it is worth asking for the batch in hand.","The practical habit is short. Buy the form you can check where you can, buy by botanical name, keep the batch and the date on the jar, and treat a proprietary blend that names neither its plants nor its amounts as a packet you cannot learn anything from."],
 q:[{q:"What must a good label carry?",a:["The botanical name, the part used, the batch, the form and the amount per dose","A brand name only","Only the price","Only the colour"],k:0,w:"Where the botanical name or the part is absent, the label cannot be checked."},
    {q:"What is a certificate of analysis?",a:["A price list","The document behind the label, naming what was tested","A recipe","A licence"],k:1,w:"Identity, and often the marker compounds."},
    {q:"What does it usually name?",a:["Only the price","Only the colour","Identity, marker compounds, heavy metals, microbes and pesticides","Nothing"],k:2,w:"What a packet can and cannot tell you."},
    {q:"What belongs to a batch rather than a brand?",a:["The price","The bottle colour","The shelf","The certificate"],k:3,w:"Which is why it is worth asking for the batch in hand."},
    {q:"When is a label impossible to check?",a:["When the botanical name or the part is missing","When it is expensive","When it is dark","When it is printed"],k:0,w:"A name is what makes a packet checkable."}]},

{d:85,t:"Practice management and pricing",s:"The unglamorous half",
 p:["A practice is a small business, and the business is where most practices quietly stop. Four things carry it: a written scope and consent, a record for each person, a priced service, and a boundary on the time each visit takes.","Pricing is set from the cost of the hour, not from the price of a competitor. The hour is the intake, the writing and the follow-up as well as the visit, and a price that ignores the writing is a price that punishes good practice. Herbs are billed as what they are rather than hidden inside a number.","The habit worth fixing early is the hour: a stated length, a stated number of people in a day, and a stated day off. A practice with no boundary on the hour is one that ends because the practitioner did, rather than because the work did."],
 q:[{q:"What four things carry a practice?",a:["A shop, a sign, a van and a card","Herbs, bottles, labels and seals","Scope, records, a price, and a boundary on the hour","Nothing"],k:2,w:"The business is where most practices quietly stop."},
    {q:"What is a price set from?",a:["A competitor","The price of the herbs","A feeling","The cost of the hour, including the writing and the follow-up"],k:3,w:"A price that ignores the writing punishes good practice."},
    {q:"What does a price that ignores the writing do?",a:["Punishes good practice","Saves money","Helps nobody","Nothing"],k:0,w:"The writing is part of the hour."},
    {q:"What habit is worth fixing early?",a:["The price","The hour","The herbs","The records"],k:1,w:"A stated length, a stated number in a day, and a stated day off."},
    {q:"What does a stated hour include?",a:["Nothing","Only the herbs","A stated length, a stated number in a day, and a stated day off","Only the price"],k:2,w:"It is the unglamorous half of a practice."}]},

{d:86,t:"Insurance and the practical risks",s:"The things that go wrong anyway",
 p:["A herbal practice carries risks that a scope statement does not remove: a reaction nobody predicted, a case that was actually something else, a record lost, a confidence broken. Each one is a reason rather than a scandal, and each one has a plain answer.","The answers are insurance suited to practice, a record kept securely and clearly, a referral made when it was needed rather than after, and a conversation about the reaction rather than a defence of the herb. Where a practice sells herbs as well, there is a second set of questions about the product and the claim.","The honest note under this day: no certificate and no amount of study makes a practice risk-free, and pretending otherwise is the opposite of the careful, plain style this course has kept."],
 q:[{q:"What risks does a scope statement not remove?",a:["An unpredicted reaction, a case that was something else, a lost record, a broken confidence","None","Only price risk","Only herb risk"],k:0,w:"Each one is a reason rather than a scandal."},
    {q:"What is the answer to a reaction?",a:["A defence of the herb","A conversation about it","Silence","A refund"],k:1,w:"Beside a record kept clearly, and a referral made when it was needed."},
    {q:"What is kept clearly beside that?",a:["A price list","A bottle","A record, and a referral made when it was needed","A receipt"],k:2,w:"That is what a careful practice does after a reaction."},
    {q:"What does a certificate do about risk?",a:["Removes it","Doubles it","Explains it","Nothing - no amount of study makes a practice risk-free"],k:3,w:"Saying so is the plain style this course keeps."},
    {q:"What is the careful, plain style here?",a:["Saying so rather than pretending otherwise","Pretending","Silence","Advertising"],k:0,w:"Pretending otherwise is the opposite of this course."}]},

{d:87,t:"Continuing education and the wider field",s:"Where the study goes next",
 p:["Every professional credential in this field is kept by continuing education: the herbalist's by continuing study and clinical hours, the trainer's by CEUs and a current CPR certificate on a two- or three-year cycle. The habit is the same for both - the study does not end when the certificate is written.","The wider field is larger than this shelf. A good next step after ninety days is one of the real programs, a botany course, a pharmacy course, or a supervised clinical placement where one can be had, and where a credential matters to a person, the pathway to AHG registration is the one to read in full.","The last direction worth naming is the reading itself. The two books here are one tradition; the field has others, and a practitioner who has read only one has read a chapter and called it the book."],
 q:[{q:"How is a credential kept, in this field?",a:["By paying once","By doing nothing","By continuing education - study, clinical hours, CEUs and current CPR","By a certificate"],k:2,w:"The habit is the same for both the herbalist and the trainer."},
    {q:"Which is named as a good next step?",a:["A larger bottle","A new shelf","A holiday","A botany course, a pharmacy course, or a supervised clinical placement"],k:3,w:"And the pathway to AHG registration is read in full."},
    {q:"What does a practitioner who has read one tradition have?",a:["A chapter, called a book","The whole field","Nothing","A licence"],k:0,w:"The field has others."},
    {q:"Where is the pathway to AHG registration read?",a:["In part","In full","Nowhere","On a bottle"],k:1,w:"Where a credential matters, it is worth reading properly."},
    {q:"Is the continuing-education habit different for a trainer?",a:["Yes","Only for herbs","No, it is the same","Only for gyms"],k:2,w:"Study, hours and current CPR."}]},

{d:88,t:"The last week: consolidation",s:"Reading it all again",
 p:["The last week of a course of study is not for new material. It is for reading back over what has been written down, and the notebook is the place to do it: the plants you have met most, the cautions you have had to look up twice, the cases you got wrong.","The three things worth being able to say without looking: the twenty classes, at least roughly; the five cautions that travel with this shelf; and the seven lines of the library's day 28. Where any of them is still thin, that is the reading for today rather than tomorrow.","Then the practice of reading a plant aloud, top to bottom, caution included, on a plant you think you know. It is the single best check of a course of study, because knowing a plant is exactly the ability to say its caution as quickly as its use."],
 q:[{q:"What is the last week for?",a:["Reading back over what has been written down","New material","Rest","Nothing"],k:0,w:"The notebook is the place to do it."},
    {q:"Where is that done?",a:["In a shop","In the notebook","In a test","Nowhere"],k:1,w:"Your own notes are read first in a practice."},
    {q:"Which three things are worth saying without looking?",a:["Prices, brands and batches","Latin names only","The twenty classes, the five shelf cautions, and the seven lines of day 28","Nothing"],k:2,w:"Where any is thin, that is the reading for today."},
    {q:"What do you do where any of them is thin?",a:["Skip it","Guess","Test it","Read that part today"],k:3,w:"The last week is for reading back, not for new material."},
    {q:"What is the best check of a course of study?",a:["Reading a plant aloud, caution included, on one you think you know","A price list","A shelf count","A test score"],k:0,w:"Knowing a plant is saying its caution as quickly as its use."}]},

{d:89,t:"The day before the examination",s:"The last lesson before the last test",
 p:["Tomorrow is the ultimate examination. Today is the smallest lesson in the course and the same one this library has always ended on: a day can go wrong and a day can end a day, and it can never end a person.","The same applies to the examination. A wrong answer points back at a day; that is the day to read again, and the examination can be taken again as many times as it takes. A score is a record of a morning, not a verdict on a practice.","So the instruction is short. Read the library's day 28 once tonight, get some sleep, and take the examination when you are awake rather than when you are anxious."],
 q:[{q:"What is the rule for a day that went wrong?",a:["Start the course again","Fast all day","The next meal is the one that matters, and it starts in ten minutes","Give up the plan"],k:2,w:"A day can end a day; it cannot end a person."},
    {q:"What does a wrong answer in the examination mean?",a:["The course is over","Nothing","A refund","It points back at a day - read that day again"],k:3,w:"And the examination can be taken again as many times as it takes."},
    {q:"How many times can the examination be taken?",a:["As many times as it takes","Once","Twice","Never"],k:0,w:"It is a study aid, not a single chance."},
    {q:"What is the short instruction for tonight?",a:["Cram all night","Read day 28 once and sleep","Skip it","Take it anxious"],k:1,w:"A score is a record of a morning, not a verdict on a practice."},
    {q:"What is a score a record of?",a:["A licence","A practice","A morning, not a verdict","A certificate"],k:2,w:"Which is why the examination can be retaken."}]},

{d:90,t:"The last day",s:"The ninety days, and after them",
 p:["You have the whole library now and the course has been through it. What is left is the habit. Read a plant before you use it, not after, and read the caution as quickly as the use - that is the whole of the practice in one sentence.","Write down what you find, carry those seven lines in your head, and keep the referral network real. Food first, a plant second, and a doctor's line over both, which is the same rule the course opened with ninety days ago.","The examination is next, and it is the last one here. After it, the certificate is a plain record of the work: ninety lessons, the quiz after each of them, two block tests and the ultimate examination. Nothing more, and nothing less."],
 q:[{q:"What is the practice, in one sentence?",a:["Read a plant before you use it, and its caution as quickly as its use","Use the strongest herb","Buy in bulk","Never use herbs"],k:0,w:"The caution is read as quickly as the use."},
    {q:"What rule does the course open and close with?",a:["A plant first","Food first, a plant second, a doctor's line over both","Nothing","Price first"],k:1,w:"The same rule the course opened with ninety days ago."},
    {q:"What does the certificate record?",a:["A licence","AHG registration","Ninety lessons, the quiz after each, two tests and the examination","A degree"],k:2,w:"Nothing more, and nothing less."},
    {q:"What is read as quickly as the use?",a:["The price","The label","The Latin name","The caution"],k:3,w:"That is the whole practice in one line."},
    {q:"How many lessons does the certificate record?",a:["Ninety","Sixty","Thirty","Ten"],k:0,w:"Ninety days, and then the examination."}]}
];

var FIT_DAYS = [
{d:1,t:"What a trainer is",s:"The two credentials, and the one that matters",
 p:["Two things are being certified in this field and they are not the same. A personal trainer works with one person at a time, on that person's goals, in a plan written for them. A group fitness instructor teaches a room, where the plan has to hold for everybody in it at once.","The industry's credentials are separate for the two: NASM-CPT, ACE-CPT, ACSM-CPT, NSCA-CPT and ISSA-CPT for the one, AFAA-CGFI and the ACSM group exercise credential for the other. This course covers the shared ground of both and then the part that is only the room's.","The one thing that matters more than either, and it is where this course begins: a trainer's first duty is not a programme, it is a person who is safe to train. Everything else is built on that."],
 q:[{q:"What is the difference the course draws first?",a:["Cost","One trainer works with one person; a group instructor teaches a room","Nothing","Location"],k:1,w:"And the industry's credentials are separate for the two."},
    {q:"Which credential is the group-fitness one?",a:["NASM-CPT","AFAA-CGFI","ISSA-CPT","NSCA-CPT"],k:1,w:"With the ACSM group exercise credential beside it."},
    {q:"What is a trainer's first duty?",a:["A programme","A person who is safe to train","A price","A plan"],k:1,w:"Everything else is built on it."}]},

{d:2,t:"Scope of practice",s:"What a trainer does, and does not, say",
 p:["A trainer's scope is exercise: screening, assessment, a programme, technique, and the coaching of it. It is not medicine. A trainer does not diagnose, does not prescribe a diet for a condition, and does not treat an injury.","The line is drawn by what is said. Safe: this movement is loading your shoulder a certain way, so let us change it. Not safe: you have a rotator cuff problem, take this. The first is coaching; the second is a diagnosis.","Referral is the everyday tool of the scope. A trainer keeps a short list - a doctor, a physiotherapist, a dietitian - and uses it early rather than as a last resort. Sending somebody on is not losing a client; it is what the certification is for."],
 q:[{q:"What is inside a trainer's scope?",a:["Diagnosis","Screening, assessment, a programme, technique","Prescribing a diet for a condition","Treating an injury"],k:1,w:"It is exercise, and the coaching of it."},
    {q:"Which sentence is inside scope?",a:["You have a rotator cuff problem","This movement loads your shoulder a certain way, so let us change it","Take this for your knee","Your blood pressure needs treatment"],k:1,w:"The first is coaching, the second is a diagnosis."},
    {q:"What is on a trainer's list?",a:["A doctor, a physiotherapist, a dietitian","A shop, a van, a sign","Nothing","Only other trainers"],k:0,w:"Used early rather than as a last resort."}]},

{d:3,t:"The by-10 method",s:"The theory behind how a session is built",
 p:["The by-10 is not a list of exercises. It is the rule that decides how a session is run, and it is short enough to say to a child: pick up a dumbbell you can pump out reps with, do two to five sets, keep every set under twenty reps, and rest ten seconds between one move and the next.","The weight is not the point, and it is the first thing people get wrong. The by-10 does not ask how much a person can lift. It asks for a dumbbell light enough to pump out the reps with, one that lets the set keep going rather than a heavy one that stops it at three. How many sets a person does depends on where they are starting, not on how strong they are: two to five sets, and that is the same range for a beginner as for somebody who has trained for years. A set ends when the reps stop being good, and it never runs past twenty.","The exercises are not the by-10's. They are P90X's - the rotation the Trainer page holds - and the rule is what gets applied to them. That is why a session trained this way is P90X rearranged rather than P90X followed to the letter: the movements are P90X's, and the sets, the twenty-rep cap and the ten seconds are the by-10's.","The ten seconds is a trade against traditional training. A traditional session rests thirty seconds to two minutes between sets: that buys more repetitions, and it also keeps the person working out for the whole hour. The by-10 spends that time on the session instead. The reps in a set come out fewer than a long rest would allow, and the set still ends in failure, because the rest was never long enough to restore the muscle - fewer reps a set, a guaranteed burnout, and a session half the length, where an hour's workout becomes thirty minutes.","The other half of the theory is the range. Each move is not taken to full extension: it is worked about three-quarters of the way in each direction, stopping short of the lockout and short of the deepest stretch, so the muscle is never handed an easy end to the rep and the tension stays on it. Add the ten seconds to that and the session builds strength, works the cardiovascular system through the whole of it rather than only on the cardio day, and promotes muscle growth. Everything else about the day - which movements, in what order - is P90X's, or the trainer's arrangement of it.","That is one session. A week is just as simple. The by-10 can be done every day, as long as the workout rotates - legs one day, pushing the next, cardio the day after - so the same muscle is not asked twice. Two sessions a day is how it is trained: one with the weights, one for the heart and lungs, and the order does not matter. And a beginner does not start with the dumbbells at all. The first week is stretching, a little every day, to get the body used to moving before anything is loaded, because a body that is ready is a body that does not get hurt."],
 q:[{q:"What does the by-10 fix, and what is left to the exercise menu?",a:["The exercises; the sets are P90X's","The sets, the twenty-rep cap and the ten seconds; the movements are P90X's","Nothing at all","Only the warm-up"],k:1,w:"The movements are P90X's, rearranged under the rule."},
    {q:"How long is the rest between moves?",a:["Ninety seconds","Ten seconds","Three minutes","None"],k:1,w:"Long enough to breathe, short enough to keep the heart rate up."},
    {q:"What decides how much weight is used?",a:["The most the person can lift","A dumbbell light enough to pump out reps with","What the last person used","Nothing - it is fixed"],k:1,w:"Not how much they can lift; how well they can pump the reps out."}]},

{d:4,t:"The home kit",s:"What the method assumes",
 p:["The by-10 assumes a room rather than a gym: a pair of dumbbells, push-up bars, a pull-up bar, and floor space. P90X, which supplies the exercises, works off the same kit and no machine, which is why the two fit together.","The kit decides the exercise menu. Dumbbells give the squats, the hinge, the presses, the rows, the raises and the arms. The push-up bars give four push-up variations by hand position and depth. The pull-up bar gives the pull-ups and the hanging work. Floor space gives the planks, the bridges and the carries.","The training point is bigger than the kit list. An exercise library is defined by its constraints, and a good programme is written for the room the person actually trains in rather than the room you wish they had."],
 q:[{q:"What four things does the by-10 assume?",a:["A gym and machines","Dumbbells, push-up bars, a pull-up bar and floor space","A treadmill and a bike","Nothing"],k:1,w:"Nothing in it assumes a machine."},
    {q:"What do the push-up bars give?",a:["Four push-up variations","The squats","The rows","The cardio"],k:0,w:"By hand position and depth."},
    {q:"What is the bigger training point?",a:["Buy more kit","A programme is written for the room the person actually trains in","Machines are better","Home training does not work"],k:1,w:"An exercise library is defined by its constraints."}]},

{d:5,t:"Anatomy: planes, joints and movements",s:"The vocabulary of every session",
 p:["A trainer names movement in three planes. Sagittal is forward and back - a squat, a lunge, a curl. Frontal is side to side - a lateral raise, a side step. Transverse is rotation - a twist, a wood chop, a swing. Almost every programme is short of the second and the third.","Joints move in a characteristic way, and the movement names follow that. Flexion closes a joint, extension opens it, abduction takes a limb away from the midline, adduction brings it back, rotation turns it, and circumduction is all of them in sequence.","Exercise selection is the art of covering the planes and the directions without copying a gym's machine list. A squat, a hinge, a push, a pull, a carry and a trunk movement, in three planes across a week, is most of a complete programme."],
 q:[{q:"Which plane is a lateral raise in?",a:["Sagittal","Frontal","Transverse","None"],k:1,w:"Side to side - and most programmes are short of it."},
    {q:"What is flexion?",a:["Closing a joint","Opening a joint","Turning a limb","Stretching a muscle"],k:0,w:"Extension opens it; abduction takes a limb away from the midline."},
    {q:"Which set is most of a complete programme?",a:["Six pushes","Squat, hinge, push, pull, carry and trunk, across three planes","Machines only","Cardio only"],k:1,w:"Rather than copying a gym's machine list."}]},

{d:6,t:"The major muscle groups",s:"What is working, and where",
 p:["The groups a trainer names most: the quadriceps and the gluteals and the hamstrings for the lower body, the calves beneath them, the pectorals and the deltoids and the triceps for the pushing, the lats and the rhomboids and the trapezius and the biceps for the pulling, and the abdominals and the obliques and the deep spinal muscles for the trunk.","A move is described by the joints it moves rather than by the muscle it is named after. A dumbbell goblet squat is hip and knee extension with a trunk resisting extension; it is not a quadriceps exercise and it is not a glute exercise - it is both, and the person's build decides the balance.","The practical value is coverage. Read a week's plan and name the groups it hits. A plan with three heavy pushes and one light pull is a plan that is writing somebody a shoulder problem."],
 q:[{q:"How is a move described, on this page?",a:["By the muscle it is named after","By the joints it moves","By the machine it uses","By its weight"],k:1,w:"A goblet squat is hip and knee extension with a trunk resisting extension."},
    {q:"Which groups are the pushing ones?",a:["Lats, rhomboids, biceps","Pectorals, deltoids, triceps","Quadriceps, gluteals, hamstrings","Calves and abdominals"],k:1,w:"And the lats, rhomboids, trapezius and biceps are the pulling ones."},
    {q:"What is a week with three heavy pushes and one light pull writing?",a:["A stronger back","A shoulder problem","Nothing","Better cardio"],k:1,w:"Read the week and name the groups it hits."}]},

{d:7,t:"The six patterns",s:"How a programme is organised",
 p:["Six patterns cover the body and they are the spine of the by-10. Squat: the goblet squat, the sumo squat, the split squat. Hinge: the Romanian deadlift, the hip thrust, the glute bridge. Push: the floor press, the shoulder press, the push-up. Pull: the bent-over row, the one-arm row, the pull-up. Carry and lunge: the reverse lunge, the calf raise, the loaded walk. Trunk: the plank, the dead bug, the hanging knee raise.","Each pattern has a home move and a harder move, and progress is usually made by choosing the harder one rather than by adding weight to the easy one. A push-up becomes a deep push-up before the floor press becomes heavy.","The six are also the audit list. A programme that misses a pattern is not a lighter programme; it is an unfinished one, and the pattern it misses is the one that eventually complains."],
 q:[{q:"How many patterns does the course name?",a:["Three","Six","Twelve","One"],k:1,w:"Squat, hinge, push, pull, carry or lunge, and trunk."},
    {q:"How is progress usually made?",a:["By adding weight to the easy move","By choosing the harder version of the pattern","By fewer reps","By more rest"],k:1,w:"A push-up becomes a deep push-up before the floor press becomes heavy."},
    {q:"What is a programme that misses a pattern?",a:["A lighter programme","An unfinished one","A better one","A cardio programme"],k:1,w:"And the pattern it misses is the one that eventually complains."}]},

{d:8,t:"Energy systems",s:"Where the work comes from",
 p:["Three systems supply the work and they overlap rather than take turns. The phosphagen system pays for the first seconds - a heavy triple, a jump, a sprint start. The glycolytic system pays for the next minute or two - the by-10 set itself, a hard minute of cardio. The aerobic system pays for everything longer, including the recovery between the sets.","The by-10 sits across the middle two by design. A set worked to its last good rep for the glycolytic system, ten seconds of rest, and on to the next move, with the aerobic system doing the recovery work the short rest does not leave time for.","The training point is that rest length is a design choice and not a gap. Ten seconds keeps the session aerobic and cardiovascular; ninety seconds would let the phosphagen system recover and make it a strength session instead."],
 q:[{q:"Which system pays for the first seconds?",a:["Phosphagen","Glycolytic","Aerobic","None"],k:0,w:"A heavy triple, a jump, a sprint start."},
    {q:"Which systems does the by-10 sit across?",a:["Phosphagen only","Glycolytic and aerobic","Aerobic only","None"],k:1,w:"A set for the glycolytic system, and the ten-second rest leaning on the aerobic one."},
    {q:"Why does rest length matter?",a:["It does not","It is a design choice - short rest makes it cardiovascular, long rest makes it strength","It changes the price","It changes the music"],k:1,w:"Ten seconds keeps the session aerobic; ninety would let the phosphagen system recover."}]},

{d:9,t:"Acute responses to exercise",s:"What a single session does",
 p:["In the minutes of a session a body does five things: the heart rate and the breathing rate rise, the blood is redirected towards the working muscle, the temperature rises, the working muscle uses its stored fuel, and the hormones that mobilise fuel rise with it.","The trainer's reading of those is a monitoring skill. A face going grey, a conversation that has stopped, a form that is coming apart, a heart rate that will not come down at rest - those are the acute responses that mean stop rather than push.","Then the recovery response, which is the one worth teaching: the heart rate comes down over a few minutes, the breathing settles, and a body that was warm becomes cool and wants its water back. Skipping that part is how a session leaves somebody sore for a week for no gain."],
 q:[{q:"Which is an acute response to a session?",a:["The heart rate and breathing rate rise","The muscle grows","The tendons thicken","Nothing changes"],k:0,w:"Along with redirected blood, a risen temperature, and hormone changes."},
    {q:"Which is a signal to stop rather than push?",a:["Sweating","A form that is coming apart","A raised heart rate","Fast breathing"],k:1,w:"Along with grey colour, stopped conversation, and a heart rate that will not settle."},
    {q:"Why does the warm-down matter?",a:["It looks tidy","Skipping it leaves somebody sore for a week for no gain","It burns fat","It is required"],k:1,w:"The breathing settles and the body wants its water back."}]},

{d:10,t:"Chronic adaptations",s:"What months of a session do",
 p:["Repeated training changes the body in ways a single session cannot. The heart pumps more per beat and beats more slowly at rest. The muscle grows and its capillary and mitochondrial density rises. The tendons and the bone thicken under load. The nervous system learns the movement, which is why a lift goes up before a muscle visibly changes.","The timetables matter to a trainer's honesty. Strength and skill move in the first weeks, size in the first months, and connective tissue more slowly still, which is why a programme that adds load faster than a tendon adapts is a programme that produces an injury in month three.","The practical rule: progress the movement before the weight, the weight before the volume, and never two at once. That single sentence prevents most of what a trainer will ever have to write an incident report about."],
 q:[{q:"What does the nervous system contribute to early progress?",a:["Size","Skill - the lift goes up before the muscle visibly changes","Nothing","Tendon strength"],k:1,w:"It is why a lift improves first."},
    {q:"Why can load added too fast cause injury in month three?",a:["Because tendons adapt more slowly than muscle or skill","Because muscles are weak","Because of the cardio","It cannot"],k:0,w:"Strength and skill move first, size after, connective tissue more slowly still."},
    {q:"What is the progress order?",a:["Weight, then movement, then volume","Movement, then weight, then volume - and never two at once","All three at once","Volume only"],k:1,w:"That single sentence prevents most incident reports."}]},

{d:11,t:"The cardiovascular system",s:"The pump a trainer watches",
 p:["The heart is a pump with four chambers, and the training question is what it is being asked to do. Aerobic work makes it a bigger, slower pump at rest. Hard intervals make it a faster one under load. Both are useful and both are in the by-10 - the two cardio days for the first, the short rests across the lifting days for the second.","The numbers a trainer works with are the heart rate, the blood pressure if the person has one to report, and the perceived effort. Of the three, the perceived effort is the one that travels everywhere, needs no equipment, and works the same in a room of thirty as it does in a living room.","The lines not to cross: chest pain with exertion, a heart rate that stays high, a faint, a breathlessness out of proportion to the work. Those stop the session and start a conversation with a doctor. A trainer does not push through a cardiac sign, ever."],
 q:[{q:"What does aerobic work do?",a:["Makes the heart a bigger, slower pump at rest","Makes the heart smaller","Nothing","Only builds muscle"],k:0,w:"Hard intervals make it a faster one under load, and the by-10 has both."},
    {q:"Which measure travels everywhere?",a:["Perceived effort","Blood pressure","ECG","VO2"],k:0,w:"It needs no equipment and works in a room of thirty as well as a living room."},
    {q:"Which stops a session?",a:["Sweating","Chest pain with exertion","Fast breathing","A raised heart rate"],k:1,w:"Along with a heart rate that stays high, a faint, or a breathlessness out of proportion."}]},

{d:12,t:"The respiratory system",s:"Breath as coaching",
 p:["Breathing is the one internal system a client can feel and control, which is why it is a coaching tool as much as a physiological one. Air moves in because the diaphragm and the rib cage change the pressure, and the working muscle takes its oxygen and gives back carbon dioxide at a rate the breathing follows.","Coaching it is simple. Breathe out on the effort, in on the return. During a set, a slow controlled breath in, and a breath out through the hardest part. Between sets of the by-10 there are ten seconds - one good breath in and out, which is exactly why the ten seconds is the number it is.","The signs to read: someone holding their breath through whole sets, which raises blood pressure sharply and is worth fixing; and breathing that stays ragged long after the set, which is a signal that the work is beyond where it should be."],
 q:[{q:"What is the basic breathing cue for a set?",a:["In on the effort, out on the return","Out on the effort, in on the return","Hold throughout","Breathe fast"],k:1,w:"A slow breath in, and out through the hardest part."},
    {q:"Why is the by-10 rest ten seconds?",a:["Randomly","It is about one good breath in and out","It is the law","It is a round number"],k:1,w:"Long enough to breathe, short enough to keep the heart rate up."},
    {q:"Which habit is worth fixing?",a:["Breathing out on effort","Holding the breath through whole sets","Resting ten seconds","Warming up"],k:1,w:"It raises blood pressure sharply."}]},

{d:13,t:"Biomechanics and technique",s:"Why a form cue is a physics cue",
 p:["A technique cue is a way of changing where a load goes. A body is a system of levers, and the distance a load sits from the joint it turns decides how hard the muscle has to work - which is why a dumbbell held away from the chest is a harder press than the same dumbbell held close.","Three levers a trainer uses constantly: the position of the load, the position of the joint, and the position of the body's own mass. Moving the dumbbell, changing the joint angle, or shifting the centre of mass changes the exercise without changing the weight at all.","The other half is the spine, which likes to stay close to neutral under load and dislikes being the thing that moves. Cue a braced trunk, a hip that hinges rather than a back that bends, and a rib cage stacked over a pelvis - and most of the technique problems in a home gym will not arrive.","One cue is the by-10's own and it is a range decision: the move is worked to about three-quarters of its range rather than to full extension, so the load never leaves the muscle at either end of the rep. Full extension hands the muscle a rest at the top of every repetition; stopping short keeps the tension on it, which is what holds the intensity up without adding weight or reps."],
 q:[{q:"Why is a dumbbell held away from the chest a harder press?",a:["It is heavier","The distance from the joint changes the lever","It is colder","It is not"],k:1,w:"Which is why a loaded position is a technique decision."},
    {q:"Which three levers does a trainer use?",a:["Load position, joint position, and body mass position","Price, brand and colour","Music, volume and tempo","None"],k:0,w:"Each changes the exercise without changing the weight."},
    {q:"What does the spine like under load?",a:["To bend","To stay close to neutral, with a braced trunk","To twist","To round"],k:1,w:"Hinge at the hip rather than bending the back."}]},

{d:14,t:"The squat pattern",s:"The first of the six",
 p:["The squat is a hip and knee bend with the trunk resisting extension. The rotation's leg day carries the goblet squat, the sumo squat, the split squat and the reverse lunge, all with dumbbells at home.","The cues: feet about shoulder width, weight through the whole foot, knees tracking over the toes rather than collapsing in, the chest staying proud, and the depth set by what the person can hold without the lower back rounding. Depth is a range of motion, not a target.","The common faults are a heel that lifts, knees that cave, a back that rounds at the bottom, and a depth chosen by pride rather than by control. One of them is worth fixing per session; all four at once is nobody's session."],
 q:[{q:"What is a squat, in joint terms?",a:["A hip and knee bend with the trunk resisting extension","A knee bend only","A hip bend only","A trunk twist"],k:0,w:"Which is why it loads the lower body and the trunk together."},
    {q:"What sets the depth?",a:["Pride","What the person can hold without the lower back rounding","The weight on the bar","A number"],k:1,w:"Depth is a range of motion, not a target."},
    {q:"Which is a common fault?",a:["Knees tracking over the toes","Heels lifting","Weight through the whole foot","A proud chest"],k:1,w:"Along with knees caving and a back rounding at the bottom."}]},

{d:15,t:"The hinge pattern",s:"The one most people are missing",
 p:["A hinge is movement at the hip with the knee only slightly bent and the spine staying neutral: the Romanian deadlift, the hip thrust, the glute bridge, and the swing shape. It is the pattern that trains the back of the body and it is the one a home programme most often omits.","The cues: push the hips back rather than bend the knees, keep the load close to the legs, feel the stretch at the back of the thighs, and stand by squeezing the glutes rather than by pulling with the back. The spine stays neutral throughout - a hinge is not a squat and it is not a bend.","The fault to watch is the one that turns it into a back exercise: the hips stop moving and the spine does the rest. The fix is usually to reduce the range, not the weight, until the hips can lead again."],
 q:[{q:"What does a hinge train?",a:["The back of the body","The chest","The arms","The calves"],k:0,w:"And it is the pattern a home programme most often omits."},
    {q:"What is the main cue?",a:["Bend the knees","Push the hips back, keep the load close, keep the spine neutral","Round the back","Straighten the knees"],k:1,w:"Stand by squeezing the glutes rather than pulling with the back."},
    {q:"What is the fix when the spine does the work?",a:["Add weight","Reduce the range until the hips can lead again","Go faster","Give up the move"],k:1,w:"Usually the range, not the weight."}]},

{d:16,t:"The push pattern",s:"Horizontal and vertical",
 p:["Pushing splits two ways: horizontal, which is the floor press and the push-up, and vertical, which is the shoulder press and the front raise. In the by-10 the dumbbells give both, and the push-up bars give four variations of the horizontal one by hand position and depth.","The cues for a press: the shoulder blade set and stable rather than rolled forward, the wrist over the elbow, the elbow not flared to ninety degrees, and a path that keeps the load over the joint it is loading. For a push-up: a body in one line, hands below the shoulders, and the chest leading rather than the head.","The fault to catch in a home setting is the shoulder that shrugs towards the ear under a press, and the hip that sags in a push-up. Both are fatigue arriving before the set ends, and both are answered by ending the set rather than the form."],
 q:[{q:"Which two directions does pushing split into?",a:["Horizontal and vertical","Left and right","Up and down only","Fast and slow"],k:0,w:"The floor press and push-up against the shoulder press."},
    {q:"How many push-up variations do the bars give?",a:["One","Four","Ten","None"],k:1,w:"By hand position and depth."},
    {q:"What does a sagging hip in a push-up mean?",a:["Nothing","Fatigue arriving before the set ends","Better form","More weight needed"],k:1,w:"Answer it by ending the set rather than the form."}]},

{d:17,t:"The pull pattern",s:"Where a home programme is usually short",
 p:["Pulling splits the same way. Horizontal is the bent-over row, the one-arm row and the renegade row. Vertical is the pull-up and the chin-up from the bar. Both are the antidote to a week of pressing, and both are what a home kit most easily forgets.","The cues: start the pull by setting the shoulder blade rather than by bending the elbow, keep the neck long, and finish with the shoulder blade rather than the hand. A one-arm row is supported, so the trunk stays still while the arm works.","The pull-up deserves its own line because it is the hardest thing in the kit and the one people skip. Its regressions are the hanging hold and the jump-assisted rep; its progressions are more reps and slower negatives. Doing none of it is the reason a home programme ends up shoulder-heavy."],
 q:[{q:"Which is the vertical pull?",a:["Bent-over row","Pull-up","One-arm row","Renegade row"],k:1,w:"From the bar, with the chin-up beside it."},
    {q:"How does a good pull start?",a:["By bending the elbow","By setting the shoulder blade","By shrugging","By leaning back"],k:1,w:"And it finishes with the shoulder blade rather than the hand."},
    {q:"Which is a pull-up regression?",a:["A heavier weight","A hanging hold","A deeper squat","More cardio"],k:1,w:"With the jump-assisted rep; its progressions are more reps and slower negatives."}]},

{d:18,t:"The lunge, the carry and the calf",s:"The patterns that finish a leg day",
 p:["The lunge is a single-leg squat with a step, and it is the move that exposes a difference between the two sides. The reverse lunge is the by-10's version and the split squat is its stationary cousin; both are done per leg, and both are worth counting per leg rather than per set.","The carry is the pattern nobody lists and everybody needs: a heavy dumbbell held and walked, which trains the grip, the trunk and the shoulder in one go. The calf raise is the small movement that finishes the lower leg.","The cues for the lunge: a step long enough that the front knee can stay over the foot, a trunk that stays upright, and a push through the front heel to return. The fault to watch is a step so short that the knee travels past the toes and the movement becomes a knee exercise rather than a leg one."],
 q:[{q:"What does a lunge expose?",a:["A difference between the two sides","Weak arms","Poor cardio","Nothing"],k:0,w:"Which is why it is counted per leg."},
    {q:"What does a carry train?",a:["Only the arms","The grip, the trunk and the shoulder together","Only the legs","Only the calves"],k:1,w:"A heavy dumbbell held and walked."},
    {q:"What is the lunge fault to watch?",a:["A step too short, so the knee travels past the toes","A step too long","An upright trunk","A push through the front heel"],k:0,w:"Which turns a leg movement into a knee exercise."}]},

{d:19,t:"The trunk",s:"Core work that is not sit-ups",
 p:["The trunk's job is to resist movement rather than to create it, which is why the by-10's trunk work is mostly anti-movement: the plank resists extension, the side plank resists side bending, the dead bug resists the limbs moving the spine, and the hollow hold resists all of it at once.","The hanging work from the bar belongs here too. The hanging knee raise and the hanging leg raise load the abdominals through a range a floor movement cannot reach, and the hanging hold is the regression that builds the grip they need.","The cues are the same across all of them: ribs down, pelvis level, a breath that keeps going, and a finish before the position changes rather than after. A plank that has sagged for ten seconds was a ten-second plank, whatever the stopwatch says."],
 q:[{q:"What is the trunk's job, on this page?",a:["To create movement","To resist movement","To twist","To stretch"],k:1,w:"Which is why the by-10's trunk work is mostly anti-movement."},
    {q:"What does the hanging work add?",a:["A range a floor movement cannot reach","Nothing","Cardio","Grip only"],k:0,w:"And the hanging hold is the regression that builds the grip it needs."},
    {q:"When does a trunk move finish?",a:["After the position changes","Before the position changes","At a fixed time","When it hurts"],k:1,w:"A plank that has sagged for ten seconds was a ten-second plank."}]},

{d:20,t:"The warm-up",s:"Five minutes that save a session",
 p:["A warm-up has three jobs: raise the temperature and the heart rate, take the joints through the ranges the session is about to use, and rehearse the movements at a light load. Five to eight minutes does all three, and the by-10's stretch day is not the same thing as a warm-up.","The rehearsal part is what is usually skipped. Two light sets of the day's first movement, at half the load, does more for the session than ten minutes on a bike, because it is practicing the exact pattern rather than the general body.","What a warm-up is not: a stretching session, a workout, or something to be skipped when time is short. When time is short, the warm-up is the last thing to cut, because it is the part that keeps the session from being the injury."],
 q:[{q:"What three jobs does a warm-up do?",a:["Raise temperature and heart rate, take joints through range, rehearse the movements","Stretch, sweat and rest","Only raise the heart rate","None"],k:0,w:"Five to eight minutes does all three."},
    {q:"What is usually skipped?",a:["The raising of the heart rate","The rehearsal of the day's first movement at a light load","The stretching","The water"],k:1,w:"Two light sets does more than ten minutes on a bike."},
    {q:"When time is short, what is cut last?",a:["The warm-up","The stretching","The last set","The cardio"],k:0,w:"It is the part that keeps the session from being the injury."}]},

{d:21,t:"Breathing and bracing",s:"The skill under every lift",
 p:["Bracing is the skill of making the trunk a stable base before a load moves, and it is the one a home client will never be taught unless a trainer teaches it. It is a breath in through the nose, a gentle tightening of the trunk as if about to be poked, and the ribs held down rather than lifted.","The breath then continues through the set. For the moderate loads of the by-10, that means breathing out on the effort rather than holding. A breath held hard through a maximal lift is a technique for a barbell and not for a set of dumbbell squats.","The value is immediate and visible. A braced trunk lets the hips do the hinging, keeps the spine neutral under a load that would otherwise round it, and takes the lower back out of moves that were never supposed to be about it."],
 q:[{q:"What is bracing?",a:["Holding the breath hard","Making the trunk a stable base before a load moves","Stretching","Leaning back"],k:1,w:"A breath in, a gentle trunk tightening, ribs held down."},
    {q:"How does the breath continue in a by-10 set?",a:["Held throughout","Out on the effort","Rapid","Through the mouth only"],k:1,w:"A hard held breath is for a barbell, not a set of dumbbell squats."},
    {q:"What does a braced trunk protect?",a:["The knees","The spine - it lets the hips do the hinging","The arms","The neck"],k:1,w:"It takes the lower back out of moves that were never about it."}]},

{d:22,t:"Spotting and safety",s:"The home and the room",
 p:["Spotting is a skill with rules. A spotter's hands are ready rather than lifting, the load is only touched when it is failing, and the spotter never takes a rep away from a client who is still moving it. In a home setting with dumbbells there is rarely anything to spot, so the safety work moves elsewhere: the floor clear, the warm-up done, the load chosen honestly.","The equipment check is two minutes and worth its own habit: the dumbbells intact, the bar mounted into something that will not move, the push-up bars steady, the floor space free of anything that would be landed on.","The last rule is the one that matters in both settings. A rep that is failing is ended, not rescued. The by-10's ten-second rest exists so that sets can be ended early without the session falling apart, and a client who learns to end a set is a client who will still be training in a year."],
 q:[{q:"What does a spotter's hand do?",a:["Lifts the weight","Stays ready, and only touches when it is failing","Counts reps","Nothing"],k:1,w:"And never takes a rep away from a client who is still moving it."},
    {q:"What does the home equipment check cover?",a:["Price and brand","Dumbbells, bar mounting, bars steady, floor clear","Music","Water"],k:1,w:"Two minutes, and worth its own habit."},
    {q:"What is done with a failing rep?",a:["Rescued","Ended","Ignored","Added to"],k:1,w:"The ten-second rest exists so a set can be ended early without the session falling apart."}]},

{d:23,t:"Health history and screening",s:"The form before the first session",
 p:["Every certification in this field begins its practical work with a screening form, and the standard one is a readiness questionnaire: a short list of questions about chest pain, dizziness, a heart condition, blood pressure, a joint problem that exercise would aggravate, a pregnancy, and any medicine that would change the advice.","The screening is not a formality and the trainer is not a doctor. Its job is to sort three ways: clear to start, start gently and check with a doctor first, and do not start until a doctor has said so. Writing the sorting down is what makes it a screening rather than a chat.","The intake beside it holds the rest - the goal, the training history, the days that are actually available, the kit in the house, what hurts, and any rule a doctor has given. The Trainer page opens with exactly this form, and it asks and keeps before any programme is decided."],
 q:[{q:"What does a readiness questionnaire ask about?",a:["Price and goals","Chest pain, dizziness, heart conditions, blood pressure, joints, pregnancy and medicines","Only goals","Only weight"],k:1,w:"A short list, and a trainer is not a doctor."},
    {q:"How many ways does the screening sort?",a:["Two","Three - clear, gently with a doctor first, and not until a doctor says so","Five","One"],k:1,w:"Writing the sorting down makes it a screening rather than a chat."},
    {q:"What does the intake hold beside it?",a:["Goal, history, available days, kit, what hurts and any doctor's rule","The price","The music","Nothing"],k:0,w:"The Trainer's own form asks and keeps before any programme is decided."}]},

{d:24,t:"Risk factors and medical clearance",s:"Who needs a doctor first",
 p:["The risk factors a trainer counts are the standard ones: age, a family history of heart disease at an early age, smoking, high blood pressure, high cholesterol, diabetes, obesity, and a body that has been inactive. Several together is a different picture from one alone.","Then the symptoms that mean clearance before training rather than after: chest pain or discomfort with effort, a breathlessness out of proportion, dizziness or fainting, an ankle or leg swelling that appears with effort, a heart murmur, or a known heart condition. Any of those is a doctor first, without exception and without a trainer's opinion on top.","The trainer's job with all of this is not to judge the risk; it is to recognise the picture, say plainly what is being seen, and hold the session until the doctor has answered. That is what a clearance is, and it is the single most important habit this block teaches."],
 q:[{q:"Which is a standard risk factor?",a:["A family history of early heart disease","Good sleep","A low resting heart rate","Eating vegetables"],k:0,w:"Along with age, smoking, pressure, cholesterol, diabetes, obesity and inactivity."},
    {q:"Which symptom means clearance before training?",a:["Sweating","Chest pain with effort","Fast breathing during a set","Soreness the next day"],k:1,w:"Along with dizziness, fainting, and swelling with effort."},
    {q:"What is the trainer's job with risk?",a:["To judge it","To recognise the picture and hold the session until the doctor answers","To ignore it","To treat it"],k:1,w:"Without a trainer's opinion on top."}]},

{d:25,t:"Baseline assessment",s:"The numbers before the plan",
 p:["A baseline is taken before the plan so that progress has something to be measured against. The four things worth having: a movement check of the patterns the plan will use, a cardiorespiratory marker, a muscular marker, and the person's own description of where they are starting.","The movement check is a squat, a hinge, a push, a pull and a plank, watched rather than scored. The cardiorespiratory marker can be as simple as how a two-minute steady effort feels. The muscular marker is a controlled set of the plan's own movements at a light load. The person's own words are the fourth and they are not optional.","The rule that keeps an assessment useful: it is repeated the same way, at the same point in the week, so that two numbers can be compared. An assessment that changes every time measures the assessment rather than the person."],
 q:[{q:"Why is a baseline taken?",a:["For the record","So progress has something to be measured against","For the price","It is not"],k:1,w:"Before the plan rather than after it."},
    {q:"What does the movement check cover?",a:["Squat, hinge, push, pull and plank","Only cardio","Only weight","Nothing"],k:0,w:"Watched rather than scored."},
    {q:"What keeps an assessment useful?",a:["Changing it each time","Repeating it the same way, at the same point in the week","Making it longer","Scoring it"],k:1,w:"An assessment that changes every time measures the assessment."}]},

{d:26,t:"Measurements and body composition",s:"Handled honestly",
 p:["Body composition is the proportion of a body that is fat and the proportion that is not, and the honest ways to approach it at a trainer's level are a tape measure, a scale read as a trend rather than a number, and photographs taken in the same light. A trainer does not report a body fat percentage with two decimal places from a handheld device.","Measurement has one rule and it is about how it is said. A measurement is a datum for the plan, not a verdict on the person, and a trainer who says it any other way has told a client something they will carry out of the room.","The useful markers are the ones that move with training: waist, hip, and how a set of clothes fits. Weight moves for reasons that have nothing to do with fat - water, salt, the time of day - and a client who weighs daily and panics weekly is a client who needs the scale put away for a month."],
 q:[{q:"Which is an honest approach at a trainer's level?",a:["A tape measure and a weight trend","A two-decimal body fat percentage from a handheld device","A scan read aloud","None"],k:0,w:"With photographs taken in the same light."},
    {q:"What is a measurement?",a:["A verdict on the person","A datum for the plan","A moral judgment","Nothing"],k:1,w:"Said any other way, it is something a client carries out of the room."},
    {q:"Why does weight move?",a:["Only fat","Water, salt and time of day as well","Only muscle","It does not"],k:1,w:"A client who weighs daily and panics weekly needs the scale put away for a month."}]},

{d:27,t:"Nutrition basics",s:"What a trainer may and may not say",
 p:["A trainer's nutrition ground is general and it is genuinely useful: eat mostly whole foods, get enough protein for the training, drink water, eat vegetables, keep the sugar and the alcohol to a level the person will actually keep, and do not chase a diet that cannot be lived in for a year.","The boundary is the important half. A trainer does not prescribe a diet for a condition, does not sell a supplement as a treatment, and does not give medical nutrition therapy. That belongs to a dietitian, and a referral there is as ordinary as a referral to a physiotherapist.","The one thing a trainer can say with confidence is the thing that matters most: the plan that works is the plan that is still being followed in six months. Adherence beats optimisation every time, and a trainer who has understood that will coach the life around the training rather than the training alone."],
 q:[{q:"What is inside a trainer's nutrition ground?",a:["Prescribing a diet for a condition","General guidance - whole foods, protein, water, vegetables, sustainable habits","Selling supplements as treatment","Nothing"],k:1,w:"With the boundary: no medical nutrition therapy."},
    {q:"Who holds medical nutrition therapy?",a:["A trainer","A dietitian","A coach","Anyone"],k:1,w:"And a referral there is as ordinary as one to a physiotherapist."},
    {q:"What beats optimisation?",a:["Adherence","Volume","Intensity","Cost"],k:0,w:"The plan that works is the plan still being followed in six months."}]},

{d:28,t:"Hydration, sleep and recovery",s:"The three levers nobody counts",
 p:["Water matters more than any supplement a client will ask about. A body that is short of water performs worse, feels worse and recovers worse, and the fix is a bottle through the day rather than a formula in a shaker.","Sleep is the whole recovery system. Muscle repairs, the nervous system resets and appetite hormones settle in sleep, and a client training three times a week on six hours of it is training to stand still. A trainer who asks about sleep and treats it as part of the programme is doing more than most.","Then the recovery rules a home programme needs: rest days are part of the plan rather than a break from it, soreness is not a measure of a good session, and a body that is still sore from the last session should train the other pattern rather than the same one again."],
 q:[{q:"What matters more than most supplements?",a:["Water","Protein powder","Caffeine","Nothing"],k:0,w:"A body short of water performs, feels and recovers worse."},
    {q:"What is the whole recovery system?",a:["Sleep","Stretching","Cold water","Protein"],k:0,w:"A client on six hours is training to stand still."},
    {q:"What is soreness?",a:["A measure of a good session","Not a measure of a good session","A goal","A requirement"],k:1,w:"A body still sore from the last session trains the other pattern rather than the same one again."}]},

{d:29,t:"Progressive overload and the ten",s:"How the by-10 progresses",
 p:["Overload is the rule that a body adapts only to more than it is used to, and every certification tests it. What changes to make the work harder: the load, the repetitions, the sets, the range, the tempo, the rest, and the difficulty of the movement itself.","The by-10 progresses in a stated order. The movement gets harder first - a push-up becomes a deep push-up. Then the repetitions, up to the cap of twenty. Then the sets, from two toward five, and only then the load. The rest stays at ten seconds throughout, because the ten seconds is the method's identity rather than a variable.","The two outer limits are what make it teachable: never more than twenty repetitions in a set, and never more than five sets. A client who can do both at good form has outgrown the rule, and the answer is a harder movement rather than a longer session."],
 q:[{q:"What is overload?",a:["Doing the same thing","Adapting only to more than the body is used to","Resting more","Eating more"],k:1,w:"And every certification tests it."},
    {q:"What changes first in the by-10?",a:["The load","The movement gets harder","The rest","The sets"],k:1,w:"Then repetitions, then sets, then load."},
    {q:"What are the by-10's two outer limits?",a:["Twenty repetitions and five sets","Ten minutes and two moves","One set and no rest","There are none"],k:0,w:"Past both, the answer is a harder movement rather than a longer session."}]},

{d:30,t:"Stage One, and the ground covered",s:"The block behind you",
 p:["Thirty days in, the ground you stand on is: what a trainer is and where the scope ends, the by-10 and its kit, the anatomy and the six patterns, the energy systems and the responses to a session, technique and the cues that change a load, the warm-up, bracing, spotting and the equipment check, screening and clearance, assessment and measurement, and the basics of food, water and sleep.","What is left of the ninety is the programme itself and the room: FITT, periodisation, the by-10's rule in full, a P90X resistance day worked through, the cardio and stretch sessions, intensity, deloading, special populations, and then the whole group-fitness half and the professional practice around it.","Take the block test before going on. It draws one question from every day of this block, and the days it points back to are the days worth rereading."],
 q:[{q:"How many days are behind you at this point?",a:["Thirty","Sixty","Ninety","Ten"],k:0,w:"And sixty remain."},
    {q:"What is left of the ninety?",a:["The same ground again","The programme in full, then the group-fitness half and professional practice","Nothing","Only the test"],k:1,w:"FITT, periodisation, the by-10 days, cardio choices, and then the room."},
    {q:"What does the block test draw on?",a:["One question from every day of the block","Random days","The last day only","Nothing"],k:0,w:"The days it points back to are the days worth rereading."}]},
{d:31,t:"FITT-VP",s:"The frame every programme is written in",
 p:["FITT-VP is the standard frame and every certification tests it. Frequency: how often. Intensity: how hard. Time: how long. Type: what kind of work. Volume: how much in total. Progression: how it advances.","The by-10 answers all six explicitly. Frequency: every day, as long as the days rotate - P90X's own week is six days on and one off, and the by-10 is not bound to the day off. Intensity: each set worked to its last good rep - as many as the person has, capped at twenty - with ten seconds between moves, and the dumbbell kept light enough to pump the reps out rather than heavy enough to be the measure. Time: the session's length, set by the number of sets. Type: resistance and cardio, in two sessions a day, with mobility on its own day. Volume: sets multiplied by moves. Progression: movement, then reps, then sets, then load.","The value of the frame is that it makes a programme answerable. A plan that cannot say what its frequency, intensity, time, type, volume and progression are is a list of exercises rather than a programme, and a client deserves the difference."],
 q:[{q:"What does FITT-VP stand for?",a:["Frequency, Intensity, Time, Type, Volume, Progression","Fast, Intense, Tough, Total, Varied, Planned","Food, Intensity, Time, Type, Volume, Protein","It has no expansion"],k:0,w:"The standard frame every certification tests."},
    {q:"What is the by-10's intensity, in the frame?",a:["A light warm-up pace","Each set to failure, capped at twenty reps, with ten seconds between moves","Very light","Untimed"],k:1,w:"Which is what makes the session short and cardiovascular at once."},
    {q:"What does the frame make a programme?",a:["Longer","Answerable","Cheaper","Harder"],k:1,w:"A plan that cannot answer the six is a list of exercises, not a programme."}]},

{d:32,t:"Volume and intensity",s:"The two that cannot both rise",
 p:["Volume is the total work: sets multiplied by repetitions multiplied by load. Intensity is how close the work is to the person's maximum. They are the two dials of a programme and the rule is that when one is high the other has to be modest.","The by-10 keeps the volume low on purpose: two to five sets, ten seconds between moves, and a session that fits in half an hour. The effort inside a set is high, but it is not bought with weight - a dumbbell light enough to pump the reps out is the by-10's choice, and the short rest is what makes the set hard. Adding load, sets, reps and a shorter rest at the same time does not produce a harder programme; it produces a programme nobody finishes.","The practical way to raise one is to lower the other for a while. A week of heavier loads can carry fewer sets; a week of more sets can carry lighter ones. The client who understands this stops asking why the plan is easy this week."],
 q:[{q:"What is volume?",a:["Sets times reps times load","How hard the work is","How long the session is","The rest length"],k:0,w:"Intensity is how close the work is to the person's maximum."},
    {q:"Where does the by-10 sit on the two dials?",a:["Hard effort, low volume","Easy effort, low volume","Hard effort, high volume","Both at maximum"],k:0,w:"A short session worked hard, with the weight kept light enough to pump the reps out."},
    {q:"How do you raise one dial?",a:["Raise both","Lower the other for a while","Add a day","Rest less"],k:1,w:"A heavier week carries fewer sets; a higher-set week carries lighter ones."}]},

{d:33,t:"Periodisation",s:"Structuring training over time",
 p:["Periodisation is the deliberate changing of training over weeks and months so that progress continues and fatigue does not accumulate forever. The simplest useful version is a block of harder weeks followed by a lighter one, repeated.","A programme does not need a competition calendar to be periodised. The rotation has the shape built in, with a recovery week at weeks 4, 8 and 13. The by-10 does not require them: a person can go straight into the next rotation, or take a week of cardio and a little stretching instead, and which one it is depends on the day. The pattern is what matters, not the vocabulary.","The reason it works is the reason a deload works: adaptation happens during recovery, and a programme with no lighter week is a programme that spends the adaptation it was trying to earn."],
 q:[{q:"What does periodisation do?",a:["Keeps training the same","Changes training over time so progress continues and fatigue does not accumulate","Raises intensity forever","Nothing"],k:1,w:"The simplest useful version is harder weeks followed by a lighter one."},
    {q:"Does a programme need a competition to be periodised?",a:["Yes","No - the rotation builds three weeks and lightens the fourth, and the light week can be skipped","Only runners","Only lifters"],k:1,w:"The pattern is what matters, not the vocabulary."},
    {q:"Why does a lighter week work?",a:["It is easier","Adaptation happens during recovery","It fills time","It does not"],k:1,w:"A programme with no lighter week spends the adaptation it was trying to earn."}]},

{d:34,t:"The by-10 rule in full",s:"Sets, reps and the ten seconds",
 p:["A by-10 session has three parts and all three are numbers. The list comes first: the movements for the day, taken from P90X or from whatever the person is actually training. Then the rule: each move is worked for a set of as many good repetitions as the person has, and never more than twenty. Then ten seconds, and on to the next move.","The session is two to five sets of that list. Two is where a client starts and five is the top, and a set is added only when the one before it was finished at good form. Where the start lands is set by the person rather than by the level they are called - a beginner and a veteran both live inside the same two to five. The ten seconds never changes and the twenty never lifts - those two are what make the method the method.","The design consequence is that a session is lengthened by a set and shortened by a set, never by cutting the rest or the warm-up. A client short of time does two sets well rather than five badly, and a client who has outgrown five sets needs a harder movement rather than a sixth set."],
 q:[{q:"What caps a set, in the by-10?",a:["The clock","Twenty good repetitions","The load","The ten seconds"],k:1,w:"As many good reps as the person has, and never more than twenty."},
    {q:"How many sets at most?",a:["Two","Three","Five","Ten"],k:2,w:"Two is where a client starts; five is the top."},
    {q:"How is a session usually shortened?",a:["By skipping the warm-up","By dropping a set","By cutting the rest","It cannot be"],k:1,w:"A client short of time does two sets well rather than five badly."}]},

{d:35,t:"Two sets to five",s:"Where the by-10 starts and where it goes",
 p:["The by-10's dial is the number of sets, and the range is narrow on purpose: two to five. Two sets is where a person starts and five is where the method stops, and that start is set by the person rather than by the level they are called. The twenty-rep cap and the ten seconds do not move at all.","The step up is taken on evidence rather than on appetite. The set is earned when the one before it was finished at good form, with the reps still inside the cap, on a day that was not the client's best. Taking the step because one session felt easy is how a client gets four weeks of progress and a month of tendon pain.","The number is also a diagnostic. A client who cannot hold two sets at good form has a programme problem rather than a willpower problem, and the answer is an easier movement rather than the same session with more enthusiasm."],
 q:[    {q:"What is the by-10's range of sets?",a:["One to two","Two to five","Five to ten","Ten to twenty"],k:1,w:"Two is the start and five is the top."},
    {q:"What does not change as the sets go up?",a:["The movements","The twenty-rep cap and the ten seconds","The warm-up","The cardio"],k:1,w:"Those two are what make the method the method."},
    {q:"When is the next set earned?",a:["After one easy session","When the last one was finished at good form, inside the cap, on a day that was not the client's best","At a fixed date","Whenever the client wants"],k:1,w:"A rush gives four weeks of progress and a month of tendon pain."}]},

{d:36,t:"The rest timer and the pace",s:"Why ten seconds is the programme",
 p:["The ten-second rest is the by-10's identity. It is long enough to set up the next move, take one good breath and reset the trunk, and it is short enough that the heart rate stays up through the whole session, which is where the cardiovascular training comes from. Against traditional training it is the whole difference: a rest of thirty seconds to two minutes buys more repetitions and a longer workout, and ten seconds buys a set that ends in failure and a session half the length.","Practically it means a session is a single continuous block rather than a set followed by a rest. The moves are arranged so that one is not the direct continuation of the last - a push follows a squat rather than another push - which is what makes ten seconds enough for the working muscle.","What the timer is not: a race, a target for its own sake, or something to shorten. Ten seconds is the design. A client who starts cutting it has stopped doing the by-10 and started doing garbage sets, and the fix is to restore the ten seconds rather than to add one."],
 q:[{q:"What does the ten-second rest do?",a:["Lets the muscle fully recover","Keeps the heart rate up so the session is cardiovascular","Nothing","Makes it easier"],k:1,w:"Long enough to set up, one good breath, and short enough to keep the work continuous."},
    {q:"Why can ten seconds be enough?",a:["Because the moves are arranged so one is not the continuation of the last","Because the weights are light","Because rest does not matter","It cannot"],k:0,w:"A push follows a squat rather than another push."},
    {q:"What is the ten seconds?",a:["A minimum to beat","The design","A suggestion","A maximum"],k:1,w:"Cutting it means the client has stopped doing the by-10."}]},

{d:37,t:"Full Body A, walked through",s:"Squat, push, pull",
 p:["A full-body day is the plainest way to use the by-10: the eight movements below, two sets each, ten seconds between one move and the next. The movements are P90X's own menu - squat, push, pull, hinge, press, lunge, trunk, arms - and the list is one arrangement of them rather than a fixed prescription.","It is ordered deliberately: a squat, then a push, then an opposite pull, so the trunk and the shoulder get a break between work of the same kind. The Romanian deadlift follows the row because the row has already taught the hinge position at a lighter load.","The last two - a plank and a curl - are the finishing pair: the trunk held while tired, and the arms given their own small slot rather than being asked to fail during a row. A client who can finish two sets at good form is a client ready for a third."],
 q:[{q:"Which move opens Full Body A?",a:["Push-up","Dumbbell goblet squat","Plank","DB curl"],k:1,w:"Then a push, an opposite pull, and the hinge."},
    {q:"Why does the row come before the Romanian deadlift?",a:["It is harder","It has already taught the hinge position at a lighter load","Random order","Because of the music"],k:1,w:"The day is ordered so work of the same kind is separated."},
    {q:"What is the finishing pair?",a:["A plank and a curl","Two squats","Two pushes","A carry"],k:0,w:"The trunk held while tired, and the arms given their own slot."}]},

{d:38,t:"Full Body B, walked through",s:"Pull, press, core",
 p:["Full Body B is the pull-led day: dumbbell sumo squat, pull-up, dumbbell floor press, dumbbell one-arm row, dumbbell lateral raise, glute bridge, hanging knee raise, dumbbell overhead triceps extension.","Its character is the vertical pull and the horizontal press. The pull-up comes early, while the grip is fresh, and the hanging knee raise comes late, because it is the same grip under load. The glute bridge sits between them as a hinge that asks nothing of the hands.","B is the day that most exposes a home kit's limits, and its regressions matter: a jump-assisted pull-up or a hanging hold for the pull-up, a knee raise from a chair or a dead bug for the hanging work. The point of the day is the pattern, not the bar."],
 q:[{q:"Which day is pull-led?",a:["Full Body A","Full Body B","Full Body C","The stretch day"],k:1,w:"With the pull-up early and the floor press behind it."},
    {q:"Why does the pull-up come early?",a:["Because it is easy","Because the grip is fresh","Randomly","Because of the rest"],k:1,w:"And the hanging knee raise comes late, because it is the same grip under load."},
    {q:"Which is a regression for the pull-up?",a:["A heavier squat","A jump-assisted pull-up or a hanging hold","More cardio","A deeper lunge"],k:1,w:"The point of the day is the pattern, not the bar."}]},

{d:39,t:"Full Body C, walked through",s:"Legs and core",
 p:["Full Body C is the day the by-10 keeps for the legs and the trunk: dumbbell split squat, dumbbell calf raise, deep push-up, dumbbell renegade row, dumbbell front raise, hip thrust, dead bug, mountain climber.","Its shape is single-leg work followed by the small movements that a home programme usually skips - the calf, the trunk, the anti-rotation of the renegade row - and it ends with a minute of work under fatigue, the mountain climber, which is the day's cardiovascular finish.","C is the day to watch for compensations. A split squat shows a difference between the sides, the renegade row shows whether the trunk can hold when the arms move, and the mountain climber shows how the form looks when the session has already been long. All three are information rather than problems."],
 q:[{q:"Which day ends with a one-minute cardiovascular finish?",a:["A","B","C - the mountain climber","The stretch day"],k:2,w:"Work under fatigue, at the end of the session."},
    {q:"What does the split squat show?",a:["A difference between the sides","Grip strength","Cardio fitness","Nothing"],k:0,w:"And the renegade row shows whether the trunk holds when the arms move."},
    {q:"Where do the small movements sit?",a:["Skipped","In C - the calf, the trunk, the anti-rotation work","In A only","Nowhere"],k:1,w:"The movements a home programme usually skips."}]},

{d:40,t:"Progression by load and reps",s:"After the movement gets harder",
 p:["The by-10's progression order is movement, repetitions, sets, load, and this day is about the last two. Repetitions move first because they cost nothing but time; the load moves last because it is the dial that most easily outruns the tendons.","A practical rule for the home kit: when the top of the rep range is comfortable for every move, add the smallest available step in load and drop back to the bottom of the range. A pair of dumbbells that is too light for a squat may be exactly right for a lateral raise, which is why the same pair appears across the days.","The honesty rule beside it: a client adds load when the movement is good for the whole set at the current one, and not when the last rep felt hard. Training to failure is the by-10's design rather than a choice offered inside it - the short rest is what takes each set there - and it is why the load moves last: a heavier set taken to failure is the fastest way to outrun a tendon."],
 q:[    {q:"What is the progression order?",a:["Load, reps, sets, movement","Movement, reps, sets, load","Random","Load only"],k:1,w:"Load is the dial that most easily outruns the tendons."},
    {q:"When is load added?",a:["When the last rep felt hard","When the movement is good for the whole set at the current load","Every session","Only at the advanced level"],k:1,w:"And the smallest available step, dropping back to the bottom of the rep range."},
