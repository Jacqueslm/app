 p:["Three things the book says blunt a herb: synthetic drugs, junk food and alcohol. Its words are that the whole effect of a herb is antidoted, lessened, or not felt at all when those are in the body.","Read beside the interaction days coming later, that claim has two faces. The first is the book's own: clean the inputs and the plant works better. The second is the safety face, and it is the one this page takes most seriously - synthetic drugs and herbs do interact, and a person on medicine must say so before adding a plant.","Tobacco and caffeine are not on the book's three, and this page adds them as things worth counting. Caffeine belongs with sleep and with the nervous system; tobacco belongs with the lungs and the circulation. Both are habits a herb is asked to outwork, and neither is outworked easily."],
 q:[{q:"Which three things does the book say blunt a herb?",a:["Cold water, salt and heat","Metal, plastic and glass","Synthetic drugs, junk food and alcohol","Sleep, exercise and water"],k:2,w:"Its words: the whole effect is antidoted, lessened, or not felt at all."},
    {q:"Which face of that claim does this page take most seriously?",a:["The book's own","Neither","The taste","The safety face - drugs and herbs do interact"],k:3,w:"A person on medicine must say so before adding a plant."},
    {q:"Which two does this page add as worth counting?",a:["Tobacco and caffeine","Water and sleep","Fruit and herbs","Salt and sugar"],k:0,w:"Both are habits a herb is asked to outwork."},
    {q:"Where does caffeine belong?",a:["With the lungs","With sleep and the nerves","With the skin","With the bones"],k:1,w:"Tobacco belongs with the lungs and the circulation."},
    {q:"What must a person on medicine do before adding a plant?",a:["Take more medicine","Stop the medicine","Say so first","Nothing"],k:2,w:"That is the second face of the book's claim, and the one this page takes seriously."}]},

{d:40,t:"The first safety rule",s:"Where the course's caution begins",
 p:["The first safety rule is not about herbs at all. It is that a herb never replaces a medicine that somebody is already taking, and never stands between a person and a diagnosis.","From that one rule everything else follows. A herb can support a body that is being treated; it cannot be the treatment for a condition that needs one. The line is not modesty for its own sake. It is the line that keeps a person alive long enough for a plant to help.","Read the library's day 28 as the course's spine rather than as a footnote: an infection, a withdrawal, a prescription, a pregnancy, a child, a liver, and kratom. Each one is a place where a green leaf is not the answer and a straight answer is needed instead.","The third book's line about drugs belongs beside this rule. It says serotonin and melatonin merge easily with drugs, and that higher-melanin people are hit harder by them. Whatever is made of that claim, the first rule of this day does not move: a herb never replaces a medicine somebody is already taking."],
 q:[{q:"What is the first safety rule?",a:["A herb never replaces a medicine already being taken","Never use herbs","Always use more","Only use fresh herbs"],k:0,w:"And it never stands between a person and a diagnosis."},
    {q:"What can a herb do, on this page?",a:["Be the treatment for anything","Support a body that is being treated","Replace a diagnosis","Nothing"],k:1,w:"It cannot be the treatment for a condition that needs one."},
    {q:"What does a herb never stand between?",a:["Two plants","A cup and a lid","A person and a diagnosis","Two doses"],k:2,w:"Everything else in the course follows from that rule."},
    {q:"Why keep that line?",a:["For style","For the law only","It does not matter","It keeps a person safe long enough for a plant to help"],k:3,w:"A straight answer is needed at each of day 28's places."},
    {q:"Everything else in the course follows from what?",a:["The first safety rule","The price","The shelf","The test"],k:0,w:"It is the line the course opens its safety half with."}]},

{d:41,t:"Contraindications: who must not",s:"The line under the caution",
 p:["A contraindication is a reason not to use a plant for a particular person at a particular time. It is not a property of the herb alone; it is the herb meeting a body, a medicine or a stage of life.","The shelf is small and worth learning by heart. Goldenseal and comfrey in a baby; licorice in high blood pressure; St John's wort with an antidepressant; ginkgo with a blood thinner; senna beyond a week; kava with a liver that is already struggling; anything strong in pregnancy.","The habit that makes this real: before choosing a plant, ask what the person is already taking and what stage of life they are in. Those two questions catch most of the contraindications a practice will ever meet, and both of them are asked before a plant is named."],
 q:[{q:"What is a contraindication?",a:["A property of the plant alone","A price","A reason not to use a plant for this person now","A preparation"],k:2,w:"It is the herb meeting a body, a medicine or a stage of life."},
    {q:"Which is the contraindication for licorice?",a:["Low blood pressure","Pregnancy only","Children only","High blood pressure"],k:3,w:"It raises blood pressure and depletes potassium."},
    {q:"Which two questions catch most of them?",a:["What are you taking, and what stage of life are you in","Price and weight","Colour and smell","Name and address"],k:0,w:"Both are asked before a plant is named."},
    {q:"When are those questions asked?",a:["After the plant is taken","Before a plant is named","At the end of the year","Never"],k:1,w:"Before a plant is named, every time."},
    {q:"Is a contraindication about the plant alone?",a:["Yes","Only in pregnancy","No - it is the plant meeting a person","Only for children"],k:2,w:"A plant can be fine for one person and out for the next."}]},

{d:42,t:"Pregnancy, breastfeeding and children",s:"The three that change everything",
 p:["Pregnancy is the single largest change in what may be used. Most of the strong shelf is out, and what is left is deliberately small: gentle food, ginger for sickness in the first months, and a doctor or midwife told about anything at all.","Breastfeeding follows the same logic, because what a mother takes can pass to the child, and children are not small adults: the amount is by weight, the liver is still maturing, and honey is out under one year.","This page's own rule is the one to carry. For these three, a herb is the last answer rather than the first, and the person's own clinician is asked first. That is not a lack of confidence in plants; it is knowing which ground the plants do not hold."],
 q:[{q:"How does this page treat herbs in pregnancy?",a:["The clinician is asked first, and only a small shelf is left","Whatever the book says","The same as always","Everything is fine"],k:0,w:"Most of the strong shelf is out, and what is left is deliberately small."},
    {q:"How is a child's amount set?",a:["By height","By weight","The same as an adult's","By age alone"],k:1,w:"The liver is still maturing, and honey is out under one year."},
    {q:"Why does a mother's herb matter to a baby?",a:["It cannot matter","Only by smell","What a mother takes can pass to the child","Only in the last month"],k:2,w:"Which is why breastfeeding follows the same logic as pregnancy."},
    {q:"What is out for a child under one year?",a:["Water","Fruit","Milk","Honey"],k:3,w:"And a syrup is not given to a baby."},
    {q:"Is breastfeeding different from pregnancy here?",a:["No - the same logic follows","Yes, anything goes","Only teas are allowed","Only tinctures"],k:0,w:"The same rule travels into it."}]},

{d:43,t:"Interactions, one: the blood and the mood",s:"St John's wort and ginkgo",
 p:["St John's wort is the herb that teaches the interaction lesson on its own. It changes how the liver handles a long list of medicines - antidepressants, birth control, blood thinners, HIV medicines, transplant medicines and more - by speeding up the liver's own machinery. It is not a herb to add quietly to anything.","Ginkgo thins the blood. On its own that is a mild effect; beside warfarin, aspirin or another thinner it is not mild at all, and it belongs on the list a surgeon is told before an operation.","The habit that follows: any herb taken alongside a prescription is checked against that prescription, and the check is the person's own clinician's to make. A page can name the pattern; only the prescriber knows the whole list."],
 q:[{q:"What does St John's wort do, in this lesson?",a:["Nothing","Raises blood sugar","Changes how the liver handles many medicines","Thins the blood"],k:2,w:"By speeding up the liver's own machinery."},
    {q:"What does ginkgo do?",a:["Lowers blood sugar","Raises blood pressure","Nothing","Thins the blood"],k:3,w:"Beside warfarin or aspirin it is not a mild effect at all."},
    {q:"Whose check is it when a herb meets a prescription?",a:["The person's own clinician","The page's","Nobody's","The shop's"],k:0,w:"A page can name the pattern; only the prescriber knows the whole list."},
    {q:"How does St John's wort do it?",a:["By adding water","By speeding up the liver's own machinery","By stopping the stomach","By cooling the blood"],k:1,w:"That is why it reaches so many medicines."},
    {q:"Is ginkgo a mild effect beside warfarin?",a:["Yes, very mild","It does nothing","No, it is not mild","It makes it safer"],k:2,w:"A person on a blood thinner has to say so."}]},

{d:44,t:"Interactions, two: sugar, pressure and the liver",s:"The other three grounds",
 p:["Diabetes: gymnema and bilberry are both described as affecting the ground the sugar medicines work on, so both are raised with a doctor before use rather than added to a routine.","Blood pressure: licorice raises it, and a person already treated for pressure has the most to lose from a herb that moves it, quietly and sweetly. The liver: kava and comfrey both have real liver cautions, and a liver that is already struggling is not a liver for either of them.","Notice the shape of the whole day. Each herb is safe in the ordinary case and not safe in the case that is already being treated - which is why the question is never whether a herb is safe, but whether it is safe for this person."],
 q:[{q:"Why are gymnema and bilberry raised with a doctor?",a:["Both work on the ground the sugar medicines work on","They are poisons","They cost a lot","They are not herbs"],k:0,w:"Raised before use rather than added to a routine."},
    {q:"Which herb raises blood pressure?",a:["Gingko","Licorice","Chickweed","Marshmallow"],k:1,w:"Quietly and sweetly, which is what makes it easy to miss."},
    {q:"What is the question this day leaves you?",a:["Is the herb safe?","Is it cheap?","Is the herb safe for this person?","Is it fresh?"],k:2,w:"Safe in the ordinary case and not in the case already being treated."},
    {q:"When are they raised with the doctor?",a:["After a month","Never","After the bottle is empty","Before use"],k:3,w:"Not after a reaction - before the first dose."},
    {q:"A herb can be safe in the ordinary case and what?",a:["Not safe in a case already being treated","Always safe","Never safe","Safe only in tea"],k:0,w:"That is the whole of this day."}]},

{d:45,t:"Dose, duration and toxicity",s:"Where a plant stops being gentle",
 p:["Three things decide whether a plant helps or harms: how much, for how long, and who is taking it. Toxicity is almost never a property of a single dose of a common herb; it is an amount, a duration and a body added together.","The named examples carry the lesson. Lobelia has killed people and its own entry says so. Comfrey is never swallowed, because its alkaloid is a liver burden. Senna is a week at most. Goldenseal accumulates and is not a long course. Kava has a liver caution.","The practical rule is short. A herb taken long is a herb taken watched, and any herb that keeps feeling necessary is a herb whose reason is worth revisiting. Nothing on this shelf is a habit."],
 q:[{q:"What three things decide whether a plant helps or harms?",a:["Colour, price and country","Taste, smell and texture","How much, for how long, and who takes it","Supply and demand"],k:2,w:"Toxicity is an amount, a duration and a body added together."},
    {q:"Which herb has killed people, in the book's own entry?",a:["Chamomile","Ginger","Valerian","Lobelia"],k:3,w:"And its entry on this page says so plainly."},
    {q:"What is a herb taken for a long time?",a:["A herb taken watched","A habit","Always safe","Never taken"],k:0,w:"Any herb that keeps feeling necessary is one whose reason is worth revisiting."},
    {q:"Where does a plant stop being gentle?",a:["At the shop","When the amount or the years go too far","In water","Always"],k:1,w:"A gentle plant is gentle at an amount and a duration."},
    {q:"What is worth revisiting when a plant keeps feeling needed?",a:["The price","The colour","The reason it is being taken","The label"],k:2,w:"A course is stated, then judged."}]},

{d:46,t:"Allergic reactions and adverse events",s:"What to do when a body says no",
 p:["An adverse reaction is any unwanted effect, and the first duty when one appears is to stop the herb and write down what happened: what was taken, how much, when, and what followed. A record is what turns a scare into information.","Allergy is its own small list. A plant in a family a person already reacts to is a plant to approach carefully, and a first exposure is a first exposure. Ragweed, daisy and chamomile sit close enough together for the comparison to matter.","Then the line between a nuisance and an emergency. A rash, a loose stool or an unsettled stomach is a stop-and-think. A swollen face or throat, a wheeze, a spreading rash with faintness, or a collapse is an ambulance and not a herbal question. Learn the second list and never hesitate on it."],
 q:[{q:"What is the first thing to do when a reaction appears?",a:["Stop the herb and write down what happened","Take more","Ignore it","Drink more water"],k:0,w:"What was taken, how much, when, and what followed."},
    {q:"What should the note say?",a:["Only the name","What was taken, how much, when, and what followed","Nothing","The price"],k:1,w:"A record turns a scare into information."},
    {q:"Which group sits close to chamomile?",a:["The mints","The roses","Ragweed and daisy","The grasses"],k:2,w:"Which is why the comparison matters to somebody who reacts to them."},
    {q:"Which of these is an emergency?",a:["A loose stool","A mild rash","An unsettled stomach","A swollen throat with a wheeze"],k:3,w:"Swelling, wheeze, faintness or collapse is an ambulance."},
    {q:"What is swelling, wheeze, faintness or collapse?",a:["An ambulance, not an herb","A cleansing","A small thing","A sign to wait"],k:0,w:"No herb is given while that is happening."}]},

{d:47,t:"Quality: adulteration and substitution",s:"Why the label is not the proof",
 p:["A herb can fail before it reaches a body. Substitution is one plant sold as another - the true herb absent, a cheaper relative in its place. Adulteration is worse: a powder cut with something that is not the herb at all, or spiked to make a tired plant act stronger.","The risks sit in the powders and the proprietary blends, where identity cannot be seen. A whole dried leaf can be looked at; a white powder cannot. That is the practical reason to buy the form you can check, and to buy by botanical name.","The book's own advice is older and simpler: buy from a herb dealer, a health food shop or a standard brand, and be careful because a weaker relative gets sold under the right name. This page adds the modern version: a certificate of analysis is worth asking for, and a refusal to give one is an answer."],
 q:[{q:"What is substitution?",a:["A powder cut with something else","A wrong price","One plant sold as another","A wrong colour"],k:2,w:"The true herb absent and a cheaper relative in its place."},
    {q:"What is adulteration?",a:["A wrong label colour","A high price","A late delivery","A powder cut with something that is not the herb"],k:3,w:"The herb is there, but not only the herb."},
    {q:"Where do those risks sit?",a:["In powders and blends","In whole dried leaves","In fresh roots","In water"],k:0,w:"A whole leaf can be looked at; a white powder cannot."},
    {q:"Why is a powder riskier?",a:["It is heavier","A whole leaf can be looked at; a powder cannot","It is cheaper","It is fresher"],k:1,w:"Which is where the whole risk of this day sits."},
    {q:"What is a refusal to give a certificate of analysis?",a:["Nothing","A legal right","An answer","A good sign"],k:2,w:"Worth asking for, and a refusal is worth hearing."}]},

{d:48,t:"Case-taking: the intake",s:"The first conversation",
 p:["A case begins with an intake, and the intake is the same shape every time: what the person has come with, how long it has been going on, what makes it better and worse, what they are already taking - medicines, supplements and herbs - what they eat and drink, how they sleep, and their history.","Then the parts a good intake always includes and a rushed one always forgets: who else is treating them, any doctor's rule that outranks this page, and what the person themselves thinks is going on.","The intake is written down, not remembered. A case you cannot read back is a case you cannot learn from, and the writing is what makes the ninety days of this course into a practice rather than a set of facts."],
 q:[{q:"What shape is the intake?",a:["The same shape every time","Different every time","Whatever is said first","No shape"],k:0,w:"What they came with, how long, what helps and worsens, what they take, food, sleep and history."},
    {q:"Which questions does a rushed intake forget?",a:["Colour and smell","Who else is treating them, and any doctor's rule","Price","Age"],k:1,w:"Along with what the person themselves thinks is going on."},
    {q:"Why is it written down?",a:["For the price","For the law only","A case you cannot read back is a case you cannot learn from","It is not"],k:2,w:"The writing is what makes the course a practice."},
    {q:"What does the intake ask about?",a:["Only the herb","Only the price","Only the name","What they came with, how long, what helps, what they take, food, sleep and history"],k:3,w:"It has the same shape every time."},
    {q:"What else does the intake ask for?",a:["What the person themselves thinks is going on","The price","A payment","A signature"],k:0,w:"The person's own account is part of the case."}]},

{d:49,t:"Assessment, not diagnosis",s:"The line that keeps a practice lawful",
 p:["An herbalist assesses: what the body is doing, what the tradition says about it, and what is safe and useful. An herbalist does not diagnose: naming a disease is what a clinician does, and a name carries treatments and implications a herbalist has no standing to give.","The difference is practical, not pedantic. A client with a lump, a mole that has changed, blood in a stool, weight gone without reason, a cough past three weeks - none of those is a case to assess and treat. Each one is a referral, made plainly and made today.","The words to keep: this is not a diagnosis, this does not replace your doctor, and here is what I would take to them. Said once and honestly, those three sentences are the whole of the boundary."],
 q:[{q:"What does an herbalist do, and not do?",a:["Diagnose and prescribe","Nothing","Assess, but not diagnose","Only sell"],k:2,w:"Naming a disease is what a clinician does."},
    {q:"Which of these is a referral, not a case to treat?",a:["A cold","A slow digestion","A poor sleep","A mole that has changed"],k:3,w:"Along with a lump, blood in a stool, and weight lost without reason."},
    {q:"What are the three sentences of the boundary?",a:["This is not a diagnosis, it does not replace your doctor, and here is what to take to them","Buy this, take that, come back","Nothing at all","Only the price"],k:0,w:"Said once and honestly, they are the whole of it."},
    {q:"Who names a disease?",a:["An herbalist","A clinician","A shop","A book"],k:1,w:"A name carries what a herbalist has no standing to give."},
    {q:"Which findings are referrals?",a:["A cold and a sniffle","A bruise","A lump, blood in a stool, unexplained weight loss, a cough past three weeks","A dry patch"],k:2,w:"Each one is named and handed on."}]},

{d:50,t:"The protocol: start, dose, duration",s:"What a plan actually says",
 p:["A protocol has four parts and no more: what the plant is for, which preparation and what dose, how long the course runs, and what would make it stop or change. A plan missing the fourth part is a wish rather than a protocol.","Start small and start single. One plant, the lowest sensible amount, for a stated few weeks, and then a look at what changed. That way the next decision has a before and an after rather than a pile of guesses.","Then write the stop conditions before you start: a doctor's new instruction, a reaction, a pregnancy, no change at the stated end date, or the person simply wanting to stop. A protocol that can only continue is a protocol that cannot be judged."],
 q:[{q:"How many parts does a protocol have?",a:["Four","One","Ten","None"],k:0,w:"And a plan missing the fourth part is a wish rather than a plan."},
    {q:"What are the four parts?",a:["The price, the shop, the bottle and the label","The purpose, the preparation and dose, the duration, and what would stop it","The herb, the tea, the cup and the spoon","Nothing"],k:1,w:"A plan says what it is for, how much, how long, and when to stop."},
    {q:"How does a course start?",a:["With five herbs at once","With the strongest amount","Small and single","With no end date"],k:2,w:"One plant, the lowest sensible amount, for a stated few weeks."},
    {q:"Why write the stop conditions first?",a:["For the record","It is required","They are not needed","A plan that can only continue cannot be judged"],k:3,w:"A doctor's instruction, a reaction, a pregnancy, or no change."},
    {q:"Which of these would stop a plan?",a:["A doctor's instruction, a reaction, a pregnancy, no change, or wanting to stop","Only the price","Nothing","A holiday"],k:0,w:"Each one is written down before the plan starts."}]},

{d:51,t:"Follow-up and reassessment",s:"The part that makes it clinical",
 p:["A follow-up is where a practice is either real or a set of impressions. The same questions come back: what changed, what did not, what the person noticed that the plan had not thought of, and what the current state of the whole person is.","Then the plan changes, and it is allowed to. A plant that did nothing in three weeks is either the wrong plant, the wrong dose, or the wrong problem, and the reassessment is where you find out which. Continuing unchanged is the one option that teaches nothing.","The record closes the loop: the reason, the result, and the decision. That is the sentence a case is worth, and ninety of those sentences is what a certificate is a plain record of."],
 q:[{q:"What does a follow-up ask?",a:["Only whether they feel better","How much it cost","What changed, what did not, what was noticed, and how the person is","Nothing"],k:2,w:"The same questions come back every time."},
    {q:"What does it mean if a plant did nothing in three weeks?",a:["Take more of it","Add five more","Give up herbs","It is the wrong plant, dose or problem"],k:3,w:"The reassessment is where you find out which."},
    {q:"What closes the loop?",a:["The reason, the result and the decision, written down","A new bottle","The price","Nothing"],k:0,w:"Ninety of those sentences is what a certificate is a plain record of."},
    {q:"What is a certificate a plain record of?",a:["The price","Ninety of those written sentences","The shop","The bottle"],k:1,w:"A case you cannot read back is a case you cannot learn from."},
    {q:"Which questions come back every time?",a:["Different ones","None","The same ones","Only the price"],k:2,w:"That is what makes a follow-up a follow-up."}]},

{d:52,t:"Documentation and records",s:"What is kept, and what is not",
 p:["A record holds what the practice needs to be careful and useful: the intake, the plan and its reason, the follow-ups, and any reaction. It does not hold a person's whole life, and it does not hold what has no bearing on the case.","Records are kept privately, secured, and only for as long as they are needed. Nothing about a client belongs in a message to somebody else, and a name and a case are not the same thing - a case can be kept and learned from with the name left off.","The value of the record is that it is the only way a practice improves. The books do not know your cases; only your cases do, and a case you cannot look back on has taught you the same twice."],
 q:[{q:"What does a record hold?",a:["What a practice needs to be careful and useful","A person's whole life","Only the price","Only the name"],k:0,w:"The intake, the plan and its reason, the follow-ups, and any reaction."},
    {q:"How is a case learned from safely?",a:["It cannot be","With the name left off","By publishing it","By sharing it"],k:1,w:"A case can be kept and learned from with the name left off."},
    {q:"Why keep a record?",a:["For the law only","It is a habit","It is the only way a practice improves","It is not useful"],k:2,w:"The books do not know your cases; only your cases do."},
    {q:"What four things does a record keep?",a:["The price and the label","The bottle and the box","The shop and the shelf","The intake, the plan and its reason, the follow-ups, and any reaction"],k:3,w:"And nothing else - not a person's whole life."},
    {q:"Who knows your cases best?",a:["Your own records","The books","The shop","Nobody"],k:0,w:"That is the whole reason for keeping them."}]},

{d:53,t:"Scope of practice",s:"What the work is, said plainly",
 p:["Scope of practice is the plain statement of what you do and what you do not, given to a client in writing before anything begins. It names the ground: assessment, herbal recommendations, and support. It names the ground that is not yours: diagnosis, prescribing, and replacing medical treatment.","A written statement is not bureaucratic; it is what makes the boundary a fact rather than a hope. The American Herbalists Guild asks its registered members for exactly this, and asks them to keep a referral network of licensed practitioners alongside it.","The test of a scope statement is simple. Read it and ask whether the person could tell, from it alone, where the practice ends and a clinician begins. If they could not, it is not yet a scope statement."],
 q:[{q:"What is a scope of practice?",a:["A price list","A diagnosis","The plain written statement of what you do and do not do","A medicine list"],k:2,w:"Given to a client before anything begins."},
    {q:"When is it given?",a:["At the end","Never","When asked","Before anything begins"],k:3,w:"It is the first thing a client reads."},
    {q:"What does AHG ask its registered members for?",a:["A referral network of licensed practitioners","A shop","A licence","Nothing"],k:0,w:"Not a diagnosis and not a prescription - assessment and herbal recommendation."},
    {q:"What is the test of a scope statement?",a:["Its length","Could the person tell where your practice ends and a clinician's begins?","Its font","Its price"],k:1,w:"If not, it is not yet a scope statement."},
    {q:"Does a scope statement diagnose or prescribe?",a:["Both","Only prescribe","Neither - it assesses and recommends herbs","Only diagnose"],k:2,w:"It says plainly what the work is."}]},

{d:54,t:"Referral and the red flags",s:"The cases that are not a herb's",
 p:["A referral is not a failure of herbalism; it is the practice working. Something is found that is not a herb's ground, it is named, and the person is sent to somebody who holds that ground - today, and with the reason written down.","The red flags to know by heart: any lump, a mole that has changed, blood anywhere it should not be, weight lost without trying, a fever that will not come down, a cough past three weeks, chest pain, a sudden weakness or a changed speech, a severe pain anywhere new.","Then the two that are most often missed and least excusable. A person who is pregnant, and a person whose mood has turned to harming themselves - both need a clinician now, and both need it said kindly and without delay."],
 q:[{q:"What is a referral, on this page?",a:["The practice working","A failure","A loss of money","A legal duty only"],k:0,w:"Something is found that is not a herb's ground, it is named, and the person is sent on."},
    {q:"Which of these is a red flag?",a:["A seasonal cold","Blood anywhere it should not be","A slow digestion","A bothersome sleep"],k:1,w:"Along with a lump, a changed mole, and weight lost without trying."},
    {q:"Which two are most often missed?",a:["A cold and a cough","A rash and a bruise","A pregnancy, and a mood turned towards self-harm","A headache and a sniffle"],k:2,w:"Both need a clinician now, and both need it said kindly and without delay."},
    {q:"What other findings are red flags?",a:["A sneeze","A dry patch","A hiccup","A lump, a changed mole, unexplained weight loss"],k:3,w:"Each one is named and handed on."},
    {q:"How is a referral given?",a:["Named, kindly, and without delay","In a letter next year","Not at all","As a guess"],k:0,w:"A referral is not a failure; it is the practice working."}]},

{d:55,t:"Consent and confidentiality",s:"The two promises a practice makes",
 p:["Consent means the person knows what is being suggested, what it is for, what the alternatives are, and that they may stop at any time. It is given before the plan starts and it is written down, and it is given again when the plan changes in a way that matters.","Confidentiality means the case goes nowhere. Not into a conversation, not into a message, not into a post. Where a case is used for learning, the name is left off, and where a person asks to see their own record, that is theirs and not a favour.","Both of these are older than any herb on the shelf. A practice without them is not a stricter or a looser practice; it simply is not one."],
 q:[{q:"What is consent?",a:["A signature on a price list","A payment","Knowing what is suggested and why, the alternatives, and the freedom to stop","A diagnosis"],k:2,w:"It is given before the plan starts."},
    {q:"When is consent given again?",a:["Never","Every day","At the end","When the plan changes in a way that matters"],k:3,w:"A changed plan needs a fresh yes."},
    {q:"What does confidentiality mean?",a:["The case goes nowhere","The case may be discussed freely","Only the name is private","Nothing"],k:0,w:"Where a case is used for learning, the name is left off."},
    {q:"How is a case used for learning?",a:["With the name in it","With the name left off","It is not used","It is published"],k:1,w:"A case teaches better than a book."},
    {q:"How old are these two promises?",a:["New this year","From the internet","Older than any herb on the shelf","From a price list"],k:2,w:"A practice without them is simply not a practice."}]},

{d:56,t:"Ethics: the claims you may not make",s:"The words that go too far",
 p:["A herbal practice may say what it does and what it is for, and may not claim to cure a named disease, to replace a medicine, or to hold a credential it does not hold. That last one is the one a certificate page must be careful about.","The forbidden shapes are few and easy to recognise: cure, treat, reverse, and the names of diseases used as a promise. The lawful shapes are plainer: support, alongside, and this is what I do and here is who you should also be seeing.","There is a legal floor under this and a professional one above it. Consumer protection law punishes a false claim about what a product or a person can do, and the profession's own code asks for honesty even where the law is silent. The two point the same way, which is worth noticing."],
 q:[{q:"Which claim is not made by a herbal practice?",a:["That it cures a named disease or replaces a medicine","What it does","What it is for","Who it refers to"],k:0,w:"Nor a credential it does not hold."},
    {q:"Which words are the forbidden shapes?",a:["Support and alongside","Cure, treat, reverse, and disease names used as a promise","Assessment and referral","Rest and water"],k:1,w:"The lawful shapes are plainer and say what is actually done."},
    {q:"Why is the certificate page careful about credentials?",a:["For style","For length","Claiming a credential you do not hold is the same kind of false claim","It is not"],k:2,w:"Consumer law and the profession's code point the same way."},
    {q:"Which words are allowed?",a:["Cure and reverse","Treat and heal","Any words","Plain ones that say what is actually done"],k:3,w:"Support and alongside are honest words."},
    {q:"What do consumer law and the profession's code do?",a:["Point the same way","Disagree","Say nothing","Allow anything"],k:0,w:"Both are on the same side of this line."}]},

{d:57,t:"What a certificate is, and is not",s:"The honest description",
 p:["A certificate of completion records that a student finished the requirements of a particular program. Its weight is the weight of that program and nothing more, and by itself it establishes no state licence and no national credential.","For herbalists the professional credential is the American Herbalists Guild Registered Herbalist, a voluntary peer-reviewed recognition with its own requirements: documented education hours, advanced knowledge of a large materia medica, a set number of clients seen over years, and a written and interview assessment. No US state licenses herbalists.","So the honest certificate says exactly what it is: this record of study, from this program, on this date. Anything more is the false claim the day before warned about, and it does the study a disservice to inflate it."],
 q:[{q:"What does a certificate of completion record?",a:["A state licence","A degree","That a student finished the requirements of a program","AHG registration"],k:2,w:"Its weight is the weight of that program, and nothing more."},
    {q:"What is the herbalist's professional credential?",a:["A state licence","A university degree","A shop permit","The AHG Registered Herbalist"],k:3,w:"Voluntary and peer-reviewed, with education and clinical requirements."},
    {q:"Does any US state license herbalists?",a:["No","Yes, all of them","Only two","Only for shops"],k:0,w:"Which is why the honest certificate says exactly what it is."},
    {q:"What is the weight of a certificate of completion?",a:["A licence","The weight of that program, and nothing more","A degree","A diagnosis"],k:1,w:"It records a course of study and says so."},
    {q:"Why does the certificate say exactly what it is?",a:["For style","For length","Because no state licenses herbalists, so the honest line matters","It does not"],k:2,w:"Nobody should mistake it for a licence."}]},

{d:58,t:"Growing, sourcing and sustainability",s:"Where a plant comes from",
 p:["The best sourcing is a plant you grew or a wild plant you identified with certainty, from ground you know. Failing that, it is a grower or a supplier you can name, who knows the species and the year.","Wildcrafting carries two duties. The first is identification, to the species, every time. The second is restraint: take from a stand that is thriving, never the last of anything, never a root from a slope that will erode without it, and never a plant that is protected where it grows.","The book's own line is worth keeping beside all of this: an herb that grows in a place has adjusted to that place, and is generally good for the diseases of that environment. It is the same argument as eating what grows near you, and it is the argument for the garden."],
 q:[{q:"What is the best sourcing, on this page?",a:["A plant you grew, or a wild one you identified with certainty","The cheapest","The largest packet","Whatever is nearest"],k:0,w:"Failing that, a grower or a supplier you can name."},
    {q:"What are the two duties of wildcrafting?",a:["Speed and volume","Identification and restraint","Price and packaging","None"],k:1,w:"Never the last of anything, and never a plant protected where it grows."},
    {q:"What is the restraint rule?",a:["Take everything","Take the roots","Never take the last of anything, and never a protected plant","Take the flowers"],k:2,w:"The plant has to be there next year."},
    {q:"Which book line sits beside this day?",a:["Fresh is weaker","Dried is best","Roots are never used","An herb that grows in a place is good for the diseases of that place"],k:3,w:"The same argument as eating what grows near you."},
    {q:"If you do not grow it yourself, what do you want?",a:["A grower or supplier you can name","The cheapest packet","A blend","A powder"],k:0,w:"And one you can ask about the batch."}]},

{d:59,t:"Research literacy",s:"How to read what you find",
 p:["A practitioner is asked, sooner or later, whether an herb works, and the answer has to be read rather than repeated. The first questions about any study are who it was in, how many, how long, what it was compared with, and whether it was blinded.","Then the two traps. A study in a test tube is not a study in a person, and a tradition is evidence of use rather than evidence of effect. Neither is worthless, and neither is a trial, and knowing which one you are holding is most of the skill.","Where the evidence is thin, say so. Where the tradition is strong and the trials are weak, say both. The tone to keep is the one the whole library keeps: here is what is known, here is what is claimed, and here is the line between them."],
 q:[{q:"What are the first questions about a study?",a:["Who paid for it only","Its title","Who, how many, how long, compared with what, and blinded?","Where it was published only"],k:2,w:"Read rather than repeated."},
    {q:"What is a test-tube study?",a:["A study in people","A tradition","A trial","Not a study in a person"],k:3,w:"Neither worthless nor a trial."},
    {q:"What is tradition evidence of?",a:["Use, rather than effect","Effect proven","Nothing","Safety proven"],k:0,w:"Knowing which of the two you hold is most of the skill."},
    {q:"Is a tradition worthless?",a:["Yes, worthless","No, but it is not a trial","It proves effect","It proves safety"],k:1,w:"It is evidence of use, not of effect."},
    {q:"What is most of the skill in reading?",a:["Reading fast","Finding a quote","Knowing which kind of evidence you hold","Believing the first result"],k:2,w:"That is the whole of research literacy."}]},

{d:60,t:"Stage Two, and the ground covered",s:"The block behind you",
 p:["Sixty days in, the ground you stand on is: the tradition and how it reads a body; how a plant is identified, picked, dried and prepared; the twenty classes; energetics; the book's nutrition and its chart; the safety rules and the interactions; the intake and the protocol; scope, ethics and the law.","What is left of the ninety is the applied half: the body by system, formulation, the first consultation end to end, the chronic case, and the practice around the plants.","Take the block test before going on. It draws one question from every day of this block, and the days it points back to are the days worth rereading."],
 q:[{q:"How many days are behind you here?",a:["Sixty","Thirty","Ninety","Ten"],k:0,w:"And thirty remain, the applied half."},
    {q:"What is left of the ninety?",a:["The same ground again","The applied half","Nothing","Only the test"],k:1,w:"The body by system, formulation and practice."},
    {q:"What does the applied half cover?",a:["Only herbs","Only prices","The body by system, formulation and practice","Only the test"],k:2,w:"Formulation, the consultation end to end, and the chronic case."},
    {q:"What does the block test draw on?",a:["Random herbs","The last day only","Nothing","One question from every day of the block"],k:3,w:"And the days it points back to are the days worth rereading."},
    {q:"What are the test's reasons for?",a:["Pointing back at the day to read again","Filling space","The price","Nothing"],k:0,w:"The reasons are how the test teaches rather than scores."}]},
{d:61,t:"The digestive system",s:"Where the applied half begins",
 p:["The gut is where the books put the beginning of everything, and it is also where the safest herbs in the whole library work: the bitters that wake the appetite and the digestion, the carminatives that settle wind, and the demulcents that soothe a lining that is sore.","The pattern to look for is a person whose trouble starts after eating, or who has lost their appetite, or whose digestion has slowed and their tongue is coated. That is the ground where chamomile, dandelion, fennel, peppermint, ginger and marshmallow do most of the work in this tradition.","The limits are equally clear. Blood in a stool, a weight lost without trying, a pain that wakes somebody at night, or a swallowing that is changing are not slow digestions - each is a referral, made today."],
 q:[{q:"Which classes work in the gut?",a:["Stimulants and nervines","Diuretics and cathartics","Bitters, carminatives and demulcents","Refrigerants and aromatics"],k:2,w:"They wake the appetite, settle wind, and soothe a lining that is sore."},
    {q:"What does a carminative do?",a:["Wakes the appetite","Soothes a sore lining","Moves water out","Settles wind"],k:3,w:"Fennel is the gentle one."},
    {q:"Which is a referral, not a slow digestion?",a:["Blood in a stool","Wind after a heavy meal","A lost appetite","A coated tongue"],k:0,w:"Along with weight lost without trying, and night pain."},
    {q:"Which demulcent is named here?",a:["Ginger","Marshmallow","Peppermint","Fennel"],k:1,w:"It soothes and protects, inside and out."},
    {q:"What else is a referral?",a:["A hiccup","A burp","Weight lost without trying, night pain, changing swallowing","A dry mouth"],k:2,w:"Each one is named rather than treated."}]},

{d:62,t:"The liver and the blood",s:"The body's quiet chemist",
 p:["The books treat the liver as the body's refinery, and both of them give the liver its own chapter. Its herb in this tradition is the bitter - dandelion root, the bitters of the whole bitter class - and its caution is the other half: anything that burdens it may not be taken twice for the same reason.","The blood follows the liver. The book's own habit is to read a red root as a blood herb, and to read the skin as a chart of what the blood is doing. Anaemia of any kind is a measured thing, not a guessed thing, and where iron is short it is a blood test rather than a shelf.","This is also where the liver cautions meet the shelf: comfrey is never swallowed, kava has a liver caution, and a person whose liver is already struggling is not a person for either. Say it plainly and ask about alcohol, which is the burden nobody counts."],
 q:[{q:"Which class does the tradition give the liver?",a:["The bitters","The nervines","The astringents","The diuretics"],k:0,w:"Dandelion root is its plainest example in this library."},
    {q:"Which herb is never swallowed, on liver grounds?",a:["Chamomile","Comfrey","Ginger","Valerian"],k:1,w:"Its alkaloid is a burden on the liver."},
    {q:"Which herb carries a liver caution beside it?",a:["Kelp","Sage","Kava","Yarrow"],k:2,w:"And comfrey sits on the same ground."},
    {q:"How is anaemia handled?",a:["Guessed, with iron","Ignored","With a red root alone","Measured, with a blood test"],k:3,w:"Where iron is short it is a blood test rather than a shelf."},
    {q:"Which root is the plainest bitter here?",a:["Dandelion root","Ginger root","Kelp","Aloe"],k:0,w:"The bitter is the class the tradition gives the liver."}]},

{d:63,t:"The respiratory system",s:"The chest and the breath",
 p:["The chest is the ground of the expectorants and the antiseptics: thyme and elecampane and mullein to bring phlegm up, sage and thyme and eucalyptus to work against the germs, marshmallow and licorice to soothe a throat that has been scraped raw by coughing.","The old picture of a chest cold is the book's one: the body clearing, the cough doing work rather than being the enemy. Read it as the book's account, and treat the cough as useful while it produces and as a reason to look when it does not.","The lines that never move are on this day. A cough past three weeks, blood in what is coughed up, a fever that will not come down, a breath that is short at rest, or a chest pain with the breath are each a referral. Licorice is the caution on the shelf side: sweet, mild-tasting, and a mover of blood pressure."],
 q:[{q:"Which herbs are the expectorants here?",a:["Ginger, garlic and chamomile","Valerian, catnip and fennel","Thyme, elecampane and mullein","Kelp, bilberry and senna"],k:2,w:"They bring phlegm up out of the chest."},
    {q:"What does an expectorant do?",a:["Stops a cough","Cools a fever","Helps you sleep","Brings phlegm up out of the chest"],k:3,w:"Thyme, elecampane and mullein."},
    {q:"Which line never moves?",a:["A cough past three weeks","A cough for two days","A sore throat","A sniffle"],k:0,w:"Along with blood coughed up, and a breath short at rest."},
    {q:"What else goes with that line?",a:["A dry patch","Blood coughed up, a fever that will not come down, a breath short at rest","A bruise","A hiccup"],k:1,w:"All of them are a doctor's ground."},
    {q:"Which caution sits on the throat shelf?",a:["Thyme is poisonous","Mullein is not a herb","Licorice raises blood pressure","Sage is fatal"],k:2,w:"Sweet, mild-tasting, and a mover of blood pressure, which makes it easy to miss."}]},

{d:64,t:"The nervous system and sleep",s:"Nervines and the evening",
 p:["The nervines relax - valerian and catnip on this shelf, with chamomile and cramp bark as the calmatives beside them. They are evening herbs, and the tradition uses them for a nervous system that will not come down rather than for a disease.","Sleep is read as a thing with causes rather than a thing with one herb: caffeine late, a screen late, food late, worry, a room too warm, a body that did not move all day. The herb is the last move and not the first, and a nervine used to prop up an unchanged evening is a nervine working against itself.","The caution to carry: a low mood that persists, or any thought of self-harm, is not a nervine's case. That is a clinician, today, and it is said kindly and without delay.","The third book adds a morning to the evening. Its serotonin is made in daylight, so the sleep advice has two halves: light in the morning and a quiet room at night. The herb is still the last move, and the light is free."],
 q:[{q:"When are the nervines used?",a:["In the evening","In the morning","At noon","Any time"],k:0,w:"They are evening herbs, for a nervous system that will not come down."},
    {q:"What is the herb's place in sleep?",a:["The first move","The last move, after the evening is fixed","The only move","No move"],k:1,w:"A nervine propping up an unchanged evening is working against itself."},
    {q:"What is not a nervine's case?",a:["A restless evening","A late coffee","A lasting low mood, or any thought of self-harm","A warm room"],k:2,w:"That is a clinician, today."},
    {q:"A nervine holding up an unchanged evening is doing what?",a:["Curing sleep","Fixing the day","Nothing","Working against itself"],k:3,w:"The evening comes first, and the herb last."},
    {q:"Where does a lasting low mood go?",a:["To a clinician, today","To a tea","To a tincture","Nowhere"],k:0,w:"That is not a herb's case."}]},

{d:65,t:"The immune system",s:"What the tradition claims, and what this page keeps",
 p:["This is the chapter where the books make their largest claims, and this page has already moved once: the idea of the body clearing is taken, the claim that a cold is therefore not passed from person to person is left in the book.","What is kept is the food and the simple support. Echinacea at the first tickle, garlic and thyme as the antiseptics, vitamin C in the book's own large figures printed as its claim, and rest and water above all of them.","What is not kept is the large claim about immunity in general, and the whole idea that any plant here stands in for an infection that has taken hold. An infection, a fever that will not come down, a chest that is filling - no plant here touches that, and that sentence is the oldest one in the library."],
 q:[{q:"Which claim does this page leave in the book?",a:["That food matters","That rest helps","That a cold is not passed from person to person","That garlic is an antiseptic"],k:2,w:"The idea of clearing is taken; the whole step is not."},
    {q:"When is echinacea taken?",a:["In the middle of a cold","Every day","Only with a fever","At the first tickle of a cold"],k:3,w:"Rather than after an infection has taken hold."},
    {q:"What is the oldest sentence in the library?",a:["No plant here touches an infection","Take more herbs","Rest is optional","Fever is harmless"],k:0,w:"An infection, a fever that will not come down, a chest that is filling."},
    {q:"Which three is the line about?",a:["A sniffle","An infection, a fever that will not come down, a chest that is filling","A dry patch","A bruise"],k:1,w:"Those are not a herb's ground, whatever a book says."},
    {q:"What part of the book's idea is kept?",a:["The whole claim","Nothing","That what goes in decides how much there is to clear","Only the sugar"],k:2,w:"The idea is taken and the whole step is not."}]},

{d:66,t:"The urinary system",s:"Water, and what moves it",
 p:["The diuretics are the herbs of this system: buchu and parsley on the book's list, dandelion leaf among the gentler ones, with water as the thing they are moving. A flush is not a cure; it is water leaving a body faster than it arrived.","The cautions are this day's real content. Water held in the tissues can mean a heart that is struggling or a kidney that is, and neither is a case for parsley. A burning on passing water, blood in the urine, a fever with it, or a pain in the back that comes with either - each is a referral and most of them are an urgent one.","The one habit worth keeping: ask why the body is holding water before moving it. A diuretic given to a body that is holding water for a reason it has not been asked about is a herb covering a question."],
 q:[{q:"What is a flush, on this page?",a:["Water leaving a body faster than it arrived","A cure","A herb","A dose"],k:0,w:"Which is why the reason for the water matters more than the moving of it."},
    {q:"What matters more than moving the water?",a:["The price","The reason the water is being held","The colour","The cup"],k:1,w:"Moving water without a reason is not a plan."},
    {q:"Which herb is a diuretic on the book's list?",a:["Comfrey","Valerian","Buchu","Turmeric"],k:2,w:"With parsley, and dandelion leaf among the gentler ones."},
    {q:"Which findings are referrals?",a:["A slow digestion","A poor sleep","A sniffle","Blood in the urine, burning on passing water, a fever with it, a pain in the back"],k:3,w:"Those belong to a doctor, today."},
    {q:"Which gentle diuretics does the page name?",a:["Parsley and dandelion leaf","Aloe and senna","Ginger and thyme","Kelp and sage"],k:0,w:"Buchu is the book's own name."}]},

{d:67,t:"The skin",s:"The chart, and the ground the astringents work",
 p:["The books read the skin as the chart of what is inside, and the skin is also the ground where the external preparations do their work: the astringent witch hazel for a bruise and a vein, aloe for a burn, a salve for a dry patch, a poultice for a place that wants warmth.","The rule about an external preparation is the first thing to learn and the easiest to forget: it goes on oiled skin, it is covered, and it is kept away from the eyes, from broken skin and from a place that is already weeping.","Then the skin's red flags, which are the ones most often excused. A mole that has changed shape, colour or size; a sore that has not healed in weeks; a rash with a fever; a spreading redness that is hot and tender - each one goes to a clinician, and the changed mole especially is the one people wait on.","The third book keeps melanin in the skin, the hair and the iris, and reads brown skin as the substance doing the work it describes. That is its claim about a colour, printed as its claim; the red flags above do not change with a person's colour, and a changed mole goes to a clinician whichever skin it is on."],
 q:[{q:"How does an external preparation go on?",a:["On dry skin, uncovered","On broken skin","On oiled skin, covered, away from the eyes and broken skin","On the eyes"],k:2,w:"A poultice for a place that wants warmth, a salve for a dry patch."},
    {q:"When is a poultice used?",a:["For a dry patch","For the eyes","For a burn","For a place that wants warmth"],k:3,w:"It is the oldest external preparation there is."},
    {q:"Which skin finding is the one people wait on?",a:["A mole that has changed","A dry patch","A bruise","A graze"],k:0,w:"Shape, colour or size - and waiting is the worst of the options."},
    {q:"What does a changed mole mean?",a:["Wait a month","Do not wait","Use a salve","Cover it"],k:1,w:"It is not a herb's ground."},
    {q:"Which is a referral?",a:["A dry patch","A bruise","A spreading redness that is hot and tender","A graze"],k:2,w:"Along with a sore that has not healed in weeks."}]},

{d:68,t:"The heart and the circulation",s:"The ground where no herb is the answer",
 p:["This is the shortest day in the applied half and the most important. The tradition has its circulatory herbs, and this page keeps them where they belong - beside a treated heart rather than in place of one.","The red flags are the ones that must be recognised instantly: chest pain, a pain spreading to the arm or the jaw, a sudden breathlessness, a speech that has changed, a weakness down one side, a faint with a cold sweat. Those are an ambulance, now, and nothing on any shelf belongs in the minutes that follow.","The herbs that do interact are the ones to say out loud: ginkgo thins the blood, garlic does a little, and a person on a thinner or facing an operation needs both named. The rule of the day is the course's rule: a herb supports a body that is being treated, and it does not become the treatment."],
 q:[{q:"Which of these is an ambulance, not a herb?",a:["A chest pain spreading to the arm or jaw","A sniffle","A dry patch","A slow digestion"],k:0,w:"Along with sudden breathlessness, changed speech and a one-sided weakness."},
    {q:"What else is an ambulance?",a:["A hiccup","Sudden breathlessness, changed speech, one-sided weakness, a faint with a cold sweat","A burp","A dry mouth"],k:1,w:"Every one of those is an emergency."},
    {q:"Which herb thins the blood here?",a:["Marshmallow","Chamomile","Ginkgo","Dandelion"],k:2,w:"And garlic does a little beside it."},
    {q:"Where does a circulatory herb belong?",a:["In place of a treated heart","Nowhere","In an emergency","Beside a treated heart"],k:3,w:"A herb supports a body that is being treated; it does not become the treatment."},
    {q:"Which other kitchen herb thins the blood a little?",a:["Garlic","Ginger","Thyme","Fennel"],k:0,w:"Which matters before an operation."}]},

{d:69,t:"The joints and inflammation",s:"Where the anti-inflammatories work",
 p:["The anti-inflammatories of the book's list - arnica, cayenne, garlic, chaparral - are the herbs of this system, and the tradition uses them both outside and in: a liniment on the skin, a tea or a tincture by mouth, and a poultice where a joint wants warmth.","The practical picture is a joint that is stiff in the morning, sore after use, or swollen without heat. That is the ground where this shelf works slowly and honestly, and where the biggest single lever is not a herb at all: movement, weight, and what the person eats.","The referral lines are the ones that separate a sore joint from something else: a joint that is hot, red and swollen with a fever; a sudden single joint that is unbearable; a back pain with numbness or weakness in a leg; a pain that wakes at night or comes with weight lost. Each one goes to a clinician."],
 q:[{q:"Where does the tradition use the anti-inflammatories?",a:["Only outside","Only by mouth","Outside and in","Only in tea"],k:2,w:"A liniment on the skin, a tea by mouth, a poultice where warmth is wanted."},
    {q:"What is the biggest lever for a sore joint?",a:["A herb","A fast","A liniment alone","Movement, weight and food"],k:3,w:"The shelf works slowly and honestly beside it."},
    {q:"Which is a referral?",a:["A joint hot and swollen with a fever","A morning stiffness","A sore knee after a walk","A stiff back on waking"],k:0,w:"A hot joint with a fever is not a liniment's case."},
    {q:"What else is a referral?",a:["A sore knee","A back pain with numbness or weakness in a leg, and pain that wakes at night","A stiff back","A graze"],k:1,w:"Numbness and weakness are a doctor's ground."},
    {q:"How do the herbs work beside the big levers?",a:["Instantly","Not at all","Slowly and honestly","Better than food"],k:2,w:"Movement, weight and food carry the weight."}]},

{d:70,t:"The endocrine system",s:"The glands, and the line not to cross",
 p:["The glands are the book's regulators, and its chapter gives each one its own herbs: kelp for the thyroid's iodine, gymnema and bilberry for the sugar ground, and its own pineal ideas printed as its own.","This page's rule for the whole system is one sentence. A gland that has been measured and is being treated belongs to the clinician; a gland's ordinary sluggishness may be read for what it is, which is usually sleep, food and movement rather than a bottle.","The two names to carry out of the day are the two that interact most: kelp is iodine, so it is not taken in quantity without knowing the thyroid's state, and gymnema and bilberry are raised with a doctor by anybody on medicine for sugar. Both are herbs this course has already met, and both come back here because this is the system that makes them matter.","The third book's line on this system is its boldest: the pineal, not the pituitary, is the master gland, and melanin is what it sends out to regulate the rest. This course prints that as the book's claim. The rule underneath is the one this day opened with, and a measured gland is still a clinician's."],
 q:[{q:"Which mineral does kelp carry?",a:["Iodine","Iron","Zinc","Calcium"],k:0,w:"Which is why it is not taken in quantity without knowing the thyroid's state."},
    {q:"What is the one-sentence rule for the glands?",a:["Treat everything","A gland that has been measured and is being treated belongs to the clinician","Ignore the glands","Only use kelp"],k:1,w:"An ordinary sluggishness is usually sleep, food and movement."},
    {q:"Who raises gymnema and bilberry with a doctor?",a:["Nobody","Only children","Anybody on medicine for sugar","Only athletes"],k:2,w:"Both affect the ground the sugar medicines work on."},
    {q:"What is ordinary sluggishness usually?",a:["A gland","A herb shortage","A salt shortage","Sleep, food and movement"],k:3,w:"Which is why the plate comes first here too."},
    {q:"Who owns a diagnosed thyroid problem?",a:["The clinician","A stronger herb","A fast","A tea"],k:0,w:"That is the line not to cross on this day."}]},
{d:71,t:"Women's health",s:"The ground that begins with a referral",
 p:["A great deal of what a woman brings to a herbal practice is ordinary and cyclical: a period that is heavy or late or painful, a monthly mood that moves, a transition into the change of life with its heat and its broken sleep. The tradition has herbs for all of it, and this page keeps them beside a clinician rather than in front of one.","Two of the shelf's herbs sit here with hard rules. Goldenseal is not for pregnancy. Anything strong at all is not for pregnancy, and the same rule travels into breastfeeding, where what the mother takes can reach the child.","The referrals are the day's real content, and they are the ones most often excused. Any bleeding after the change of life; a bleed between periods or after sex; a period so heavy it soaks through; a pain that is severe rather than dull; a pregnancy that might be there; a discharge with a smell or a fever. Each one is a clinician, and the first one especially is never waited on."],
 q:[{q:"Which herb is not for pregnancy?",a:["Chamomile","Peppermint","Goldenseal","Dandelion"],k:2,w:"And the same rule travels into breastfeeding."},
    {q:"Which finding is never waited on?",a:["A heavy period","A monthly mood","A late period","Any bleeding after the change of life"],k:3,w:"Along with bleeding between periods or after sex."},
    {q:"What is the rule about herbs and pregnancy?",a:["Anything strong is out, and the clinician is told","Anything may be used","Only tinctures","Only teas"],k:0,w:"The tradition has herbs for the ordinary and cyclical, kept beside a clinician."},
    {q:"Where does the tradition's work sit here?",a:["Instead of a clinician","Beside a clinician, not in front of one","Alone","Nowhere"],k:1,w:"Which is the same rule the whole course keeps."},
    {q:"Which other bleeding is a referral?",a:["A monthly period","A late period","Bleeding between periods or after sex","A monthly mood"],k:2,w:"That is a doctor's ground, not a herb's."}]},

{d:72,t:"Men's health",s:"The same rule, the other shape",
 p:["The ordinary ground here is the same as the day before: sleep, weight, movement, alcohol, stress, and the slow changes of the middle years. The tradition reads a man's vitality through the same organs as anybody else's - the liver, the gut, the heart and the blood - and its herbs are the ones this course has already met.","The one system with its own chapter is the prostate, and this page's line about it is the line about every gland: an enlarged prostate is a measured thing, and a man who is getting up at night is a man whose doctor should know, because the same symptom can be two very different things.","The red flags to carry: blood in the urine or the semen, a change in the stream, a pain in the back with weight lost, a lump in a testicle. Each one is a clinician, quickly. And where a man is on medicine for pressure, sugar or the heart, the interaction days apply to him exactly as they apply to anybody else."],
 q:[{q:"How is the prostate treated here?",a:["As a measured thing, with a doctor told","With a strong herb","With a fast","Not at all"],k:0,w:"The same symptom can be two very different things."},
    {q:"Which is a red flag?",a:["Getting up at night","Blood in the urine","A slow stream","A tired evening"],k:1,w:"Along with a change in the stream, and a back pain with weight lost."},
    {q:"Do the interaction rules change for a man?",a:["Yes","Only for herbs","No","Only for supplements"],k:2,w:"Pressure, sugar and the heart all bring the same cautions."},
    {q:"Which other findings are red flags?",a:["A sore knee","A dry patch","A poor sleep","A change in the stream, a back pain with weight lost, a lump in a testicle"],k:3,w:"Each one is handed to a doctor."},
    {q:"What brings the same cautions here?",a:["Pressure, sugar and the heart","The price","The season","The label"],k:0,w:"The rules apply exactly as they do to anybody else."}]},

{d:73,t:"Older age",s:"Where the dose and the liver change",
 p:["Older age changes four things about a practice. The liver and the kidneys clear things more slowly, so a dose waits longer and a course accumulates. There is more likely to be a prescription list. Skin and gut and sleep are more easily unsettled. And the person's own view of what they want is the thing that matters most.","So a course in older age starts lower, runs shorter, and is watched more closely, and the intake asks for the whole medicine list by name, including the ones bought without a prescription.","The rest of the day is the same as every day of this course. A herb supports a body that is being treated, food comes first, and the red flags - chest pain, changed speech, one-sided weakness, a fall with a head injury, a sudden confusion - are a doctor's, today."],
 q:[{q:"What changes about a dose in older age?",a:["Nothing","It doubles","It starts lower and runs shorter","It is always a tincture"],k:2,w:"Because the liver and kidneys clear more slowly."},
    {q:"Why?",a:["Older bodies are weaker","Herbs get stronger","It is the law","The liver and kidneys clear more slowly"],k:3,w:"A course in older age accumulates, so it is watched more closely."},
    {q:"What does the intake ask for in full?",a:["The whole medicine list by name","Only the herbs","Only the prescriptions","Nothing"],k:0,w:"Including the ones bought without a prescription."},
    {q:"What does the full list include?",a:["Only pills","The things bought without a prescription","Only teas","Nothing"],k:1,w:"Every name, in full."},
    {q:"Which is a doctor's, today?",a:["A stiff knee","A poor sleep","A sudden confusion","A dry patch"],k:2,w:"Along with chest pain, changed speech, and a fall with a head injury."}]},

{d:74,t:"Formulating: simples and compounds",s:"One plant, then several",
 p:["A simple is one herb used alone. It is the form a course should begin in, because it is the only form where a result can be attributed. A compound is several herbs in one preparation, and it is what a practice grows into once the simples are known.","A compound is built with a reason for every part: a chief herb for the main thing, a support for what the chief does not reach, a comfort for the taste or the gut, and nothing else. A compound with nine herbs in it is usually nine guesses wearing one label.","The practical rule: build a compound only after a simple has been tried, use the smallest number of parts that does the job, and write down the reason each part is in it. If a part cannot be given a reason, it is not yet a formulation."],
 q:[{q:"What is a simple?",a:["One herb used alone","Several herbs together","A powder","A pill"],k:0,w:"The only form where a result can be attributed."},
    {q:"Why start with a simple?",a:["It is cheaper","It is the only form where you can tell what worked","It tastes better","It is stronger"],k:1,w:"That is why the course starts with one plant."},
    {q:"How is a compound built?",a:["With as many herbs as possible","At random","With a reason for every part","By price"],k:2,w:"A chief herb, a support, a comfort, and nothing else."},
    {q:"When is a compound built?",a:["Before trying anything","Never","Always","Only after a simple has been tried"],k:3,w:"And the smallest number of parts that does the job."},
    {q:"What parts does a compound have?",a:["A chief herb, a support and a comfort, and nothing else","Ten herbs","Whatever is on the shelf","Only one herb"],k:0,w:"Every part has a reason."}]},

{d:75,t:"Dosage across forms",s:"Turning a plan into a spoonful",
 p:["Each form has its ordinary range and each one is written as the form it is. A tea is one teaspoon of herb to a cup, one to three cups a day. A tincture is given in drops or millilitres against its ratio, so a 1:5 tincture takes more drops than a 1:2 of the same plant. A syrup is a teaspoon or two, and a salve is spread and not counted.","Two conversions are worth knowing by heart. A teaspoon is about five millilitres, so the tea's base line and a small tincture dose are the same order of size. And a capsule of dried herb is a much smaller amount of plant than a cup of tea, which is why capsules of a bitter root often do less than a tea of the same root.","The rule under all of it: a dose is the amount of plant, not the amount of liquid. Write the form, the strength and the amount, and a dose can be handed to somebody else without a conversation."],
 q:[{q:"What is the tea's base line?",a:["One handful to a pot","One ounce to a glass","One teaspoon of herb to a cup","There is none"],k:2,w:"One to three cups a day is the ordinary range."},
    {q:"How many cups a day is the ordinary range?",a:["Five to eight","Ten","None","One to three"],k:3,w:"A stated amount, so a plan can be handed on."},
    {q:"Of a 1:2 and a 1:5 tincture, which takes more drops?",a:["The 1:5","The 1:2","The same","Neither"],k:0,w:"A dose in drops means nothing without the ratio."},
    {q:"A dose in drops means nothing without what?",a:["The price","The ratio it is measured against","The bottle colour","The label"],k:1,w:"Which is why the strength is always written."},
    {q:"A dose is an amount of what?",a:["Liquid","Price","Plant","Colour"],k:2,w:"Twenty drops of one strength and of another are different amounts of plant."}]},

{d:76,t:"The first consultation, end to end",s:"Walking the whole thing through",
 p:["The door, the room, the introduction, the scope statement, the consent. Then the intake, written as it is asked. Then the assessment aloud: here is what I heard, here is what I think is being described, and here is what I am not able to know - and here is the doctor's appointment we should make anyway.","Then the plan in four parts: the purpose, the preparation and the dose, the duration, and the stop conditions. It is given in writing, in plain words, with the reason for each part and the name of what to send to the doctor.","Then the record, and the next appointment. The whole visit is about an hour and none of it is the herb. That is the shape of a practice, and the herbs are the smallest part of it."],
 q:[{q:"What comes before the intake?",a:["The scope statement and consent","The herb","The payment","Nothing"],k:0,w:"The door, the room, the introduction, the scope statement, the consent."},
    {q:"What is said aloud in the assessment?",a:["Only the plan","What was heard, what is described, what is not known, and the doctor's appointment","Only the price","Nothing"],k:1,w:"Including what I am not able to know."},
    {q:"What is the smallest part of the visit?",a:["The intake","The record","The herbs","The plan"],k:2,w:"The whole visit is about an hour and none of it is the herb."},
    {q:"How long is the whole visit?",a:["Ten minutes","A whole day","Two days","About an hour"],k:3,w:"And the herb is the smallest part of it."},
    {q:"What does the visit put first?",a:["The person and the record","The bottle","The price","The shop"],k:0,w:"That is the shape of the whole visit."}]},

{d:77,t:"The chronic case",s:"The long ground",
 p:["A chronic case is one that has been going on for months or years, and it is worked differently from an acute one. Nothing is expected in a week. The first aim is not the symptom but the ground under it - the sleep, the food, the stress, the alcohol, the movement - because that is what the symptom is standing on.","Then the plan is small and long: the gentler herbs, the lower doses, the forms that suit a long course, and a review at a stated date with a stated thing to look at. Progress in a chronic case is measured in months and described in the person's own words.","And the honest limit: some chronic conditions are managed rather than resolved, by the clinician and by the person together, and a herbalist's part in that is support and the things the plate can do, said plainly and not oversold."],
 q:[{q:"What is the first aim in a chronic case?",a:["The symptom","The price","The ground under the symptom","The name"],k:2,w:"Sleep, food, stress, alcohol and movement are what the symptom stands on."},
    {q:"What is that ground made of?",a:["Herbs and bottles","Price and packaging","Rest and pills","Sleep, food, stress, alcohol and movement"],k:3,w:"The plate carries most of the weight."},
    {q:"How is the plan shaped?",a:["Small and long, with a review at a stated date","Large and short","One strong herb","No plan"],k:0,w:"Gentler herbs, lower doses, forms that suit a long course."},
    {q:"How is progress measured?",a:["In days","In months, in the person's own words","In doses","In money"],k:1,w:"A long case moves in months."},
    {q:"What is a herbalist's part in a long case?",a:["A cure","A diagnosis","Support, not overselling","Nothing"],k:2,w:"Some conditions are managed rather than resolved."}]},

{d:78,t:"When the plate is the medicine",s:"The strongest lever in the course",
 p:["The books' whole argument is that food comes first, and this day puts it in practice. The levers that carry most of the weight in this tradition are simple and unglamorous: what is eaten, when it is eaten, how much water, how much sugar, how much alcohol, how much movement and how much sleep.","The book's own chart is worth working from as a frame: raw whole food, cooked whole grains, lightly steamed vegetables and dark green leaves, with dairy and fried food off the table as its claim. This page keeps the emphasis and softens the absolute, and it keeps the morning fruit of the book's clock as an experiment rather than a law.","The test of this day is whether a plan can be written with no herb in it at all. Where it can, and where it works, the herb was never the point - which is the most useful thing the course teaches."],
 q:[{q:"What comes first, in this day's practice?",a:["The plate","The herb","The bottle","The tincture"],k:0,w:"The levers that carry most of the weight are simple and unglamorous."},
    {q:"How does this page treat the book's absolute about dairy and fried food?",a:["As a law","As the book's claim, with the absolute softened","As proven","As unimportant"],k:1,w:"The emphasis is kept and the absolute is not."},
    {q:"How is the morning fruit kept?",a:["As a law","As a cure","As an experiment, not a law","As a punishment"],k:2,w:"One thing tried at home rather than a rule for everybody."},
    {q:"What is the test of this day?",a:["The price","The number of herbs","The bottle size","Whether a plan can be written with no herb in it at all"],k:3,w:"Where it works, the herb was never the point."},
    {q:"Where the plate works, what was the herb?",a:["Never the point","The cure","The reason","The only lever"],k:0,w:"That is the strongest lever in the course."}]},

{d:79,t:"A year of tea: seasonal practice",s:"What the year asks for",
 p:["The tradition practises with the year. Spring is the green and the bitter, the nettle and the dandelion, and the moving of what the winter held. Summer is the cooling and the light, the mints and the fruit. Autumn is the root and the berry and the storing. Winter is the warming and the damp, the ginger and the root and the long slow decoction.","The book's own line sits under this as well: an herb that grows where you are is generally good for the diseases of that place, which is the same argument as eating what grows near you.","The day's exercise is a small one and a real one. Write the four seasons and put three herbs under each, from this shelf, with a reason. That list is a practice in miniature, and every part of it is one you can defend."],
 q:[{q:"What is the spring's work?",a:["The warming and the damp","The root and the berry","The green, the bitter and the moving of what winter held","The cooling"],k:2,w:"Nettle and dandelion are its plainest herbs."},
    {q:"Which herbs are spring's plainest?",a:["Ginger and garlic","Valerian and catnip","Kelp and bilberry","Nettle and dandelion"],k:3,w:"The green and the bitter ones."},
    {q:"Which line sits under the seasonal practice?",a:["An herb that grows where you are is good for the diseases of that place","Fresh is weaker","Roots are never used","Winter needs no herbs"],k:0,w:"The same argument as eating what grows near you."},
    {q:"What is the day's exercise?",a:["A long essay","Four seasons, three herbs under each, with a reason","A test","A price list"],k:1,w:"That list is a practice in miniature."},
    {q:"What is that list?",a:["A shopping list","A test","A practice in miniature","A diary"],k:2,w:"And every part of it is defensible."}]},

{d:80,t:"Keeping a materia medica notebook",s:"The book you write yourself",
 p:["The library is the books; the notebook is yours. One page to a plant, and on it the botanical name, the part, the class, the energetics, the preparations, the dose, the caution and the interactions - copied once, in your own hand, which is how a shelf becomes knowledge.","Then the half that no book can give you: the cases you have seen it in. A plant's page is complete when it carries the reason you chose it and the result you saw, in the person's own words rather than yours.","Read your own notebook before you read the shelf. A practice that only reads the books is a practice that has learned nothing it did not already know, and the notebook is the only place your cases live."],
 q:[{q:"What is on a plant's page?",a:["Name, part, class, energetics, preparations, dose, caution and interactions","Only the name","Only the price","Only the cases"],k:0,w:"Copied once, in your own hand, which is how a shelf becomes knowledge."},
    {q:"How is it written?",a:["By a computer","Once, in your own hand","By a shop","It is not written"],k:1,w:"The writing is the work."},
    {q:"What half can no book give you?",a:["The dose","The name","The cases you have seen it in","The class"],k:2,w:"The reason you chose it and the result you saw, in the person's own words."},
    {q:"What is read first in a practice?",a:["The shelf","The price list","The internet","Your own notebook"],k:3,w:"A practice that only reads the books has learned nothing new."},
    {q:"What do you write beside a plant?",a:["The reason you chose it and the result you saw","The price","The colour","The weather"],k:0,w:"That is the half no book has."}]},
{d:81,t:"Teaching and passing it on",s:"How a tradition survives",
 p:["A tradition survives by being handed on, and the two books are themselves the proof: they were written to be read by somebody who was not in the room. Teaching an herb is the same act in small, and the standard is the same one this page has kept - say what is the book's and what is yours.","The first lesson to pass on is not a plant, it is the order: read the body, read the caution, read the use, and never the other way round. The second is the library's day 28, which is the whole course compressed into seven lines.","The last thing worth passing on is the habit of saying I do not know. A teacher who does not know and says so leaves a student with a method; a teacher who guesses leaves one with a habit of guessing."],
 q:[{q:"What is the first lesson to pass on?",a:["A plant","A dose","The order: read the body, the caution, the use","A price"],k:2,w:"And never the other way round."},
    {q:"What order is never used?",a:["Body first","Caution first","Use last","The other way round"],k:3,w:"A teacher who guesses leaves the habit of guessing."},
    {q:"What is the whole course, compressed?",a:["Day 28 of the library","The price list","The shelves","The index"],k:0,w:"Seven lines that outrank everything else on the page."},
    {q:"How many lines are on the library's day 28?",a:["Two","Seven","Twenty","Ninety"],k:1,w:"They outrank every claim on every other shelf."},
    {q:"What does a teacher who says I do not know leave a student with?",a:["A habit of guessing","Nothing","A method","A doubt"],k:2,w:"That is worth more than a guess."}]},

{d:82,t:"The referral network",s:"The people around a practice",
