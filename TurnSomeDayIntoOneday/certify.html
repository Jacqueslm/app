// The words on the door each lesson opens. The track says which room, and the
// address says which part of it - a course day, the cards, or
// the Trainer.
function libLabel(tid, to){
  if (tid === "fitness") return "The Trainer - the by-10 regimen";
  var m = String(to).match(/#d(\d+)/);
  if (m) return "Herb Library - day " + m[1];
  if (String(to).indexOf("#course") > -1) return "Herb Library - the ninety days";
  return "Herb Library - the plant cards";
}

// A plant name, turned into the address the Herb Library opens a card at
// (13 Oct 2026). The library does the same to its own names, so a lesson that
// names garlic and a card called Garlic meet at /herbs#p-garlic. Letters and
// numbers only, everything else a hyphen - the same rule on both pages.
function plantSlug(s){
  return String(s == null ? "" : s).toLowerCase()
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}

// One lesson's deeper layer, or null where the page has none. Read by the day
// view and exposed for the checks, so the link and the paragraph can be verified
// without a browser. Where the lesson names plants, each one carries its own door
// into that exact card - the plant cards, not only the shelf they sit on.
function deeperFor(tid, d){
  var all = GO_DEEPER[tid];
  var entry = all ? all[String(d)] : null;
  if (!entry) return null;
  var cards = (entry.cards || []).map(function(n){
    var s = plantSlug(n);
    return { name:n, slug:s, to:"/herbs#p-" + s };
  });
  return { p:entry.p, to:entry.to, label:libLabel(tid, entry.to), cards:cards };
}

/* ---------- how a track is judged ---------- */

// asks three and passes at two; the herbalist track asks five (15 Oct 2026,
// when its quizzes were rewritten in plainer words) and passes at four, which
// is the same four-in-five the block tests ask for. Read per track, because one
// shared number would either make the herbalist quiz pass at two of five or say
// "of 3" under a five-question quiz.
var PASS_DAY = 2;      // of the three questions after a trainer-track lesson
var PASS_DAY_HERB = 4; // of the five questions after a herbalist-track lesson
var PASS_TEST = 24;  // of the 30 questions in a block test or the exam
function passMark(t){ return t.id === "herbalist" ? PASS_DAY_HERB : PASS_DAY; }
// The one place the day's pass is decided, so the score, the tick line and the
// stored record cannot disagree about what passed.
function passOk(id,right){ return right >= passMark(track(id)); }
var BLOCKS = [
  { n:1, from:1,  to:30, name:"Block Test One", covers:"Days 1 to 30" },
  { n:2, from:31, to:60, name:"Block Test Two", covers:"Days 31 to 60" }
];

function track(id){
  for (var i=0;i<TRACKS.length;i++) if (TRACKS[i].id===id) return TRACKS[i];
  return null;
}

/* ---------- what is kept, and where ---------- */

var LS = "tsid_certify_v1";
var INTAKE = "tsid_trainer_intake_v1";

/* ---------- the cross progress bridge ----------
   The Herb Library keeps its ninety days under its own key, on the same phone,
   and it writes a small summary of them beside them (tsid_herb_progress_v1).
   This page reads that summary, so the ninety-day track can say where the
   library has actually got to - and the library reads this page's store the
   same way. Two islands became one road: a student's work on either side shows
   on both. Nothing is sent anywhere; it is one phone reading its own shelf.
   An absent or damaged summary is not an error here - it is simply a library
   nobody has started, which is what the first day of every course is. */
var HERB_BRIDGE = "tsid_herb_progress_v1";
var HERB_TOTAL = 59;

function herbBridge(){
  var s = null;
  try { s = JSON.parse(localStorage.getItem(HERB_BRIDGE) || "null"); } catch(e){ s = null; }
  var out = { done:0, total:HERB_TOTAL, passed:false };
  if (s && typeof s === "object"){
    out.done = Number(s.done) > 0 ? Number(s.done) : 0;
    out.total = Number(s.total) > 0 ? Number(s.total) : HERB_TOTAL;
    out.passed = !!s.passed;
    if (out.done > out.total) out.done = out.total;
  }
  return out;
}

function herbBridgeLine(){
  var b = herbBridge();
  if (b.done <= 0) return "The Herb Library's own progress: nothing started yet - its plant cards and its ninety days are open beside this track.";
  return "The Herb Library's own progress: " + b.done + " of " + b.total + " days done"
    + (b.passed ? ", and its day-60 test passed." : ".");
}

function blankTrack(){ return { days:{}, tests:{}, exam:null }; }

/* 15 Oct 2026. The herbalist track's quizzes were rewritten from three questions
a lesson to five, and a day recorded against a different number of questions is
a score for a quiz that is no longer on the page. So it is not a score: the day
opens again, and the block tests and the examination - every question of them
drawn from those same rewritten quizzes - are owed again with it. "Start over"
is then not a button somebody has to find on a phone we cannot reach; the page
notices for itself, once, and says nothing about the days that did not change.
The trainer track's quizzes are the three they always were, so every record it
has stands. */
function dropStaleDays(t, cur){
  var dropped = 0;
  Object.keys(cur.days).forEach(function(k){
    var day = t.days[Number(k) - 1], rec = cur.days[k];
    if (!day || !rec || typeof rec !== "object" || rec.total !== day.q.length){
      delete cur.days[k]; dropped++;
    }
  });
  return dropped;
}

var state = null;
function load(){
  var s = null;
  try { s = JSON.parse(localStorage.getItem(LS) || "null"); } catch(e){ s = null; }
  if (!s || typeof s !== "object") s = {};
  if (!s.tracks || typeof s.tracks !== "object") s.tracks = {};
  s.name = typeof s.name === "string" ? s.name : "";
  var rebuilt = false;
  TRACKS.forEach(function(t){
    var cur = s.tracks[t.id];
    if (!cur || typeof cur !== "object") s.tracks[t.id] = blankTrack();
    else {
      if (!cur.days || typeof cur.days !== "object") cur.days = {};
      if (!cur.tests || typeof cur.tests !== "object") cur.tests = {};
      if (dropStaleDays(t, cur)) { cur.tests = {}; cur.exam = null; rebuilt = true; }
    }
  });
  // Written straight back, so the phone is cleaned once rather than re-pruned on
  // every open - and so the Herb Library, which reads this store to report where
  // the ninety days have got to, reads the truth instead of the old 3/3s.
  if (rebuilt){ try { localStorage.setItem(LS, JSON.stringify(s)); } catch(e){} }
  return s;
}
function save(){
  try { localStorage.setItem(LS, JSON.stringify(state)); } catch(e){}
}

function myName(){
  if (state && state.name) return state.name;
  try {
    var t = JSON.parse(localStorage.getItem(INTAKE) || "null");
    if (t && typeof t.name === "string" && t.name) return t.name;
  } catch(e){}
  return "";
}

/* ---------- what counts as done ---------- */

function get(id){ return state.tracks[id] || blankTrack(); }
function dayRec(id,d){ return get(id).days[String(d)] || null; }
function dayDone(id,d){ var r = dayRec(id,d); return !!(r && r.passed); }
function daysDone(id){
  var n=0; for (var d=1; d<=TOTAL; d++) if (dayDone(id,d)) n++; return n;
}
function blockDone(id,b){
  for (var d=b.from; d<=b.to; d++) if (!dayDone(id,d)) return false;
  return true;
}
function testRec(id,end){ return get(id).tests[String(end)] || null; }
function testPassed(id,end){ var r = testRec(id,end); return !!(r && r.passed); }
function examRec(id){ return get(id).exam || null; }
function examPassed(id){ var r = examRec(id); return !!(r && r.passed); }
function testUnlocked(id,b){ return blockDone(id,b); }
function examUnlocked(id){
  return blockDone(id,BLOCKS[0]) && blockDone(id,BLOCKS[1]) &&
         testPassed(id,30) && testPassed(id,60);
}

/* ---------- the questions a test is built from ---------- */
// A block test is one question from every day in the block - the first one,
// thirty of them. The ultimate examination is one from every third day across
// all ninety - the second question of that day, so the exam is never simply the
// block tests again.

function blockQuestions(id,b){
  var t = track(id), out = [];
  for (var d=b.from; d<=b.to; d++){
    var day = t.days[d-1];
    if (day && day.q && day.q[0]) out.push({ day:day.d, q:day.q[0] });
  }
  return out;
}
function examQuestions(id){
  var t = track(id), out = [];
  for (var d=1; d<=TOTAL; d+=3){
    var day = t.days[d-1];
    if (day && day.q && day.q[1]) out.push({ day:day.d, q:day.q[1] });
  }
  return out;
}

/* ---------- the page's small helpers ---------- */

function id(x){ return document.getElementById(x); }
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}
function plus(n){ return n + (n===1 ? " day" : " days"); }
function pct(a,b){ return b ? Math.round(a/b*100) : 0; }
function today(){
  var d = new Date(), m = d.getMonth()+1, day = d.getDate();
  return d.getFullYear() + "-" + (m<10?"0":"") + m + "-" + (day<10?"0":"") + day;
}

/* ---------- the views ---------- */

var view = { at:"home", track:null, day:null, test:null, exam:false, cert:null };
var picks = {};   // question index -> chosen option, for the view being answered

function go(next){
  // Leaving a lesson ends its reading, so the voice never carries into the next
  // screen over the top of a different day.
  sayStop();
  for (var k in next) if (Object.prototype.hasOwnProperty.call(next,k)) view[k] = next[k];
  picks = {};
  render();
}

function setHead(title, sub){
  id("title").textContent = title;
  id("subtitle").textContent = sub;
}

// The seal in the header (13 Oct 2026): from any lesson, any test and the
// examination, one tap opens the certificate that work is being done for. On the
// home screen and on the certificate itself there is nowhere for it to go, so it
// is not shown, and its own note carries the state of the work.
function setCertLink(){
  var b = id("certlink");
  if (!b) return;
  if (view.cert || !view.track){ b.hidden = true; return; }
  var tid = view.track;
  b.hidden = false;
  b.title = examPassed(tid)
    ? "Your certificate - earned"
    : "Your certificate - " + daysDone(tid) + " of " + TOTAL + " days done so far";
}

function render(){
  setCertLink();
  var v = id("view");
  if (view.cert) renderCert(v, view.cert);
  else if (view.day) renderDay(v, view.day);
  else if (view.test) renderTest(v, view.test, false);
  else if (view.exam) renderExam(v);
  else if (view.track) renderTrack(v, track(view.track));
  else renderHome(v);
  /* The voice bar goes on after the screen is drawn, so it lands under whatever
     this screen turned out to be. */
  mountScreenSay();
}

/* -- home -- */

       +     "<p class=\"tt\">The Ultimate Examination</p>"
       +     "<p class=\"ts\">" + (exOpen ? "All ninety days · thirty questions, " + PASS_TEST + " to pass" : "Unlocks when both block tests are passed and all ninety days are done") + "</p></span></button>";

  // The way from the lessons to the certificate, open from day one (13 Oct

  out += "<button class=\"btn\" id=\"toCert\">Open the certificate</button>";

  // one by one; this is the same door, for the track as a whole. On the

  if (t.lib){

         +   "<div class=\"rowtop\"><span class=\"txt\"><h2 class=\"tname\">" + esc(t.lib.name) + "</h2><p class=\"tsub\">" + esc(t.lib.note) + "</p>"

  });

    b.addEventListener("click", function(){ if (!b.disabled) go({ test:Number(b.getAttribute("data-test")), day:null }); });

  Array.prototype.forEach.call(v.querySelectorAll("[data-exam]"), function(b){

  });

}

function dayRows(t, from, to){
  var out = "<div class=\"daylist\">";
  for (var d=from; d<=to; d++){
    var day = t.days[d-1];
    if (!day) continue;
    var rec = dayRec(t.id,d);
    var on = !!rec && rec.passed;
    out += "<button class=\"day" + (on ? " done" : "") + "\" data-day=\"" + day.d + "\">"
         +   "<span class=\"num\">" + day.d + "</span>"
         +   "<span class=\"txt\"><p class=\"t\">" + esc(day.t) + "</p><p class=\"s\">" + esc(day.s) + "</p></span>"
         +   "<span class=\"tick" + (on ? " done" : "") + "\">" + (on ? (rec.right + "/" + rec.total + " ✓") : "&#8250;") + "</span>"
         + "</button>";
  }
  return out + "</div>";
}

/* ── THE VOICE ────────────────────────────────────────────────────────────────
   The phone reads the lesson out loud, with the voice already on it.

   speechSynthesis is built into the browser, so nothing leaves the phone,
   nothing is charged, there is no key and no server, and it works with no
   signal — the same voice the Herb Library uses on a plant and The Key uses on
   a reading. It reads only the lesson card as it stands on this page: the day's
   title, its subject line and the teaching paragraphs. The quiz is left to the
   eye, because reading the answers out loud would spoil it.

   13 Oct 2026, from Jacques: "have the lessons all the lessons on both programs
   to read it to me like everything else". Both tracks come through here — this
   is the one place a lesson is drawn — so every lesson on both is read. If the
   phone has no voice of its own, the button says so instead of doing nothing.
─────────────────────────────────────────────────────────────────────────── */
var SAYING = false;
function speechOK(){
  return typeof speechSynthesis !== "undefined" && typeof SpeechSynthesisUtterance !== "undefined";
}
function sayStop(){
  if (speechOK()){ try{ speechSynthesis.cancel(); }catch(e){} }
  SAYING = false;
  var b = id("sayBtn"); if (b) b.textContent = "Read it to me";
  var s = id("sayStop"); if (s) s.hidden = true;
  /* The bar under the screens that have no lesson on them — Jacques, 15 Oct
     2026: "the read it to me doesn't work here ... the whole app not just
     specific sections." */
  var sb = id("screenSayBtn"); if (sb) sb.textContent = "Read it to me";
  var ss = id("screenSayStop"); if (ss) ss.hidden = true;
}
/* The lesson, word for word, in the order the card shows it. */
function sayText(day){
  var s = day.t + ". ";
  if (day.s) s += day.s + ". ";
  (day.p || []).forEach(function(p){ s += p + " " });
  return s;
}
function sayLesson(){
  sayStop();
  var t = track(view.track);
  var day = (t && view.day) ? t.days[view.day-1] : null;
  if (!day) return;
  if (!speechOK()){ var b = id("sayBtn"); if (b) b.textContent = "This phone has no voice"; return; }
  // The lesson card, and the "Going deeper" paragraph under it when this day has
  // one — everything the page shows of the lesson, and none of the quiz.
  var text = sayText(day);
  var deeper = deeperFor(t.id, day.d);
  if (deeper && deeper.p) text += "Going deeper. " + deeper.p + " ";
  var u = new SpeechSynthesisUtterance(text);
  u.onend = function(){ if (SAYING) sayStop(); };
  u.onerror = function(){ if (SAYING) sayStop(); };
  SAYING = true;
  var btn = id("sayBtn"); if (btn) btn.textContent = "Stop";
  var st = id("sayStop"); if (st) st.hidden = false;
  try{ speechSynthesis.speak(u); }catch(e){ sayStop() }
}

/* ── THE VOICE ON THE OTHER SCREENS ──────────────────────────────────────────
   The lesson carried a Read it to me button and the other four screens carried
   none, so on the home page, a track, a test and the certificate the reading
   had no voice at all. This bar is mounted once under whatever screen has words
   on it and reads that screen.

   Two screens are left out on purpose and they are the quiz ones. A test and
   the examination are made of questions with their answers underneath — read
   aloud, the answers arrive before the reader has decided anything, which is
   the whole exercise gone. The lesson keeps the button it already had, because
   that one reads the teaching and stops at the quiz by design.
─────────────────────────────────────────────────────────────────────────── */
function screenSayHTML(){
  return '<div class="sayrow noprint" id="screenSay">'
       +   '<p class="saysaid">Read aloud</p>'
       +   '<button class="saybtn" id="screenSayBtn">Read it to me</button>'
       +   '<button class="saybtn stop" id="screenSayStop" hidden>Stop</button>'
       + '</div>';
}
/* Whatever the drawn screen says, in the order it says it. The controls are not
   words, so buttons, fields and the bar itself are walked past. */
function screenSayText(){
  var v = id("view");
  if (!v) return "";
  var out = [];
  var skip = /(^|\s)(noprint|sayrow|saybar|saysaid)(\s|$)/;
  var walk = function(e){
    var kids = e.children, deeper = false;
    for (var i = 0; i < kids.length; i++){
      var c = kids[i];
      if (skip.test(c.className || "")) continue;
      if (/^(BUTTON|INPUT|SELECT|TEXTAREA|OPTION|SCRIPT|STYLE)$/.test(c.tagName)) continue;
      if (!(c.textContent || "").trim()) continue;
      if (/^(DIV|P|LI|UL|OL|H2|H3|H4|TABLE|TR|TD|TH|SECTION|ARTICLE|A)$/.test(c.tagName)){ deeper = true; walk(c); }
    }
    if (!deeper){
      var t = (e.textContent || "").replace(/\s+/g, " ").trim();
      if (t.length > 1) out.push(t);
    }
  };
  walk(v);
  return out.join(". ");
}
function screenSay(){
  if (SAYING){ sayStop(); return; }
  if (!speechOK()){ var b0 = id("screenSayBtn"); if (b0) b0.textContent = "This phone has no voice"; return; }
  var text = screenSayText();
  if (!text){ var b1 = id("screenSayBtn"); if (b1) b1.textContent = "Nothing here to read yet"; return; }
  sayStop();
  var u = new SpeechSynthesisUtterance(text);
  u.onend = function(){ if (SAYING) sayStop(); };
  u.onerror = function(){ if (SAYING) sayStop(); };
  SAYING = true;
  var b = id("screenSayBtn"); if (b) b.textContent = "Stop";
  var s = id("screenSayStop"); if (s) s.hidden = false;
  try{ speechSynthesis.speak(u); }catch(e){ sayStop() }
}
/* Mounted after every render, and taken off the two screens that keep their own
   arrangement — a lesson's own button, and a quiz, which is left to the eye. */
function mountScreenSay(){
  var v = id("view");
  if (!v) return;
  var old = id("screenSay");
  if (old && old.parentNode) old.parentNode.removeChild(old);
  if (view.day || view.test || view.exam) return;
  v.insertAdjacentHTML("beforeend", screenSayHTML());
  var b = id("screenSayBtn"); if (b) b.addEventListener("click", screenSay);
  var s = id("screenSayStop"); if (s) s.addEventListener("click", sayStop);
}

/* -- one lesson and its quiz -- */
function renderDay(v, d){
  var t = track(view.track);
  var day = t.days[d-1];
  if (!day){ view.day = null; return renderTrack(v,t); }
  setHead("Day " + day.d, t.name + " · " + day.s);
  var rec = dayRec(t.id,d);
  var out = "";
  out += "<div class=\"card\"><h2>" + esc(day.t) + "</h2>";
  (day.p || []).forEach(function(p){ out += "<p>" + esc(p) + "</p>"; });
  out += "</div>";
  // Read aloud (13 Oct 2026): the same voice the Herb Library reads a plant
  // with reads this lesson — the title, the subject and the teaching, and it
  // stops before the quiz, which is left to the eye.
  out += "<div class=\"sayrow noprint\">"
       +   "<p class=\"saysaid\">Read aloud</p>"
       +   "<button class=\"saybtn\" id=\"sayBtn\">Read it to me</button>"
       +   "<button class=\"saybtn stop\" id=\"sayStop\" hidden>Stop</button>"
       + "</div>";
  out += "<p class=\"kicker\">The day's quiz</p>";
  out += quizHtml(day.q);
  out += "<button class=\"btn\" id=\"submit\">Check the answers</button>";
  out += "<p class=\"tickline\" id=\"tick\">" + (rec && rec.passed ? ("Passed at " + rec.right + " of " + rec.total + ".") : "") + "</p>";
  out += "<div class=\"btn row noprint\"><button class=\"btn quiet\" id=\"again\">Take it again</button><button class=\"btn quiet\" id=\"next\">" + (d < TOTAL ? "Day " + (d+1) : "Back to the track") + "</button></div>";
  // Every lesson stands on the way to the certificate, so every lesson carries
  // the link to it (13 Oct 2026) - the same door the header's seal opens.
  out += "<p class=\"fine\">Day " + day.d + " of " + TOTAL + " in " + esc(t.name) + ". The certificate is written at the end of the ninety." + (rec && rec.passed ? " This day is done." : "") + "</p>";
  out += "<button class=\"btn quiet noprint\" id=\"dayCert\">Open the certificate</button>";

  // The deeper layer, and the doors to where this ground is taught at length
  // (13 Oct 2026). One more paragraph the lesson would otherwise send a student
  // to find, the Herb Library or the Trainer beside it, and - where the lesson
  // names plants - a link onto each plant's own card, so the lesson lands on the
  // exact card and not only on the shelf (Jacques, "link to plant cards").
  var deeper = deeperFor(t.id, day.d);
  if (deeper){
    out += "<div class=\"card\" style=\"margin-top:14px\"><h2>Going deeper</h2>"
         +   "<p>" + esc(deeper.p) + "</p>";
    if (deeper.cards.length){
      out += "<p class=\"kicker\">The plant cards this lesson names</p><div class=\"plantcards\">";
      deeper.cards.forEach(function(c){
        out += "<a class=\"plantcard noprint\" href=\"" + esc(c.to) + "\">" + esc(c.name) + "</a>";
      });
      out += "</div>";
    }
    out += "<a class=\"btn quiet noprint\" style=\"display:block;text-align:center;text-decoration:none\" href=\"" + esc(deeper.to) + "\">" + esc(deeper.label) + "</a>"
         + "</div>";
  }
  v.innerHTML = out;

  id("sayBtn").addEventListener("click", sayLesson);
  id("sayStop").addEventListener("click", sayStop);

  wireQuiz(v, day.q, function(right,total){
    var r = get(t.id);
    var mark = passMark(t);
    r.days[String(d)] = { right:right, total:total, passed:passOk(t.id,right), on:today() };
    save();
    id("tick").textContent = passOk(t.id,right)
      ? ("Passed at " + right + " of " + total + ". " + (d < TOTAL ? "Day " + (d+1) + " opens next." : "That is the last lesson."))
      : ("Not yet - " + right + " of " + total + ". " + mark + " of " + total + " is the pass. Read the day again and take it as many times as you like.");
  });
  id("again").addEventListener("click", function(){ go({ day:d }); });
  id("next").addEventListener("click", function(){
    if (d < TOTAL) go({ day:d+1 }); else go({ day:null });
  });
  id("dayCert").addEventListener("click", function(){ go({ cert:t.id, track:null, day:null, test:null, exam:false }); });
}

/* -- a block test -- */
function renderTest(v, n, isExam){
  var b = BLOCKS[n-1];
  var t = track(view.track);
  var set = blockQuestions(t.id,b);
  setHead(b.name, t.name + " · " + b.covers);
  var rec = testRec(t.id,b.to);
  var out = "";
  out += "<div class=\"card\"><h2>" + b.name + "</h2><p>" + set.length + " questions, one from every day in the block. " + PASS_TEST + " to pass. Nothing is timed, and it can be taken again as many times as you like.</p>"
       + (rec ? "<p>Last time: " + rec.right + " of " + rec.total + ".</p>" : "") + "</div>";
  out += quizHtml(set.map(function(x){ return x.q; }));
  out += "<button class=\"btn\" id=\"submit\">Check the answers</button>";
  out += "<p class=\"tickline\" id=\"tick\"></p>";
  v.innerHTML = out;
  wireQuiz(v, set.map(function(x){ return x.q; }), function(right,total){
    var r = get(t.id);
    r.tests[String(b.to)] = { right:right, total:total, passed:right >= PASS_TEST, on:today() };
    save();
    id("tick").textContent = (right >= PASS_TEST)
      ? ("Passed at " + right + " of " + total + ". " + (n===2 ? "The Ultimate Examination opens once every day is done." : "Day 31 opens next."))
      : ("Not yet - " + right + " of " + total + ". " + PASS_TEST + " of " + total + " is the pass. Read the days the reasons point back to.");
  });
}

/* -- the ultimate examination -- */
function renderExam(v){
  var t = track(view.track);
  var set = examQuestions(t.id);
  setHead("The Ultimate Examination", t.name + " · all ninety days");
  var rec = examRec(t.id);
  var out = "";
  out += "<div class=\"card\"><h2>The Ultimate Examination</h2><p>" + set.length + " questions drawn from all ninety days. " + PASS_TEST + " to pass, and the certificate is written when you do.</p>"
       + (rec && rec.passed ? "<p>Already passed at " + rec.right + " of " + rec.total + " on " + esc(rec.on) + ".</p>" : "")
       + "<p class=\"fine\">Nothing is timed, the answers are checked on the phone, and nothing goes anywhere. If a question points back at a day, that is the day to read again.</p></div>";
  out += quizHtml(set.map(function(x){ return x.q; }));
  out += "<button class=\"btn\" id=\"submit\">Finish the examination</button>";
  out += "<p class=\"tickline\" id=\"tick\"></p>";
  out += "<div class=\"btn row\" id=\"afterRow\" hidden><button class=\"btn\" id=\"toCert\">Open the certificate</button></div>";
  v.innerHTML = out;
  wireQuiz(v, set.map(function(x){ return x.q; }), function(right,total){
    var r = get(t.id);
    var passed = right >= PASS_TEST;
    r.exam = { right:right, total:total, passed:passed, on:today() };
    save();
    id("tick").textContent = passed
      ? ("Passed at " + right + " of " + total + ". The certificate is yours.")
      : ("Not yet - " + right + " of " + total + ". " + PASS_TEST + " of " + total + " is the pass, and it can be taken again as often as you like.");
    if (passed){
      id("afterRow").hidden = false;
      id("toCert").addEventListener("click", function(){ go({ cert:t.id, track:null, day:null, test:null, exam:false }); });
    }
  });
}

/* -- the certificate -- */
// The end of the lessons, and reachable from them the whole way (13 Oct 2026).
// What it shows is the record of the work - the ninety lessons and both block
// tests beside the examination - the honest line about what it is not, the
// certificate itself once it is earned, and two ways out of it: printed, or
// saved as an image. Before it is earned it says so and says what is still
// owed, because a page that paints a certificate for work not done is the one
// dishonest thing this page could do.
function renderCert(v, tid){
  var t = track(tid);
  setHead("The Certificate", t.name);
  var ex = examRec(tid) || { right:0, total:0, on:today() };
  var earned = examPassed(tid);
  var name = myName();
  var out = "";

  out += "<div class=\"card noprint\"><h2>What this certificate records</h2>"
       +   recordHtml(t)
       +   "<p class=\"fine\">This is a certificate of completion, written and kept on this phone. It records the study done on this page and nothing more. " + esc(t.law) + "</p></div>";

  if (earned) out += certHtml(t, name, ex);
  else out += "<div class=\"card\"><h2>Not yet earned</h2><p>" + esc(certStatus(tid)) + "</p>"
            +   "<p class=\"fine\">The certificate is written the moment the ultimate examination is passed. Its wording is the same for everybody, and so is the line on it about what it is not.</p></div>";

  out += "<div class=\"card noprint\" id=\"setup\">"
       +   "<p class=\"for\">The name the certificate is written for</p>"
       +   "<input id=\"certName\" type=\"text\" value=\"" + esc(name) + "\" placeholder=\"A name, or just an initial\" autocapitalize=\"words\" "
       +     "style=\"width:100%;margin:0 0 12px;padding:13px 14px;font:inherit;font-size:1rem;color:var(--ink);background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;outline:none\">"
       +   "<button class=\"btn\" id=\"write\">Write the certificate</button>"
       + "</div>";

  // Printing and the image are offered only for a certificate that is earned.
  if (earned){
    out += "<div class=\"btn row noprint\"><button class=\"btn quiet\" id=\"print\">Print it</button><button class=\"btn quiet\" id=\"image\">Save as image</button></div>";
  }
  out += "<div class=\"btn row noprint\"><button class=\"btn quiet\" id=\"reload\">Reload</button><button class=\"btn quiet\" id=\"backTrack\">Back to the lessons</button></div>";
  out += "<p class=\"fine noprint\" id=\"note\"></p>";

  v.innerHTML = out;
  id("write").addEventListener("click", function(){
    state.name = (id("certName").value || "").trim();
    save();
    renderCert(v, tid);
  });
  if (earned){
    id("print").addEventListener("click", function(){ try { window.print(); } catch(e){} });
    id("image").addEventListener("click", function(){
      var typed = id("certName") ? (id("certName").value || "") : "";
      var how = exportCert(t, (typed || state.name || "").trim(), ex);
      id("note").textContent = how === "saved"
        ? ("Saved as " + certFilename(t.id, ex.on) + ". Look in your downloads, or in your photos.")
        : (how === "print"
          ? "This browser would not hand the image over, so the print dialog is open - choose Save as PDF in it."
          : "This browser would neither save the image nor open its print dialog. A screenshot of the certificate works everywhere.");
    });
  }
  id("reload").addEventListener("click", reloadPage);
  id("backTrack").addEventListener("click", function(){ go({ cert:null, track:tid }); });
}

// The record the certificate stands on: the lessons, the two tests and the
// examination that made it, each with what actually happened. It is drawn from
// the same store the rest of the page writes, so it can never flatter it.
function recordHtml(t){
  var d = daysDone(t.id);
  var t1 = testRec(t.id,30), t2 = testRec(t.id,60), ex = examRec(t.id);
  function line(label, value, on){
    return "<div class=\"rec\"><span>" + esc(label) + "</span><b class=\"" + (on ? "yes" : "") + "\">" + esc(value) + "</b></div>";
  }
  return "<div class=\"recs\">"
    + line("The ninety lessons", d + " of " + TOTAL + " done", d === TOTAL)
    + line("The quiz after each lesson", d + " of " + TOTAL + " passed", d === TOTAL)
    + line("Block Test One", t1 ? ("passed " + t1.right + " of " + t1.total + " on " + t1.on) : "not yet taken", !!(t1 && t1.passed))
    + line("Block Test Two", t2 ? ("passed " + t2.right + " of " + t2.total + " on " + t2.on) : "not yet taken", !!(t2 && t2.passed))
    + line("The Ultimate Examination", ex ? (ex.right + " of " + ex.total + " on " + ex.on) : "not yet taken", !!(ex && ex.passed))
    + "</div>";
}

/* ---------- what is still owed ---------- */
// One sentence, used under the track's button and in the certificate's own
// "not yet earned" card, so the two can never say different things.
function certStatus(tid){
  if (examPassed(tid)) return "Earned. Open it to write your name on it, print it, or save it as an image.";
  var owed = [];
  var left = TOTAL - daysDone(tid);
  if (left > 0) owed.push(left === 1 ? "one lesson" : left + " lessons");
  if (!testPassed(tid,30)) owed.push("Block Test One");
  if (!testPassed(tid,60)) owed.push("Block Test Two");
  if (!examPassed(tid)) owed.push("the Ultimate Examination");
  return "Not yet earned. Still owed: " + owed.join(", ").replace(/, ([^,]*)$/, " and $1") + ".";
}

/* ---------- reload ---------- */
// Reload reads the page from the top again: the store is read afresh, so answers
// taken in another tab or an earlier visit appear, and a copy a phone has been
// holding since an update is replaced by the one being served now. Where the
// browser will not reload (a sandbox, a file:// page), the record is read again
// and the page redrawn, which is the part a reload is for here.
function reloadPage(){
  try {
    if (window.location && typeof window.location.reload === "function"){ window.location.reload(); return; }
  } catch(e){}
  state = load();
  render();
}

function certHtml(t, name, ex){
  var who = name || "Your name here";
  return "<div class=\"cert\">"
    + "<span class=\"seal\"><svg viewBox=\"0 0 64 64\"><circle cx=\"32\" cy=\"32\" r=\"22\"/><circle cx=\"32\" cy=\"32\" r=\"15\"/><path d=\"M22 46l-4 12 8-4 6 6 6-6 8 4-4-12\"/></svg></span>"
    + "<p class=\"over\">The Truth &middot; Certificate of Completion</p>"
    + "<h2>" + esc(t.name) + "</h2>"
    + "<p class=\"for\">awarded to</p>"
    + "<p class=\"who\">" + esc(who) + "</p>"
    + "<div class=\"line\"></div>"
    + "<p class=\"what\">for completing the ninety-day training, the quiz after each of the ninety lessons, both block tests and the ultimate examination.</p>"
    + "<p class=\"when\">Ultimate Examination " + ex.right + " of " + ex.total + " &middot; " + esc(ex.on) + "</p>"
    + "</div>";
}

/* ---------- the certificate as an image ---------- */
// "Save as image" is the export: the same certificate, drawn onto a canvas here
// rather than photographed off the screen, then handed to the browser as a
// download. Drawn, so it needs no library, no server and no permission - and the
// honest line goes on the image itself, because a picture of a certificate
// travels further than the page does and should not travel as more than it is.
// 1600 by 1132 is a certificate's shape.
var IMG_W = 1600, IMG_H = 1132;

function certFilename(tid, on){
  return "certificate-" + String(tid).replace(/[^a-z0-9]+/gi, "-").replace(/^-|-$/g, "").toLowerCase()
       + "-" + (on || today()) + ".png";
}

function wrapText(g, text, maxW){
  var words = String(text == null ? "" : text).split(/\s+/);
  var lines = [], line = "";
  for (var i=0; i<words.length; i++){
    var next = line ? line + " " + words[i] : words[i];
    if (line && g.measureText(next).width > maxW){ lines.push(line); line = words[i]; }
    else line = next;
  }
  if (line) lines.push(line);
  return lines;
}

function drawCert(t, name, ex){
  var c = null;
  try { c = document.createElement("canvas"); } catch(e){ c = null; }
  if (!c) return null;
  c.width = IMG_W; c.height = IMG_H;
  var g = c.getContext ? c.getContext("2d") : null;
  if (!g) return null;

  var serif = 'Georgia, "Iowan Old Style", "Times New Roman", serif';
  var sans = 'system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
  var cx = IMG_W / 2;

  g.fillStyle = "#07060d";
  g.fillRect(0, 0, IMG_W, IMG_H);
  var glow = g.createLinearGradient ? g.createLinearGradient(0, 0, 0, IMG_H * 0.55) : null;
  if (glow){
    glow.addColorStop(0, "rgba(232,192,122,.15)");
    glow.addColorStop(1, "rgba(232,192,122,0)");
    g.fillStyle = glow;
    g.fillRect(0, 0, IMG_W, IMG_H * 0.55);
  }
  g.strokeStyle = "rgba(232,192,122,.72)"; g.lineWidth = 5; g.strokeRect(52, 52, IMG_W - 104, IMG_H - 104);
  g.strokeStyle = "rgba(232,192,122,.28)"; g.lineWidth = 2; g.strokeRect(74, 74, IMG_W - 148, IMG_H - 148);

  // The seal, drawn the way the page draws it.
  g.strokeStyle = "rgba(232,192,122,.85)"; g.lineWidth = 3;
  g.beginPath(); g.arc(cx, 222, 58, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.arc(cx, 222, 39, 0, Math.PI * 2); g.stroke();
  g.beginPath();
  g.moveTo(cx - 22, 272); g.lineTo(cx - 34, 340); g.lineTo(cx - 11, 320);
  g.lineTo(cx, 334); g.lineTo(cx + 11, 320); g.lineTo(cx + 34, 340); g.lineTo(cx + 22, 272);
  g.stroke();

  g.textAlign = "center";
  if ("letterSpacing" in g) g.letterSpacing = "8px";
  g.fillStyle = "#6f6890"; g.font = "600 25px " + sans;
  g.fillText("THE TRUTH \u00b7 CERTIFICATE OF COMPLETION", cx, 396);

  g.fillStyle = "#ece9f5"; g.font = "500 62px " + serif;
  g.fillText(t.name, cx, 480);

  g.fillStyle = "#a29cbb"; g.font = "400 28px " + sans;
  g.fillText("awarded to", cx, 534);

  // A long name is drawn smaller rather than off the edge of the certificate.
  var who = name || "Your name here";
  var size = 78;
  g.fillStyle = "#e8c07a";
  g.font = "500 " + size + "px " + serif;
  while (size > 40 && g.measureText(who).width > 900){ size -= 4; g.font = "500 " + size + "px " + serif; }
  g.fillText(who, cx, 630);

  g.strokeStyle = "rgba(232,192,122,.4)"; g.lineWidth = 2;
  g.beginPath(); g.moveTo(cx - 330, 690); g.lineTo(cx + 330, 690); g.stroke();

  g.fillStyle = "#a29cbb"; g.font = "400 30px " + sans;
  var body = wrapText(g, "for completing the ninety-day training, the quiz after each of the ninety lessons, both block tests and the ultimate examination.", 1040);
  for (var i=0; i<body.length; i++) g.fillText(body[i], cx, 742 + i * 44);

  g.fillStyle = "#6f6890"; g.font = "400 25px " + sans;
  g.fillText("Ultimate Examination " + ex.right + " of " + ex.total + " \u00b7 " + (ex.on || today()), cx, 852);

  var law = wrapText(g, t.law, 1120);
  g.font = "400 20px " + sans;
  for (var j=0; j<law.length; j++) g.fillText(law[j], cx, 942 + j * 28);

  if ("letterSpacing" in g) g.letterSpacing = "0px";
  return c;
}

function saveCanvas(c, filename){
  try {
    if (!c || typeof c.toDataURL !== "function") return false;
    var url = c.toDataURL("image/png");
    if (!url) return false;
    var a = document.createElement("a");
    if (typeof a.click !== "function") return false;
    a.href = url;
    a.download = filename;
    if (document.body && document.body.appendChild) document.body.appendChild(a);
    a.click();
    if (a.remove) a.remove();
    return true;
  } catch(e){ return false; }
}

// Returns how it went out: "saved" (an image the browser took), "print" (no
// canvas or no download here, so the print dialog - where a phone keeps "Save as
// PDF"), or "none" (neither, and the page says a screenshot instead).
function exportCert(t, name, ex){
  var c = drawCert(t, name, ex);
  if (c && saveCanvas(c, certFilename(t.id, ex.on))) return "saved";
  try { if (window.print){ window.print(); return "print"; } } catch(e){}
  return "none";
}

/* ---------- the quiz, drawn the same way everywhere ---------- */

function quizHtml(qs){
  var out = "";
  qs.forEach(function(q, i){
    out += "<div class=\"q\" data-q=\"" + i + "\"><p class=\"qp\">" + (i+1) + ". " + esc(q.q) + "</p><div class=\"opts\">";
    q.a.forEach(function(a, j){
      out += "<button class=\"opt\" data-o=\"" + j + "\"><span class=\"mark\">" + "ABCD".charAt(j) + "</span><span>" + esc(a) + "</span></button>";
    });
    out += "</div><p class=\"why\" hidden></p></div>";
  });
  return out;
}

function wireQuiz(v, qs, done){
  var blocks = v.querySelectorAll(".q");
  Array.prototype.forEach.call(blocks, function(block, i){
    var opts = block.querySelectorAll(".opt");
    Array.prototype.forEach.call(opts, function(o){
      o.addEventListener("click", function(){
        if (block.getAttribute("data-checked") === "1") return;
        picks[i] = Number(o.getAttribute("data-o"));
        Array.prototype.forEach.call(opts, function(x){ x.classList.remove("pick"); });
        o.classList.add("pick");
      });
    });
  });
  id("submit").addEventListener("click", function(){
    var right = 0;
    Array.prototype.forEach.call(blocks, function(block, i){
      if (block.getAttribute("data-checked") === "1") return;
      var q = qs[i], chosen = picks[i];
      var opts = block.querySelectorAll(".opt");
      Array.prototype.forEach.call(opts, function(o, j){
        o.classList.remove("pick");
        if (j === q.k) o.classList.add("right");
        else if (j === chosen) o.classList.add("wrong");
      });
      var why = block.querySelector(".why");
      why.hidden = false;
      why.innerHTML = "<b>" + (chosen === q.k ? "Right." : (chosen == null ? "No answer." : "Not quite.")) + "</b> " + esc(q.w);
      block.setAttribute("data-checked","1");
      if (chosen === q.k) right++;
    });
    done(right, qs.length);
  });
}

/* ---------- the way back, and the way out ---------- */

function back(){
  if (view.cert) return go({ cert:null, track:view.cert });
  if (view.day != null) return go({ day:null });
  if (view.test) return go({ test:null });
  if (view.exam) return go({ exam:false });
  if (view.track) return go({ track:null });
  window.location.href = "/app";
}

id("back").addEventListener("click", back);
id("certlink").addEventListener("click", function(){
  if (view.track && !view.cert) go({ cert:view.track, track:null, day:null, test:null, exam:false });
});

/* ---------- the deep link ---------- */
// A link from the Herb Library or the Trainer back into a lesson lands here:
// #herbalist, #fitness, #herbalist/12, or ?track=herbalist&day=12. The hash is
// the shape the app uses elsewhere, and the query is the shape a shared link
// travels in. Both are read once at boot; anything unrecognised leaves the home
// screen as it was.
function parseDeepLink(){
  var hash = "", search = "";
  try { hash = String((window.location && window.location.hash) || ""); } catch(e){}
  try { search = String((window.location && window.location.search) || ""); } catch(e){}
  var tid = "", day = 0;
  var m = hash.replace(/^#/, "").match(/^([a-z]+)(?:\/(\d+))?$/i);
  if (m){ tid = m[1]; if (m[2]) day = Number(m[2]); }
  if (!tid && search){
    search.replace(/^\?/, "").split("&").forEach(function(kv){
      var p = kv.split("=");
      if (p[0] === "track") tid = decodeURIComponent(p[1] || "");
      if (p[0] === "day") day = Number(decodeURIComponent(p[1] || ""));
    });
  }
  return { track: tid, day: day };
}
function bootLink(){
  var dl = parseDeepLink();
  if (!dl.track || !track(dl.track)) return false;
  if (dl.day >= 1 && dl.day <= TOTAL){
    go({ track:dl.track, day:dl.day, test:null, exam:false, cert:null });
  } else {
    go({ track:dl.track, day:null, test:null, exam:false, cert:null });
  }
  return true;
}

state = load();
render();
bootLink();

/* The page's own surface, so a check can drive it the way a thumb does. */
window.CERTIFY = {
  TRACKS: TRACKS, state: state,
  days: function(id){ return track(id).days; },
  blocks: BLOCKS, PASS_TEST: PASS_TEST, PASS_DAY: PASS_DAY, TOTAL: TOTAL,
  PASS_DAY_HERB: PASS_DAY_HERB, passMark: passMark, passOk: passOk,
  render: render, go: go, save: save,
  certStatus: certStatus, certFilename: certFilename,
  drawCert: drawCert, exportCert: exportCert, reload: reloadPage,
  GO_DEEPER: GO_DEEPER, deeperFor: deeperFor, libLabel: libLabel, plantSlug: plantSlug,
  dropStaleDays: dropStaleDays,
  herbBridge: herbBridge, herbBridgeLine: herbBridgeLine,
  sayLesson: sayLesson, sayText: sayText, sayStop: sayStop, speechOK: speechOK,
  parseDeepLink: parseDeepLink, bootLink: bootLink
};
})();
</script>
