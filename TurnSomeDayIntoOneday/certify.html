    {q:"Is training to failure part of the by-10?",a:["No, it is avoided","Yes - the short rest is what takes each set there","Only on cardio days","Only for beginners"],k:1,w:"Which is why the load moves last and the movement moves first."}]},

{d:41,t:"Regression and modification",s:"The same pattern, made possible",
 p:["A regression is not a lesser programme; it is the same pattern at a level a person can actually do well. Every move in the by-10 has one, and the ability to reach for it is most of what separates a trainer from a list of exercises.","The regressions to know: a squat to a chair, a hinge with no weight, a push-up against a wall or on a bench, a row with a lighter dumbbell and a shorter range, a pull-up as a hanging hold, a plank on the knees, a lunge holding a wall. Each keeps the pattern and removes the difficulty.","The rule about how to offer one matters more than the list. A regression is given as an option, not an announcement, and never as a comment on the person's ability. The words are: here is the same movement with less load on that joint - and then the trainer demonstrates it."],
 q:[{q:"What is a regression?",a:["A lesser programme","The same pattern at a level the person can do well","A rest","A warm-up"],k:1,w:"Every move in the by-10 has one."},
    {q:"Which is a regression for the push-up?",a:["A deeper push-up","A push-up on a bench","A heavier push-up","A jumping push-up"],k:1,w:"With a wall push-up as the easier step again."},
    {q:"How is a regression offered?",a:["As an announcement about the person","As an option, with a demonstration","As a punishment","It is not offered"],k:1,w:"Never as a comment on the person's ability."}]},

{d:42,t:"The cardio day",s:"Where the by-10 steps aside",
 p:["On a cardio day the by-10 mostly steps aside. Its ten seconds exists to keep a list of resistance moves moving, and steady work on minutes does not need it. The rotation names its own cardio - Plyometrics, Kenpo X, Yoga X, and X Stretch in the recovery weeks - and any of them can be replaced or mixed: jump rope, a step session, walking, dancing, or two of them in the same week. What matters is that the session happens and keeps the heart rate up; which one it is matters much less.","Plyometrics is the exception, because it is a list of explosive moves rather than a continuous session: it takes the by-10's shape, a set of each move with ten seconds between them. The continuous sessions are run on minutes, with a bell marking each change.","The training point is that the cardio options are genuine alternatives and not a ladder. A person who does not want to jump should not be jumping; the adaptation does not care which session it came from, and the one still being done in six months is the one that works."],
 q:[{q:"Which cardio session takes the by-10's shape?",a:["Kenpo X","Plyometrics","Yoga X","X Stretch"],k:1,w:"A list of explosive moves is what the short rests suit."},
    {q:"How are the continuous cardio sessions paced?",a:["By the by-10 rotation","On minutes, with a bell for each change","By reps","By sets"],k:1,w:"The ten seconds exists to keep a list of moves moving, and steady work does not need it."},
    {q:"How are the options related?",a:["As a ladder","As genuine alternatives","By difficulty","They are not"],k:1,w:"The adaptation does not care which session it came from."}]},

{d:43,t:"Plyometrics",s:"The one cardio with a fixed shape",
 p:["Plyometrics is the session that takes the by-10's shape: a set of each move, ten seconds, then the next one - which is what a list of explosive moves suits. Its moves are the jump squat, the run squat lunge, the squat reach jump, the airborne heisman, the swing kick, the jump knee tuck, the mary katherine lunge, the leapfrog squat, the twist combo, the rock star hop, the gap jump, the squat jacks, the hot foot and the slalom jump.","Two things make it safe. Landing mechanics - land soft, hips back, knees tracking, and never on a locked leg - and a volume a beginning client can absorb. Plyometrics is the fastest way to a tendon problem in a home programme and the fastest way to a cardio adaptation when it is dosed honestly.","The design line: plyo borrows the shape of the by-10 because jumping is a skill that improves with repeatable, short, high-quality efforts. It is not the place to add sets until somebody is tired."],
 q:[{q:"How many moves are in a plyo rotation?",a:["Four","Eight","Ten","One"],k:0,w:"Three for twenty seconds, the last for thirty seconds to a minute."},
    {q:"What makes plyometrics safe?",a:["Speed","Landing mechanics and honest volume","Music","Rest length"],k:1,w:"Land soft, hips back, knees tracking, never on a locked leg."},
    {q:"Why does plyo borrow the by-10 shape?",a:["It looks tidy","Jumping is a skill that improves with short, repeatable, high-quality efforts","It is easier","It is required"],k:1,w:"It is not the place to add rounds until somebody is tired."}]},

{d:44,t:"Kickboxing",s:"A bell a move",
 p:["Kickboxing is run on minutes with a bell for each move: the jab and cross, the hook and uppercut, the ball kick, the step drag kick, the knee kick, the back kick, the side kick, the high block, the downward block, the three-kick combo, the elbow series and the vertical punches.","Its coaching is about hands and landings: hands up between strikes, every strike landed soft rather than through the air at speed, and the knees and the hips turning rather than the arms alone. Kicks off a planted foot are the commonest way a beginning client tweaks a knee.","The training value is that it is a continuous activity with intervals built into the moves rather than the timer. That is also why it does not need the by-10 cycle: the bell marks the change, and the effort is sustained through it."],
 q:[{q:"How is kickboxing paced?",a:["By the by-10 rotation","By minutes, with a bell for each move","By rounds","By reps"],k:1,w:"It is a continuous activity rather than a rotation."},
    {q:"What is the commonest way to tweak a knee?",a:["Punching","Kicks off a planted foot","Blocking","Warming up"],k:1,w:"Knees and hips turn rather than the arms alone."},
    {q:"What is the coaching line for strikes?",a:["Hit hard through the air","Land every strike soft, hands up","Hold the breath","Go as fast as possible"],k:1,w:"Hands up between strikes, and knees and hips turning."}]},

{d:45,t:"Sweat step",s:"The step at a low impact",
 p:["Sweat step is the low-impact option among the five: basic step, v-step, knee lift, kick step, hamstring curl, l-step, repeater knee, over the top, stomp and side tap, one bell a minute, and the same lead leg swapped at each block.","Its value is that it is genuinely accessible. It can be done by a person who cannot jump, cannot run, and cannot yet hold a squat, and it still keeps a heart rate up for twenty to forty minutes. In a group, it is also the easiest of the five to teach, because every move has a name and a direction.","The coaching details are small and they matter: a step height low enough to keep the knees happy, a lead leg that changes, and a landing that is flat rather than toe-first. Stomping a step for twenty minutes is how a home stepper finds a shin problem."],
 q:[{q:"What is sweat step?",a:["The high-impact option","The low-impact option among the five","A lifting day","A stretch"],k:1,w:"It still keeps a heart rate up for twenty to forty minutes."},
    {q:"Which detail matters for the knees?",a:["A step low enough, and a lead leg that changes","Music volume","Rope length","Shoes only"],k:0,w:"And a landing that is flat rather than toe-first."},
    {q:"Why is it the easiest of the five to teach a group?",a:["It is hardest","Every move has a name and a direction","It needs no space","It is shortest"],k:1,w:"Which also makes it the easiest for a room to follow."}]},

{d:46,t:"Jump rope",s:"The cheapest and the least forgiving",
 p:["Jump rope is one bell a minute and a list of ten moves: the basic bounce, alternating foot, high knees, boxer skip, side swing, criss-cross, running in place, speed step, heel taps and the double under. The rope is the cheapest piece of cardio equipment there is and the one that most punishes a poor landing.","The coaching: jump only an inch or two, land on the balls of the feet with the knees soft, keep the elbows close and turn the rope from the wrists rather than the shoulders, and stop when the calves tell you to. A home client's calves and shins are the cost of rope work done too fast too soon.","The progression rule for the rope is time rather than tricks. A client who can skip for ten minutes has done more than one who can do a double under and nothing else, and the double under is a skill to add later rather than a benchmark to chase."],
 q:[{q:"How is the rope paced?",a:["By rounds","One bell a minute","By the by-10 rotation","By reps"],k:1,w:"With ten moves in the list."},
    {q:"Where does the rope turn from?",a:["The shoulders","The wrists","The elbows only","The hips"],k:1,w:"With the elbows close to the body."},
    {q:"What is the rope's progression rule?",a:["Tricks before time","Time rather than tricks","Double unders first","Speed only"],k:1,w:"Ten minutes of skipping beats one double under and nothing else."}]},

{d:47,t:"Dancing",s:"The one that gets done",
 p:["Dancing is the fifth choice and it is run the same way: one bell a minute and a list - the two-step, step touch, grapevine, body roll, hip sway, arm sweep, side slide, drop and recover, free style and a cool-down sway.","Its training honesty is that the intensity depends entirely on the person. A free-style minute is whatever the person makes it, so the talk test rather than the clock is the way to keep it in the working range. That is not a weakness; it is the reason it is the one people keep doing.","The coaching is about the feet and the floor. Keep the feet moving, keep the landings soft, keep the arms big enough to be worth doing, and let the last two minutes be the cool-down sway rather than a stop. A dancing session should end as a session, not as a halt."],
 q:[{q:"How is dancing paced?",a:["By reps","One bell a minute","By rounds","By the by-10 rotation"],k:1,w:"With ten moves in the list, from the two-step to the cool-down sway."},
    {q:"How is its intensity kept in range?",a:["By the clock","By the talk test","By the music","It cannot be"],k:1,w:"A free-style minute is whatever the person makes it."},
    {q:"How should a dancing session end?",a:["As a halt","As a session, with the cool-down sway","With a sprint","With the by-10"],k:1,w:"The last two minutes are the cool-down rather than a stop."}]},

{d:48,t:"The stretch day",s:"The session the by-10 leaves alone",
 p:["The rotation's stretch session is X Stretch, and the by-10 adds nothing to it: there is no set and no ten seconds, because nothing is being worked to a set. It is a run of movements held for about half a minute each, with no load - a chest opener, cat-cow, child's pose, downward dog, a hip flexor stretch, a figure-4 glute stretch, a seated hamstring stretch, a quad stretch, a calf stretch, thread the needle, a supine twist and neck and shoulder rolls.","The rules of the day are the opposite of the lifting days. Hold each one, breathe out into it, and take no rush at all, which is why there is no timer on it. It is a session in the programme rather than a rest from it, and it is the day most often skipped. It is also where a beginner starts: the first week of the by-10 is this day, every day, before a dumbbell is picked up - a week of stretching that gets the body used to moving and keeps it from getting hurt.","The coaching points: a stretch is held to tension rather than to pain, the breath keeps moving, and the range is entered slowly and left slowly. Thirty seconds matters because the first ten are the body deciding whether to allow it at all."],
 q:[{q:"What pace does the stretch session run at?",a:["Ten seconds a move","Held, with the breath, and no rest timer","By reps","By sets"],k:1,w:"There is no set and no ten seconds, because nothing is worked to a set."},
    {q:"How is a stretch held?",a:["To pain","To tension, with the breath moving","For one second","Bouncing"],k:1,w:"Entered slowly and left slowly."},
    {q:"Why does thirty seconds matter?",a:["It is a round number","The first ten are the body deciding whether to allow it","It is the law","It is not"],k:1,w:"Which is why the day is held rather than rushed."}]},

{d:49,t:"Mobility and flexibility",s:"Range as a skill",
 p:["Flexibility is the length a muscle can reach; mobility is the ability to use a range under control, which is the one that matters for training. A person can be flexible and unable to hold a squat, and the difference is strength at the end of the range.","So the by-10's stretch day is only half of the work and the other half is the lifting days, which take the joints through their ranges under load. A hip that is stiff in a squat is often better served by a deeper, slower squat than by an extra stretch.","The static stretching rule to keep: long static holds before a heavy session can slightly reduce the power available for it, so the stretch day is its own day and the warm-up is dynamic rather than held. At the end of a session, static holds are fine."],
 q:[{q:"What is mobility?",a:["How far a muscle reaches","The ability to use a range under control","A stretch","A rest"],k:1,w:"A person can be flexible and still unable to hold a squat."},
    {q:"What is often better for a stiff hip in a squat?",a:["An extra stretch","A deeper, slower squat","A longer rest","A massage"],k:1,w:"The lifting days take the joints through range under load."},
    {q:"Why is the stretch day its own day?",a:["Habit","Long static holds before a heavy session can reduce the power available for it","It is easier","It is shorter"],k:1,w:"The warm-up is dynamic rather than held."}]},

{d:50,t:"Cardio intensity: talk test and effort",s:"Two rulers that need no equipment",
 p:["The talk test is the simplest intensity tool there is. Full sentences means an easy effort; short phrases means a moderate one; single words or nothing means hard. For the by-10's cardio days the target is the middle one: breathing deep and rhythmic, able to say a short sentence but not to hold a conversation.","The rating of perceived exertion, the training data version of the same thing, is a scale from six to twenty or from one to ten, and the by-10's cardio sits at a five or six out of ten. It is subjective on purpose, because the person's own sense of effort is a better guide than a formula for somebody who has never been assessed.","What the two rulers are for: they stop a client going too hard on the easy days, which is the commonest mistake in a home programme, and they give a trainer a target that works identically in a living room and in a class of thirty."],
 q:[{q:"What does the talk test use?",a:["A heart-rate monitor","Whether full sentences, short phrases or single words are possible","A stopwatch","Nothing"],k:1,w:"The by-10's target is short phrases: deep but able to speak briefly."},
    {q:"Where does the by-10's cardio sit on a ten-point effort scale?",a:["One","Five or six","Nine","Ten"],k:1,w:"Moderate rather than hard."},
    {q:"What is the commonest mistake in a home programme?",a:["Going too easy on the easy days","Going too hard on the easy days","Skipping warm-ups","Too much sleep"],k:1,w:"The two rulers stop a client going too hard on the days that should be moderate."}]},

{d:51,t:"Heart-rate zones",s:"The number, and its limits",
 p:["The standard estimate of a maximum heart rate is 220 minus age, and the zones are percentages of it: roughly fifty to sixty percent for an easy effort, sixty to seventy for the by-10's cardio, and seventy to eighty-five for hard intervals. A zone is a guide rather than a measurement, because the estimate has a wide spread between people of the same age.","That spread is why a trainer uses the talk test alongside it. A person whose true maximum is twenty beats higher than the estimate will be walking while the monitor says they are working, and one whose true maximum is lower will be working hard while the monitor disagrees.","For a client on a medicine that lowers the heart rate - a beta blocker, for instance - the zone method is not usable at all, and effort is the only ruler left. That is one of the practical reasons the perceived-effort scale is taught before the formula."],
 q:[{q:"What is the standard maximum heart-rate estimate?",a:["Age minus 220","220 minus age","180 minus age","There is none"],k:1,w:"A guide rather than a measurement, with a wide spread between people."},
    {q:"Where does the by-10's cardio sit?",a:["Fifty to sixty percent","Sixty to seventy percent of the estimate","Eighty-five percent","Maximal"],k:1,w:"Easy work sits lower, hard intervals higher."},
    {q:"Why is the zone method unusable on a beta blocker?",a:["It is too accurate","The medicine lowers the heart rate, so effort is the only ruler left","It costs money","It is not"],k:1,w:"Which is why the effort scale is taught first."}]},

{d:52,t:"Recovery, sleep and the deload",s:"Where the progress actually happens",
 p:["A body adapts between sessions rather than during them, so recovery is part of the programme and not a break from it. The three levers are sleep, food and the lighter week, and of the three sleep is the largest and the least often asked about.","A deload is a planned lighter period, and the by-10 leaves the timing to the person. The rotation puts a recovery week at weeks 4, 8 and 13, and the by-10 does not require them: one path goes straight into the next rotation, the other takes a full week of cardio and a little stretching, and which one it is depends on the day and the mood. Both are training rather than time off. The signs that a lighter week is due: a session that keeps feeling harder, a resting heart rate that has crept up, a sleep that has worsened, and a mood that has gone flat about training.","The rule that makes it real: recovery is prescribed rather than earned. A client who lifts the same weights six days a week for a year has not trained more than one who deloaded; they have just spent the adaptation they earned."],
 q:[{q:"When does a body adapt?",a:["During a session","Between sessions","During a warm-up","It does not"],k:1,w:"Which is why recovery is part of the programme."},
    {q:"What is the largest recovery lever?",a:["Sleep","Mobility work","Cold water","Stretching"],k:0,w:"And the least often asked about."},
    {q:"Which is a sign a deload is due?",a:["Sessions feeling easier","A resting heart rate that has crept up","Better sleep","A good mood"],k:1,w:"Along with sessions that keep feeling harder and a flat mood about training."}]},

{d:53,t:"Plateaus",s:"When the numbers stop moving",
 p:["A plateau is a period in which progress stops, and the honest first question is whether the plan is still being followed rather than whether the plan has stopped working. Adherence is the commonest cause and the least popular answer.","If the plan is being followed, the levers are these: change one variable rather than four, check sleep and food, check the recovery, and check the movements are actually being loaded rather than merely performed. Often a plateau is the person having outgrown the easy version of a pattern without moving to the harder one.","The last honest possibility is that the goal has been reached or has changed. A client who has got what they came for and is now training to keep it does not have a plateau; they have a different objective, and saying so plainly is a service rather than a disappointment."],
 q:[{q:"What is the first question about a plateau?",a:["Is the weight too light","Is the plan still being followed","Is the food right","Is the programme broken"],k:1,w:"Adherence is the commonest cause and the least popular answer."},
    {q:"How many variables change at once?",a:["Four","One","All of them","None"],k:1,w:"Otherwise nothing can be attributed."},
    {q:"What is the last honest possibility?",a:["The client is lazy","The goal has been reached or has changed","The kit is wrong","The plan is broken"],k:1,w:"That is a different objective rather than a plateau."}]},

{d:54,t:"Special populations: older adults",s:"The fastest-growing group and the most rewarding",
 p:["An older client is trained with the same six patterns and the same overload rule, with three changes: the warm-up is longer, the recovery is longer, and the balance work is added on purpose rather than left out. Falling is the injury that matters most and strength is the best insurance against it.","The by-10 suits this group well, because the kit is light and the rest is short and the session can be cut to two sets. The movements are chosen for what a person can do: a chair for the squat, a hinge with no load, a push-up against a wall, a step instead of a jump.","The screening is the part that matters. A clearance from a doctor where there are risk factors, a check of the medicines for anything that affects balance, and a first session that is deliberately easy. An older client who is trained gently for three months is one who is still training; one who is pushed in the first week is often neither."],
 q:[{q:"What three things change for an older client?",a:["Longer warm-up, longer recovery, and balance work on purpose","Nothing","Heavier loads","No rest"],k:0,w:"Falling is the injury that matters most."},
    {q:"How does the by-10 suit the group?",a:["It does not","Light kit, short rest, and a session that can be cut to two sets","It needs a gym","It needs machines"],k:1,w:"Movements chosen for what the person can do."},
    {q:"What is checked about the medicines?",a:["The price","Anything that affects balance","The colour","Nothing"],k:1,w:"And a first session that is deliberately easy."}]},

{d:55,t:"Youth and teens",s:"Where a trainer is most careful",
 p:["A young client is trained for the same reasons as anybody else and with two extra rules: technique before load, always, and a clearance question whenever they are an athlete already training elsewhere. Growth changes a body's proportions, and a growing body also has growth plates at the ends of its long bones, which are more vulnerable to repeated heavy loading than an adult's are.","So the by-10's movement progression is the whole programme for a young client: a push-up before a deep push-up, a light dumbbell before a heavy one, and volume added slowly and honestly. Bodyweight work is the mainstay and loaded work is a garnish rather than the meal.","The other half is the conversation. The words a trainer uses about a young person's body are remembered for a long time, and the standard is the same as it is for anybody: measure the training and not the person, and never make a young client's worth the subject of a session."],
 q:[{q:"What two extra rules apply to a young client?",a:["Technique before load, and a clearance question for an athlete","Speed before form","Load first","No rules"],k:0,w:"Growth plates are more vulnerable to repeated heavy loading than an adult's are."},
    {q:"What is the mainstay of a young client's programme?",a:["Heavy dumbbells","Bodyweight work","Machines","Cardio only"],k:1,w:"Loaded work is a garnish rather than the meal."},
    {q:"What is never the subject of a session?",a:["The training","A young client's worth","The technique","The plan"],k:1,w:"Measure the training and not the person."}]},

{d:56,t:"Pregnancy and postpartum",s:"Where the trainer's ground ends",
 p:["Pregnancy is the clearest example in this whole course of ground that belongs to somebody else. A pregnant client trains only with her own clinician's agreement, the programme is written around that answer, and the trainer's job is to hold the plan inside it rather than to have a view of their own.","Where training continues, the standard is movement, comfort and breathing rather than progress. The by-10 can be adapted with an easier squat, no jumping, no lying flat on the back after the first trimester, and a session that stops at any of the warning signs - bleeding, fluid loss, pain, dizziness, a headache that will not go, or a reduced movement from the baby.","Postpartum follows the same rule, with the addition of the pelvic floor and the abdominal wall and a clinician's say on when training resumes. A trainer who reads the research, asks the clinician and keeps the plan modest is doing the whole job; a trainer who improvises is the reason this day exists."],
 q:[{q:"Whose agreement does a pregnant client train with?",a:["The trainer's","Her own clinician's","Nobody's","A coach's"],k:1,w:"The trainer holds the plan inside that answer rather than having a view."},
    {q:"What is the standard for a continuing programme?",a:["Progress","Movement, comfort and breathing","Heavier loads","Speed"],k:1,w:"Along with an easier squat and no jumping."},
    {q:"Which is a warning sign to stop?",a:["Feeling warm","Bleeding or fluid loss","Sweating","Fast breathing"],k:1,w:"Along with pain, dizziness, a headache that will not go, or reduced movement from the baby."}]},

{d:57,t:"Chronic conditions and limits",s:"Train with the answer, not around it",
 p:["A client with a chronic condition - heart disease, diabetes, high blood pressure, asthma, arthritis - is trained with the clinician's answer in hand rather than around the subject. Where the answer allows training, the programme is remarkably ordinary: the six patterns, moderate effort, a strong emphasis on consistency.","What changes is the monitoring. A diabetic client's blood sugar before and after a session, an asthmatic's inhaler to hand and a warm-up long enough to matter, a hypertensive client's effort kept at a talking level, an arthritic client's range worked a little more each week. Each condition has its counterpart in the programme.","The trainer's rule is the scope rule again: the condition is the clinician's, the exercise is the trainer's, and the two meet in the plan. A trainer who cannot say which decisions are theirs is a trainer who will make somebody else's by accident."],
 q:[{q:"How is a client with a chronic condition trained?",a:["Around the condition","With the clinician's answer in hand","Not at all","With maximal effort"],k:1,w:"The programme is ordinary where the answer allows training."},
    {q:"What changes?",a:["The patterns","The monitoring","The kit","Nothing"],k:1,w:"Blood sugar, inhaler, effort level and range, condition by condition."},
    {q:"Who holds the condition, and who holds the exercise?",a:["Both are the trainer's","The clinician and the trainer, meeting in the plan","Both are the clinician's","Nobody"],k:1,w:"A trainer who cannot say which decisions are theirs will make somebody else's by accident."}]},

{d:58,t:"When to stop: red flags",s:"The list that is never pushed through",
 p:["These stop a session and start a conversation with a doctor, every time and without exception: chest pain or pressure, including a pain spreading to the arm, the jaw or the back; a breathlessness out of proportion to the work; dizziness, faintness or a grey colour; a sudden severe headache; a heartbeat that is racing, irregular or pounding; a cold sweat; a sudden weakness or numbness on one side; a loss of speech or vision.","Then the ones that stop the movement rather than the session: a joint that gives way, a pain that is sharp rather than a muscle working, a cramp that will not release, a numbness or tingling down a limb, and any sharp pain in the back.","The habit to build is saying the sentence out loud rather than thinking it. A trainer who has said I am stopping this and why has done the whole job; one who thought it and carried on has done nothing, whatever happened afterwards."],
 q:[{q:"Which stops a session every time?",a:["Soreness","Chest pain or pressure","Sweating","Fast breathing during a set"],k:1,w:"Along with a disproportionate breathlessness, faintness, a cold sweat, and one-sided weakness."},
    {q:"Which stops the movement rather than the session?",a:["A sharp pain in a joint","Feeling warm","Being tired","A good effort"],k:0,w:"Along with a joint that gives way, and numbness or tingling down a limb."},
    {q:"What is the habit to build?",a:["Thinking it quietly","Saying the sentence out loud","Pushing through","Waiting for the end of the set"],k:1,w:"One who thought it and carried on has done nothing."}]},

{d:59,t:"Coaching a client through the by-10",s:"Putting the whole block together",
 p:["A by-10 session coached end to end looks like this: a two-minute check-in on sleep and how the last session felt, five minutes of warm-up with the day's first move rehearsed light, the day's list through its sets with the ten seconds kept and one cue given at a time, a minute or two of cooling down, and two sentences of feedback - what improved and what the next session is for.","The coaching art is the one cue at a time rule. A trainer who says four things during a set has said nothing; a trainer who names the one thing that will change the load has coached. The rest of the cues wait for the next move, which is exactly why the by-10's format suits coaching.","And the feedback is written down. A client's plan and their progress live in a log, and the log is what makes the sixth week different from the first rather than the first week six times."],
 q:[{q:"What opens a coached session?",a:["A warm-up","A two-minute check-in on sleep and how the last session felt","The heaviest set","A weigh-in"],k:1,w:"Then five minutes of warm-up with the day's first move rehearsed light."},
    {q:"How many cues at a time?",a:["Four","One","As many as possible","None"],k:1,w:"The rest wait for the next rotation, which is why the format suits coaching."},
    {q:"What makes the sixth week different from the first?",a:["The music","The log","The kit","Nothing"],k:1,w:"Otherwise it is the first week six times."}]},

{d:60,t:"Stage Two, and the ground covered",s:"The block behind you",
 p:["Sixty days in, the ground you stand on is: the by-10's rule in full, FITT-VP, volume and intensity, periodisation, a P90X resistance day, the cardio and stretch sessions, intensity measures, recovery and deloading, plateaus, and the special populations from older age to pregnancy and chronic conditions.","What is left of the ninety is the room and the profession: group fitness in full - class design, cueing, choreography, music, multi-level teaching, monitoring - then emergency response, ethics, agreements, privacy, money, the law on claims, insurance, and the continuing education that keeps any of it current.","Take the block test before going on. It draws one question from every day of this block, and the days it points back to are the days worth rereading."],
 q:[{q:"How many days are behind you at this point?",a:["Thirty","Sixty","Ninety","Ten"],k:1,w:"And thirty remain."},
    {q:"What is left of the ninety?",a:["The same ground again","The room and the profession","Nothing","Only the test"],k:1,w:"Group fitness in full, then emergency response, ethics, money, the law and CEUs."},
    {q:"What does the block test draw on?",a:["One question from every day of the block","Random days","The last day only","Nothing"],k:0,w:"The days it points back to are the days worth rereading."}]},
{d:61,t:"Group fitness: the difference",s:"One plan and thirty people",
 p:["A group instructor's problem is that there is one plan and thirty people, and both of those are fixed. The programme cannot be rewritten for each person, so the class is designed to hold everybody at once and every movement carries a way up and a way down.","The published frameworks say the same thing. The AFAA group fitness course is organised into professionalism, the fundamentals of exercise science, class design and planning, and class instruction and presentation. The ACSM group exercise credential describes the role as safely teaching, leading and motivating participants through classes designed on purpose.","So the difference is not the exercise science, which is shared with the personal trainer's, it is the delivery. A group instructor is a teacher first, and the plan is written for the room rather than for the person in front of them."],
 q:[{q:"What is fixed in a group class?",a:["Both the plan and the people","There is one plan and thirty people","The music only","Nothing"],k:1,w:"So the class is designed to hold everybody at once."},
    {q:"Which is the group-fitness credential here?",a:["NASM-CPT","AFAA-CGFI","ISSA-CPT","NSCA-CPT"],k:1,w:"With the ACSM group exercise credential beside it."},
    {q:"What is the difference from a personal trainer's work?",a:["The science","The delivery","The kit","Nothing"],k:1,w:"A group instructor is a teacher first."}]},

{d:62,t:"Class design",s:"The shape of an hour",
 p:["A class is designed rather than improvised, and it has a shape: a welcome and an explanation, a warm-up that raises the heart rate and rehearses the movements, a main block that does the work, a cool-down that brings the heart rate and the breathing down, and a close that says what the class was for.","Within the main block the design rules are the same ones the by-10 uses: work that alternates the muscle groups rather than repeating them, intensity that rises and falls rather than climbing forever, and a finish that ends on a high point rather than on a collapse. The class should be able to be followed by somebody new and still be worth attending by somebody who has come for a year.","The three questions a designer answers before the class: what is this hour for, how will it feel at the halfway point, and what will the movement options be for the person who cannot do the hardest version. An hour that cannot answer the third is an hour that will hurt somebody."],
 q:[{q:"What is a class's shape?",a:["Welcome, warm-up, main block, cool-down, close","Warm-up and go","Main block only","No shape"],k:0,w:"And it is designed rather than improvised."},
    {q:"How should intensity move?",a:["Climbing forever","Rising and falling","Flat","Random"],k:1,w:"And the class finishes on a high point rather than a collapse."},
    {q:"Which question is the one that prevents injury?",a:["What is the hour for","What will the options be for the person who cannot do the hardest version","How will it feel halfway","The price"],k:1,w:"An hour that cannot answer the third will hurt somebody."}]},

{d:63,t:"Cueing and demonstration",s:"How a room follows",
 p:["A cue is an instruction given while moving, and the craft is to make it understandable in the second it takes to hear. Verbal cues name the movement and the body part; visual cues show it, mirrored when the class is facing you; and directional cues say where to go next before the class needs to know.","The three rules that make cueing work: cue before the change rather than during it, name one thing at a time, and demonstrate from an angle the room can actually see. An instructor who turns their back to demonstrate a foot position has taught nobody.","Then the awkward half that is the difference between a good class and a lost one: spotting. The instructor watches for the person who has stopped, the person who is doing something else entirely, and the person who is quietly going hard enough to hurt themselves, and each of those gets a cue that fits the room rather than a call-out."],
 q:[{q:"When is a cue given?",a:["During the change","Before the change","After the change","Never"],k:1,w:"So the room knows what is coming before it needs to."},
    {q:"Which is a directional cue?",a:["Naming a body part","Saying where to go next","Showing the movement","Stopping"],k:1,w:"Verbal names the movement, visual shows it, directional says where to go."},
    {q:"What does the instructor watch for?",a:["Only the front row","The person who has stopped, the one doing something else, and the one going too hard","Nothing","The clock"],k:1,w:"Each gets a cue that fits the room rather than a call-out."}]},

{d:64,t:"Choreography and transitions",s:"The moves and the join between them",
 p:["Choreography is a planned sequence of movements, and its purpose is to make a class followable and repeatable. The building blocks are simple by design - a step touch, a knee lift, a grapevine, a squat, a press - and a class is taught from a small vocabulary rather than a large one.","Transitions are where a class is won or lost. The rule is that the change is cued early, the movement is taught before it is sped up, and the class is not left doing something for the first time at full speed. A move is introduced at half-time, then at full-time, then it is part of the sequence.","The other rule is about repetition: a class repeats what it learns, class to class, so that the vocabulary becomes familiar and the intensity can rise rather than the complexity. Novelty is a spice, not the meal."],
 q:[{q:"What is choreography for?",a:["Making a class followable and repeatable","Showing off","Filling time","Nothing"],k:0,w:"A class is taught from a small vocabulary rather than a large one."},
    {q:"How is a new move introduced?",a:["At full speed","At half-time, then full-time, then into the sequence","After the class","It is not"],k:1,w:"The class is not left doing something for the first time at full speed."},
    {q:"What should rise as the class becomes familiar?",a:["Complexity","Intensity","Novelty","Length"],k:1,w:"Novelty is a spice, not the meal."}]},

{d:65,t:"Music and tempo",s:"The clock the room moves to",
 p:["Music is a timing device as much as a mood. Its tempo is counted in beats per minute, and the working range for a class runs roughly from a warm-up tempo in the low nineties up to about a hundred and sixty for the fastest cardio, with most of the main block in the hundred-and-twenty to hundred-and-forty band.","The practical use is that a movement has a natural tempo and the music should fit it. A squat at a walking pace is a different exercise from a squat at a running pace, and a class moving faster than the music is a class moving out of control.","The other rules: the volume low enough that a cue can be heard, the language appropriate to the room, and the music chosen before the class and checked for anything the room should not have to hear. The instructor's voice is the primary instrument and the music is the second."],
 q:[{q:"How is tempo counted?",a:["Bars per minute","Beats per minute","Seconds per move","It is not"],k:1,w:"Roughly from the low nineties to about a hundred and sixty."},
    {q:"Why should the music fit the movement?",a:["It looks better","A squat at a walking pace is a different exercise from one at a running pace","It is the law","It does not"],k:1,w:"A class moving faster than the music is a class out of control."},
    {q:"What is the primary instrument?",a:["The music","The instructor's voice","The whistle","The drums"],k:1,w:"The volume is kept low enough that a cue can be heard."}]},

{d:66,t:"Multi-level teaching",s:"One movement, three difficulties",
 p:["Multi-level teaching is the core skill of the room and the one that makes a class serve everybody. Every movement is offered at three levels at the same time: a lower one that stays accessible, the main one, and a higher one for the people who want it. All three are demonstrated, and none is described as hard or easy.","The by-10's own regressions are exactly these options: a squat to a chair, a push-up on a wall, a step instead of a jump, a lighter dumbbell. The language matters as much as the options, and the rule is the same one this course has kept - an option is offered rather than assigned.","The skill is that the three levels are given while the movement is happening, in a cue the whole room receives. Low impact option, hands on the hips, and the class keeps moving while the person who needs it takes it."],
 q:[{q:"How many levels are offered at once?",a:["One","Three","Ten","As many as people"],k:1,w:"A lower, a main, and a higher one, all demonstrated."},
    {q:"How is an option given?",a:["Assigned to one person","Cued to the whole room","Written down","After class"],k:1,w:"Low impact option, and the class keeps moving."},
    {q:"What is the rule about the language?",a:["Call the hard version hard","Do not describe the levels as hard or easy","Name weak versions","Say nothing"],k:1,w:"An option is offered rather than assigned."}]},

{d:67,t:"Room and equipment setup",s:"The five minutes before the door",
 p:["A class's safety begins before anybody arrives. The floor clear of anything to trip over, the space each person will occupy marked out in the mind, the equipment counted and laid out where it can be reached without crossing the room, the ventilation and the water available, and a route to the door kept open.","The equipment setup sets the class up to flow. In a by-10 style strength class the dumbbells are laid in pairs where people will stand, the mats are laid in a grid rather than a crowd, and the front of the room is left clear for demonstration. Ten minutes of setup buys an hour that runs itself.","The last check is the environment: the temperature, the music level, and anything a person might not want to be seen near. A room set up on purpose tells a class that somebody has thought about them, which is the cheapest retention tool there is."],
 q:[{q:"When does a class's safety begin?",a:["At the warm-up","Before anybody arrives","At the hardest movement","After the class"],k:1,w:"The floor, the space, the equipment, the air, the water and the route to the door."},
    {q:"Where are dumbbells laid?",a:["In a pile at the back","In pairs where people will stand","Outside","Nowhere"],k:1,w:"So the class flows rather than queues."},
    {q:"What is called the cheapest retention tool?",a:["A discount","A room set up on purpose","A music playlist","A big class"],k:1,w:"It tells a class that somebody has thought about them."}]},

{d:68,t:"Monitoring the room",s:"Teaching and watching at once",
 p:["An instructor teaches and watches at the same time, and the watching has three targets: faces, which show effort and distress better than anything else; movement, where a form breaking down is the cue to offer an option; and the edges of the room, where the person who is struggling usually is.","The signs to act on: a face going grey or flushed unevenly, a person who has stopped moving while the room continues, somebody holding a position that looks wrong, and the one who is clearly working beyond the class. Each gets a cue or a quiet word rather than a public correction.","The rule about the hard moments: the class goes on. One person's difficulty is handled with a cue and a movement, not by stopping thirty people, unless what is happening is an emergency - and then it is an emergency and the class stops."],
 q:[{q:"What are the three watching targets?",a:["Faces, movement, and the edges of the room","The clock, the music and the door","Shoes, water and mats","Nothing"],k:0,w:"The person who is struggling is usually at the edge."},
    {q:"How is a correction given?",a:["Publicly","As a cue or a quiet word","By stopping the class","It is not"],k:1,w:"And an option is offered rather than an assignment."},
    {q:"When does the class stop?",a:["Whenever somebody struggles","Only in an emergency","Every fifteen minutes","Never"],k:1,w:"Otherwise the class goes on."}]},

{d:69,t:"Managing a large class",s:"Ten, thirty and a hundred",
 p:["Class management is the same job at every size and harder at each one. Ten people can be taught almost individually; thirty needs a grid, a front, and cues that carry; a hundred needs a microphone, a plan that works in rows, and the acceptance that the instructor's own demonstration is now for a screen rather than a room.","The constants are the ones the earlier days built: a plan designed for the room, three levels on every movement, cues given before the change, and a route to walk so the instructor is not fixed at the front. Movement around the room is what turns a broadcast into a class.","The one thing that scales badly is the correction, and the answer is the same at every size. A public correction is not given; an option cued to the room is. That single rule keeps a hundred people working and no one embarrassed."],
 q:[{q:"What does a hundred-person class need?",a:["Nothing special","A microphone and a plan that works in rows","More equipment","A bigger room only"],k:1,w:"And the acceptance that the demonstration is for a screen rather than a room."},
    {q:"What is a constant at every size?",a:["The music","Cues given before the change, and a route to walk","The equipment","The price"],k:1,w:"Movement around the room is what turns a broadcast into a class."},
    {q:"What scales badly?",a:["The warm-up","The correction","The music","The cool-down"],k:1,w:"An option cued to the room keeps a hundred people working."}]},

{d:70,t:"Motivation and adherence",s:"The only intervention that works",
 p:["The programme that works is the programme that is still being followed, and in a group the largest single factor is the instructor. A class that is welcoming, predictable and slightly enjoyable is followed; a class that is punishing is attended for a month and then talked about in the past tense.","The tools are unglamorous and they work: names, a greeting, a comment on progress rather than on appearance, a plan that is explained so people know what the hour is for, and a finish that sends people out feeling better than they came in rather than wrecked.","The last tool is the calendar. A class at a stated time on a stated day, every week, is a habit the room can build a week around; a class that moves is a class people drop. Consistency of time is teaching, and it is the easiest thing to get right."],
 q:[{q:"What is the largest single factor in a group?",a:["The music","The instructor","The equipment","The room"],k:1,w:"A welcoming, predictable class is followed; a punishing one is talked about in the past tense."},
    {q:"What is commented on?",a:["Appearance","Progress","Weight","Nothing"],k:1,w:"Along with names, a greeting, and an explained plan."},
    {q:"What is called the easiest thing to get right?",a:["Consistency of time","Music choice","Equipment","Price"],k:0,w:"A class at a stated time on a stated day is a habit the room can build a week around."}]},

{d:71,t:"Behaviour change",s:"Why knowing is not doing",
 p:["A trainer's real subject is behaviour, because everybody already knows that moving is good for them. The useful model is short: a person changes when the reason is theirs, the change is small enough to actually do, the cue to do it is attached to something already in their day, and the reward arrives soon enough to matter.","The trainer's tools follow from that. Ask what the person wants rather than telling them what they should want. Make the first plan small enough that it cannot fail. Attach the session to an existing habit - after the school run, before the shower. And make the progress visible, because a client who can see a number change keeps going.","The failure modes are equally short: a plan made for the trainer's idea of a good client, a goal set in somebody else's numbers, a programme that requires a life the person does not have, and a lapse treated as a failure rather than as a Tuesday. The last one is the most common and the most easily fixed."],
 q:[{q:"When does a person change?",a:["When told to","When the reason is theirs, the change is small, the cue is attached to the day, and the reward is soon","When it is hard","Never"],k:1,w:"Knowing is not doing."},
    {q:"How small should the first plan be?",a:["As big as possible","Small enough that it cannot fail","Irrelevant","It does not matter"],k:1,w:"And progress should be visible."},
    {q:"How is a lapse treated?",a:["As a failure","As a Tuesday","As a reason to stop","As a warning"],k:1,w:"The commonest failure mode and the most easily fixed."}]},

{d:72,t:"Teaching the by-10 in a group",s:"The method, in a room",
 p:["The by-10 is a good class format because its structure is already legible: a list of movements, ten seconds between each, and two to five sets. Taught to a room, the sets are announced, the ten seconds is counted aloud, and the list is written up where people can see the next movement coming.","The adaptations are few and they matter. The weights differ across the room, so the load is chosen by each person with guidance rather than prescribed. The room's pace is set by the instructor's counting rather than by the person who finishes first. And three options for each movement are offered, exactly as on any other class.","What the format gives a room is a session that ends on time, progresses by sets rather than by guesswork, and can be joined at any level. What it asks of the instructor is the counting, which is the whole job and is harder than it sounds."],
 q:[{q:"What is announced in a group by-10?",a:["Nothing","The sets, with the ten seconds counted aloud","Only the music","The price"],k:1,w:"And the list is written up where people can see the next movement."},
    {q:"What sets the room's pace?",a:["The fastest person","The instructor's counting","The music only","The clock"],k:1,w:"Rather than the person who finishes first."},
    {q:"What is the instructor's whole job in the format?",a:["The counting","Choosing the music","Setting the price","Nothing"],k:0,w:"Which is harder than it sounds."}]},

{d:73,t:"Group cardio: plyo and kickboxing",s:"The two that teach best in a room",
 p:["Of the cardio sessions, Plyometrics and Kenpo X teach best to a group, and for opposite reasons. Plyo is short, explosive and counted, so a room can be paced by the beat and stopped before form fails. Kickboxing is continuous and named, so a room can be led through moves by call and response.","Plyo in a group has one extra rule: the room's landing quality is watched, and the class comes down a level rather than pushing through. A room of thirty landing badly is thirty chances at a knee, and the low-impact option is cued early rather than late.","Kickboxing in a group has one extra rule too: the strikes are controlled rather than fast, because a room full of people throwing loose kicks at speed is a room full of people kicking the person next to them. Space is marked out before the class and the combinations are kept simple enough to be safe in it."],
 q:[{q:"Why does plyo teach well in a room?",a:["It is long","It is short, explosive and counted","It needs no space","It is easy"],k:1,w:"So a room can be paced by the beat and stopped before form fails."},
    {q:"What is plyo's extra rule in a group?",a:["Push through","Watch landing quality and come down a level rather than pushing on","Go faster","Remove the beat"],k:1,w:"Thirty bad landings are thirty chances at a knee."},
    {q:"What is kickboxing's extra rule?",a:["Strike as fast as possible","Strikes are controlled, and space is marked out","No rule","Kick hard"],k:1,w:"Loose kicks at speed are kicks at the person next to you."}]},

{d:74,t:"Group strength with minimal kit",s:"Dumbbells and a floor",
 p:["A group strength class with the by-10's kit is a room of people with a pair of dumbbells each and a mat, and the design question is how to keep thirty of them moving without a queue. The answer is a grid rather than a crowd, a list of movements that each pair can do in place, and a rule that equipment goes back where it came from.","The movements that work in a room are the by-10's own: goblet squats, floor presses, rows, Romanian deadlifts, presses, lunges, planks. The movements that do not are the ones that need a bench, a rack, or more space than a person's own square - and a class that includes them turns into a queue, which is where a class loses its intensity and its charm.","The load problem is the real one. One class has one range of dumbbells and thirty different strengths, so the design leans on the movement options rather than the weights: a deep push-up for the strong, a wall push-up for the new, the same list for everybody. That is the by-10's logic applied to a room."],
 q:[{q:"What is the answer to a queue?",a:["A bigger room","A grid rather than a crowd, and movements done in place","More equipment","Fewer people"],k:1,w:"And equipment goes back where it came from."},
    {q:"Which movements do not work in a class?",a:["Goblet squats","Ones that need a bench, a rack, or extra space","Rows","Planks"],k:1,w:"They turn a class into a queue."},
    {q:"What carries the load differences?",a:["The weights","The movement options","The music","The pace"],k:1,w:"One class has one range of dumbbells and thirty different strengths."}]},

{d:75,t:"Injury prevention in groups",s:"The risks a room adds",
 p:["A room adds risks a one-to-one session does not: the person who pushes past their own limit to keep up, the person who copies the person next to them rather than the instructor, the space that shrinks as the class moves, and the equipment that ends up under a foot.","The preventions are design decisions rather than warnings: cue the options early rather than late, keep the movements within a square each person owns, keep the pace set by the instructor, teach the landing before the jumping, and make the warm-up long enough to matter. A warning shouted mid-class is worse than useless; a design that never needs one is the answer.","The trainer's own standard is part of this. An instructor who turns up cold and demonstrates at full speed has taught the class that a warm-up is optional, and the room will do as the instructor does."],
 q:[{q:"Which risk is new in a room?",a:["Chest pain","Pushing past a limit to keep up with the class","Sweating","Fast breathing"],k:1,w:"Along with copying a neighbour rather than the instructor, and shrinking space."},
    {q:"What are the preventions?",a:["Warnings shouted mid-class","Design decisions - options cued early, space kept, pace set by the instructor","Nothing","Longer classes"],k:1,w:"A warning was needed because the design did not do its job."},
    {q:"What does an instructor who skips the warm-up teach?",a:["Rigour","That a warm-up is optional","Nothing","That the class is hard"],k:1,w:"The room will do as the instructor does."}]},

{d:76,t:"Emergency response and CPR/AED",s:"The certification requirement nobody escapes",
 p:["Every certification in this field requires a current adult CPR and AED certificate, and it is the one requirement that is not negotiable: NASM requires it and renews with CEUs including a CPR element, ACE requires a hands-on skills check, ACSM requires it to qualify and to renew, AFAA requires it and renews every two years with it, and NETA requires a live hands-on CPR assessment.","In a class, the response has a shape. Recognise - the person who has collapsed, the person who is not breathing normally, the person with chest pain. Call - the emergency number and the AED, by name and out loud. Act - the CPR or the AED, and the class stopped and moved aside rather than continuing around them.","The trainer's particular duty is to have rehearsed it. A plan that has never been practiced is a hope, and the place to practice it is a quiet room rather than the middle of a class. This is the day of the course where an hour of study buys something that no other hour does."],
 q:[{q:"Which is required by every certification here?",a:["A degree","A current adult CPR and AED certificate","Insurance only","A gym membership"],k:1,w:"It is the one requirement that is not negotiable."},
    {q:"What is the shape of the response?",a:["Recognise, call, act","Wait, watch, discuss","Continue the class","Ask the room"],k:0,w:"With the class stopped and moved aside rather than continuing around them."},
    {q:"Why does the plan have to be rehearsed?",a:["For the certificate","A plan never practiced is a hope","It is a legal requirement","It is not"],k:1,w:"The place to practice is a quiet room, not the middle of a class."}]},

{d:77,t:"Ethics and professionalism",s:"The reputation of the whole field",
 p:["A trainer's ethics are mostly about what is said and where a relationship ends. The scope rule from the first days is the core of it: no diagnosis, no treatment, no medical advice, and a referral whenever the question is not exercise. The rest is honesty about what is being sold and what it will do.","Then the boundary between trainer and client, which is where a field gets its reputation. A trainer does not sell a client a supplement as a treatment, does not use a client's body as a marketing image without consent, does not promise a result a plan cannot guarantee, and does not take a client's dependence as a business model.","The standard to hold is the one this whole course has kept: say what is true, say what is not known, and say who else should be involved. It is short, it is unglamorous, and it is what a client remembers in ten years."],
 q:[{q:"What is the core of a trainer's ethics?",a:["The scope rule - no diagnosis, no treatment, referral","Charging more","Winning","No rule"],k:0,w:"And honesty about what is sold and what it will do."},
    {q:"Which is a boundary a trainer keeps?",a:["Selling a supplement as a treatment","Not taking a client's dependence as a business model","Using a client's image without consent","Promising any result"],k:1,w:"Along with no promises of results and no sale of supplements as treatment."},
    {q:"What is the standard?",a:["Say what is true, say what is unknown, and say who else is involved","Say as little as possible","Say what sells","Say nothing"],k:0,w:"Short, unglamorous, and remembered in ten years."}]},

{d:78,t:"Client agreements and consent",s:"The paperwork that does a job",
 p:["Informed consent is the client knowing what is being suggested, what the risks are, what the alternatives are, and that they may stop at any time - and it is given before the training starts and renewed when the plan changes in a way that matters.",
"A written agreement beside it holds the practical facts: the scope, the price, the cancellation terms, what the trainer will keep and where, and the understanding that training carries a risk of injury even when it is done well. The agreement is not a shield; it is a shared statement of what is being done.",
"For the trainer's protection and the client's, the paperwork is done properly once rather than rushed once. A signed scope statement and a screening form are what make the rest of the relationship frank."],
 q:[{q:"What is informed consent?",a:["A signature","Knowing what is suggested, the risks, the alternatives, and the freedom to stop","A price list","A waiver"],k:1,w:"Given before training starts and renewed when the plan changes."},
    {q:"What does a written agreement hold?",a:["The scope, the price, the terms, what is kept and where, and the risk of injury","Only the price","Only the scope","Nothing"],k:0,w:"It is not a shield; it is a shared statement of what is being done."},
    {q:"How is the paperwork done?",a:["Rushed","Properly once","Never","Twice a week"],k:1,w:"It is what makes the rest of the relationship frank."}]},

{d:79,t:"Privacy and records",s:"What is kept, and what is never said",
 p:["A trainer holds some of the most personal information a person gives anybody: their body, their health, their injuries, their goals and their reasons. The rule is the same as the herbalist's: it goes nowhere, it is stored securely, and it is used for the plan and nothing else.","The record itself is short and useful: the screening, the assessment, the plan, the sessions and any incident. It is kept because it is what makes the sixth week different from the first, and it is kept carefully because a client's information is theirs.","The trainer's particular trap is the photograph and the story. A before-and-after is a client's decision and not a trainer's, and a good result told as an anecdote with enough detail to identify somebody is a privacy breach with a friendly face."],
 q:[{q:"Where does a client's information go?",a:["Into marketing","Nowhere - it is used for the plan and nothing else","To other clients","Online"],k:1,w:"Stored securely, as the herbalist's case is."},
    {q:"What does the record hold?",a:["Screening, assessment, plan, sessions and any incident","Only the price","Only the name","Nothing"],k:0,w:"It is what makes the sixth week different from the first."},
    {q:"Whose decision is a before-and-after?",a:["The trainer's","The client's","The gym's","Nobody's"],k:1,w:"And an anecdote detailed enough to identify somebody is a privacy breach with a friendly face."}]},

{d:80,t:"Business: pricing and packaging",s:"Making the work sustainable",
 p:["A training business is priced from the cost of the hour rather than from a competitor's rate, and the cost of the hour includes the planning, the writing, the travel and the time between sessions as well as the session itself. A price that ignores the planning punishes the trainer for doing it well.","Packaging is the second decision. A block of sessions sold together, a stated cancellation window, a price for a group class different from a one-to-one, and a way for a client to pay that does not involve a conversation every time. The packaging exists so that the relationship is about training rather than about money.","The last part is the boundary on the week: a stated number of sessions, a stated day off, and a stated stopping time. A trainer with no boundary on the week is a trainer who will be unavailable in a year, which serves nobody."],
 q:[{q:"What is a price set from?",a:["A competitor","The cost of the hour, including planning, writing and travel","The market","A feeling"],k:1,w:"A price that ignores the planning punishes good practice."},
    {q:"What does packaging exist for?",a:["To confuse","So the relationship is about training rather than about money","To raise prices","Nothing"],k:1,w:"Blocks, a cancellation window, and different prices for group and one-to-one."},
    {q:"What boundary is on the week?",a:["A stated number of sessions, a day off and a stopping time","None","Only a price","Only a location"],k:0,w:"A trainer with no boundary will be unavailable in a year, which serves nobody."}]},

{d:81,t:"Marketing honestly",s:"What may be said and shown",
 p:["Honest marketing in this field is narrower than most of what is on the internet. What may be said: what the service is, what it involves, who it suits, what it costs, and what people have said about it with their permission. What may not be said: a guaranteed result, a cure, a medical claim, or a body used without consent.","The shapes to avoid are the same ones the herbalist day named: cure, treat, reverse, and anybody else's credential used as yours. A trainer who does not hold a NASM credential does not imply one, and a certificate of completion is described as exactly that.","The line that keeps it clean is the evidence line. Before-and-afters are shown with consent and without a promise that the same will happen for anybody else, and a testimonial is quoted as it was given rather than rewritten. That is a floor, and a surprising amount of the field stands below it."],
 q:[{q:"What may be said in honest marketing?",a:["A guaranteed result","What the service is, what it involves, who it suits, what it costs","A cure","A medical claim"],k:1,w:"And what people have said about it with their permission."},
    {q:"Which is one of the shapes to avoid?",a:["Support","Treat or reverse","Assessment","Referral"],k:1,w:"Along with anybody else's credential used as yours."},
    {q:"What is the evidence line?",a:["Before-and-afters shown with consent and without a promise","Promising everyone the same result","Rewriting a testimonial","No line"],k:0,w:"A surprising amount of the field stands below that floor."}]},

{d:82,t:"The law: what you may claim",s:"The boundary, in writing",
 p:["The legal ground under a training business is consumer protection: what is advertised has to be true, and a claim about what a service or a person can do has to be one that can be stood behind. That is the same floor the herbalist certificate page had to be careful about, and it applies to a fitness page exactly as it does to a supplement.","The two rules that catch the commonest mistakes: a credential is described as the credential it is, and nothing implies a licence or an accreditation that has not been granted. No US state licenses a personal trainer in the sense a state licenses a doctor, so a page that says licensed can only mean a business licence, and saying so is the honest version.","The everyday version of all this is short. Say what you do, say what you hold, say what it costs, and let the client decide. It is the same standard as the herbalist's, which is not a coincidence: both are people in a helping trade with no medical licence, and both live or die by what they claim."],
 q:[{q:"What is the legal floor under a training business?",a:["Insurance","Consumer protection - what is advertised has to be true","A licence","Nothing"],k:1,w:"A claim about what a service can do has to be one you can stand behind."},
    {q:"What has to be described exactly?",a:["The price","A credential, as the credential it is","The gym","The music"],k:1,w:"And nothing may imply a licence or accreditation not granted."},
    {q:"What is the everyday version?",a:["Say what you do, what you hold and what it costs, and let the client decide","Say as little as possible","Say whatever sells","Say nothing"],k:0,w:"The same standard as the herbalist's, and not by coincidence."}]},

{d:83,t:"Insurance",s:"The part that is boring and necessary",
 p:["Professional liability insurance is the floor of a training practice and every credentialing body expects it. It covers a claim made against a trainer for injury or advice given in the course of the work, and it does not cover what the trainer was never allowed to do in the first place - which is why insurance and scope are read together.","The details that matter: the policy covers the actual work being done - group classes as well as one-to-one, and the location it is done in, including a client's house or a park; the cover is current; and the certificate is kept where it can be shown.","The trainer's version of the herbalist's risk day: no certificate and no amount of study makes a practice risk-free, and the honest response is not to pretend otherwise but to keep the plan, the record and the referral honest, and to be insured for the rest."],
 q:[{q:"What does professional liability insurance cover?",a:["Everything","A claim for injury or advice given in the course of the work","Nothing","Only equipment"],k:1,w:"And not what the trainer was never allowed to do, which is why insurance and scope are read together."},
    {q:"Which detail matters?",a:["The cover matches the actual work - group and one-to-one, wherever it happens","The colour of the certificate","The price only","Nothing"],k:0,w:"Including a client's house or a park."},
    {q:"What is the honest response to risk?",a:["Pretend it is zero","Keep the plan, the record and the referral honest, and be insured for the rest","Stop training","Ignore it"],k:1,w:"No amount of study makes a practice risk-free."}]},

{d:84,t:"Continuing education and CEUs",s:"Keeping the credential",
 p:["Every certification in this field is kept by continuing education rather than by the original exam. The numbers differ - NASM renews every two years with 2.0 CEUs including a CPR element, ACE with twenty hours, ACSM every three years with forty-five CECs, AFAA every two years with 1.5 CEUs, NETA every two years with twenty CECs including six from NETA, ISSA with twenty credits - but the shape is the same for all of them.","A current adult CPR and AED certificate runs alongside the CEUs for every one of them, and a lapsed CPR lapses the credential. The renewal also usually carries a fee.","The practical reading is that the certificate earned on this page is not one of those credentials, and this course says so in its own text. What it is, is study - and the habit of continuing study is the thing the field actually asks for, whichever credential somebody eventually holds."],
 q:[{q:"How is a credential kept?",a:["By the original exam","By continuing education, plus a current CPR and AED certificate","By paying once","It is not"],k:1,w:"The numbers differ between bodies; the shape is the same."},
    {q:"What happens if CPR lapses?",a:["Nothing","The credential lapses with it","It is fine","It is a fee only"],k:1,w:"A current adult CPR and AED certificate runs alongside the CEUs for every body named here."},
    {q:"What is this course's certificate?",a:["A credential","Study, and not one of those credentials","A licence","An accreditation"],k:1,w:"The habit of continuing study is what the field actually asks for."}]},

{d:85,t:"Recertification and the certificate",s:"The honest description",
 p:["A certificate of completion records that a student finished the requirements of a particular programme, and its weight is the weight of that programme. By itself it establishes no state licence and none of the industry credentials, and the honest certificate says exactly what it is: this record of study, from this programme, on this date.","For this field the credentials are NASM, ACE, ACSM, NSCA, ISSA, AFAA and NETA, each with its own exam, its own pass standard and its own renewal cycle, and each requiring a current adult CPR and AED certificate. Where a person wants one of those, the pathway is that body's own candidate handbook and nothing else.","So the certificate on this page is a plain record of ninety days of study - each lesson, each quiz, both block tests and the ultimate examination - and it says so on its face. Anything more would be the false claim the ethics day warned about."],
 q:[{q:"What does a certificate of completion record?",a:["A licence","That a student finished a particular programme's requirements","A credential","A degree"],k:1,w:"Its weight is the weight of that programme."},
    {q:"Which of these is a real credential in this field?",a:["NASM","AHG RH","The certificate on this page","A diploma"],k:0,w:"With ACE, ACSM, NSCA, ISSA, AFAA and NETA beside it."},
    {q:"What does the certificate on this page record?",a:["Ninety days of study: each lesson, each quiz, both block tests and the ultimate examination","A licence","A credential","Nothing"],k:0,w:"And it says so on its face."}]},

{d:86,t:"Building a referral network",s:"The people around a practice",
 p:["A trainer's network is shorter than a herbalist's and just as necessary: a doctor, a physiotherapist, a dietitian, a massage or manual therapist, and one or two trainers whose judgement can be borrowed when a case is outside the usual.","The network is built by giving rather than asking. A trainer who refers a client to a physiotherapist with a clear note about what was seen gets a note back the next time, and that exchange is worth more than any amount of networking.","The last member of the network is the emergency one: a named person to call, the venue's address written down in a place a client can find it, and the emergency number known without looking it up. That is the network that matters most and is prepared for least."],
 q:[{q:"Who is on a trainer's network?",a:["A doctor, a physiotherapist, a dietitian, a manual therapist","A shop, a sign, a van","Only other trainers","Nobody"],k:0,w:"Shorter than a herbalist's and just as necessary."},
    {q:"How is a network built?",a:["By asking","By giving - a clear note that gets a note back","By advertising","By luck"],k:1,w:"That exchange is worth more than any amount of networking."},
    {q:"Which member matters most and is prepared for least?",a:["The emergency one","The dietitian","The physiotherapist","The doctor"],k:0,w:"A named person to call, the address written down, the emergency number known without looking it up."}]},

{d:87,t:"Writing a ninety-day plan",s:"The whole course, applied",
 p:["A ninety-day plan for a client is written in three blocks of four weeks, and it answers FITT-VP on its face. Block one builds the patterns and the habit at two sets. Block two raises the sets and the movement difficulty. Block three raises the load and, if the person is ready, takes the sets to five. The lighter week between the blocks is optional: the by-10 goes straight on when the person feels good, and takes a week of cardio and stretching when they do not.","The plan includes the things beside the sessions: the warm-up, the stretch day, the cardio choices the person actually likes, the food and sleep notes that belong on any programme, and the review dates - at four weeks, eight weeks and twelve - where the assessment is repeated exactly as it was at the start.","And the plan includes its own stop conditions: what would end it, what would make it change, and who to talk to when something is outside the trainer's ground. A plan that cannot say when it stops is a plan that cannot be judged, which is the same sentence the herbalist's protocol day ended on."],
 q:[{q:"How is a ninety-day plan shaped?",a:["One block","Three blocks of four weeks with a lighter week between","Ninety sessions in a row","No structure"],k:1,w:"And it answers FITT-VP on its face."},
    {q:"What is repeated at the review dates?",a:["The assessment, exactly as it was at the start","The warm-up","The fee","The music"],k:0,w:"At four, eight and twelve weeks."},
    {q:"What does the plan include beside the sessions?",a:["Nothing","Warm-up, stretch day, cardio choices, food and sleep notes, review dates and stop conditions","Only the price","Only the lifting"],k:1,w:"A plan that cannot say when it stops cannot be judged."}]},

{d:88,t:"Designing a sample week",s:"Every day, as long as it rotates",
 p:["A week out of the rotation, with the by-10's rule sitting on the resistance days: Chest & Back, Plyometrics, Shoulders & Arms, Yoga X, Legs & Back, Kenpo X, then a rest day. The movement lists are P90X's, and the rule is two to five sets of each list, every set inside the twenty-rep cap, ten seconds between moves. P90X's own week is six days on and one off; the by-10 can run every day, so the seventh day is somewhere to put the second, cardio session rather than a day the method demands.","Written for a beginner at week one: a week of stretching first, on its own, before any of this; then two sets of each move with the reps inside the cap rather than at it, steady cardio on minutes, and the stretch session as its own day. Written for the same client at week twelve: four or five sets, still inside the cap, and the harder movement in each pattern rather than a longer session.","The design detail that makes it a programme rather than a list: each day's movements are ordered so that one is not the continuation of the last, the cardio alternates rather than repeats - and can be jump rope, a step session, walking or dancing as easily as Plyometrics or Kenpo X - and the rest day sits where it does so that the hardest day is not the day after the hardest day."],
 q:[{q:"How often can the by-10 run?",a:["Three days a week","Every day, as long as the workout rotates","Only with a rest week","Once a week"],k:1,w:"P90X's own week is six on and one off; the method is not bound to the day off."},
    {q:"What changes from week one to week twelve?",a:["Nothing","The sets, and the harder movement inside each pattern","Only the music","Only the kit"],k:1,w:"Within the same two to five, and a beginner's first week is stretching."},
    {q:"What makes it a programme rather than a list?",a:["The price","The ordering - no move continues the last, cardio rotates, rest lands where it should","The kit","The music"],k:1,w:"So the hardest day is not the day after the hardest day."}]},

{d:89,t:"The last week: consolidation",s:"Reading it back",
 p:["The last week is for reading back rather than learning new material, and the log is the place to do it: the clients, the sessions, the plan changes, the days the course pointed back to.","The things worth being able to say without looking: the six patterns and their home movements; FITT-VP; the by-10's rule and its two limits - two to five sets, twenty reps at most; which cardio sessions take the rule and which do not; the special populations and their rules; and the red flags that stop a session. Where any of them is thin, that is today's reading rather than tomorrow's.","Then the practice of coaching a session aloud, from the check-in to the feedback, on a day you think you know. It is the best check of a course of study, because coaching is exactly the ability to say the one thing that changes the load."],
 q:[{q:"What is the last week for?",a:["New material","Reading back over what has been written down","Rest","Nothing"],k:1,w:"The log is the place to do it."},
    {q:"Which should be sayable without looking?",a:["The six patterns, FITT-VP, the by-10's rule and its limits, the special populations and the red flags","Prices only","Only the kit","Nothing"],k:0,w:"Where any is thin, that is today's reading."},
    {q:"What is the best check of the course?",a:["A test score","Coaching a session aloud from the check-in to the feedback","A price list","A log count"],k:1,w:"Coaching is the ability to say the one thing that changes the load."}]},

{d:90,t:"The last day",s:"The ninety days, and after them",
 p:["The whole by-10 is yours now - the method, and the P90X exercises it is put to - and the accreditation ground around it. What is left is the habit, and it is the same sentence the herbalist track ended on: read before you prescribe, coach one thing at a time, and say plainly what you do not know.","For the trainer that means a screening before a plan, a baseline before progress, a scope statement before the first coat, and a referral whenever the question stops being about exercise. The six patterns, the ten seconds, and the plate and the sleep underneath them are the practice.","The examination is next and it is the last one here. After it, the certificate is a plain record of the work: ninety lessons, the quiz after each, two block tests and the ultimate examination. Nothing more, and nothing less."],
 q:[{q:"What is the trainer's version of read before you prescribe?",a:["Screening before a plan, a baseline before progress","Load first","No plan","Skip the warm-up"],k:0,w:"And a scope statement before the first session."},
    {q:"What are the practice, on this page?",a:["The six patterns, the ten seconds, the plate and the sleep","The kit","The price","The music"],k:0,w:"With a referral whenever the question stops being about exercise."},
    {q:"What does the certificate record?",a:["A credential","Ninety lessons, the quiz after each, two block tests and the ultimate examination","A licence","A degree"],k:1,w:"Nothing more, and nothing less."}]}
];
