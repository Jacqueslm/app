<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Fight</title>
<meta name="theme-color" content="#070a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070a14'/%3E%3Crect x='14' y='26' width='36' height='14' rx='3' fill='%23f2a93b'/%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#070a14;color:#eef1ff;font-family:'Barlow','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
body.g2-fighting{overflow:hidden}
   bottom. Classes are g2-* so nothing here collides with the rest of the app. */
#s-tower{background:#000;min-height:calc(100vh - 132px);padding:0 0 30px;color:#eef1ff}
.g2{--g2-ink:#070a14;--g2-edge:#2a3350;--g2-lamp:#f2a93b;--g2-hit:#e24b4a;--g2-you:#2fd08a;--g2-chalk:#eef1ff;--g2-dim:#a9b1d6;--g2-disp:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  position:relative;min-height:calc(100vh - 132px);max-width:480px;margin:0 auto;background:var(--g2-ink);color:var(--g2-chalk);display:flex;flex-direction:column;overflow:hidden;font-size:16px;line-height:1.4}
.g2 button{font:inherit;color:inherit;cursor:pointer}
/* the 3D fight takes the whole screen so nobody is cut off at the edges */
.g2-bld{margin:6px 0 14px;padding:16px 0 14px;border-top:2px solid var(--g2-lamp);border-bottom:2px solid var(--g2-lamp)}
.g2-bld span{display:block;font-family:var(--g2-disp);font-weight:800;text-transform:uppercase;font-size:2.4rem;line-height:.95;letter-spacing:.01em}
.g2-bld small{display:block;margin-top:6px;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--g2-dim)}
.g2-flrs{display:grid;gap:6px;margin-top:10px}
.g2-flr{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;
  background:rgba(10,13,22,.72);border:1px solid var(--g2-edge);border-radius:4px;padding:11px 12px;color:var(--g2-dim)}
.g2-flr b{font-family:var(--g2-disp);font-size:1.3rem;color:var(--g2-dim)}
.g2-flr span{font-size:.92rem}
.g2-flr i{font-style:normal;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase}
.g2-flr.done{border-color:rgba(47,208,138,.5)}.g2-flr.done b,.g2-flr.done i{color:var(--g2-you)}
.g2-flr.here{border-color:var(--g2-lamp);color:var(--g2-chalk);background:rgba(242,169,59,.12)}
.g2-flr.here b,.g2-flr.here i{color:var(--g2-lamp)}
.g2-flr.roof{margin-bottom:4px}
.g2-flr[disabled]{opacity:.55}
.g2-chute{position:relative;height:120px;margin:4px 0 10px;overflow:hidden}
.g2-chute i{position:absolute;left:50%;top:-40px;width:64px;height:34px;margin-left:-32px;border-radius:64px 64px 0 0;
  background:linear-gradient(180deg,var(--g2-lamp),#c8262a);animation:g2fall 2.6s ease-out forwards}
.g2-chute i::after{content:"";position:absolute;left:50%;top:34px;width:2px;height:34px;margin-left:-1px;background:var(--g2-dim)}
@keyframes g2fall{from{top:-40px;transform:rotate(-6deg)}to{top:56px;transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.g2-chute i{animation:none;top:56px}}
.g2.g2-full{position:fixed;inset:0;width:100%;max-width:none;min-height:0;height:100dvh;margin:0;z-index:60;padding:0}
.g2-full .g2-photo,.g2-full .g2-grain,.g2-full .g2-glove,.g2-full .g2-red,.g2-full .g2-mini,.g2-full .g2-ref,.g2-full .g2-top,.g2-full .g2-floors{display:none}
.g2-full .g2-body{padding:0}
/* the fight takes the whole phone: the tab bar and the guide button would sit on the buttons, so they step aside and a way out goes in the corner */
body.g2-fighting .bnav,body.g2-fighting #guide-fab,body.g2-fighting .hdr{display:none}
body.g2-fighting .screens{overflow:visible;-webkit-overflow-scrolling:auto;padding-bottom:0}
body.g2-fighting .app{overflow:visible}
.g2-exit{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;z-index:70;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(7,10,20,.6);color:#fff;font-size:1rem;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.g2-photo{position:absolute;inset:0;background-size:cover;background-position:center top;background-repeat:no-repeat;transform-origin:50% 60%}
.g2-photo::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,10,20,.15) 0%,rgba(7,10,20,.25) 45%,rgba(7,10,20,.92) 100%)}
.g2-photo.boss{animation:g2sway 3.2s ease-in-out infinite alternate}
@keyframes g2sway{from{transform:translateX(-6px) scale(1.02)}to{transform:translateX(6px) scale(1.04)}}
.g2-photo.boss.tired{animation-duration:5.5s;filter:saturate(.6) brightness(.85)}
.g2-photo.boss.far{animation:none;transform:scale(.9) translateY(-20px);filter:brightness(.6)}
.g2-photo.boss.floor{animation:none;transform:scale(1.1) translateY(160px) rotate(6deg);filter:brightness(.5) blur(1px);transition:transform 1s,filter 1s}
.g2-photo.boss.recoil{animation:g2recoil .38s ease-out}
.g2-photo.boss.recoil.hard{animation:g2recoilhard .45s ease-out}
@keyframes g2recoil{0%{transform:translateX(0)}30%{transform:translateX(34px) rotate(3deg) scale(.97);filter:brightness(1.8) contrast(1.2)}100%{transform:translateX(0);filter:none}}
@keyframes g2recoilhard{0%{transform:translateX(0)}30%{transform:translate(-60px,18px) rotate(-7deg) scale(.92);filter:brightness(2.2) saturate(0)}100%{transform:translateX(0);filter:none}}
.g2-photo.boss.lunge{animation:g2lunge .55s cubic-bezier(.3,.9,.4,1) forwards}
@keyframes g2lunge{0%{transform:scale(1)}55%{transform:scale(1.55) translateY(70px);filter:blur(1px)}100%{transform:scale(1.6) translateY(80px);filter:blur(2px) brightness(.7)}}
.g2-photo.boss.tellL{animation:g2tellL var(--tell,1s) ease-in forwards}.g2-photo.boss.tellR{animation:g2tellR var(--tell,1s) ease-in forwards}
@keyframes g2tellL{0%{transform:translateX(0) rotate(0)}100%{transform:translateX(-70px) rotate(-9deg) scale(1.12);filter:brightness(1.3) drop-shadow(-30px 0 40px rgba(226,75,74,.9))}}
@keyframes g2tellR{0%{transform:translateX(0) rotate(0)}100%{transform:translateX(70px) rotate(9deg) scale(1.12);filter:brightness(1.3) drop-shadow(30px 0 40px rgba(226,75,74,.9))}}
.g2-photo.boss.swingL{animation:g2swingL .22s ease-out forwards}.g2-photo.boss.swingR{animation:g2swingR .22s ease-out forwards}
@keyframes g2swingL{from{transform:translateX(-70px) rotate(-9deg) scale(1.12)}to{transform:translateX(90px) rotate(10deg) scale(1.3)}}
@keyframes g2swingR{from{transform:translateX(70px) rotate(9deg) scale(1.12)}to{transform:translateX(-90px) rotate(-10deg) scale(1.3)}}
.g2.shake{animation:g2shake .4s}
@keyframes g2shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.g2.dodgeL{animation:g2dodgeL .45s ease-out}.g2.dodgeR{animation:g2dodgeR .45s ease-out}
@keyframes g2dodgeL{30%{transform:translateX(-60px) rotate(-4deg)}100%{transform:none}}
@keyframes g2dodgeR{30%{transform:translateX(60px) rotate(4deg)}100%{transform:none}}
.g2-grain{position:absolute;inset:0;pointer-events:none;opacity:.08;background-image:radial-gradient(rgba(255,255,255,.9) .5px,transparent 1px);background-size:5px 5px;mix-blend-mode:overlay}
.g2-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;padding:16px 16px 0}
.g2-kicker{font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--g2-lamp);font-weight:600}
.g2-sub{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--g2-dim);margin-top:3px}
.g2-ups{text-align:right}.g2-ups b{display:block;font-family:var(--g2-disp);font-weight:800;font-size:2rem;line-height:.9}.g2-ups span{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--g2-dim)}
.g2-floors{position:relative;z-index:2;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin:12px 16px 0}
.g2-floors i{display:block;height:4px;background:var(--g2-edge)}.g2-floors i.done{background:var(--g2-lamp)}
.g2-floors i.safe{box-shadow:inset 0 0 0 1px rgba(47,208,138,.7)}.g2-floors i.safe.done{background:var(--g2-you)}
.g2-floors i.here{background:var(--g2-chalk)}.g2-floors i.roof{background:var(--g2-hit);opacity:.5}.g2-floors i.roof.here{opacity:1}
.g2-body{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 16px 72px}
.g2-h1{font-family:var(--g2-disp);font-weight:800;font-size:3rem;line-height:.92;letter-spacing:.01em;text-transform:uppercase;margin:0 0 8px;color:var(--g2-chalk)}
.g2-h1 em{font-style:normal;color:var(--g2-lamp)}
.g2-q{font-family:var(--g2-disp);font-weight:800;font-size:1.9rem;line-height:1.02;margin:0 0 16px}
.g2-lead{margin:0 0 18px;color:var(--g2-dim);font-size:.95rem;max-width:40ch}
.g2-center{text-align:center;margin-left:auto;margin-right:auto}
.g2-voice{background:var(--g2-chalk);color:var(--g2-ink);padding:10px 12px;font-weight:600;font-size:.95rem;line-height:1.3;border-radius:14px 14px 14px 4px;margin:0 0 14px;max-width:88%}
.g2-voice small{display:block;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin-bottom:2px}
.g2-cat{font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--g2-lamp);margin-bottom:8px}
.g2-from{font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--g2-dim);text-align:center;margin-bottom:6px}.g2-from em{font-style:normal;color:var(--g2-lamp)}
.g2-big{background:var(--g2-lamp);color:var(--g2-ink);border:0;font-family:var(--g2-disp);font-weight:800;font-size:1.45rem;letter-spacing:.06em;text-transform:uppercase;padding:15px;border-radius:4px;width:100%}
.g2-big:disabled{opacity:.4}
.g2-ghost{background:rgba(7,10,20,.72);color:var(--g2-chalk);border:1px solid var(--g2-edge);font-family:var(--g2-disp);font-weight:700;font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase;padding:13px;border-radius:4px;width:100%}
.g2-ghost:disabled{opacity:.35}
.g2-opts{display:grid;gap:8px}
.g2-opt{background:rgba(7,10,20,.72);border:1px solid var(--g2-edge);color:var(--g2-chalk);text-align:left;padding:13px 12px;font-weight:600;font-size:.95rem;line-height:1.25;border-radius:4px;min-height:52px;display:flex;gap:10px;align-items:flex-start;width:100%}
.g2-opt b{font-family:var(--g2-disp);font-weight:800;color:var(--g2-lamp);font-size:1.05rem;line-height:1.1}
.g2-opt.pick{border-color:var(--g2-lamp);box-shadow:inset 0 0 0 1px var(--g2-lamp)}
.g2-opt.right{border-color:var(--g2-you);background:rgba(47,208,138,.14)}.g2-opt.wrong{border-color:var(--g2-hit);background:rgba(226,75,74,.14)}
.g2-opt.gone{opacity:.18;pointer-events:none}
.g2-lifelines{display:flex;gap:8px;margin:14px 0 10px}
.g2-ll{flex:1;background:transparent;border:1px solid var(--g2-edge);color:var(--g2-chalk);padding:10px 6px;border-radius:4px;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:3px}
.g2-ll small{font-size:.58rem;color:var(--g2-dim);letter-spacing:.06em;text-transform:none;text-align:center}
.g2-ll:disabled{opacity:.3}.g2-ll.earned{border-color:var(--g2-lamp)}
.g2-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.g2-note{font-size:.66rem;color:var(--g2-dim);margin-top:12px;letter-spacing:.04em}.g2-note em{font-style:normal;color:var(--g2-lamp)}
.g2-reveal{font-family:var(--g2-disp);font-weight:800;font-size:4.2rem;line-height:.9;text-transform:uppercase;text-align:center;margin:0 0 6px}
.g2-reveal.up{color:var(--g2-you)}.g2-reveal.down{color:var(--g2-hit)}
.g2-pick{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap}
.g2-thumb{width:44px;height:64px;border-radius:5px;border:2px solid var(--g2-edge);background-size:cover;background-position:center 20%;padding:0;opacity:.7}
.g2-thumb.on{border-color:var(--g2-lamp);opacity:1;box-shadow:0 0 14px rgba(242,169,59,.5)}
.g2-gl{flex:1;background:transparent;border:1px solid var(--g2-edge);color:var(--g2-dim);padding:8px;border-radius:4px;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase}
.g2-gl.on{border-color:var(--g2-lamp);color:var(--g2-lamp)}
/* the wheel */
.g2-wheelwrap{position:relative;width:min(70vw,290px);margin:0 auto 10px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.6))}
.g2-wheelwrap svg{display:block;width:100%;height:auto;overflow:visible}
.g2-spinner{transform-origin:200px 200px;transition:transform 4s cubic-bezier(.12,.72,.08,1)}
.g2-wlbl{font-family:var(--g2-disp);font-weight:800;font-size:23px;letter-spacing:.5px;text-transform:uppercase;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:5px;text-anchor:middle}
.g2-hubspin{transform-origin:200px 200px;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.g2-hubspin.whirl{animation:g2whirl .28s linear infinite}
@keyframes g2whirl{to{transform:rotate(360deg)}}
.g2-wheelwrap.lit{animation:g2wpulse .9s ease-in-out infinite alternate}
@keyframes g2wpulse{from{filter:drop-shadow(0 18px 30px rgba(0,0,0,.6))}to{filter:drop-shadow(0 18px 30px rgba(0,0,0,.6)) drop-shadow(0 0 26px rgba(242,169,59,.7))}}
.g2-landed{font-family:var(--g2-disp);font-weight:800;font-size:1.7rem;text-transform:uppercase;text-align:center;color:var(--g2-lamp);min-height:1.1em;line-height:1.1;margin-bottom:4px}
.g2-landed small{display:block;font-family:inherit;font-weight:400;font-size:.7rem;letter-spacing:.2em;color:var(--g2-dim)}
/* the one-letter puzzle */
.g2-board{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;margin:6px 0 10px}
.g2-word{display:flex;gap:3px}
.g2-tile{width:24px;height:34px;display:flex;align-items:center;justify-content:center;font-family:var(--g2-disp);font-weight:800;font-size:1.25rem;background:rgba(7,10,20,.72);border:1px solid var(--g2-edge);border-radius:3px;color:var(--g2-chalk);font-style:normal}
.g2-tile.on{background:var(--g2-chalk);color:var(--g2-ink);border-color:var(--g2-chalk)}
.g2-tile.new{animation:g2flip .5s ease}.g2-tile.pun{background:transparent;border-color:transparent;width:12px;color:var(--g2-dim)}
.g2-tile.gap:not(.on){border-color:var(--g2-lamp);box-shadow:0 0 12px rgba(242,169,59,.5);animation:g2gap 1.2s ease-in-out infinite alternate}
@keyframes g2gap{from{background:rgba(7,10,20,.72)}to{background:rgba(242,169,59,.35)}}
@keyframes g2flip{from{transform:rotateX(90deg);background:var(--g2-lamp)}to{transform:rotateX(0)}}
.g2-keys{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0 8px}
.g2-keys button{background:rgba(7,10,20,.72);border:1px solid var(--g2-edge);color:var(--g2-chalk);font-family:var(--g2-disp);font-weight:800;font-size:1.05rem;padding:9px 0;border-radius:3px}
.g2-keys button:disabled{opacity:.18}
.g2-strikes{display:flex;gap:6px;justify-content:center;margin:4px 0 8px}.g2-strikes i{width:12px;height:12px;border-radius:50%;border:1px solid var(--g2-hit);display:block}.g2-strikes i.x{background:var(--g2-hit)}
/* three doors */
.g2-doors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 12px;perspective:900px}
.g2-door{position:relative;height:170px;border:0;background:transparent;padding:0}
.g2-door .leaf{position:absolute;inset:0;border-radius:60px 60px 4px 4px;background:linear-gradient(90deg,#4a2c14,#7a4a22 30%,#5a3418 55%,#8a5426 80%,#3d2410);box-shadow:inset 0 0 0 3px rgba(0,0,0,.5),inset 0 0 40px rgba(0,0,0,.6),0 10px 20px rgba(0,0,0,.6);transform-origin:left center;transition:transform 1.1s cubic-bezier(.6,.05,.3,1);display:flex;align-items:center;justify-content:center;font-family:var(--g2-disp);font-weight:800;font-size:2.4rem;color:rgba(255,220,160,.85);text-shadow:0 2px 6px #000;backface-visibility:hidden}
.g2-door .leaf::after{content:'';position:absolute;right:14px;top:50%;width:9px;height:9px;border-radius:50%;background:#e2b45a;box-shadow:0 0 8px #e2b45a}
.g2-door .inside{position:absolute;inset:0;border-radius:60px 60px 4px 4px;background:rgba(7,10,20,.85);border:1px solid var(--g2-edge);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 8px;text-align:center;font-size:.72rem;line-height:1.3;color:var(--g2-chalk);overflow:hidden}
.g2-door .inside b{display:block;font-family:var(--g2-disp);font-size:1.15rem;line-height:1.05;margin-bottom:4px}
.g2-door.heal .inside{box-shadow:inset 0 0 40px rgba(47,208,138,.35);border-color:var(--g2-you)}.g2-door.heal .inside b{color:var(--g2-you)}
.g2-door.boss .inside{box-shadow:inset 0 0 40px rgba(226,75,74,.45);border-color:var(--g2-hit)}.g2-door.boss .inside b{color:var(--g2-hit)}
.g2-door.open .leaf{transform:rotateY(-108deg)}
.g2-door.mine .leaf{box-shadow:inset 0 0 0 3px var(--g2-lamp),inset 0 0 40px rgba(0,0,0,.6),0 0 24px rgba(242,169,59,.6)}
.g2-door.dim{opacity:.35}
.g2-deal{background:rgba(226,75,74,.12);border:1px solid var(--g2-hit);border-radius:4px;padding:12px;margin:0 0 10px}
.g2-deal small{display:block;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--g2-hit);margin-bottom:4px}
.g2-deal b{font-family:var(--g2-disp);font-size:1.3rem;line-height:1.1;display:block}
.g2-breath{width:110px;height:110px;border-radius:50%;margin:8px auto;border:2px solid var(--g2-you);display:flex;align-items:center;justify-content:center;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--g2-you);animation:g2breathe 8s ease-in-out infinite}
@keyframes g2breathe{0%,100%{transform:scale(.7);box-shadow:0 0 0 rgba(47,208,138,0)}50%{transform:scale(1.1);box-shadow:0 0 40px rgba(47,208,138,.5)}}
/* the roof */
.g2-strength{text-align:center;margin:6px 0 4px}.g2-strength b{display:block;font-family:var(--g2-disp);font-weight:800;font-size:3.4rem;line-height:1;color:var(--g2-lamp)}.g2-strength span{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--g2-dim)}
.g2-strrows{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:8px 0 14px;font-size:.8rem;color:var(--g2-dim)}
.g2-strrows div{display:flex;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--g2-edge);padding:3px 0}.g2-strrows b{color:var(--g2-chalk)}.g2-strrows small{flex-basis:100%;font-size:.62rem;color:var(--g2-lamp)}
.g2-locked{background:rgba(226,75,74,.12);border:1px solid var(--g2-hit);border-radius:4px;padding:12px;margin:0 0 10px;font-size:.95rem}
.g2-fhud{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--g2-dim);margin-bottom:10px}
.g2-fhud .right{text-align:right}.g2-fhud .rd{font-family:var(--g2-disp);font-weight:800;font-size:1.1rem;color:var(--g2-chalk)}
.g2-bar{height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;margin-top:4px}.g2-bar i{display:block;height:100%;width:100%;background:var(--g2-hit);transition:width .35s}.g2-bar.you i{background:var(--g2-you)}
.g2-counters{display:grid;gap:8px}.g2-counters .g2-ghost{text-align:left;text-transform:none;letter-spacing:0;font-family:inherit;font-weight:600;font-size:1rem;padding:13px 12px}

// fight is ok but the questions on all levels are wack." Game shows, no clock,

//   - A building is a level: five floors, then the roof. Then the next
//     building. It never ends, because nobody is ever finished (house rule).
//   - Every floor starts with the wheel. It lands on one of three shows:
//       Who Wants to Recover  - a moment, three moves, one is yours (no clock)
//       Wheel of Your Addictions - a word or line of this person's own, from
//                               their journal or their lessons, one letter gone
//       Time to Heal          - three doors, two heal, one is the boss; before
//                               the door opens the boss offers a deal. There is
//                               never anything behind the deal.
//     Floors score Ups. Lose a floor and you drop to the last safe floor
//     (4 or 8) for reinforcements. Ups are never taken away.
//   - The roof is the boss: the thing this person is fighting, by name, as a
//     shadow in the ring. It says its line, you pick the counter. Right, and
//     targets light up on it: tap them, three is the combo, stars are uppercuts
//     earned in the app today. Then its turn: it winds up (the tell), you dodge
//     the other way or block. Dodge clean and you get a counter-punch. Every
//     boss has its own pattern. Bell, announcer, ref, crowd, grunts: recorded
//     files in audio/fight, the same Deep male voice as the SOS talk.
//   - Your strength is earned in the app: days, today's lesson, today's
//     journal, today's pledge, cravings ridden out. Do the work, walk in strong.
//   - Lose on the roof and the door locks until you do one real thing in the
//     app. Win and a parachute, helicopter or jet takes you to the next
//     building. The boss's last line is always "same time tomorrow".
//   - Buildings 1-2 talk in single words with dodge arrows shown. Lines get
//     longer, tells shorter, feints and the switch arrive as buildings go up.
//
// House rules, and where they live here:
//   - The game knows the track from the app (gameTrack). Supporters get their
//     own opponent, The Checking, and never their person's addiction.
//   - No invented numbers: every card behind a door and every corner line is
//     read from what this person actually did. No made-up crowd figures.
//   - Unbiased: no line blames the person struggling to comfort the supporter,
//     or the reverse. No pronouns for a supporter's person - "they" only.
//   - No medical claims. It says what people report and what the app does.
//   - It can end a fight, a floor, a building. It never tells anyone they are
//     finished.
//   - A relapse costs nothing in here. The building stands where it stood.
//   - No new dependencies. Same file, plain JS, CSS animation, <audio>.
//   - Art: img/fight (scenes, boss shadows, boxers, gloves). Sound: audio/fight.

// Pace per building. Jacques: "start each rooftop level off slow ... just a
// word, as levels progress they can become longer." No clock anywhere: the
// only thing that tightens is the wind-up before its swing (tell, in ms) and
// what it throws. Buildings 1-2 show dodge arrows; after that you read it.
function gameTier(){
  const s=gameStep();
  return s<=12?{key:'short',label:'Single words',tell:1000,swings:2,feint:false,switch:false,arrows:true,hit:8,given:'word'}
       :s<=24?{key:'mid',label:'Short lines',tell:800,swings:3,feint:true,switch:false,arrows:false,hit:11,given:'line'}
       :{key:'long',label:'Full sentences',tell:620,swings:4,feint:true,switch:true,arrows:false,hit:14,given:'line'};
}

const GAME_GLOVES=['red','blue','white','black','gold','green','pink'];
// Every boss fights differently. Learn the pattern, like Punch-Out.
// L/R = it swings from that side, you dodge the other way. F = feint: it winds
// up and stops. S = the switch: winds up one side, swings from the other.
function gameState(){
  if(!S.bld||typeof S.bld!=='object')S.bld={b:1,f:1,cleared:{},wins:0,losses:0,locked:null,rides:{jet:0,heli:0,chute:0},streak:0,ups:0,upsTotal:0,boxer:1,glove:'red',spun:0};
  const g=S.bld;
  g.b=Math.max(1,g.b|0);g.f=Math.max(1,Math.min(GAME_FLOORS+1,g.f|0));
  g.cleared=g.cleared||{};g.rides=g.rides||{jet:0,heli:0,chute:0};
  g.ups=g.ups|0;g.upsTotal=g.upsTotal|0;g.spun=g.spun|0;
  if(!GAME_BOXERS.includes(g.boxer))g.boxer=1;if(!GAME_GLOVES.includes(g.glove))g.glove='red';
  return g;
}
// Which opponent. Supporters get their own; everybody else gets the track
// their lessons are open on. The app decides, never the game.
function gameTrack(){
  const t=gameBuilding().track;
  return GAME_BOSSES[t]?t:'Other';
}
function gameBossName(){return gameBuilding().name;}
function gameBossImg(){return 'img/fight/boss-'+gameBuilding().k+'.jpg';}
function gameBldImg(){return 'img/fight/bld-'+gameBuilding().k+'.jpg';}
function gamePlace(){const g=gameState();return GAME_PLACES[(g.b-1)%GAME_PLACES.length];}
function gameDays(){
  try{if(!S.startDate)return 0;return Math.max(0,Math.floor((Date.now()-new Date(S.startDate).getTime())/86400000));}catch(e){return 0;}
}
function gameToday(){return new Date().toDateString();}
function gameStrength(){
  const days=Math.min(30,gameDays());
  const g=gameState();
  const floors=Object.keys(g.cleared).length;
  const behind=Math.min(36,Math.max(0,g.b-1)*6);
  const parts=[
    {k:'Days here',v:days,hint:null},
    {k:'Floors this building',v:floors,hint:null},
    {k:'Buildings behind you',v:behind,hint:null}];
  const total=Math.min(120,50+parts.reduce((s,p)=>s+p.v,0));
  return {total,parts};
}
// Stars are uppercuts: one for each real thing done today.
let gmBusy=false,gmFight=null,gmQ=null,gmPZ=null,gmH=null,gmInput=null,gmAC=null,gmCrowd=null,gmCrowdT=null;
function gm(id){return document.getElementById(id);}
function gmEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function openTower(){switchTo('tower');actBn('bn-game');}
function gameStop(){gmBusy=false;gmFight=null;gmInput=null;try{if(gmCrowd){gmCrowd.pause();}}catch(e){}clearInterval(gmCrowdT);}
function gmPhoto(cls,src){const p=gm('g2-photo');if(!p)return;p.className='g2-photo '+(cls||'');if(src!==undefined)p.style.backgroundImage=src?`url(${src})`:'';}
function gmBoxerImg(pose){return `img/fight/boxer${gameState().boxer}-${pose}.jpg`;}
function gmMini(pose){const m=gm('g2-mini');if(!m)return;m.hidden=false;m.className='g2-mini '+pose;m.style.backgroundImage=`url(${gmBoxerImg(pose)})`;}
function gmMiniHide(){const m=gm('g2-mini');if(m)m.hidden=true;}
function gmTop(){
  const g=gameState();
  const sub=gm('g2-sub'),ups=gm('g2-ups'),fl=gm('g2-floors');
  if(sub)sub.textContent=`Building ${g.b} · ${gameBuilding().name}`;
  if(ups)ups.textContent=g.ups;
  if(fl)fl.innerHTML=Array.from({length:GAME_FLOORS},(_,i)=>`<i class="${g.cleared[i+1]?'done':(g.f===i+1?'here':'')}"></i>`).join('')+`<i class="roof ${g.f>GAME_FLOORS?'here':''}"></i>`;
}
function gmBody(html){const b=gm('g2-body');if(b)b.innerHTML=html;}
function renderTower(){
  gameStop();
  const g=gameState();
  if(!gm('g2'))return;
  gmTop();
  if(!g.inside)renderApproach();else renderFloors();
}
// You land in the street and the building is standing there with its name on it.
function renderApproach(){
  const g=gameState(),B=gameBuilding();
  gmPhoto('scene',gameBldImg());gmMiniHide();
  gmBody(`<div class="g2-cat">Building ${g.b}${gameLap()>1?` · time ${gameLap()}`:''}</div>
    <div class="g2-bld"><span>${gmEsc(B.name)}</span><small>${gmEsc(B.kind)}</small></div>
    <p class="g2-lead">Five floors and a roof. The same thing waits on every one of them, wearing something different each time. The roof is where it comes from.</p>
    <button class="g2-big" onclick="gameGoIn()">Go in</button>`);
}
function gameGoIn(){const g=gameState();g.inside=true;save();renderFloors();}
// The climb. One fight a floor, then the roof.
function renderFloors(){
  gmReplay=null;
  const g=gameState(),B=gameBuilding();
  gmPhoto('boss',gameBossImg());gmMiniHide();
  const rows=[];
  for(let n=GAME_FLOORS;n>=1;n--){
    const done=!!g.cleared[n],here=g.f===n&&!done;
    const go=here?'gameFloorGo('+n+')':done?'gameFloorReplay('+n+')':'';
    rows.push(`<button class="g2-flr ${done?'done':''} ${here?'here':''}" ${go?'onclick="'+go+'"':'disabled'}>
      <b>${n}</b><span>${gmEsc(gameFloorEl(n))}${here?'<small style="display:block;font-size:.7rem;opacity:.75">'+gmEsc(GAME_ELEMENT_HOW[gameFloorEl(n)]||'')+'</small>':''}</span><i>${done?'cleared &middot; go again':here?'fight':'locked'}</i></button>`);
  }
  const roofReady=Object.keys(g.cleared).length>=GAME_FLOORS;
  gmBody(`<div class="g2-cat">${gmEsc(B.name)} · ${gmEsc(B.kind)}</div>
    <button class="g2-flr roof ${roofReady?'here':''}" ${roofReady?'onclick="gameFloorGo('+(GAME_FLOORS+1)+')"':'disabled'}>
      <b>&#9650;</b><span>The roof &middot; the source</span><i>${roofReady?'fight':'five floors first'}</i></button>
    <div class="g2-flrs">${rows.join('')}</div>
    <button class="g2-ghost" style="margin-top:14px" onclick="gameStartOver()">Start the whole thing over</button>`);
}
function gameFloorGo(n){gmReplay=null;const g=gameState();g.f=n;save();gmTop();renderRoofDoor();}
// Walking back into a fight you already cleared (Jacques, 8 Sep 2026). It changes
// nothing: the floor is not re-cleared, and the win and loss counts are left alone.
// Progress only ever moves forward the first time through, so going back to floor
// two on your way up cannot cost you floors three to seven.
let gmReplay=null;
function gmFloor(){const g=gameState();return gmReplay!=null?gmReplay:g.f;}
function gameFloorReplay(n){gmReplay=n;gmTop();renderRoofDoor();}
function gameFightAgain(){
  const g=gameState();
  // The one just won is already marked cleared, so going again is a replay. A fight
  // that was lost cleared nothing and g.f never moved - that is a straight retry.
  gmReplay=g.cleared[gmFloor()]?gmFloor():null;
  gmTop();renderRoofDoor();
}
// Start the whole thing over: building one, floor one, nothing cleared. Asked for
// out loud, never offered mid-fight, and it says what it costs before it does it.
function gameStartOver(){
  appConfirm('Start the whole fight over? Every building and every floor goes back to the beginning. Nothing outside the fight changes.',
    ()=>{
      const g=gameState();
      g.b=1;g.f=1;g.cleared={};g.inside=false;g.wins=0;g.losses=0;g.rides={};g.lastRide='';
      gmReplay=null;gmFight=null;gmBusy=false;
      save();gmTop();renderTower();
    },{okText:'Start over'});
}

function gameFighter(){const g=gameState();return Math.max(1,Math.min(5,(g.fighter|0)||(((g.boxer-1)%5)+1)));}
function gameSetFighter(n){const g=gameState();g.fighter=Math.max(1,Math.min(5,n|0));save();renderRoofDoor();}
function gmCrowdLevel(level){try{if(!gmCrowd){gmCrowd=new Audio('audio/fight/crowd.mp3');gmCrowd.loop=true;gmCrowd.volume=0;gmCrowd.play().catch(()=>{});}
  clearInterval(gmCrowdT);const target=Math.min(1,level*4);gmCrowdT=setInterval(()=>{if(!gmCrowd)return clearInterval(gmCrowdT);const d=target-gmCrowd.volume;if(Math.abs(d)<.02){gmCrowd.volume=target;clearInterval(gmCrowdT);if(target===0)gmCrowd.pause();return;}if(gmCrowd.paused)gmCrowd.play().catch(()=>{});gmCrowd.volume=Math.max(0,Math.min(1,gmCrowd.volume+d*.2));},60);}catch(e){}}
function renderRoofDoor(){
  const g=gameState(),T=gameTier(),str=gameStrength(),boss=gameBossName();
  const F=gmFloor(),again=gmReplay!=null;
  const roof=F>GAME_FLOORS;
  gmPhoto('boss',gameBossImg());gmMini('guard');
  const rows=str.parts.map(p=>`<div><span>${gmEsc(p.k)}</span><b>${p.v?'+'+p.v:'—'}</b>${p.hint?`<small>${gmEsc(p.hint)}</small>`:''}</div>`).join('');
  gmBody(`<div class="g2-cat">${gmEsc(gameBuilding().name)} · ${roof?'the roof':'floor '+F+' · '+gmEsc(gameFloorEl(F))} · ${T.label}</div>
    <h1 class="g2-h1">${roof?`${gmEsc(boss)} <em>itself.</em>`:`${gmEsc(boss)} is <em>waiting.</em>`}</h1>
    <div class="g2-from" style="text-align:left">${roof?'The source. No element, no disguise. It fights straight, and it hits hardest.':gmEsc(gameFloorEl(F))+' in the ring. '+gmEsc(GAME_ELEMENT_HOW[gameFloorEl(F)]||'')} It swings from one side, you go the other &middot; swipe or use the arrows. Some of them sell a punch they never throw.</div>
    ${again?'<div class="g2-from" style="text-align:left">You have already cleared this one. Go as many rounds as you want &mdash; nothing here counts against you.</div>':''}
    <div class="g2-strength"><b>${str.total}</b><span>Strength</span></div>
    <div class="g2-strrows">${rows}</div>
    <div class="g2-pick g2-gloves" role="group" aria-label="Your fighter">${[1,2,3,4,5].map(n=>`<button class="g2-gl ${gameFighter()===n?'on':''}" aria-pressed="${gameFighter()===n}" onclick="gameSetFighter(${n})">Fighter ${n}</button>`).join('')}</div>
    <button class="g2-big" onclick="startFight()">Ring the bell</button>
    <button class="g2-ghost" style="margin-top:8px" onclick="renderFloors()">Back to the stairs</button>`);
}

// The roof is the 3D fight. It runs in its own page (game3d.html) so the app shell
// stays light; this hands it the person's own opponent, lines, boxer and gloves and
// waits to hear how it ended. The photo fight it replaced is in git before this date.
function game3dLines(){
  const track=gameBuilding().track,B=GAME_BOSSES[track]||{};
  const out=[];
  for(const k of ['short','mid','long'])for(const q of (B[k]||[]))out.push({line:q.line});
  for(const line of (GAME_TEMPT[track]||GAME_TEMPT['Other']||[]))out.push({line:line});
  const seen={};return out.filter(q=>q.line&&!seen[q.line]&&(seen[q.line]=1));
}
function game3dSupport(){
  const out=[];
  try{const j=(S.journal||[]).slice(-6).map(e=>(e&&e.text||'').trim()).filter(Boolean);for(const line of j)out.push(line.length>44?line.slice(0,41)+'…':line);}catch(e){}
  try{if(S.partnerName)out.push(S.partnerName+' is up.');}catch(e){}
  const d=gameDays();if(d>0)out.push(d===1?'One day.':d+' days.');
  out.push('Hands up.','Breathe.');
  return out.slice(0,8);
}
async function startFight(){
  if(gmBusy)return;
  const g=gameState(),track=gameTrack(),str=gameStrength();
  gmFight={round:0,you:str.total,youMax:str.total,building:g.b};
  gmCrowdLevel(0);
  try{gm('g2').classList.add('g2-full');document.body.classList.add('g2-fighting');}catch(e){}
  gmBody(`<button class="g2-exit" title="Leave the fight" onclick="gameLeaveFight()">&#10005;</button><iframe id="g2-3d" title="The fight" allow="autoplay" src="/game3d.html?boss=${encodeURIComponent(gameBuilding().k)}&fighter=${gameFighter()}&glove=${encodeURIComponent(g.glove)}&place=${encodeURIComponent(gamePlace().k)}&building=${g.b}&floor=${gmFloor()>GAME_FLOORS?0:gmFloor()}"></iframe>`);
  const f=gm('g2-3d');if(!f)return;
  if(!window.__g3d){window.__g3d=true;addEventListener('message',game3dMessage);}
  f.addEventListener('load',()=>{try{f.contentWindow.postMessage({to:'fightofyourlife',
    bossKey:gameBuilding().k,bossName:gameBossName(),lines:game3dLines(),
    support:game3dSupport(),tempt:game3dLines().map(q=>q.line).slice(0,6),
    place:gamePlace().k,glove:g.glove,fighter:gameFighter(),building:g.b,floor:(gmFloor()>GAME_FLOORS?0:gmFloor()),name:(S.name||'you')},'*');}catch(e){}});
}
function game3dMessage(ev){
  const d=ev&&ev.data;if(!d||d.from!=='fightofyourlife')return;
  if(d.type!=='fight-over')return;
  const F=gmFight;if(!F)return;
  F.round=d.round||1;F.you=Math.max(0,Math.round((d.youHP||0)/100*F.youMax));
  if(d.result==='won')game3dWon();else game3dLost(d.result==='draw');
}
// stepping out of the fight without a result: back to the stairs
function gameLeaveFight(){
  try{gm('g2').classList.remove('g2-full');document.body.classList.remove('g2-fighting');}catch(e){}
  gmFight=null;gmBusy=false;renderFloors();}
function game3dWon(){
  const F=gmFight,g=gameState();
  try{gm('g2').classList.remove('g2-full');document.body.classList.remove('g2-fighting');}catch(e){}
  // A floor walked back into is practice: it was already cleared, so nothing is
  // added to the record and the climb does not move.
  if(gmReplay!=null){
    const n=gmReplay;
    gmBody(`<div class="g2-reveal up" style="font-size:3rem">Took it again</div>
    <div class="g2-cat g2-center">Floor ${n} &middot; round ${F.round}</div>
    <p class="g2-lead g2-center">This one was already yours. Nothing counted, nothing moved &mdash; you just wanted the round.</p>
    <button class="g2-big" onclick="gameFightAgain()">Again</button>
    <button class="g2-ghost" style="margin-top:8px" onclick="renderFloors()">The stairs</button>`);
    gmFight=null;gmBusy=false;return;
  }
  const roof=g.f>GAME_FLOORS;
  g.wins++;
  if(!roof){g.cleared[g.f]=true;g.f=Math.min(GAME_FLOORS+1,g.f+1);}
  save();
  if(typeof logActivity==='function')try{logActivity('game_building_cleared',{building:g.b,floor:roof?'roof':g.f});}catch(e){}
  if(roof)return renderJump();
  const nextEl=g.f>GAME_FLOORS?'the roof':gameFloorEl(g.f);
  gmBody(`<div class="g2-reveal up" style="font-size:3rem">Floor clear</div>
  <div class="g2-cat g2-center">${gmEsc(S.name||'You')} · round ${F.round}</div>
  <div class="g2-voice"><small>${gmEsc(gameBossName())}</small>Down. Not out. I am on the next one too.</div>
  <p class="g2-lead g2-center">It is waiting one floor up, in ${gmEsc(String(nextEl))}. Same thing, different face.</p>
  <button class="g2-big" onclick="gameFloorGo(${g.f})">${g.f>GAME_FLOORS?'Up to the roof':'Floor '+g.f}</button>
  <button class="g2-ghost" style="margin-top:8px" onclick="gameFightAgain()">Fight that one again</button>
  <button class="g2-ghost" style="margin-top:8px" onclick="renderFloors()">The stairs</button>`);
  gmFight=null;gmBusy=false;
}
// The roof is done: off the side, under the chute, on to the next one.
function renderJump(){
  const g=gameState(),B=gameBuilding();
  const pct=gmFight?gmFight.you/gmFight.youMax:1,ride=GAME_RIDES.find(r=>pct>=r.min)||GAME_RIDES[GAME_RIDES.length-1];
  g.rides[ride.key]=(g.rides[ride.key]||0)+1;g.lastRide=ride.key;save();
  gmBody(`<div class="g2-chute" aria-hidden="true"><i></i></div>
  <div class="g2-reveal up" style="font-size:2.8rem">${gmEsc(B.name)} is done</div>
  <div class="g2-cat g2-center">Six fights, roof to street</div>
  <p class="g2-lead g2-center">You go off the side and the chute opens. It is still down there and it will be back &mdash; but not tonight, and not in this building.</p>
  <button class="g2-big" onclick="gameNextBuilding()">Land at the next one</button>`);
  gmFight=null;gmBusy=false;
}
function game3dLost(draw){
  const g=gameState();
  try{gm('g2').classList.remove('g2-full');document.body.classList.remove('g2-fighting');}catch(e){}
  // Losing a floor you already cleared costs nothing either - it was practice.
  if(!draw&&gmReplay==null)g.losses++;
  save();
  gmBody(`<div class="g2-reveal" style="font-size:2.6rem">${draw?'Even':'Saved by the bell'}</div>
  <div class="g2-voice"><small>${gmEsc(gameBossName())}</small>Down. Not out. Same time tomorrow.</div>
  <p class="g2-lead g2-center">${draw?'Nobody took it. The floor is still there to walk back into.':'It took this one. The floor is still there, and so are you. Go again when you are ready.'}</p>
  <button class="g2-big" onclick="renderRoofDoor()">Go again</button>
  <button class="g2-ghost" style="margin-top:8px" onclick="renderFloors()">The stairs</button>`);
  gmFight=null;gmBusy=false;
}

function gameNextBuilding(){const g=gameState();
  g.b++;g.f=1;g.cleared={};g.inside=false;g.locked=null;g.ups=0;g.used={};save();
  gmFight=null;gmBusy=false;renderTower();}

function towerOnRelapse(){}
function towerStop(){gameStop();}

/* boot - the app used to call this when its Fight tab opened */
renderTower();
</script>
</body>
</html>
