 {k:'rain',    name:'Rain',      c:0x4f8ef7, ring:[0x1d3f6b,0x0b2036,0x8fc4ff]},

 {k:'smoke',   name:'Smoke',     c:0x7d7f8c, ring:[0x2a2c33,0x101116,0xc2c4cc]},

function RINGGLB(){return ART+'ring.glb';}

// The ring itself, built in Blender: a square canvas on an apron with a skirt,
// padded corner posts, turnbuckles and steps up. The old pipes stay in the scene
// but go invisible the moment it lands, so the ropes still have something to hang on.
const OLDRING=[];let ringModel=null,ringCanvasMat=null;
function loadRing(){loader.load(RINGGLB(),g=>{
  const r=g.scene;r.traverse(o=>{if(o.isMesh){o.receiveShadow=true;o.castShadow=true;o.frustumCulled=false;
    const ms=Array.isArray(o.material)?o.material:[o.material];

  scene.add(r);ringModel=r;ringFloor.visible=false;for(const o of OLDRING)o.visible=false;setMood();

function CHUTEGLB(){return ART+'chute.glb';}function CITYGLB(){return ART+'city.glb';}

// ── off the roof ────────────────────────────────────────────────────────────
// Win on a roof and you do not walk out: you go off the side under a chute,
// over the city, on the way to the next building. Both models are from Blender.
let CHUTE=null,CITY=null;
function loadJump(){
  loader.load(CHUTEGLB(),g=>{CHUTE=g.scene;CHUTE.visible=false;CHUTE.traverse(o=>{if(o.isMesh)o.frustumCulled=false;});scene.add(CHUTE);},undefined,e=>console.error(e));
  loader.load(CITYGLB(),g=>{CITY=g.scene;CITY.visible=false;
    CITY.traverse(o=>{if(!o.isMesh)return;o.frustumCulled=false;
      const ms=Array.isArray(o.material)?o.material:[o.material];
      for(const m of ms){if(m&&m.emissive&&(m.emissive.r+m.emissive.g+m.emissive.b)>.2)m.emissiveIntensity=3.2;}});
    scene.add(CITY);},undefined,e=>console.error(e));}
async function jumpOut(){
  if(!CHUTE||!CITY||!YOU)return;
  autoCam=false;walkCam=null;curShot='jump';camTo=null;
  // everything but the fighter, the chute, the city and the lights goes away
  const keep=new Set([YOU.root,CHUTE,CITY,cam]);
  const hidden=[];
  for(const o of scene.children){if(keep.has(o)||o.isLight||o===scene.fog)continue;if(o.visible){o.visible=false;hidden.push(o);}}
  clearElem();shaftsOff();aisleOff();$('lines').classList.remove('on');
  CITY.visible=true;CHUTE.visible=true;CITY.position.y=16;
  // a moon over the city, and the arena haze pulled back so it can be seen at all
  const moon=new T.DirectionalLight(0xcfe0ff,2.2);moon.position.set(9,26,12);scene.add(moon);
  const glow=new T.HemisphereLight(0x334466,0x0a0c14,.9);scene.add(glow);
  const fog0=scene.fog.density;scene.fog.density=.006;
  amb.intensity=.55;spot.intensity=0;rim.intensity=0;
  scene.fog.color.set(0x070a12);scene.background.set(0x070a12);
  // nothing on the screen but the drop
  const chrome=[document.querySelector('.hud'),document.querySelector('.supers'),document.querySelector('.ctl')].filter(Boolean);
  for(const e of chrome)e.style.opacity=0;
  say('Off the side. On to the next one.','Announcer');snd('cheer');whoosh();
  const H0=34,H1=7;
  YOU.play('victory',{loop:true,fade:.3});YOU.root.rotation.set(0,0,0);
  const t0=performance.now(),ms=6200;
  await new Promise(res=>{(function f(){
    const t=Math.min(1,(performance.now()-t0)/ms),e=1-Math.pow(1-t,2.2);
    const h=H0+(H1-H0)*e, sway=Math.sin(t*7)*0.5, drift=t*3.2;
    YOU.root.position.set(sway,h,drift);
    YOU.root.rotation.z=Math.sin(t*7)*0.09;
    CHUTE.position.set(sway*1.15,h+3.1,drift-0.1);
    CHUTE.rotation.z=Math.sin(t*7+0.5)*0.07;
    CITY.position.set(0,0,drift);
    cam.position.set(sway+7.5,h+2.6,drift+8.5);
    look.set(sway,h+0.2,drift);
    if(t<1)requestAnimationFrame(f);else res();})();});
  await wait(600);
  scene.remove(moon);scene.remove(glow);scene.fog.density=fog0;
  for(const e of chrome)e.style.opacity='';
  for(const o of hidden)o.visible=true;
  CITY.visible=false;CHUTE.visible=false;YOU.root.rotation.set(0,0,0);autoCam=true;setPlace(place);}

function orbit(pos,look){if(!orbYaw&&!orbPitch&&orbZoom===1)return pos;const v=pos.clone().sub(look);const r=v.length();let th=Math.atan2(v.x,v.z)+orbYaw,ph=Math.asin(Math.max(-1,Math.min(1,v.y/r)))+orbPitch;ph=Math.max(-0.5,Math.min(1.15,ph));const rr=r*orbZoom;return new T.Vector3(look.x+rr*Math.cos(ph)*Math.sin(th),look.y+rr*Math.sin(ph),look.z+rr*Math.cos(ph)*Math.cos(th));}

canvas.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-dragX,dy=e.clientY-dragY;dragX=e.clientX;dragY=e.clientY;orbYaw-=dx*0.008;orbPitch+=dy*0.005;orbPitch=Math.max(-0.5,Math.min(1.15,orbPitch));manualUntil=performance.now()+9000;});

function recentre(){orbTarget.yaw=0;orbTarget.pitch=0;orbTarget.zoom=1;driftT=Math.random()*10;}
// the camera is never still: a slow swing round, a slow push in and out, and it eases back to the shot
// a few seconds after you stop dragging. Held still only while a card or a count is being read.
const orbTarget={yaw:0,pitch:0,zoom:1};let driftT=0,holdUntil=0,autoCam=true;
function holdCam(ms){holdUntil=performance.now()+ms;}
function camDrift(dt){if(dragging){manualUntil=performance.now()+9000;orbTarget.yaw=orbYaw;orbTarget.pitch=orbPitch;orbTarget.zoom=orbZoom;return;}
  driftT+=dt;
  const manual=performance.now()<manualUntil;
  if(!manual&&autoCam&&performance.now()>holdUntil){
    const pz=posing&&fightOver;/* on the picker the swing stays gentle and the push in and out stops, so nobody gets cropped */
    // Halved, and slowed. Between this and a cut every few seconds the camera was
    // never once still: seventeen degrees of swing and a push in and out, on top
    // of a new position every three seconds. Nothing to settle your eye on.
    orbTarget.yaw=(Math.sin(driftT*0.07)*0.10+Math.sin(driftT*0.031)*0.04)*(pz?0.4:1);

let sx=null;canvas.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>40){autoOff();doDodge(dx>0?'R':'L');}});
// the shots. A ringside TV view is the main one, over your shoulder for exchanges, a low corner camera for a knockdown, the house from the back at the bell.
// The ringside camera used to stand at a fixed +x, broadside to the ring. Two
// problems on a phone: the boss stands on the +x side of you, so the shot looked
// past its back at your own fighter - the fight watched backwards - and a portrait
// screen is far too narrow to hold two fighters standing side by side, so one of
// them went off the edge. It is built off the line between them now: mostly behind
// you and a little to the side on a tall screen, broadside on a wide one. You are
// always the one nearest the lens, and both of you are always in frame.
// Down on the canvas. It used to sit at one fixed corner looking at the middle of
// the ring, so whoever was still standing came between it and the person on the
// floor - a screen full of the addiction's back while the referee counted. It
// stands off the one who is down now, on the house side, and the referee's mark is
// read off the same point (downCamAt, above), so he cannot get between them.
let downWho=null;
function downLowPos(){
  if(!downWho)return new T.Vector3(-1.7,0.5,1.9);

  // still up - and once that fighter was sent to a neutral corner it dragged the
  // camera out through the ropes into the dark, looking at nothing.
  return downCamAt(downWho.root.position);
}
function tvPos(a,b,mid,d){
  const toYou=a.clone().sub(b);toYou.y=0;
  if(toYou.lengthSq()<0.01)toYou.set(0,0,1);
  toYou.normalize();
  const side=new T.Vector3(toYou.z,0,-toYou.x);        // perpendicular, on the usual side
  const port=cam.aspect<0.85;
  const back=port?(2.35+d*0.35):(1.15+d*0.3), off=port?1.45:(2.05+d*0.5);
  return mid.clone().setY(port?1.42:1.2).addScaledVector(toYou,back).addScaledVector(side,off);
}
const SHOTS={corner:{pos:()=>new T.Vector3(-0.15,1.15,3.55),look:()=>new T.Vector3(-1.78,0.72,1.85)},shoulder:{pos:()=>camBase.clone(),look:()=>LOOK.clone()},tv:{pos:()=>(YOU&&BOSS)?tvPos(YOU.root.position,BOSS.root.position,YOU.root.position.clone().add(BOSS.root.position).multiplyScalar(.5),YOU.root.position.distanceTo(BOSS.root.position)):new T.Vector3(1.95,1.22,1.25),look:()=>new T.Vector3(-0.05,1.05,-0.15)},low:{pos:()=>downLowPos(),look:()=>downWho?downWho.root.position.clone().setY(0.42):new T.Vector3(0,0.9,-0.55)},crowd:{pos:()=>new T.Vector3(0.3,2.7,4.6),look:()=>new T.Vector3(-0.2,1.0,-1.6)},
  // from above: the roof you are fighting on, the ring as a square with two people in it
  sky:{pos:()=>{const m=actionLook();return new T.Vector3(m.x+0.5,6.6,m.z+2.6);},look:()=>actionLook()},
  rafters:{pos:()=>{const m=actionLook();return new T.Vector3(m.x-2.9,4.5,m.z-2.9);},look:()=>actionLook()},
  overhead:{pos:()=>{const m=actionLook();return new T.Vector3(m.x+0.25,3.9,m.z+1.15);},look:()=>actionLook()}};
let walkCam=null;
const runnerMat=new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.2,blending:T.AdditiveBlending,depthWrite:false});
const runner=new T.Mesh(new T.PlaneGeometry(1.8,9),runnerMat);runner.rotation.x=-Math.PI/2;runner.position.set(-0.5,.014,0);runner.visible=false;scene.add(runner);
const runnerLights=[];for(let i=0;i<4;i++){const l=new T.PointLight(0xffffff,0,4.6,2);l.position.set(-.5,1.7,0);l.visible=false;scene.add(l);runnerLights.push(l);}
function aisleOn(x,z0,z1,color){runner.position.set(x,.014,(z0+z1)/2);runner.scale.set(1,Math.abs(z1-z0)/9,1);runnerMat.color.set(color);runner.visible=true;runnerLights.forEach((l,i)=>{l.color.set(color);l.intensity=8;l.visible=true;l.position.set(x,1.7,z0+(z1-z0)*(i+.5)/4);});}
function aisleOff(){runner.visible=false;runnerLights.forEach(l=>{l.visible=false;l.intensity=0;});}
function walkPos(){if(!walkCam)return camBase.clone();const p=walkCam.F.root.position,s=walkCam.s,sway=Math.sin(performance.now()/1500);
  if(walkCam.mode==='front')return new T.Vector3(p.x+sway*0.55,1.52+Math.sin(performance.now()/2100)*.07,p.z-s*3.3);
  return new T.Vector3(p.x+0.75+sway*0.3,2.16,p.z+s*3.7);}/* stood well back: on a tall phone a close shot is all shoulders */
function walkLook(){if(!walkCam)return LOOK.clone();const p=walkCam.F.root.position,s=walkCam.s;
  if(walkCam.mode==='front')return new T.Vector3(p.x,1.24,p.z);
  return new T.Vector3(p.x-s*0.08,1.32,p.z-s*1.7);}
function camWalk(F,mode,ms){walkCam={F:F,mode:mode,s:Math.sign(F.root.position.z)||1};SHOTS.walk={pos:walkPos,look:walkLook};shot('walk',ms||0);}
function camWalkOff(){walkCam=null;}
// stepping through the ropes gets its own camera, stood inside the ring where nobody can cross it
function entryShot(side,ms){SHOTS.entry=side==='N'?{pos:()=>new T.Vector3(0.15,1.4,0.5),look:()=>new T.Vector3(1.15,1.05,-2.35)}:{pos:()=>new T.Vector3(0.05,1.4,-0.4),look:()=>new T.Vector3(-1.35,1.05,2.35)};camWalkOff();shot('entry',ms||700);}
let curShot='shoulder',camFrom=null,camTo=null,camT=0,camMs=0,lookFrom=null,lookTo=null,manualUntil=0,autoCut=0,slow=1;
function shot(name,ms){const S2=SHOTS[name];if(!S2)return;curShot=name;recentre();if(!ms){cam.position.copy(S2.pos());look.copy(S2.look());camTo=null;return;}camFrom=cam.position.clone();camTo=S2.pos();lookFrom=look.clone();lookTo=S2.look();camT=0;camMs=ms;}
function actionLook(){
  // While somebody is down the camera watches the body, not the midpoint between
  // the two. The midpoint was fine when both stood together; now the one still up
  // is sent to a neutral corner, and aiming halfway between them pointed the lens
  // at empty air with the man on the canvas out of frame.
  if(downWho) return downWho.root.position.clone().setY(0.45);
  if(YOU&&BOSS){const m=YOU.root.position.clone().add(BOSS.root.position).multiplyScalar(.5);m.y=1.2;return m;}
  return LOOK.clone();}
function camTick(dt){liftFrame();if(posing&&fightOver&&!document.getElementById('fighters').hidden){poseFrame();return;}
  if(curShot==='walk'&&walkCam&&!camTo){cam.position.lerp(walkPos(),Math.min(1,dt*3.5));look.lerp(walkLook(),Math.min(1,dt*5));}
  // the card walk: she is moving, so her camera moves with her instead of aiming where she used to be
  if((curShot==='girl'||curShot==='girlclose')&&!camTo&&GIRL){const S3=SHOTS[curShot];cam.position.lerp(S3.pos(),Math.min(1,dt*3));look.lerp(S3.look(),Math.min(1,dt*4));}
  if(curShot==='tv'&&!camTo&&YOU&&BOSS){const a=YOU.root.position,b=BOSS.root.position,mid=a.clone().add(b).multiplyScalar(.5),d=a.distanceTo(b);
    cam.position.lerp(tvPos(a,b,mid,d),Math.min(1,dt*3));look.lerp(new T.Vector3(mid.x-.05,1.05,mid.z),Math.min(1,dt*3));}if(!camTo&&!walkCam&&curShot!=='tv'&&curShot!=='walk'&&curShot!=='entry'&&curShot!=='girl'&&curShot!=='girlclose'){
    const t=(YOU&&!$('corner').hidden)?YOU.root.position.clone().setY(1.25):((!fightOver||running||downState)?actionLook():null);
    if(t)look.lerp(t,Math.min(1,dt*2.0));}
  if(camTo){camT+=dt*1000;const t=Math.min(1,camT/camMs),e=1-Math.pow(1-t,3);cam.position.lerpVectors(camFrom,camTo,e);look.lerpVectors(lookFrom,lookTo,e);if(t>=1)camTo=null;}if(Math.abs(cam.fov-fovBase)>.01){cam.fov+=(fovBase-cam.fov)*Math.min(1,dt*6);cam.updateProjectionMatrix();}}
let rollAmt=0,rollUntil=0;
function roll(a,ms){rollAmt=a*(Math.random()<.5?-1:1);rollUntil=performance.now()+ms;}
function punchIn(){cam.fov=fovBase*.85;cam.updateProjectionMatrix();}
function slowMo(ms){slow=.3;setTimeout(()=>slow=1,ms);}
// the director: during a round it cuts between the TV view and your shoulder every few seconds unless you picked a camera yourself
// the director. Watching, it never sits still: it works the whole room,
// ringside, down on the canvas, up in the house - but never from behind your
// own man's head. That shot puts you behind him with the addiction hidden
// behind him, which is the backwards view, and it is no better to watch than
// it was to box. It still does the knockdowns and the exchanges in a live
// round, where the camera is not cycling.
const AUTOCUTS=['tv','overhead','low','crowd','tv','sky','corner','low','tv','rafters','crowd','overhead'];
setInterval(()=>{
  if(performance.now()<manualUntil)return;
  if(curShot==='walk'||curShot==='entry'||curShot==='girl')return;
  // and the move itself glides rather than snaps: same distance, twice as long
  if(auto&&!downState){shot(AUTOCUTS[(++autoCut)%AUTOCUTS.length],1500);return;}
  if(!running||downState)return;
  // Measured 8 Sep 2026: the round used to cut between the ringside camera and the
  // over-the-shoulder one every few seconds. Ringside you see your own fighter's
  // face; over the shoulder you are stood behind his head with the addiction hidden
  // behind him. A third of every round was spent looking at your own man's back,
  // and it switched while you were trying to read a punch. That is the backwards.
  // The round stays ringside now. The other cameras still do the walk-in, the
  // knockdowns and the preview, where nobody is trying to dodge anything.
  if(curShot!=='tv')shot('tv',600);},7000);
// nothing is ever right up against the lens: if the camera ends a move too close to what it
// is looking at, it backs off along its own sight line rather than filling the frame with a body
function camClear(p,l,min){const v=p.clone().sub(l);const d=v.length();if(d>=min)return p;
  if(d<0.02)v.set(0,0.2,1);v.normalize();return l.clone().add(v.multiplyScalar(min));}
function frame(){const dt0=clock.getDelta(),dt=dt0*slow;camTick(dt0);
  if(aura&&BOSS){const pulse=1+Math.sin(performance.now()/650)*.06;aura.scale.set(3.6*pulse,3.6*pulse,1);aura.material.opacity=.75+Math.sin(performance.now()/650)*.1;const bp=BOSS.root.position,dir=bp.clone().sub(cam.position);dir.y=0;dir.normalize();aura.position.set(bp.x+dir.x*1.1,1.25,bp.z+dir.z*1.1);rim.position.set(bp.x+dir.x*2.6,1.5,bp.z+dir.z*2.6);floorGlow.position.set(bp.x+dir.x*.3,.012,bp.z+dir.z*.3);if(YOU){const yp=YOU.root.position;fillYou.position.set(yp.x-dir.x*1.2+0.3,1.9,yp.z-dir.z*1.2);}}for(const p of PROPS)if(p.userData.ember)p.material.color.setHex(Math.random()<.1?0xffc27a:0xff7a2b);if(BOSS)BOSS.mixer.update(dt);if(YOU)YOU.mixer.update(dt);
  sparkTick(dt0);sweatTick(dt0);trailTick(dt0);tweenTick(dt0);elemTick(dt0);shaftTick();if(followWho){const p=followWho.root.position;walkSpot.position.set(p.x,4.6,p.z+0.6);walkSpot.target.position.set(p.x,0.9,p.z);walkSpot.target.updateMatrixWorld();}
  if(REF&&!fightOver&&!downState&&curShot!=='walk'&&curShot!=='entry'&&performance.now()>refLock&&YOU&&BOSS){
    const m=YOU.root.position.clone().add(BOSS.root.position).multiplyScalar(.5);
    // the same degenerate case as refFace: no bearing from standing on the thing
    // you are watching, so he keeps the one he has
    if(m.distanceToSquared(ref.position)>0.0625){
      const want=Math.atan2(m.x-ref.position.x,m.z-ref.position.z);let d=want-ref.rotation.y;
      while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;ref.rotation.y+=d*Math.min(1,dt0*2.2);}}
  if(REF)REF.mixer.update(dt);if(ANN)ANN.mixer.update(dt);if(GIRL)GIRL.mixer.update(dt);for(const k in CORNER)CORNER[k].mixer.update(dt);if(card&&card.visible&&cardHand){const h=new T.Vector3();cardHand.getWorldPosition(h);const toCam=cam.position.clone().sub(h).setY(0).normalize();card.position.copy(h).add(new T.Vector3(0,0.22,0)).addScaledVector(toCam,0.16);card.lookAt(cam.position);}crowdTick(dt);
  if(shake>0){const S2=SHOTS[curShot]||SHOTS.shoulder;const base=camTo?cam.position.clone():S2.pos();cam.position.x=base.x+(Math.random()-.5)*shake;cam.position.y=base.y+(Math.random()-.5)*shake;shake*=.85;if(shake<.004){shake=0;if(!camTo)cam.position.copy(S2.pos());}}
  camDrift(dt0);if(performance.now()<kickUntil)cam.position.add(kick);const _p=cam.position.clone();const _l=look.clone();_l.y-=(fovBase-48)*0.011;/* a wide lens on a tall phone leaves sky at the top, so aim a little lower and lift everyone up the frame */cam.position.copy(camClear(orbit(cam.position,_l),_l,1.15));cam.lookAt(_l);if(performance.now()<rollUntil){cam.rotateZ(rollAmt*(1-(rollUntil-performance.now())/900));}R.render(scene,cam);cam.position.copy(_p);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
