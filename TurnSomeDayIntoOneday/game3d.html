<meta charset="utf-8">
<title>The Fight of Your Life</title>
<style>
  :root{--lamp:#f2a93b;--hit:#e24b4a;--you:#2fd08a;--chalk:#eef1ff;--dim:#a9b1d6;--ink:#070a14}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;background:#000;color:var(--chalk);font-family:'Barlow','Helvetica Neue',Arial,sans-serif}
  #stage{position:relative;max-width:none;width:100%;margin:0 auto;height:100dvh;overflow:hidden;background:var(--ink)}
  canvas{display:block;width:100%;height:100%}
  body.embed .hud{padding-left:52px}
  .hud{position:absolute;left:0;right:0;top:0;padding:10px 8px 0;display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--chalk);background:linear-gradient(180deg,rgba(0,0,0,.72),transparent);z-index:5}
  .hud .side{min-width:0}.hud .side .nm{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:800;font-size:.8rem;letter-spacing:.1em;color:#fff;text-shadow:0 1px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hud .side.r{text-align:right}
  .hud .bar{height:13px;border-radius:0;background:rgba(10,12,20,.85);border:1px solid rgba(255,255,255,.28);box-shadow:0 0 10px rgba(0,0,0,.6) inset;clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%)}
  .hud .side.r .bar{clip-path:polygon(9px 0,100% 0,100% 100%,0 100%)}
  .hud .bar i{background:linear-gradient(90deg,#e24b4a,#f2a93b 55%,#9be36a)}
  .hud .bar.you i{background:linear-gradient(90deg,#9be36a,#f2a93b 55%,#e24b4a)}
  .stars{margin-top:3px;font-size:.75rem;letter-spacing:.12em;color:var(--lamp);height:.9rem;text-shadow:0 0 8px rgba(242,169,59,.8)}
  .supers{position:absolute;left:0;right:0;bottom:calc(206px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 10px;z-index:5;pointer-events:none}
  .sup{display:flex;align-items:center;gap:6px}.sup.r{flex-direction:row-reverse}
  .sup b{font-family:'Barlow Condensed',Impact,sans-serif;font-size:.66rem;letter-spacing:.16em;color:#fff;text-shadow:0 1px 0 #000}
  .sup .bar{flex:1;height:9px;background:rgba(10,12,20,.8);border:1px solid rgba(255,255,255,.25)}
  .sup .bar i{background:linear-gradient(90deg,#f2a93b,#fff1d6);box-shadow:0 0 12px rgba(242,169,59,.9)}
  .sup.full b{animation:supflash .5s ease-in-out infinite alternate}@keyframes supflash{from{color:#fff}to{color:var(--lamp)}}
  .hud .rd{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:800;text-align:center;padding:0 6px;background:rgba(10,12,20,.8);border:1px solid rgba(255,255,255,.25);clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 100%,0 100%)}
  #clk{display:block;font-size:1.55rem;line-height:1.05;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(255,255,255,.35)}
  #rdn{display:block;font-size:.55rem;letter-spacing:.16em;color:var(--lamp)}.row.one{grid-template-columns:1fr}.row.four{grid-template-columns:repeat(4,1fr)}.row.six{grid-template-columns:repeat(5,1fr)}.row.pick{grid-template-columns:repeat(5,1fr)}.row.pick button{font-size:.58rem;letter-spacing:.02em;padding:8px 1px}.row.pick i{display:block;width:14px;height:14px;border-radius:50%;margin:0 auto 5px;border:1px solid rgba(255,255,255,.35)}.row.gl{grid-template-columns:repeat(4,1fr)}.row.gl button{font-size:.6rem;padding:8px 1px}.row.punch{grid-template-columns:repeat(4,1fr)}.row.punch button{padding:12px 2px;font-size:1rem}.row.six button{font-size:.56rem;letter-spacing:.02em;padding:9px 1px}#auto.on{background:rgba(242,169,59,.22);border-color:var(--lamp);color:var(--lamp)}
  #fighters button.on{background:rgba(242,169,59,.25)}.row.four button,#gloves button{font-size:.9rem;padding:9px 4px}#places button.on,#gloves button.on{background:rgba(242,169,59,.25)}
  .bar.sp{height:4px;margin-top:3px}.bar.sp i{background:linear-gradient(90deg,#f2a93b,#fff1d6);transition:width .25s}
  .talk{position:absolute;left:12px;right:12px;top:118px;z-index:6;background:rgba(7,10,20,.85);border:2px solid var(--lamp);border-radius:12px;padding:8px 10px}.talk .tline{font-family:'Barlow Condensed',Impact,sans-serif;font-weight:800;font-size:1.25rem;color:var(--lamp);margin-bottom:6px}.talk .tbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.talk button{padding:9px 6px;font-size:.95rem;text-transform:none;letter-spacing:0;border-color:var(--chalk)}
  .call{position:absolute;left:12px;right:12px;bottom:calc(210px + env(safe-area-inset-bottom));z-index:6;text-align:center;font-family:'Barlow Condensed',Impact,sans-serif;font-weight:800;font-size:1.15rem;letter-spacing:.03em;color:#fff;text-shadow:0 0 12px #000,0 2px 0 #000;animation:callin .3s ease-out}@keyframes callin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .fx{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0}.fx.on{animation:fxflash .16s ease-out}@keyframes fxflash{from{opacity:.28}to{opacity:0}}
  .lines{position:absolute;inset:-40%;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.0) 0deg 4deg,rgba(255,255,255,.09) 4deg 5deg);mix-blend-mode:screen}.lines.on{opacity:.7;animation:spin 1.2s linear infinite}@keyframes spin{to{transform:rotate(20deg)}}
  .super{position:absolute;left:50%;transform:translateX(-50%);top:36%;z-index:7;font-size:1.6rem;padding:14px 26px;border-color:var(--lamp);color:var(--lamp);background:rgba(7,10,20,.85);animation:superpulse .7s ease-in-out infinite alternate}@keyframes superpulse{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.12);box-shadow:0 0 30px var(--lamp)}}
  .bar{height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--hit);transition:width .35s}.bar.you i{background:var(--you)}
  .voice{position:absolute;left:16px;right:16px;top:74px;background:var(--chalk);color:var(--ink);padding:10px 12px;font-weight:600;border-radius:14px 14px 14px 4px;max-width:80%;font-size:.95rem}
  .voice small{display:block;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
  .ctl{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(14px + env(safe-area-inset-bottom));display:grid;gap:8px;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent)}
  .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  button{font:inherit;color:var(--chalk);background:rgba(7,10,20,.78);border:2px solid #2a3350;border-radius:8px;padding:12px 6px;font-family:'Barlow Condensed',Impact,sans-serif;font-weight:800;font-size:1.1rem;text-transform:uppercase;letter-spacing:.06em;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  button.p{border-color:var(--lamp);color:var(--lamp)}button.d{border-color:var(--you);color:var(--you)}button.x{border-color:var(--hit);color:var(--hit)}
  .slam{position:absolute;left:0;right:0;top:36%;text-align:center;font-family:'Barlow Condensed',Impact,sans-serif;font-weight:800;font-size:5rem;color:#fff;text-shadow:0 0 30px var(--lamp),0 4px 0 #000;animation:slam .6s ease-out forwards;pointer-events:none}
  @keyframes slam{from{opacity:1;transform:scale(.4) rotate(-8deg)}60%{transform:scale(1.15) rotate(2deg)}to{opacity:0;transform:scale(1.3)}}
  .count{position:absolute;left:0;right:0;top:26%;text-align:center;font-family:'Barlow Condensed',Impact,sans-serif;font-weight:800;font-size:9rem;line-height:1;color:#fff;text-shadow:0 0 40px rgba(0,0,0,.9),0 6px 0 #000;animation:countpop .85s ease-out forwards;pointer-events:none}
  @keyframes countpop{0%{opacity:0;transform:scale(1.6)}20%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
  .red{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(226,75,74,0) 30%,rgba(226,75,74,.85) 100%);transition:opacity .12s}
  .cue{position:absolute;top:30%;pointer-events:none;text-align:center;color:var(--hit);font-family:'Barlow Condensed',Impact,sans-serif;font-weight:800;animation:cue .3s ease-in-out infinite alternate}
  .cue.L{left:8%}.cue.R{right:8%}.cue b{display:block;font-size:4rem;line-height:1;text-shadow:0 0 30px rgba(226,75,74,.9)}
  @keyframes cue{from{transform:scale(.9);opacity:.7}to{transform:scale(1.1);opacity:1}}
  .chant{position:absolute;top:44%;max-width:38%;padding:6px 10px;font-family:'Barlow Condensed',Impact,sans-serif;font-weight:800;font-size:1.05rem;line-height:1.1;text-transform:uppercase;letter-spacing:.04em;opacity:0;transition:opacity .25s;pointer-events:none;border-radius:6px;background:rgba(0,0,0,.55)}
  .chant.L{left:10px;color:#ff8a80;border-left:3px solid #e24b4a}.chant.R{right:10px;color:#7ff0b0;border-right:3px solid #2fd08a;text-align:right}.chant.on{opacity:1}
  .load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',Impact,sans-serif;font-size:1.6rem;letter-spacing:.1em;color:var(--lamp);background:var(--ink)}

  @media (max-height:820px){
    .ctl{padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:6px}
    .row.pick button{padding:6px 1px;font-size:.52rem}.row.pick i{width:11px;height:11px;margin-bottom:3px}
    .row.one button{padding:9px 6px;font-size:.95rem}
    .row.punch button{padding:9px 2px;font-size:.9rem}
    .row button{padding:9px 4px;font-size:.95rem}
    .supers{bottom:calc(168px + env(safe-area-inset-bottom))}
    .skipwalk{bottom:calc(202px + env(safe-area-inset-bottom))}
  }
  @media (max-height:700px){
    .supers{bottom:calc(148px + env(safe-area-inset-bottom))}
    .skipwalk{bottom:calc(180px + env(safe-area-inset-bottom))}
    .row.pick button{font-size:.48rem;padding:5px 1px}
  }
  /* The walk-in runs about forty seconds. Worth watching once; not every time. */
  /* Sits above the control panel, not over the HUD - top left is the round clock
     and the fighter's name, and the skip button was landing straight on them. */
  .skipwalk{position:absolute;left:50%;transform:translateX(-50%);z-index:9;
    bottom:calc(246px + env(safe-area-inset-bottom));
    background:rgba(0,0,0,.6);color:#dfe4ff;border:1px solid rgba(255,255,255,.28);
    border-radius:999px;padding:9px 16px;font:600 .72rem/1 inherit;letter-spacing:.04em;
    white-space:nowrap;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .skipwalk[hidden]{display:none}
  .note{position:absolute;left:0;right:0;bottom:0;background:#000;color:#8a93bd;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:5px}
</style>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="hud"><div class="side l"><div class="nm" id="youname">You</div><div class="bar you"><i id="yb" style="width:100%"></i></div><div class="stars" id="ystars"></div></div><div class="rd" id="rd"><span id="clk">0:30</span><small id="rdn">ROUND 1</small></div><div class="side r"><div class="nm" id="bossname">The Drink</div><div class="bar"><i id="bb" style="width:100%"></i></div><div class="stars" id="bstars"></div></div></div><div class="supers"><div class="sup l"><b>SUPER</b><div class="bar sp"><i id="ysp" style="width:0%"></i></div></div><div class="sup r"><div class="bar sp"><i id="bsp" style="width:0%"></i></div><b>SUPER</b></div></div>
    <div class="fx" id="fx"></div><div class="lines" id="lines"></div>

  <div class="ctl">

    <div class="row" id="moverow"><button class="d" id="dl">&#9664; Dodge</button><button class="d" id="bl">&#128737; Block</button><button class="d" id="dr">Dodge &#9654;</button></div>
    <div class="row" id="corner" hidden><button class="d" id="cw">Water</button><button class="d" id="ct">Towel</button><button class="d" id="cd">A word</button></div>

    <div class="row one" id="bellrow"><button class="x" id="go">Ring the bell</button></div>
  </div>
  <button class="skipwalk" id="skipwalk" hidden>Skip the walk-in</button>
  <div class="load" id="load">LOADING THE ROOF…</div>
</div>

const SHOTS={corner:{pos:()=>new T.Vector3(-0.15,1.15,3.55),look:()=>new T.Vector3(-1.78,0.72,1.85)},shoulder:{pos:()=>camBase.clone(),look:()=>LOOK.clone()},tv:{pos:()=>new T.Vector3(2.35,1.22,0.1),look:()=>new T.Vector3(-0.05,1.05,-0.15)},low:{pos:()=>new T.Vector3(-1.7,0.5,1.9),look:()=>new T.Vector3(0,0.9,-0.55)},crowd:{pos:()=>new T.Vector3(0.3,2.7,4.6),look:()=>new T.Vector3(-0.2,1.0,-1.6)}};
let walkCam=null;
const runnerMat=new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.2,blending:T.AdditiveBlending,depthWrite:false});
const runner=new T.Mesh(new T.PlaneGeometry(1.8,9),runnerMat);runner.rotation.x=-Math.PI/2;runner.position.set(-0.5,.014,0);runner.visible=false;scene.add(runner);
const runnerLights=[];for(let i=0;i<4;i++){const l=new T.PointLight(0xffffff,0,4.6,2);l.position.set(-.5,1.7,0);l.visible=false;scene.add(l);runnerLights.push(l);}
function aisleOn(x,z0,z1,color){runner.position.set(x,.014,(z0+z1)/2);runner.scale.set(1,Math.abs(z1-z0)/9,1);runnerMat.color.set(color);runner.visible=true;runnerLights.forEach((l,i)=>{l.color.set(color);l.intensity=8;l.visible=true;l.position.set(x,1.7,z0+(z1-z0)*(i+.5)/4);});}
function aisleOff(){runner.visible=false;runnerLights.forEach(l=>{l.visible=false;l.intensity=0;});}
function walkPos(){if(!walkCam)return camBase.clone();const p=walkCam.F.root.position,s=walkCam.s,sway=Math.sin(performance.now()/1500);
  if(walkCam.mode==='front')return new T.Vector3(p.x+sway*0.55,1.52+Math.sin(performance.now()/2100)*.07,p.z-s*3.3);
  return new T.Vector3(p.x+0.75+sway*0.3,2.16,p.z+s*3.7);}/* stood well back: on a tall phone a close shot is all shoulders */
function walkLook(){if(!walkCam)return LOOK.clone();const p=walkCam.F.root.position,s=walkCam.s;
  if(walkCam.mode==='front')return new T.Vector3(p.x,1.24,p.z);
  return new T.Vector3(p.x-s*0.08,1.32,p.z-s*1.7);}
function camWalk(F,mode,ms){walkCam={F:F,mode:mode,s:Math.sign(F.root.position.z)||1};SHOTS.walk={pos:walkPos,look:walkLook};shot('walk',ms||0);}
function camWalkOff(){walkCam=null;}
// stepping through the ropes gets its own camera, stood inside the ring where nobody can cross it
function entryShot(side,ms){SHOTS.entry=side==='N'?{pos:()=>new T.Vector3(0.15,1.4,0.5),look:()=>new T.Vector3(1.15,1.05,-2.35)}:{pos:()=>new T.Vector3(0.05,1.4,-0.4),look:()=>new T.Vector3(-1.35,1.05,2.35)};camWalkOff();shot('entry',ms||700);}
let curShot='shoulder',camFrom=null,camTo=null,camT=0,camMs=0,lookFrom=null,lookTo=null,manualUntil=0,autoCut=0,slow=1;
function shot(name,ms){const S2=SHOTS[name];if(!S2)return;curShot=name;recentre();if(!ms){cam.position.copy(S2.pos());look.copy(S2.look());camTo=null;return;}camFrom=cam.position.clone();camTo=S2.pos();lookFrom=look.clone();lookTo=S2.look();camT=0;camMs=ms;}
function actionLook(){
  if(YOU&&BOSS){const m=YOU.root.position.clone().add(BOSS.root.position).multiplyScalar(.5);m.y=1.2;return m;}
  return LOOK.clone();}
function camTick(dt){liftFrame();if(posing&&fightOver&&!document.getElementById('fighters').hidden){poseFrame();return;}
  if(curShot==='walk'&&walkCam&&!camTo){cam.position.lerp(walkPos(),Math.min(1,dt*3.5));look.lerp(walkLook(),Math.min(1,dt*5));}
  // the card walk: she is moving, so her camera moves with her instead of aiming where she used to be
  if((curShot==='girl'||curShot==='girlclose')&&!camTo&&GIRL){const S3=SHOTS[curShot];cam.position.lerp(S3.pos(),Math.min(1,dt*3));look.lerp(S3.look(),Math.min(1,dt*4));}
  if(curShot==='tv'&&!camTo&&YOU&&BOSS){const a=YOU.root.position,b=BOSS.root.position,mid=a.clone().add(b).multiplyScalar(.5),d=a.distanceTo(b);const want=new T.Vector3(2.05+d*.5,1.2,mid.z+.05);cam.position.lerp(want,Math.min(1,dt*3));look.lerp(new T.Vector3(mid.x-.05,1.0,mid.z),Math.min(1,dt*3));}if(!camTo&&!walkCam&&curShot!=='tv'&&curShot!=='walk'&&curShot!=='entry'&&curShot!=='girl'&&curShot!=='girlclose'){
    const t=(YOU&&!$('corner').hidden)?YOU.root.position.clone().setY(1.25):((!fightOver||running||downState)?actionLook():null);
    if(t)look.lerp(t,Math.min(1,dt*2.0));}
  if(camTo){camT+=dt*1000;const t=Math.min(1,camT/camMs),e=1-Math.pow(1-t,3);cam.position.lerpVectors(camFrom,camTo,e);look.lerpVectors(lookFrom,lookTo,e);if(t>=1)camTo=null;}if(Math.abs(cam.fov-fovBase)>.01){cam.fov+=(fovBase-cam.fov)*Math.min(1,dt*6);cam.updateProjectionMatrix();}}
let rollAmt=0,rollUntil=0;
function roll(a,ms){rollAmt=a*(Math.random()<.5?-1:1);rollUntil=performance.now()+ms;}
function punchIn(){cam.fov=fovBase*.85;cam.updateProjectionMatrix();}
function slowMo(ms){slow=.3;setTimeout(()=>slow=1,ms);}
// the director: during a round it cuts between the TV view and your shoulder every few seconds unless you picked a camera yourself
// the director. In the preview it never sits still: it works the whole room,
// ringside, over the shoulder, down on the canvas, up in the house.
const AUTOCUTS=['tv','shoulder','low','crowd','corner','tv','shoulder','low'];
setInterval(()=>{
  if(performance.now()<manualUntil)return;
  if(curShot==='walk'||curShot==='entry'||curShot==='girl')return;
  if(auto&&!downState){shot(AUTOCUTS[(++autoCut)%AUTOCUTS.length],750);return;}
  if(!running||downState)return;
  if(++autoCut%3===0)shot(curShot==='tv'?'shoulder':'tv',600);},3400);
// nothing is ever right up against the lens: if the camera ends a move too close to what it
// is looking at, it backs off along its own sight line rather than filling the frame with a body
function camClear(p,l,min){const v=p.clone().sub(l);const d=v.length();if(d>=min)return p;
  if(d<0.02)v.set(0,0.2,1);v.normalize();return l.clone().add(v.multiplyScalar(min));}
function frame(){const dt0=clock.getDelta(),dt=dt0*slow;camTick(dt0);
  if(aura&&BOSS){const pulse=1+Math.sin(performance.now()/650)*.06;aura.scale.set(3.6*pulse,3.6*pulse,1);aura.material.opacity=.75+Math.sin(performance.now()/650)*.1;const bp=BOSS.root.position,dir=bp.clone().sub(cam.position);dir.y=0;dir.normalize();aura.position.set(bp.x+dir.x*1.1,1.25,bp.z+dir.z*1.1);rim.position.set(bp.x+dir.x*2.6,1.5,bp.z+dir.z*2.6);floorGlow.position.set(bp.x+dir.x*.3,.012,bp.z+dir.z*.3);if(YOU){const yp=YOU.root.position;fillYou.position.set(yp.x-dir.x*1.2+0.3,1.9,yp.z-dir.z*1.2);}}for(const p of PROPS)if(p.userData.ember)p.material.color.setHex(Math.random()<.1?0xffc27a:0xff7a2b);if(BOSS)BOSS.mixer.update(dt);if(YOU)YOU.mixer.update(dt);
  sparkTick(dt0);sweatTick(dt0);trailTick(dt0);tweenTick(dt0);elemTick(dt0);shaftTick();if(followWho){const p=followWho.root.position;walkSpot.position.set(p.x,4.6,p.z+0.6);walkSpot.target.position.set(p.x,0.9,p.z);walkSpot.target.updateMatrixWorld();}
  if(REF&&!fightOver&&!downState&&curShot!=='walk'&&curShot!=='entry'&&performance.now()>refLock&&YOU&&BOSS){
    const m=YOU.root.position.clone().add(BOSS.root.position).multiplyScalar(.5);
    const want=Math.atan2(m.x-ref.position.x,m.z-ref.position.z);let d=want-ref.rotation.y;
    while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;ref.rotation.y+=d*Math.min(1,dt0*2.2);}
  if(REF)REF.mixer.update(dt);if(ANN)ANN.mixer.update(dt);if(GIRL)GIRL.mixer.update(dt);for(const k in CORNER)CORNER[k].mixer.update(dt);if(card&&card.visible&&cardHand){const h=new T.Vector3();cardHand.getWorldPosition(h);const toCam=cam.position.clone().sub(h).setY(0).normalize();card.position.copy(h).add(new T.Vector3(0,0.22,0)).addScaledVector(toCam,0.16);card.lookAt(cam.position);}crowdTick(dt);
  if(shake>0){const S2=SHOTS[curShot]||SHOTS.shoulder;const base=camTo?cam.position.clone():S2.pos();cam.position.x=base.x+(Math.random()-.5)*shake;cam.position.y=base.y+(Math.random()-.5)*shake;shake*=.85;if(shake<.004){shake=0;if(!camTo)cam.position.copy(S2.pos());}}
  camDrift(dt0);if(performance.now()<kickUntil)cam.position.add(kick);const _p=cam.position.clone();const _l=look.clone();_l.y-=(fovBase-48)*0.011;/* a wide lens on a tall phone leaves sky at the top, so aim a little lower and lift everyone up the frame */cam.position.copy(camClear(orbit(cam.position,_l),_l,1.15));cam.lookAt(_l);if(performance.now()<rollUntil){cam.rotateZ(rollAmt*(1-(rollUntil-performance.now())/900));}R.render(scene,cam);cam.position.copy(_p);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
