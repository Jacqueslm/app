/* The pass mark for day 30. */
var EXAM_PASS = 16;

/* Each section opens and shuts like a herb card does, so the page keeps one
   way of doing it — the click handler on the view already toggles by data-h. */
function bsec(b,i){
  var id='bk'+i, open=openId===id;
  var out='<div class="card'+(open?' open':'')+'" data-h="'+id+'">'
   +'<div class="row"><div class="row-txt"><b>'+esc(b.h)+'</b>'
   +(b.s?'<span>'+esc(b.s)+'</span>':'')+'</div><div class="chev">&#8250;</div></div>'
   +'<div class="body">';
  (b.rows||[]).forEach(function(r){ out+='<p><b>'+esc(r[0])+'</b> &mdash; '+esc(r[1])+'</p>' });
  if(b.note) out+='<div class="big '+(b.noteCls||'warnbox')+'">'+b.note+'</div>';
  out+='</div></div>';
  return out;
}

var KEY='tsid_herb_notes_v1';
var store={};
try{ store=JSON.parse(localStorage.getItem(KEY)||'{}')||{} }catch(e){ store={} }
var tab='az', openId=null, q='';

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)) }catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}) }
function mineList(){ return Object.keys(store).filter(function(k){ return k.indexOf('herb:')===0 }) }
function noteOf(id){ var v=store['herb:'+id]; return v&&v.note?String(v.note):'' }
function ownOf(id){ var v=store['herb:'+id]; return v&&v.own?String(v.own):'' }

/* A herb the person added from the book joins the same list, so search finds it
   the same way. Marked so the page never pretends it came from here. */
function allHerbs(){
  var own=Object.keys(store).filter(function(k){ return k.indexOf('own:')===0 }).map(function(k){
    var o=store[k];
    return {n:o.n,a:'added by you',u:o.u||'',d:o.d||'',h:o.h||'',c:o.c||'',t:[],own:1,id:k};
  });
  return HERBS.map(function(h,i){ h=Object.assign({},h); h.id='h'+i; return h; }).concat(own);
}

/* ── THE THIRTY DAYS ──────────────────────────────────────────────────────────
   Progress lives in the same store as the notes, one key a day. Nothing is
   sent anywhere, there is no clock on it, and an answer can be changed —
   changing it just changes the score. The test on day 30 is checked here on
   the phone, the same way every other day is.
--------------------------------------------------------------------------- */
function dayRec(d){ var r=store['day:'+d]; if(!r||!r.a) return {a:[]}; return r }
function picked(d,qi){ var r=dayRec(d); return typeof r.a[qi]==='number' ? r.a[qi] : -1 }
function dayOf(d){ var o=null; COURSE.forEach(function(x){ if(x.d===d) o=x }); return o }
function dayScore(d){
  var day=dayOf(d); if(!day) return {right:0,total:0,done:false};
  var right=0, answered=0;
  day.q.forEach(function(q,i){ var p=picked(d,i); if(p>-1){ answered++; if(p===q.k) right++ } });
  return {right:right, total:day.q.length, done:answered===day.q.length};
}
function daysDone(){ var n=0; COURSE.forEach(function(x){ if(x.d<30 && dayScore(x.d).done) n++ }); return n }
function answer(d,qi,oi){
  var r=dayRec(d); r.a[qi]=oi; store['day:'+d]=r; save();
}

function courseDay(day){
  var rec=dayScore(day.d), open=openId==='d'+day.d;
  var out='<div class="card'+(open?' open':'')+'" data-h="d'+day.d+'">'
   +'<div class="row"><div class="row-txt"><div class="dayno">Day '+day.d+(day.test?' \u00b7 the test':' of 30')+'</div>'
   +'<b>'+esc(day.t)+'</b><span>'+esc(day.s)+(rec.done?' &middot; '+rec.right+' of '+rec.total+' right':'')+'</span></div>'
   +'<div class="chev">&#8250;</div></div><div class="body">';
  (day.p||[]).forEach(function(t){ out+='<p>'+esc(t)+'</p>' });
  if(day.bk) out+='<div class="big okbox"><b>From the books &middot; their line</b>'+esc(day.bk)+'</div>';
  if(day.note) out+='<div class="big warnbox"><b>This page\u2019s own line</b>'+esc(day.note)+'</div>';
  out+='<div class="lbl">'+(day.test?'The test \u00b7 twenty questions':'Day '+day.d+' quiz')+'</div>';
  day.q.forEach(function(q,i){
    var p=picked(day.d,i);
    out+='<div class="qbox"><p class="qt">'+(i+1)+'. '+esc(q.q)+'</p>';
    q.a.forEach(function(t,oi){
      out+='<button class="opt'+(p===oi?(oi===q.k?' right':' wrong'):'')+'" data-ans="'+day.d+':'+i+':'+oi+'">'+esc(t)+'</button>';
    });
    if(p>-1) out+='<div class="why">'+(p===q.k?'Right. ':'The answer is \u201c'+esc(q.a[q.k])+'\u201d. ')+esc(q.w)+'</div>';
    out+='</div>';
  });
  if(rec.done){
    if(day.test){
      var pass=rec.right>=EXAM_PASS;
      out+='<div class="big '+(pass?'okbox':'redbox')+'"><b>'+(pass?'Passed':'Not yet')+'</b>'+rec.right+' of '+rec.total
        +'. '+(pass?'The pass mark was '+EXAM_PASS+'. Every day of this course is now yours.':'The pass mark is '+EXAM_PASS+'. Take it again as many times as you like, and read the days the reasons point back to.')+'</div>';
    }else{
      out+='<div class="done">Day '+day.d+' done &middot; '+rec.right+' of '+rec.total+' right.</div>';
    }
  }
  return out+'</div></div>';
}

function courseView(){
  var done=daysDone(), t=dayScore(30);
  var test=t.done ? 'The test: '+t.right+' of '+t.total+(t.right>=EXAM_PASS?' \u2014 passed':' \u2014 the pass mark is '+EXAM_PASS+'. Take it again whenever you like.')
                  : 'The test is day 30. Sixteen out of twenty is a pass. More than one answer can be changed, and the test can be taken again as many times as you like.';
  return '<div class="sec">'
   +'<div class="prog"><b>'+done+' of 29 days done</b>'
   +'<div class="bar"><i style="width:'+Math.round(done/29*100)+'%"></i></div>'
   +'<span>'+test+'</span></div>'
   +'<div class="big okbox"><b>Thirty days, beginner to the end</b>A day of teaching, a short quiz under it, and the test on the last day. Every day is built out of the two books already behind this library, and each quiz tells you why the answer is the answer. Nothing is timed, nothing is sent anywhere, and nothing here has to be bought.</div>'
   +'<div class="sec-hd">The days</div>'
   +COURSE.map(courseDay).join('')
   +'</div>';
}

function render(){
  var v=document.getElementById('view'), out='';
  var list=allHerbs();

  if(tab==='az' || tab==='need'){
    var shown=[];
    if(tab==='az'){
      shown=list.slice().sort(function(a,b){ return a.n.localeCompare(b.n) });
    }else{
      NEEDS.forEach(function(nd){
        var group=list.filter(function(h){ return (h.t||[]).indexOf(nd.k)>-1 });
        if(!group.length) return;
        out+='<div class="sec"><div class="sec-hd">'+esc(nd.t)+(nd.s?' &middot; '+esc(nd.s):'')+'</div>';
        group.sort(function(a,b){ return a.n.localeCompare(b.n) });
        out+=group.map(card).join('')+'</div>';
      });
      shown=null;
    }
    if(shown){
      out='<div class="sec">';
      out+=shown.map(card).join('');
      out+='</div>';
    }
    if(q){
      out='<div class="sec">';
      var hits=list.filter(match);
      out+= hits.length ? '<div class="sec-hd">'+hits.length+' found</div>'+hits.map(card).join('')
        : '<div class="empty">Nothing here matches that.<br>Try a plant name, or a word like <b>sleep</b>, <b>stomach</b>, <b>throat</b>.</div>';
      out+='</div>';
    }
    if(!q && !out) out='<div class="empty">Nothing on this shelf yet.</div>';
  }

  if(tab==='books'){
    out='<div class="sec">'+BOOKS.map(bsec).join('')+'</div>';
  }

  if(tab==='course'){
    out=courseView();
  }

  if(tab==='safety'){
    out=
    '<div class="sec">'
    +'<div class="big redbox"><b>An infection is a doctor, not a tea</b>Nothing in this library treats an infection. Not oregano oil, not goldenseal, not garlic. A fever that will not come down, a wound going red and hot, a chest that rattles, a tooth gone bad, anything yellow or green coming up — that is a doctor today, not a herb.</div>'
    +'<div class="big warnbox"><b>Coming off alcohol or a drug</b>Alcohol withdrawal can kill. It is not something to sit out with chamomile and valerian. If you have been drinking heavily and stop, that is a doctor or a hospital, and the timeline page in the app says the same thing. Herbs do not belong in that week.</div>'
    +'<div class="big warnbox"><b>If you take any medication</b>St John\u2019s wort alone interferes with antidepressants, birth control, blood thinners and HIV medicine. Licorice and hibiscus move blood pressure. Ginger, ginkgo, turmeric, garlic and white willow all thin the blood. Ask a pharmacist before you add a herb to what you already take — one question, free, in any chemist.</div>'
    +'<div class="big warnbox"><b>Kratom is not in this library</b>It is sold as a herb. It acts on the same receptors as opioids and it is addictive — people come off it with withdrawal like any opioid. It has no place here.</div>'
    +'<div class="big warnbox"><b>Pregnancy and children</b>Most of this list is not for pregnancy. Raspberry leaf is the one people talk about, and even that is a midwife\u2019s call. Children are not small adults for dosing — a few of these are genuinely dangerous for a baby, goldenseal and comfrey root especially.</div>'
    +'<div class="big warnbox"><b>Liver</b>Comfrey is never taken internally. Kava and several cleanse brews put strain on a liver that is already tired. If you have been hard on your body and you want to clean it up, food and water and time do that. A tea does not.</div>'
    +'<div class="big okbox"><b>What this page is</b>What these plants do, and what the two books say they do. The claims are made here plainly, because this is a private shelf for two people and their own books (15 Sep 2026). What still holds is at the top of this tab: an infection, withdrawal, a chest that hurts to breathe or a bleed that will not stop is a doctor.'
    +'</div>';
  }

  if(tab==='mine'){
    var withNotes=list.filter(function(h){ return noteOf(h.id) });
    var owns=Object.keys(store).filter(function(k){ return k.indexOf('own:')===0 });
    out='<div class="sec">'
      +'<div class="sec-hd">Add a herb from the book</div>'
      +'<div class="addf">'
      +'<label>Herb</label><input id="an" placeholder="Name as the book has it">'
      +'<label>What people use it for</label><input id="au" placeholder="One line">'
      +'<label>What the book says</label><textarea id="ad" placeholder="Type it as you read — page, and the words"></textarea>'
      +'<label>Caution, if the book gives one</label><input id="ac">'
      +'<button class="txtbtn" id="aadd">Save it</button>'
      +'</div>'
      +'<div class="sec-hd">Your notes'+(withNotes.length?' ('+withNotes.length+')':'')+'</div>';
    if(!withNotes.length) out+='<div class="empty">No notes yet. Open any herb and write what the book says about it, or what happened when you used it. It stays on this phone.</div>';
    withNotes.forEach(function(h){
      out+='<div class="card"><div class="row" data-h="'+esc(h.id)+'"><div class="row-txt"><b>'+esc(h.n)+'</b><span>'+esc(h.u)+'</span>'
        +(noteOf(h.id)?'<div class="mine-note">'+esc(noteOf(h.id))+'</div>':'')
        +'</div></div></div>';
    });
    out+='</div>';
  }

  v.innerHTML=out;
  if(tab==='mine'){
    var b=document.getElementById('aadd');
    if(b)b.onclick=function(){
      var n=document.getElementById('an').value.trim();
      if(!n) return;
      var id='own:'+Date.now();
      store[id]={n:n,u:document.getElementById('au').value.trim(),d:document.getElementById('ad').value.trim(),c:document.getElementById('ac').value.trim(),own:1};
      save(); render();
    };
  }
}

function match(h){
  var hay=[h.n,h.a,h.u,h.d,h.h,h.c,h.bk].join(' ').toLowerCase();
  return hay.indexOf(q)>-1;
}

function card(h){
  var open=openId===h.id;
  return '<div class="card'+(open?' open':'')+'" data-h="'+esc(h.id)+'">'
  +'<div class="row"><div class="row-txt"><b>'+esc(h.n)+'</b><span>'+esc(h.u)
  +(h.a&&h.a!=='added by you'?' &middot; '+esc(h.a):'')+(h.own?' <span class="pill">yours</span>':'')
  +'</span></div><div class="chev">&#8250;</div></div>'
  +'<div class="body">'
  +(h.d?'<div class="lbl">What it does</div><p>'+esc(h.d)+'</p>':'')
  +(h.h?'<div class="lbl">How it is traditionally taken</div><p>'+esc(h.h)+'</p>':'')
  +(h.c?'<div class="lbl">Caution</div><p>'+esc(h.c)+'</p>':'')
  +(h.bk?'<div class="lbl">From the books</div><p>'+esc(h.bk)+'</p>':'')
  +'<div class="lbl">Read aloud</div>'
  +'<div class="saybar"><button class="txtbtn" data-say="'+esc(h.id)+'">Read it to me</button>'
  +'<button class="txtbtn" data-saystop="1" hidden>Stop</button></div>'
  +'<div class="lbl">What your book says</div>'
  +'<div class="note"><textarea data-note="'+esc(h.id)+'" placeholder="As you read, put it here — the page and the words.">'+esc(noteOf(h.id))+'</textarea><div class="saved">Saved on this phone as you type. Nothing is sent anywhere.</div></div>'
  +'</div></div>';
}

/* An answer to a quiz question, on any day including the test. The day stays
   open and the score under it updates where it stands. */
document.getElementById('view').addEventListener('click',function(e){
  var b=e.target.closest && e.target.closest('[data-ans]');
  if(!b) return;
  var p=b.getAttribute('data-ans').split(':');
  answer(Number(p[0]),Number(p[1]),Number(p[2]));
  openId='d'+p[0];
  render();
});
document.getElementById('view').addEventListener('click',function(e){
  var row=e.target.closest('.row'); if(!row) return;
  var cardEl=row.closest('.card'); if(!cardEl) return;
  var id=cardEl.getAttribute('data-h');
  openId = openId===id ? null : id;
  render();
});
document.getElementById('view').addEventListener('input',function(e){
  var id=e.target.getAttribute && e.target.getAttribute('data-note');
  if(!id) return;
  var v=store['herb:'+id]||{};
  v.note=e.target.value; store['herb:'+id]=v; save();
});
document.getElementById('q').addEventListener('input',function(e){
  q=e.target.value.trim().toLowerCase();
  if(q && tab!=='az'){ tab='az'; document.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('on',x.getAttribute('data-t')==='az') }) }
  render();
});
document.querySelectorAll('.tab').forEach(function(el){
  el.onclick=function(){
    tab=el.getAttribute('data-t'); openId=null;
    document.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('on',x===el) });
    render();
  };
});
/* ── THE VOICE ────────────────────────────────────────────────────────────────
   The phone reads the entry out loud, with the voice already on it.

   speechSynthesis is built into the browser, so nothing leaves the phone,
   nothing is charged, there is no key and no server, and it works with no
   signal — which is the point. It reads only what is already written on the
   page: the same words in the same order, caution included. If the phone has no
   voice of its own the button says so instead of doing nothing.
--------------------------------------------------------------------------- */
var SAY_BUSY=null;
function speechOK(){
  return typeof speechSynthesis!=='undefined' && typeof SpeechSynthesisUtterance!=='undefined';
}
function sayLabel(text){
  Array.prototype.forEach.call(document.querySelectorAll('[data-say]'),function(x){ x.textContent=text });
}
function sayStop(){
  if(speechOK()){ try{ speechSynthesis.cancel() }catch(e){} }
  SAY_BUSY=null;
  sayLabel('Read it to me');
  Array.prototype.forEach.call(document.querySelectorAll('[data-saystop]'),function(x){ x.hidden=true });
}
/* The entry, word for word, in the order the card shows it. */
function sayText(h){
  var s=h.n;
  if(h.a&&h.a!=='added by you') s+='. Also called '+h.a;
  s+='. ';
  if(h.u) s+='What people use it for: '+h.u+'. ';
  if(h.d) s+=h.d+' ';
  if(h.h) s+='How it is traditionally taken: '+h.h+' ';
  if(h.c) s+='Caution: '+h.c+' ';
  if(h.bk) s+='From the books: '+h.bk+' ';
  return s;
}
function say(id){
  var h=null;
  allHerbs().forEach(function(x){ if(x.id===id) h=x });
  if(!h) return;
  if(!speechOK()){ sayLabel('This phone has no voice'); return; }
  if(SAY_BUSY===id){ sayStop(); return; }
  try{ speechSynthesis.cancel() }catch(e){}
  var u=new SpeechSynthesisUtterance(sayText(h));
  u.onend=function(){ if(SAY_BUSY===id) sayStop() };
  u.onerror=function(){ if(SAY_BUSY===id) sayStop() };
  SAY_BUSY=id;
  sayLabel('Read it to me');
  Array.prototype.forEach.call(document.querySelectorAll('[data-saystop]'),function(x){ x.hidden=false });
  try{ speechSynthesis.speak(u) }catch(e){ sayStop() }
}

/* The read-aloud button inside an open herb. The phone's own voice reads the
   entry as it stands on this page — name, what it is used for, what it does,
   how it is traditionally taken, the caution and the book line. Nothing is
   added and nothing is left out, and the caution is read like the rest. */
document.getElementById('view').addEventListener('click',function(e){
  var b=e.target.closest('[data-say]');
  if(!b) return;
  say(b.getAttribute('data-say'));
});
document.getElementById('view').addEventListener('click',function(e){
  if(!e.target.closest('[data-saystop]')) return;
  sayStop();
});


render();
