{n:"Bee balm",a:"bergamot, wild bergamot, Oswego tea",u:"A raw throat, a cold coming on",t:["cold","fever"],d:"A North American mint the Oswego people brewed for a sore throat long before gardens grew it under the name bergamot. The crushed leaf smells of citrus.",h:"Leaf, fresh or dried, brewed and drunk warm.",c:"It is a mint, so it loosens the valve at the top of the stomach — keep it away from a reflux you already have. A throat that is closing, or a throat with a fever that will not come down, is a doctor."},
{n:"Beetroot",a:"beet, beetroot juice",u:"Blood pressure, stamina, a tired body",t:["heart","energy"],d:"The red root of the garden, eaten as food everywhere and drunk as juice by athletes for the work it does on the blood vessels in the tradition.",h:"Cooked as food, or the juice.",c:"It lowers blood pressure — with tablets for blood pressure it can go too low, and it can make you dizzy standing up. It turns urine and stool red, which is harmless. High in oxalate, so a kidney that makes stones should go easy."},
{n:"Bitter melon",a:"bitter gourd, karela, Momordica charantia",u:"Blood sugar, a heavy stomach",t:["digestion","energy"],d:"A knobbly green gourd of Asia and the Caribbean, cooked as food and brewed as a tea for a slow stomach and for blood sugar.",h:"Unripe fruit in cooking; or the sliced fruit steeped as a tea.",c:"It lowers blood sugar and stacks with diabetes medicine. Not in pregnancy. The seeds and the ripe skin are not the usual material — the unripe fruit is. Food amounts are food."},
{n:"Bitter orange",a:"Seville orange peel, Citrus aurantium, neroli's fruit",u:"Digestion, a blocked nose, appetite",t:["digestion","cold"],d:"The peel of the sour orange that neroli and marmalade come from, brewed for a sluggish digestion and a nose that is blocked.",h:"Dried peel, tea.",c:"It is a stimulant and it pushes up blood pressure and heart rate — not with heart medicine, not with a MAOI, not before surgery, not with a heart condition. It has been in slimming pills that caused real harm."},
{n:"Blackberry leaf",a:"bramble leaf, Rubus fruticosus",u:"A loose stomach, a sore throat, the gums",t:["digestion","mouth"],d:"The leaf of the bramble, gathered in autumn after the fruit and brewed as a drying tea for a loose stomach and a gargle for a rough throat and soft gums.",h:"Leaf, tea; cooled to rinse the mouth.",c:"Gentle as a tea. Not in quantity in pregnancy — the leaf has been used to bring labour on, which is exactly why it is a midwife's call."},
{n:"Blessed thistle",a:"holy thistle, Cnicus benedictus",u:"Digestion, appetite, milk coming in",t:["digestion","women"],d:"A thorny Mediterranean thistle, a bitter herb of the monasteries, brewed to get a slow stomach moving and, in the old women's books, to bring milk after a birth.",h:"Leaf and flower, tea — very bitter.",c:"Not in pregnancy. The milk tradition is a midwife's decision, not something to pour for yourself. Large amounts upset the stomach."},
{n:"Boldo",a:"Peumus boldus leaf",u:"A heavy liver feeling, slow digestion",t:["liver","digestion"],d:"An evergreen leaf of Chile, brewed as a bitter after-dinner tea for a heavy feeling under the ribs and a slow digestion.",h:"Leaf, tea, short stretches.",c:"Leaf tea only, and not for months on end. Never with a liver that is already damaged, never in pregnancy. The essential oil is poisonous — it is not the tea."},
{n:"Borage",a:"starflower, Borago officinalis",u:"Strain, skin, an old tonic",t:["skin","mood"],d:"The blue star flower of the old herb gardens, brewed as a tonic for a stretched and tired body and used on the skin.",h:"Leaf and flower in small amounts, tea. The seed oil is a separate thing.",c:"The leaf carries liver-toxic compounds — small amounts, short use, never in pregnancy, never for a child. The pressed seed oil is not the same as the leaf."},
{n:"Butterbur",a:"Petasites, butterbur root",u:"Migraine, hay fever",t:["pain","cold"],d:"A big-leaved waterside plant of the old European lists, used as a preventive in the tradition for a migraine that keeps coming and for hay fever.",h:"A prepared root extract with the liver-toxic alkaloids taken out — that is the only form sold.",c:"The raw plant is hard on the liver; only a preparation with the alkaloids removed. Not in pregnancy, not for a child. It is a preventive in the tradition and not a cure for a headache that is new and the worst of your life — that is an emergency."},
{n:"Chlorella",a:"freshwater alga, Chlorella vulgaris",u:"Food, digestion, an old green supplement",t:["digestion","energy"],d:"A green alga eaten as a food supplement, sold as a green powder and a tablet since the middle of the last century.",h:"Powder or tablets as food. It is not brewed.",c:"Buy from a source that tests it — algae hold heavy metals out of the water they grow in. Thins the blood a little. Not with immune-suppressing medicine or an autoimmune condition without asking. Not a metal chelator; that is a hospital treatment."},
{n:"Cilantro",a:"coriander leaf, Chinese parsley",u:"A heavy stomach, and the metal-cleansing talk",t:["digestion"],d:"The leaf of the coriander plant, eaten in handfuls across the world as a food and used in teas for a heavy, gassy stomach.",h:"A food herb. Eaten in cooking or steeped fresh.",c:"It is food. The claim that it lifts heavy metals out of a person is not established, and it must never stand in front of real treatment for poisoning."},
{n:"Cinnamon",a:"Ceylon cinnamon, cassia, dalchini",u:"Blood sugar, a heavy stomach, warmth",t:["digestion","heart"],d:"The inner bark of a tropical laurel, rolled and dried, simmered for a slow stomach and for blood sugar, and used in food wherever it grows.",h:"Bark, simmered or steeped; or in cooking.",c:"The cheap cassia has a lot of coumarin, which is hard on the liver in daily spoonfuls — Ceylon is the gentler one for everyday use. Not in medicine doses with blood thinners, and not in pregnancy beyond food."},
{n:"Coconut",a:"coconut oil, coconut water",u:"Skin, food, water in the heat",t:["skin","energy"],d:"The fruit of the coastal palm, eaten and drunk across the tropics, with the pressed oil used on the skin and the hair.",h:"Flesh and water as food; oil on the outside.",c:"The oil on the skin is food grade and fine, though it blocks pores for some faces. Coconut water carries potassium — a kidney that is unwell should not drink a lot of it."},
{n:"Cowhage",a:"velvet bean, Mucuna pruriens",u:"Worms in the old books, and it carries levodopa",t:["digestion","mood"],d:"The seed of a tropical climbing bean, used in the tradition against intestinal worms. The second fact about it matters more: the seed carries levodopa, the substance Parkinson's medicine is made of.",h:"Seed, ground. In the West it is sold as a mood and libido supplement.",c:"Never with Parkinson's medicine, never with an antidepressant or any psychiatric medicine, and never for a low mood — it can push dopamine too far and cause real harm. The hairs on the pod are an itch powder, not for the skin. Not in pregnancy."},
{n:"Epazote",a:"Mexican tea, Dysphania ambrosioides",u:"Gas, beans, an old worm tea",t:["digestion"],d:"A strong-smelling Mexican herb cooked into beans, where it is put to cut the gas they cause, and brewed in the tradition against worms.",h:"A few leaves in the cooking pot.",c:"The leaf in a pot of beans is food. The oil and strong brews are poisonous and have killed people — never on their own, never in pregnancy, never for a child."},
{n:"Fig",a:"fig fruit, fig leaf, Ficus carica",u:"A slow bowel, food, calcium in the tradition",t:["digestion"],d:"The fruit of the Mediterranean tree, dried and kept for a slow bowel, and the leaf brewed in the tradition for blood sugar and breathing.",h:"Dried fruit as food; leaf as a tea.",c:"The sap of the leaf and the green fruit burns skin in sunlight. Ripe figs are food and a mild laxative — a lot of them is a stomach ache, not a treatment."},
{n:"Fumitory",a:"earth smoke, Fumaria officinalis",u:"Skin, a sluggish liver",t:["liver","skin"],d:"A delicate grey-green weed of European fields, named for the way it looks like smoke, brewed as a bitter tea for the skin and the liver in the old books.",h:"Whole herb, tea or tincture.",c:"Not in pregnancy. It can be hard on a liver that is already strained, and it can make the skin more sensitive to sunlight."},
{n:"Gravel root",a:"Joe-Pye weed, Eupatorium purpureum",u:"Kidney stones, water that will not pass",t:["urinary"],d:"A tall purple-headed North American meadow plant, its root brewed by the people there and by the settlers for gravel — stones — in the kidney and for urine that would not come.",h:"Root, decoction.",c:"A stone that blocks the flow, with pain in the back and blood in the urine, is a hospital today — not a tea. Not in pregnancy."},
{n:"Grindelia",a:"gumweed, Grindelia robusta",u:"A chest that rattles, an old asthma tea",t:["lungs","cold"],d:"A sticky yellow daisy of the American west, its buds brewed as a tea for a chest that rattles and for wheezing.",h:"Flower buds and leaf, tea.",c:"Asthma bad enough to need a reliever is not a herb problem — keep the inhaler and see a doctor. Not for a kidney that is already unwell."},
{n:"Guava leaf",a:"Psidium guajava leaf",u:"Running diarrhoea, blood sugar, the gums",t:["digestion","mouth"],d:"The leaf of the guava tree, brewed across the tropics for a bowel that is running and used as a rinse for the gums.",h:"Leaf, tea.",c:"Drink water and salt with it — diarrhoea takes water out of a person and a tea does not put it back. Blood in the stool, or diarrhoea with a fever, is a doctor."},
{n:"Guggul",a:"guggulu, Commiphora mukul resin",u:"Cholesterol, stiff joints, a slow thyroid",t:["joints","heart"],d:"The sticky, strongly smelling gum resin of an Indian tree, taken in the tradition for cholesterol and for joints that are stiff and swollen.",h:"Resin, in tablets or a decoction. It is bitter and it is not a tea for pleasure.",c:"It interferes with thyroid tablets, blood thinners and others. Not in pregnancy. Ask a pharmacist before adding it to anything you take."},
{n:"Hemp seed",a:"hemp hearts, Cannabis sativa seed",u:"Food — protein, oils, a tired body",t:["energy","skin"],d:"The seed of the hemp plant, eaten as food for thousands of years — pressed for oil and cooked into bread. The seed is not the part that carries the drug.",h:"Eaten as food or pressed for the oil.",c:"Food, not medicine. The oil goes rancid — keep it cold and dark. It is not a meal; it does not have the vegetables in it."},
{n:"Honeysuckle",a:"jin yin hua, Japanese honeysuckle",u:"A fever, a sore throat, a hot cold",t:["fever","cold"],d:"The sweet white-to-yellow flower of the climbing honeysuckle, brewed in China for a fever and a hot sore throat, and drunk as a cooled tea in summer.",h:"Flower, tea, warm or cooled.",c:"Cooling and mild for most — a short stretch, not a daily drink for months. The berries are not the medicine and are not to be eaten."},
{n:"Jiaogulan",a:"gynostemma, the immortality herb",u:"Long days, blood sugar, cholesterol",t:["energy","heart"],d:"A southern Chinese vine brewed as a sweet green tea by people who called it the herb of immortality. It is one of the few here drunk like ordinary tea, daily.",h:"Leaf, brewed as a tea.",c:"It lowers blood sugar and thins the blood a little — ask first if you take warfarin or diabetes medicine. Stop before surgery."},
{n:"Jojoba",a:"Simmondsia chinensis, jojoba oil",u:"Skin, hair, the scalp",t:["skin","hair"],d:"The seed of a desert shrub of the American south-west, pressed into a liquid wax that is used on the skin and hair because it does not go rancid.",h:"The oil on the outside — skin, scalp, hair ends.",c:"The oil is for the outside. The whole seed is not food: eaten it causes stomach pain and worse. Not the same thing as the oil on the shelf."},
{n:"Kelp",a:"kombu, Laminaria, kelp",u:"Iodine, a slow thyroid, minerals",t:["energy","hair"],d:"A brown seaweed of cold coasts, eaten as food in Japan and dried into flakes and tablets elsewhere. The reason it is on a herb shelf is iodine, and iodine is the thing to be careful with.",h:"Eaten as food; or tablets.",c:"A thyroid that is over-active, or being treated for anything at all, should not get a lot of extra iodine — ask before taking it. Too much iodine can make a thyroid worse in either direction. Food amounts in a soup are food."},
{n:"Knotweed",a:"Japanese knotweed, Polygonum cuspidatum",u:"An old tea for joints and for a tick bite that went on",t:["joints","liver"],d:"A bamboo-like invasive weed, its root brewed in Japan and China for joints and for the blood vessels. It is where most resveratrol on a label comes from.",h:"Root, decoction or a standardised tablet.",c:"It is not a treatment for Lyme disease — that is antibiotics and a doctor, and sitting with a tea is how a tick bite becomes a long illness. Not with blood thinners. Not in pregnancy."},
{n:"Kudzu",a:"Japanese arrowroot, Pueraria montana",u:"A craving for alcohol — the one the old books name",t:["liver","mood"],d:"The big starchy root of the kudzu vine, used as food in Japan and, in the Chinese tradition, given to a heavy drinker whose craving came on hard.",h:"Root or flower brewed as a tea; the starch used in cooking.",c:"It is not a treatment for alcohol withdrawal, and withdrawal can kill — that week is a doctor, as the timeline page in the app says. Not with blood thinners or tamoxifen without asking. Some people flush badly if they drink with it."},
{n:"Lemongrass",a:"lemon grass, Cymbopogon citratus",u:"A slow stomach, a fever, an old tea",t:["digestion","fever"],d:"A tall lemon-scented grass of south Asia, cut and brewed as a tea for a slow stomach and for the heat of a fever, and put in food everywhere it grows.",h:"Stalks and leaf, tea.",c:"Culinary and tea amounts are fine. The essential oil is not for swallowing and never for a baby. It adds to a water tablet if you take one."},
{n:"Lobelia",a:"Indian tobacco, Lobelia inflata",u:"An old lung and smoking herb — and a dangerous one",t:["lungs"],d:"A small North American plant whose whole story is the warning: in a small amount it moves the lungs, in a larger amount it makes a person vomit hard, slows the pulse and has caused deaths.",h:"The tincture, measured in drops — the book gives the dried herb at one teaspoon to four cups of water. It is a herb to measure, not to pour.",c:"A small amount moves the lungs and the larger amount is a poison: it makes a person vomit hard, slows the pulse, and has killed people who guessed the amount. Weigh it or leave it. Not in pregnancy. Not for a child. The old lobelia smoking mixtures were a marketing idea, not medicine."},
{n:"Magnolia bark",a:"hou po, Magnolia officinalis bark",u:"A racing mind at night, a tight chest",t:["sleep","mood"],d:"The bark of the magnolia tree, boiled in the Chinese tradition for a mind that will not settle at night and the tight, blocked feeling that goes with it.",h:"Bark, decoction, or a tincture.",c:"Not in pregnancy — it moves the muscle of the womb. It makes sedatives and sleeping tablets hit harder, so it is not to be stacked with them or with alcohol."},
{n:"Mistletoe",a:"European mistletoe, Viscum album",u:"Blood pressure, an old tonic, and a treatment given by injection",t:["heart"],d:"The winter bush that grows out of a host tree, used in Europe for the heart and blood pressure, and as an injected preparation a doctor gives in some countries.",h:"Leaf and twig as a tea or tincture in the tradition. The injected form is a medical treatment, not a home one.",c:"Do not pick a branch and brew it. The American mistletoe is the poisonous one and the berries of both are not for eating. Not in pregnancy. Not with blood pressure tablets without asking."},
{n:"Mugwort",a:"common mugwort, moxa",u:"Dreams, a heavy cycle, a slow stomach",t:["women","digestion","sleep"],d:"A bitter grey wayside plant, burned as moxa by practitioners and brewed as a tea in Europe for a late heavy cycle and kept by the bed for dreaming.",h:"Leaf, tea. The dried leaf burned near the skin is moxa, which is a practitioner's tool.",c:"Never in pregnancy — it has been used to bring a period on, and that is exactly why it is not safe there. A ragweed or mugwort allergy means care. Long internal use is not wise."},
{n:"Noni",a:"Morinda citrifolia, noni fruit",u:"An old tonic, tiredness, skin",t:["energy","skin"],d:"A lumpy green fruit of the Pacific islands, fermented into a strong-smelling juice and drunk daily there as a tonic, with the leaf used on the skin.",h:"The juice, or the fruit in food; the leaf warmed on the outside.",c:"Noni juice has been reported to injure the liver in some people who drank it, and it is high in potassium — a kidney that is unwell should not take it. Not in pregnancy."},
{n:"Oat straw",a:"Avena sativa straw, oat straw",u:"Bones, tired nerves, minerals",t:["energy","sleep"],d:"The dried stalk of the oat plant, left over after the grain is taken, brewed as a tea for nerves that are stretched and as the old source of minerals for the bones.",h:"Straw, tea.",c:"Calming and mild, and it is not a bone treatment — a bone that has broken is a doctor, and calcium and vitamin D come from food and from a prescription, not a tea. Oats are a gluten grain: coeliac disease means leave it."},
{n:"Oregon grape",a:"mahonia, Mahonia aquifolium root",u:"Skin, a sluggish liver, blood sugar",t:["liver","skin"],d:"A spiny evergreen shrub of the American north-west, its yellow root brewed as a bitter for a sluggish liver and the skin that goes with it.",h:"Root, decoction or tincture.",c:"Not in pregnancy, and never for an infant — it is one of the strong ones. Not with blood thinners. Short courses."},
{n:"Orris root",a:"Iris florentina root, orris",u:"A throat tea, an old scent fixer",t:["mouth","lungs"],d:"The dried root of a Florentine iris, once powdered into tooth powders and throat sweets and used to hold a scent in a jar.",h:"Root, powdered or steeped.",c:"Mostly kept for scent and powders, and it can set off a reaction in someone allergic to iris or ragweed. Not for swallowing in quantity."},
{n:"Pau d'arco",a:"taheebo, lapacho, Tabebuia bark",u:"An old immunity tea, candida, a long-running complaint",t:["cold","skin"],d:"The inner bark of a South American tree, brewed by the people of the Amazon basin as a long, bitter tea and carried north as a tea for almost everything.",h:"Bark, decoction.",c:"Short stretches, not months. It thins the blood and there are reports of liver strain with big doses. Not with chemotherapy or blood thinners. Not in pregnancy."},
{n:"Peach leaf",a:"Prunus persica leaf",u:"A cough, an old digestive tea",t:["lungs","digestion"],d:"The leaf of the peach tree, brewed in the old household books for a cough and for a stomach that was unsettled.",h:"Leaf, tea, in small amounts.",c:"Like the kernel, the leaf carries compounds that turn into cyanide. Small amounts only, never a daily brew, never in pregnancy, never for a child."},
{n:"Pennyroyal",a:"squaw mint, Mentha pulegium",u:"A late period, in the old books, and a slow digestion",t:["women","digestion"],d:"A creeping strong mint that appears in every old list for a late period and for a stomach that will not settle. The oil of it is the reason the same name sits at the top of the modern warning lists.",h:"The dried leaf as a weak tea, and nothing more than that — the oil is a different substance and it is a poison.",c:"Pennyroyal oil is a liver poison and has killed people, including people who took it for a late period. Never swallow the oil, ever. Not in pregnancy, not on a child, not on broken skin."},
{n:"Periwinkle",a:"vinca, Vinca minor and Catharanthus roseus",u:"It appears in old lists for circulation and memory",t:["heart"],d:"The blue-flowered creeper of churchyards. Its alkaloids became real medicines for circulation and for cancer, which is the whole reason it sits on this shelf.",h:"Its alkaloids became two real medicines — one for the circulation and one that is chemotherapy. What is made from it is given by a doctor, in doses nobody could guess at from a leaf.",c:"The plant is toxic and people have died from drinking it. Its alkaloids are what some chemotherapy is measured from, and those doses are weighed in a pharmacy, not in a cup."},
{n:"Pipissewa",a:"chimaphila, prince's pine",u:"A bladder that keeps calling",t:["urinary"],d:"A small evergreen of the pine woods of North America, brewed by the people there and by the settlers for a bladder that kept calling.",h:"Leaf, tea.",c:"Not for a real bladder infection — burning and frequency is often an infection that needs a doctor and an antibiotic. Not for long stretches; high doses have caused ringing in the ears. Not in pregnancy."},
{n:"Pomegranate",a:"pomegranate juice, peel, rind",u:"Antioxidants, blood pressure, a gargle for the throat",t:["heart","mouth"],d:"The fruit of a tree of the Middle East and beyond, eaten as food and brewed as a peel tea for the throat and for blood pressure.",h:"The juice as food; the dried peel as a tea or a gargle.",c:"The juice is food, but it interferes with some medicines the same way grapefruit does — ask a pharmacist if you take anything. Not in pregnancy as a peel medicine."},
{n:"Prickly ash",a:"toothache tree, Xanthoxylum",u:"Cold hands, a stiff joint, an aching tooth",t:["joints","heart"],d:"A North American bark that leaves the tongue tingling and numb; it was chewed for a toothache and brewed for cold hands and stiff joints.",h:"Bark, decoction or tincture.",c:"It numbs. That can hide a tooth that still needs a dentist, so use it to get there, not instead. Not with blood thinners. Not in pregnancy."},
{n:"Quassia",a:"bitter wood, Quassia amara",u:"A sluggish stomach, an appetite that has gone",t:["digestion","urinary"],d:"A bitter wood of the Caribbean, shaved into water as a bitter tonic to wake up a stomach and an appetite — the same bitterness that makes it work in a garden spray.",h:"Wood shavings steeped in cold water.",c:"Very bitter, and small amounts are the dose — larger ones have caused real harm. Not for a child, not in pregnancy."},
{n:"Red rice yeast",a:"hong qu, red yeast rice, Monascus",u:"Cholesterol — it works like a medicine, so treat it as one",t:["heart","digestion"],d:"Rice fermented with a red mould, used in Chinese cooking and winemaking and taken for cholesterol. It contains the same active substance as a cholesterol tablet, which is the fact that matters most.",h:"Taken as a capsule. It is not brewed.",c:"It is a statin by another name: never alongside statin tablets, never with grapefruit, not in pregnancy, and not without a doctor if your liver is being watched. Muscle pain on it is a reason to stop and call a doctor. Stop before surgery."},
{n:"Rehmannia",a:"di huang, Chinese foxglove root",u:"Building back up, a tired kidney, an old tonic",t:["energy","women","urinary"],d:"A root of the Chinese tradition, prepared by steaming and simmering, given in the long tonics for a body that has been run down and for the blood.",h:"The prepared root, decoction, usually with other herbs.",c:"It is heavy and damp for a stomach that is already slow. The prepared root and the raw root are different medicines. Not in pregnancy without a practitioner."},
{n:"Rue",a:"ruta graveolens, herb of grace",u:"Cramps, a late cycle, a nervous stomach",t:["women","digestion"],d:"A bitter grey-blue leaf of the old Mediterranean gardens, kept for a nervous stomach and a cramping cycle. It was never a leaf to eat freely, and the old books said so.",h:"A very small amount of leaf, in a tea or a tincture.",c:"Never in pregnancy. The fresh leaf can burn the skin in sunlight. A larger amount is poisonous. This is one to leave to a practitioner."},
{n:"Saffron",a:"kesar, Crocus sativus stigma",u:"A low mood, a heavy cycle, a flat week",t:["mood","women"],d:"The red stigma of an autumn crocus, picked by hand and once weighed against gold, steeped as a tea in the tradition for a low mood and for a painful cycle.",h:"A good pinch of stigma steeped in warm water or milk. A pinch is a dose.",c:"A pinch is a dose and a spoonful is not — large amounts are poisonous and have killed. Not in pregnancy. And if a low mood has lasted weeks, or there is any thought of not being here, that is a doctor and not a tea."},
{n:"Sarsparilla",a:"sarsaparilla root, Smilax",u:"Skin, joints, an old spring tonic",t:["skin","joints"],d:"A Central American vine root that gave its name to a fizzy drink, brewed in the tradition as a spring tonic for the skin and for a stiff joint.",h:"Root, decoction.",c:"The sweet drink is not the medicine. Not in pregnancy. It can upset the stomach and it changes how other medicines are absorbed — ask a pharmacist."},
{n:"Sassafras",a:"root bark, filé powder, Sassafras albidum",u:"Digestion, skin, and the root beer that was taken off the shelf",t:["digestion","skin"],d:"The root bark that flavoured the first root beer in America, brewed for a slow stomach and for the skin — until the safrole in it was found to be a problem and it was taken out of food.",h:"The root beer sold today has the safrole removed. The old bark tea is the thing to leave alone; filé powder in gumbo is a seasoning.",c:"Safrole is hard on the liver and was removed from food for that reason. Do not brew the bark. Not in pregnancy. Not a daily tea in any amount."},
{n:"Shiitake",a:"Lentinula edodes, shiitake mushroom",u:"Food, immunity, cholesterol",t:["energy","cold"],d:"A mushroom cultivated on oak logs in East Asia for a thousand years, eaten as food and boiled into a broth that is kept for the long haul.",h:"Cooked as food; or a long simmered broth.",c:"Cook it — raw or barely cooked shiitake causes a rash in some people. Not with immune-suppressing medicine. Buy from a food source, not picked wild."},
{n:"Shilajit",a:"mumijo, mineral pitch",u:"Energy, an old source of minerals",t:["energy","men"],d:"A tar-like substance that seeps from rock in the mountains of Asia, dissolved in warm water or milk and taken in the tradition for energy and for building back up.",h:"A small amount dissolved in warm water or milk.",c:"It comes out of rock and it can carry heavy metals and mould — buy from a source that tests it, or do not take it. It interacts with blood thinners and with iron. Not in pregnancy, not for a child."},
{n:"Soursop",a:"graviola, Annona muricata, guanábana",u:"Calm, sleep, an old tea of the tropics",t:["sleep"],d:"A spiky green fruit of the Caribbean and South America, eaten as food, with the leaf brewed as a calming tea and sold online as far more than that.",h:"The fruit as food; the leaf as a tea.",c:"The seeds are poisonous. The leaf tea is not a cancer treatment and it is not a daily drink in quantity. There is a real concern about the fruit and a nerve condition in people who eat a great deal of it. Anything called a tumour is a doctor."},
{n:"Spearmint",a:"Mentha spicata, garden mint",u:"A heavy stomach, sickness, hair that grows where it should not",t:["digestion","women","hair"],d:"The gentler garden mint, brewed as a tea after a meal and drunk twice a day in the tradition by women troubled by coarse hair on the face and chin.",h:"Leaf, tea, often two cups a day for weeks at a time.",c:"A mild thing taken over weeks, not a hormone treatment, and it is not a replacement for one if a doctor has prescribed it. It loosens the valve at the top of the stomach, so it can make reflux worse. Not for a baby."},
{n:"Spirulina",a:"blue-green alga, Arthrospira",u:"Food, a tired body, an old green",t:["energy"],d:"A blue-green alga skimmed from shallow lakes and dried into cakes, eaten as food in central Africa and Mexico long before it was a tablet in a jar.",h:"Eaten as food, in powder or tablets.",c:"Buy from a source that tests it — the wrong algae can grow alongside it, and heavy metals and toxins have been found in cheap tubs. Not with an autoimmune condition or immune-suppressing medicine without asking. Not for a child without asking."},
{n:"Star anise",a:"Illicium verum, Chinese star anise",u:"Flu, a blocked chest, a pot of broth",t:["cold","fever","digestion"],d:"The eight-pointed pod of a Chinese evergreen, put in broths and brewed as a warm tea for a blocked chest and the ache of flu.",h:"The pod in cooking or steeped as a tea.",c:"Chinese star anise is the cooking one. Japanese star anise looks almost identical and is poisonous — never gather the pods yourself. Not for a baby, in tea or in food."},
{n:"Stevia",a:"sweetleaf, Stevia rebaudiana",u:"Sweetness without sugar",t:["digestion"],d:"A small South American shrub with leaves that taste far sweeter than sugar, chewed by the people of Paraguay for centuries and now sold as a powder.",h:"The leaf, fresh or dried; or the processed powder as a sweetener.",c:"It sweetens. It is not a treatment for blood sugar — sugar levels are still a doctor's business and a monitor. The refined white powder is a different thing from a leaf. Not for a baby."},
{n:"Sumac",a:"Rhus coriaria, the spice sumac",u:"Food, a sour spice, digestion",t:["digestion","skin"],d:"The dried red berries of a Middle Eastern shrub, crushed into a sour purple spice that goes on salads and rice, and brewed as a tea for a sluggish stomach.",h:"The dried berry as a spice, or steeped as a tea.",c:"The purple spice is food. Do not confuse it with poison sumac or poison ivy — the same family and not food at all. Not in pregnancy as a medicine."},
{n:"Tarragon",a:"French tarragon, Artemisia dracunculus",u:"Appetite, a slow stomach, an old sleep tea",t:["digestion","sleep"],d:"A slender aniseed-scented herb of the French kitchen, put in with chicken and eggs and brewed in the old household books for appetite and for sleep.",h:"Leaf in food; or a small amount steeped as a tea.",c:"Culinary amounts are food. The essential oil is not for swallowing. Long daily teas beyond kitchen use are not wise."},
{n:"Watercress",a:"Nasturtium officinale",u:"Food, minerals, a spring green",t:["energy","lungs"],d:"A green of cold running water, eaten as a peppery salad leaf and once kept as the spring green that was supposed to clear the winter out of a body.",h:"Eaten as food.",c:"It is food, not medicine. Wild watercress from slow or dirty water can carry a liver fluke — buy it or grow it, and do not pick it from a ditch and eat it raw. Not in pregnancy as a large daily medicine."},
{n:"Yohimbe",a:"Pausinystalia yohimbe bark",u:"Sexual difficulty — and a real risk sitting beside it",t:["men","energy"],d:"The bark of a west African tree, sold for sexual difficulty. Its active substance became a prescription medicine given under supervision, and that is the important half of the story.",h:"Bark, sold as a supplement. It is not a drink to pour for yourself.",c:"It raises blood pressure and heart rate and it is genuinely dangerous with antidepressants, anything acting on serotonin, MAOIs, and blood pressure medicine. Not with a heart condition, not with drink. Prescription-only in several countries, and for good reason."},
{n:"Ziziphus",a:"jujube, sour jujube seed, suan zao ren",u:"Broken sleep, a mind that will not switch off",t:["sleep","mood"],d:"The red date of China, eaten as food, and its seed — suan zao ren — simmered into a tea in the tradition for sleep that keeps breaking.",h:"The seed as a decoction before bed; the fruit eaten as food.",c:"Sleepy-making, so not with sedatives, sleeping tablets or drink. The fruit is food and the seed is medicine. Not in pregnancy without a practitioner."},
{n:"Bladderwrack",a:"bladder wrack, Fucus vesiculosus, rockweed",u:"A mineral food for a run-down body, an old tonic",t:["energy","joints"],d:"A brown seaweed of the north Atlantic shore, cut off the rocks at low tide and dried. The old books keep it as food for a body short on minerals, through a long grey stretch, and it is the seaweed most often put into a capsule and sold in a shop.",h:"Dried, brewed as a tea or eaten as a food; a little goes a long way.",c:"Very heavy with iodine. Not if you take thyroid medicine, not if your thyroid has ever run hot, and not in the weeks before a thyroid test. Not in pregnancy or while feeding. Seaweed pulled from unclear water carries whatever was in that water, so buy it somewhere that tests it. It is sold as a slimming pill and that talk is not established; a thyroid out of balance belongs to a doctor."},
{n:"Sea moss",a:"irish moss, Chondrus crispus, gracilaria",u:"A mineral food for building back up",t:["energy","digestion"],d:"A red seaweed of the cold Atlantic shore, boiled down to a gel and eaten with milk in the islands as food for a body that is mending. The old books keep it as a thickener for the sick, and it is sold now as a gel by the spoonful.",h:"Soaked and blended to a gel, a spoonful a day; or boiled into milk as a food.",c:"Heavy with iodine — not if you take thyroid medicine, and not in the weeks before a thyroid test. Seaweed pulled from unclear water carries whatever is in that water, so buy it from somewhere that tests it. The talk of it clearing the chest or thinning mucus is not established: it is a food, and a chest infection belongs to a doctor."},
{n:"Cascara sagrada",a:"sacred bark, Rhamnus purshiana, chittem bark",u:"A stubborn bowel, the old bitter bark",t:["digestion","liver"],
 d:"The dried bark of a west-coast tree, and the one strong laxative the old books treated with respect rather than cheerfulness. \"Sagrada\" means sacred, and the tradition says the same thing about it twice over: age the bark a year before use, and never keep it as a daily tea. Every household book of the last century had it, usually in a \"tonic\" or a \"spring clean\" blend.",
 h:"Aged dried bark, a short decoction; sold as tablets and as a bitter tonic. It is a medicine measure, not a drink to pour freely.",c:"A stimulant laxative, and the caution is the whole story. Short use only — a few days, not a nightly tea and not a \"cleanse\" that runs for weeks. The bowel comes to depend on it and then will not move without it. Not in pregnancy, not while feeding, not for a child, and not with an inflamed or blocked bowel, piles, or a sore gut. Pain in the belly, blood, or a bowel that has changed for weeks is a doctor, not a laxative. It is also the herb that shows why \"natural\" is not the same as \"mild\" — it was pulled out of over-the-counter laxative medicines in the United States in 2002 for want of long-term safety data, and it is still sold freely as a supplement."},

 {h:"The doctrine of signatures", s:"African Holistic Health · the doctrine of signature",

 {h:"Food: what the book says about eating", s:"African Holistic Health \u00b7 food",

    {q:"With two together, how much of each spice?", k:0, a:["A quarter to an eighth of a teaspoon","A teaspoon each","A tablespoon each","None is given"], w:"A quarter teaspoon of each herb, and a quarter to an eighth of a teaspoon of each spice, for four servings."},
    {q:"What is the book's argument about seasonings?", k:2, a:["They are only for taste","They should be avoided","They were the original medicaments","They only work on meat"], w:"Its line is that the shelf stopped being read that way."}]},

{d:15, t:"What each seasoning is for", s:"Nutricide, herb seasoning for dis-ease, p341",
 p:["The book gives one line to each seasoning, and the From the books tab has the whole list. A few of them, so the shape is clear: allspice for digestion, gas and diabetes, as a stimulant. Anise for digestion, the liver, colic and colds. Basil for rheumatism, cramps, vomiting and mucous. Chervil for swellings, edema and gout, as a diuretic. Cinnamon for diarrhea and an upset stomach. Coriander as a stomach tonic and for joint pain. Dill for indigestion, gastritis, croup and nausea.",
    "Fennel as a laxative, a diuretic, and for sores. Garlic for hypertension, infections, high blood pressure and worms. Ginger for nausea, cramps, edema. Horseradish for dysmenorrhea, high blood pressure, arthritis. Kelp for the thyroid and goiter. Marjoram for headaches, acidity, colds and nervousness. Mustard for gastritis, the liver, rheumatism. Oregano for colds, headaches and asthma. Paprika for sinus trouble and colds. Parsley as a diuretic. Pepper for neuralgia, which is nerve pain. Rosemary for colds, arthritis, memory and digestion. Sage for sores, wounds, depression, a sore throat. Savory for ear trouble and colds. Thyme for headaches, colds, worms, loss of appetite, diarrhea. Turmeric for fever, colds, skin problems, high blood pressure. Vanilla for digestion, gas, and soothing the nerves.",
    "Three of those lines name a cancer, a meningitis and a poliomyelitis. Those are a hospital. The book names them, and on this page a claim that came out of the book stays the book's claim."],
 note:"Nothing goes in an ear from that list. An ear that leaks, or that hurts a child at night with a fever, is a doctor.",
 q:[{q:"Which seasoning does the book give for digestion, gas and diabetes?", k:0, a:["Allspice","Sage","Kelp","Paprika"], w:"Allspice, on the book's one-line-each list."},
    {q:"Which seasoning does it name for the thyroid and goiter?", k:2, a:["Dill","Chervil","Kelp","Basil"], w:"Kelp, in the book's own words."},
    {q:"What does the page say about an ear that leaks or hurts a child at night?", k:1, a:["Use savory","That is a doctor","Use a warm oil","Wait a week"], w:"The seasoning list has an ear line in it. The page's own rule overrides it: a leaking ear, or an ear that hurts a child with a fever, is a doctor."}]},

{d:16, t:"Which seasoning goes on which food", s:"Nutricide, seasoning for food, p339",
 p:["The book does not leave the seasonings floating. It pairs them, food by food, in a table, and the table is in the From the books tab row for row.",
    "Asparagus: lemon juice, dry mustard, marjoram, sesame seed, pepper, thyme. Broccoli: lemon juice, pepper, caraway seed, dry mustard, nutmeg, basil, curry, oregano, garlic. Carrots: parsley, cinnamon, lemon juice, allspice, nutmeg, mint, bay leaf, caraway, dill seed, ginger, mace, thyme, marjoram. Cabbage and cauliflower get the longest row of all.",
    "Read one line of that table and a pattern shows up: the seasoning that goes on a vegetable is usually the seasoning the book has a use for. Fennel is a diuretic and it is on the vegetables. Thyme is on the list for headaches and colds and it is on nearly everything.",
    "And the beef row: bay leaf, basil, dry mustard, nutmeg, green pepper, sage, marjoram, onion, pepper, thyme, dill seed, oregano, caraway, garlic, parsley, rosemary, savory, turmeric, allspice, celery seed. It is the book's row. This page is not the one who put it back, and it is not this page's diet."],
 bk:"A quarter teaspoon of dill seed and a quarter teaspoon of dry mustard on vegetables, or a quarter teaspoon of basil and an eighth of a teaspoon of garlic powder in bean or soy patties.",
 q:[{q:"How does the book give the seasonings?", k:1, a:["One list of everything","Paired food by food, in a table","By price","By season of the year"], w:"Food by food, and the whole table is in the From the books tab."},
    {q:"Which seasoning is on the page's list for headaches and colds, and turns up on nearly every vegetable row?", k:2, a:["Vanilla","Cinnamon","Thyme","Allspice"], w:"Thyme: headaches, colds, worms, loss of appetite, diarrhea."},
    {q:"What is the beef row in the book's table?", k:0, a:["The book's own row, printed as the book has it","This page's suggestion","A grocery advert","A mistake that should be deleted"], w:"It is the book's row. The page prints it and does not claim it as its own diet."}]},

{d:17, t:"Food as medicine", s:"Nutricide, the food medicine chart, p337-338",
 p:["The chart is the plainest thing in either book: a compound, one line of what it does, and the foods that carry it.",
    "Allylic sulfides dissolve cholesterol and protect against carcinogens, in garlic. Alpha-linolenic acid reduces inflammation and enhances the immune system, in flaxseed, soy products, purslane and walnut. Carotenoids fight cancer and reduce plaque, in parsley, carrots, winter squash, sweet potatoes, yams, cantaloupe, apricots, spinach, kale, turnip greens and citrus fruit.",
    "Catechins fight gastrointestinal cancer and lower cholesterol, in tea and berries. Coumarins prevent blood clotting and help high blood pressure, in parsley and citrus fruit. Flavonoids decrease cancer, in parsley, carrots, citrus fruit, broccoli, cabbage, cucumbers, squash, yams, tomatoes, eggplant, peppers, soy products and berries.",
    "Indoles normalise oestrogen action and help PMS, in cabbage and brussels sprouts. Isothiocyanates stimulate the liver and help blood pressure, in mustard, horseradish and radishes. Limonoids are alkalinising, in citrus fruit. Lycopene fights cancer and its progression, in tomatoes and red grapefruit.",
    "Parsley and citrus fruit appear again and again. That is the chart's own message: the ordinary food is doing the work."],
 note:"The chart carries on for another eight or nine rows in the book, and the scan of it garbles every name. Those are left out rather than guessed at.",
 q:[{q:"Which compound is in garlic, for cholesterol and carcinogens?", k:0, a:["Allylic sulfides","Limonoids","Indoles","Catechins"], w:"Allylic sulfides, on the book's chart."},
    {q:"Lycopene is in which two foods?", k:2, a:["Parsley and citrus","Tea and berries","Tomatoes and red grapefruit","Cabbage and sprouts"], w:"And its line on the chart is fighting cancer and its progression."},
    {q:"What does the page do with the rows the scan garbles?", k:1, a:["It guesses them from the fragments","It leaves them out","It fills them from another book","It copies the fragments alone"], w:"Left out rather than guessed at, and the tab says so."}]},

{d:18, t:"Blood cleansers", s:"Nutricide, p342",
 p:["The book gives blood cleansers their own shelf, and the From the books tab carries it whole. It is a list of plants rather than a recipe.",
    "The idea under the shelf is the spring clean: a body that has been fed badly, or that has been carrying something for a while, is helped out by plants that move water and waste through it. That is the book's idea and it is stated here as the book's.",
    "What the page adds is the ordinary half of it. Water, food and time do most of a spring clean, and the plants on the shelf work beside that and not instead of it. Burdock, dandelion and milk thistle are the ones in the library most often named for this work, and each of their own entries carries its caution, including the one that matters most here: a liver that is struggling needs a doctor, not a tea."],
 note:"A cleanse is not a detox, and nothing on this shelf does what a hospital does.",
 q:[{q:"What is the idea under the blood cleansers shelf?", k:1, a:["Replacing blood","A spring clean, moving water and waste through the body","Removing a virus","Stopping a bleed"], w:"It is the book's idea, stated as the book's."},
    {q:"Which of these is in the library for this work?", k:0, a:["Milk thistle","Vanilla","Lycopene","Paprika"], w:"Burdock, dandelion and milk thistle."},
    {q:"What does the page add to the shelf?", k:2, a:["A stronger recipe","Nothing at all","That water, food and time do most of it","A dose for each plant"], w:"And that a liver that is struggling needs a doctor, not a tea."}]},

{d:19, t:"Immune builders", s:"Nutricide, p342-343",
 p:["The book's immune shelf is short and its figures are large. Garlic, which it calls an antibiotic and gives for parasites. Vitamin C at 25,000 to 60,000 mg, and 300 mg every two hours, for an infection, printed here exactly as the book prints it. Echinacea extract and grape seed extract for infection. Pine bark extract for colds and infection. Vitamin E up to 800 i.u. a day. Ginseng for energy. Lecithin for the nerves. Lysine at 1000 mg for infection and for herpes. Zinc and selenium.",
    "Those are the book's numbers and they are not small ones. Every figure in that shelf is the book's own, printed as claims, which is the thing that makes printing them honest.",
    "Two of the names on that shelf carry their own warning, and both are on the page. Goldenseal is given in the book broadly, for all types of disease, and it has harmed newborns. Yohimbe is dangerous with anything acting on serotonin or on blood pressure, and its entry says so.",
    "And the one line that outranks the whole shelf: an infection is a doctor. Not oregano oil, not goldenseal, not garlic. A fever that will not come down, a wound going red and hot, a chest that rattles, anything yellow or green coming up."],
 bk:"The listed dose is what a healthy body needs. A dis-ease needs more, because the body has to use its normal amount and still fight.",
 q:[{q:"How much vitamin C does the book give for an infection?", k:1, a:["60 mg","25,000 to 60,000 mg","500 mg","It gives no figure"], w:"And 300 mg every two hours. It is the book's figure, printed as its claim."},
    {q:"Which two names on that shelf carry their own warning on this page?", k:2, a:["Ginseng and lecithin","Vitamin E and lysine","Goldenseal and yohimbe","Zinc and selenium"], w:"Goldenseal has harmed newborns; yohimbe clashes with serotonin and blood pressure medicine."},
    {q:"What is the one line that outranks the whole immune shelf?", k:0, a:["An infection is a doctor","Take more vitamin C","Start with garlic","Wait three days"], w:"A fever that will not come down, a hot red wound, a rattling chest, anything yellow or green."}]},

{d:20, t:"Sleep and a racing mind", s:"The evening shelf",
 p:["Six plants in this library carry sleep, and the book's short shelf names valerian, catnip, chamomile, kava, passion flower and hops. Each has its own entry here, and kava is the one to read first if the liver has had a bad time.",
    "The library's own evening shelf adds a few the books do not: ashwagandha, which the tradition takes slowly for weeks rather than for one bad night. Lavender, three ways, the flowers in a pillow, the oil diluted on the wrists and temples, and the oil in a carrier for the skin. Lemon balm, as a nightly tea. And St John's wort, which is on this page for a heavy mood and is the herb that taught everybody to check interactions.",
    "Two rules travel with this shelf and both are in the entries. Do not drive after a big dose of valerian, and do not take it with alcohol or sleeping tablets. Never swallow neat lavender oil. And St John's wort is read twice before it is taken at all.",
    "The old line about a slow herb is worth carrying into every shelf in this course: some plants are for one bad night and some are for weeks. Ashwagandha and valerian are the second kind in this tradition."],
 note:"Some plants are for one bad night and some are for weeks. Ashwagandha and valerian are the second kind in this tradition, and the evening shelf itself is the book's own: valerian, catnip, chamomile, kava, passion flower and hops.",
 q:[{q:"Which six does the book's sleep shelf name?", k:2, a:["Ashwagandha and lavender","Ginger and thyme","Valerian, catnip, chamomile, kava, passion flower, hops","Burdock and dandelion"], w:"The library adds ashwagandha, lavender and lemon balm from other traditions."},
    {q:"What does the library say about lavender oil?", k:0, a:["Never swallow the neat oil","Drink a spoonful at night","Rub it in the eyes","Give it to a baby"], w:"Dilute it, always, and never swallow it neat."},
    {q:"Which of the evening shelf is the one to read first if the liver has had a bad time?", k:1, a:["Chamomile","Kava","Hops","Catnip"], w:"Its own entry carries it, and the safety tab names kava with the liver."}]},

{d:21, t:"Stomach, wind and bowels", s:"Kitchen roots and the bitter tonics",
 p:["Ginger is the single most useful kitchen root in the tradition: a slice chewed or brewed for a queasy stomach, for sickness on a boat, and for the cramping of a monthly cycle. Large amounts can thin the blood and burn the stomach, which its entry says.",
    "Peppermint is a tea after a heavy meal, and the oil, kept well away from the eyes, rubbed on the temples for a headache across the brow. It worsens heartburn for some people, and the oil must stay off the face of a baby.",
    "Fennel seed, chewed or brewed, was the ordinary European answer to wind and cramping. Dandelion is a bitter tonic and a diuretic both. Slippery elm coats as it goes down, which is why it turns up for a raw throat and an acid stomach, and it is taken two hours away from any medicine because it slows how the medicine is taken up.",
    "Then the one that has to be handled like a medicine rather than a food. Senna is a strong laxative, leaf and pod, for a week at most, not in pregnancy, not for a child, and not with a bowel condition. The old herbals pair it with ginger or fennel to stop the griping."],
 bk:"One teaspoon of herb per cup of water.",
 q:[{q:"What does the library say about ginger in large amounts?", k:1, a:["It is harmless at any amount","It can thin the blood and burn the stomach","It stops the heart","It causes fever"], w:"That is the caution on its entry, and ginger is otherwise one of the gentlest on the shelf."},
    {q:"Slippery elm has to be taken how?", k:0, a:["Two hours away from any medicine","With the medicine","On an empty stomach only","At night only"], w:"It slows how a medicine is taken up."},
    {q:"How long is senna used for?", k:2, a:["Six months","Every day","A week at most","Once a year"], w:"And never in pregnancy, never for a child, never with a bowel condition."}]},

{d:22, t:"Colds, throat and chest", s:"The first day of a cold",
 p:["Elderberry is the European standby for the first day of a cold, cooked berry as syrup in autumn and tea through winter, with the flowers in a sweat tea for a fever. The caution is absolute and its entry says it: never eat the raw berries, bark or stems.",
    "Echinacea, the North American prairie plant the Plains nations used, is taken at the very first tickle of a cold, not in the middle of one. It is avoided with autoimmune conditions and it is not for the long term.",
    "Mullein is the cough herb: the soft leaf brewed for a cough that will not clear, and the flowers steeped in olive oil for an earache. Thyme is the kitchen one: a strong brew to gargle with for a raw throat, and a steam for a chest that is tight. Onion and garlic both turn up in the book's colds and coughs rows.",
    "And the rule that stands over all of it. Nothing goes into an ear that is leaking or that you think may have a torn drum. An ear that hurts a child at night with a fever, a chest that hurts to breathe, or a cough that is not clearing after weeks, is a doctor."],
 note:"Never eat elderberry raw, and never its bark or stems. Cooked berry only, as a syrup or in a tea.",
 q:[{q:"When is echinacea taken?", k:1, a:["In the middle of a cold","At the first tickle","Every day forever","Only with a fever"], w:"And it is avoided with autoimmune conditions."},
    {q:"What is the rule about elderberry?", k:0, a:["Never eat the raw berries, bark or stems","Eat it raw, it is stronger","Boil it for a minute and it is finished","The stems are the best part"], w:"Cooked berry only, as syrup or in a tea."},
    {q:"What goes into a leaking ear?", k:2, a:["Warmed mullein oil","Olive oil","Nothing at all — that is a doctor","A cotton bud"], w:"An ear that leaks, or a drum you think may be torn, is a doctor's appointment."}]},

{d:23, t:"Skin, joints and a spring clean", s:"Outside and inside",
 p:["Outside: aloe vera for burns and grazes, goldenseal powder on the skin, marshmallow, witch hazel as the astringent, and oatmeal and slippery elm for a sore surface. Calendula, chickweed and comfrey leaf, in the old books, for skin eruptions and wounds, with comfrey leaf on the outside only.",
    "Inside, for the joints: the anti-inflammatory shelf from the book's classes, arnica, cayenne, garlic and chaparral. Turmeric is on the seasoning list for its own reasons, and its entry carries the caution that it thins the blood.",
    "For the spring clean: burdock root and dandelion are the old pair, and milk thistle the seed most often named, with each of their own cautions travelling with them.",
    "Two things this page will not do with this shelf. It will not let a burn be treated at home when it is deep, or on a face, or bigger than a palm. And it will not let a joint that is hot, red, swollen and painful be treated at home either, because that is a joint that needs looking at."],
 note:"Goldenseal on the skin is one thing. Goldenseal swallowed has harmed newborns, which is why it sits on the safety tab by name.",
 q:[{q:"Which plant is the astringent of this shelf, tightening the skin?", k:1, a:["Aloe vera","Witch hazel","Oatmeal","Turmeric"], w:"The book's astringent class names witch hazel and alum root."},
    {q:"Which pair is the old spring clean?", k:0, a:["Burdock root and dandelion","Garlic and cayenne","Arnica and thuja","Ginger and sage"], w:"With milk thistle the seed most often named, in the library."},
    {q:"What does the page say about a joint that is hot, red, swollen and painful?", k:2, a:["Rub in cayenne","Use garlic","It needs looking at, not a poultice","Ignore it for a week"], w:"And a deep burn, a burn on a face, or one bigger than a palm is not a home job either."}]},

{d:24, t:"Vitamins", s:"African Holistic Health, the vitamin and mineral guides",
 p:["The book's framing is short and worth having: vitamins energise the body, minerals stabilise it, and vitamins are either water-soluble or oil-soluble.",
    "Vitamin A is tissue and immunity, and short of it the skin and the sight suffer: carrots and leafy greens. B complex is metabolism, energy and mental health. Vitamin C is the glands and resistance to disease, and short of it, wounds and gums. Vitamin D draws minerals in and builds bone, and short of it, growth and energy suffer. Vitamin E is tissue health and circulation. Vitamin K is clotting and energy.",
    "It also names the vitamins the quizzes never ask about: F, the fatty acids. T, for making blood. U, for healing a wound. P, for protecting a cell.",
    "On which to buy, the book says plant-derived over synthetic, and whole food over processed. Its line on synthetic vitamins is that they drain the body of nutrients, alter pH and body chemistry, and work against the immune system. That is its claim and it is printed as its claim."],
 bk:"Vitamins energise the body while minerals stabilise it.",
 q:[{q:"In the book's framing, what do vitamins do?", k:0, a:["Energise the body","Stabilise the body","Build bone","Clot blood"], w:"Minerals stabilise it; vitamins energise it."},
    {q:"Which vitamin does the book give for tissue and immunity, with carrots and leafy greens as its food?", k:2, a:["Vitamin K","Vitamin C","Vitamin A","Vitamin D"], w:"And short of it, the skin and the sight suffer."},
    {q:"Which does the book prefer to buy?", k:1, a:["Synthetic, it is purer","Plant-derived and whole food","The cheapest","Whichever is on offer"], w:"Its line on the synthetic ones is that they drain the body and work against the immune system."}]},

{d:25, t:"Minerals", s:"Iron, calcium, zinc, selenium",
 p:["Minerals, in the book, are bought chelated rather than synthetic, from a health food shop in its words, and two to three times the ordinary amount when treating something.",
    "Iron makes blood. Short of it: low mental sharpness, anemia, tiredness and headaches. Its herbs are burdock root, chamomile and fennel, and its foods are almonds, spinach and whole grains.",
    "Calcium is bone, teeth and muscle. Short of it: soft bone, nervousness, muscle cramps and heart trouble. Its herbs are aloe root, horsetail and red clover, and its foods are broccoli, raw vegetables and leafy greens.",
    "Zinc is cell and tissue growth, the prostate, healing wounds and burns, taste and smell, and in the book's words it is vital to enzymes. Selenium is liver function, less energy lost, protection from toxins, the prostate, and an antioxidant.",
    "The copy of the summary in the repo cuts off in the middle of the mineral guide, at phosphorus, and that is where the From the books tab ends. There is no fuller list to put here from it, so the course stops where the book stops."],
 bk:"Minerals stabilise the body.",
 note:"Where the copy of the book runs out, the tab says so. Nothing is invented to fill a gap.",
 q:[{q:"How does the book say to buy minerals?", k:1, a:["In any form","Chelated rather than synthetic","As a powder only","From a supermarket"], w:"From a health food shop in its words, and two to three times the ordinary amount when treating something."},
    {q:"Which herbs does the book give for iron?", k:0, a:["Burdock root, chamomile and fennel","Aloe root and horsetail","Ginger and sage","Mullein and thyme"], w:"With almonds, spinach and whole grains as its foods."},
    {q:"Where does this copy of the book stop?", k:2, a:["At the last page","At the herbs chapter","In the middle of the mineral guide, at phosphorus","At the recipes"], w:"And the tab says so, rather than inventing the rest."}]},

{d:26, t:"Colour, organ and clock", s:"African Holistic Health, colours and cycles",
 p:["In the book, each colour goes with an organ and its work. Yellow, a lemon, for the liver. Red for the heart. A plant whose colour matches what an organ produces is, in the book, medicine for that organ. The colour of the eye, the skin and the nail is read the same way, as a sign of what is going on inside.",
    "The organ clock is the second half of it. Each organ keeps its own rhythm around the day, and the book's own example is that the liver is at its most active at one in the morning. Organs that work together suffer together: when one fails to do its part, the other wears out with it.",
    "Then the days. Sunday, Tuesday and Thursday are the physical days, for the muscles. Monday, Wednesday and Friday are the internal days, for the organs inside and the spirit. Oils and incense work through the nose, and each oil has its own work and its own days. Metals and crystals each have their own. And its line on music is that sound goes into a person through the skin, the eyes, the ears and the food.",
    "The zodiac, the colours, the parts of the body and the acupressure meridians are mapped onto each other in the book as well. None of this comes with a mechanism, and the page does not add one: it is here because it is in the book."],
 note:"Colour, cycle, oil, crystal and sign, with no account of how. Stated as the book states it, and not sharpened into anything it is not.",
 q:[{q:"Which colour goes with the liver in the book?", k:1, a:["Red","Yellow","Blue","Green"], w:"Yellow, a lemon, for the liver; red for the heart."},
    {q:"Which organ does the book say is most active at one in the morning?", k:2, a:["The heart","The kidneys","The liver","The lungs"], w:"Its own example of the organ clock."},
    {q:"Which days are the physical days, for the muscles?", k:0, a:["Sunday, Tuesday and Thursday","Monday, Wednesday and Friday","Saturday only","Every day"], w:"Monday, Wednesday and Friday are the internal days."}]},

{d:27, t:"Easy remedies", s:"African Holistic Health, easy remedies",
 p:["The book has a chapter of short remedies, and the From the books tab carries the whole list. Athlete's foot: garlic powder, pau d'arco powder and horseradish powder sprinkled on the feet, tea tree oil between the toes, and pau d'arco tea to drink. Chapped lips: a lotion of lavender, aloe vera, witch hazel, vegetable glycerin and beeswax. Falling hair: wild cherry bark boiled, with nettle and horsetail added.",
    "Grey hair gets a rinse of henna and sage tea. A facial mask is equal parts wheat germ flour, honey and clay. A lotion is one ounce of vegetable glycerin, half an ounce of sage, half an ounce of aloe oil and a quarter of an ounce of a scented oil, shaken together. A foot soak is cabbage juice, lemon juice, ginger root and turpentine.",
    "Two rows in that chapter are the book's and not this page's, and the tab says so on the row. The ringworm line mixes gunpowder, vinegar and charcoal: gunpowder is not a household ingredient and this page leaves that one in the book. And the natural contraceptives row, acacia and stone seed on a tampon or a douche, is an old practice and not a reliable contraceptive, which the stone seed entry says in its own words.",
    "Everything else in that chapter is a kitchen job: a lotion, a mask, a rinse, a soak."],
 note:"A blocked skin remedy is one thing. A blocked nose, an asthma attack or an inhaler is another, and nothing in this chapter stands in for one.",
 q:[{q:"What does the book put on athlete's foot?", k:0, a:["Garlic, pau d'arco and horseradish powder, with tea tree oil","Vinegar and charcoal","Henna and sage","Wheat germ flour and clay"], w:"And pau d'arco tea to drink."},
    {q:"Which row does this page leave in the book?", k:2, a:["The facial mask","The chapped lips lotion","The ringworm line with gunpowder in it","The hair oil"], w:"Gunpowder is not an ingredient anybody should be mixing at a kitchen table."},
    {q:"What is the acacia and stone seed row described as?", k:1, a:["A reliable method","An old practice, not a reliable contraceptive","A modern technique","A cure for cramps"], w:"The stone seed entry says it in its own words."}]},

{d:28, t:"The lines that never move", s:"Read this first, all of it, today",
 p:["This is the day to open the Read this first tab and read the whole thing, slowly, because it is the only tab on this page that does not soften.",
    "An infection is a doctor, not a tea. Not oregano oil, not goldenseal, not garlic. A fever that will not come down, a wound going red and hot, a chest that rattles, a tooth gone bad, anything yellow or green coming up.",
    "Coming off alcohol or a drug is a doctor. Alcohol withdrawal can kill, and it is not something to sit out with chamomile and valerian. If you have been drinking heavily and stop, that is a doctor or a hospital, and the timeline page in the app says the same thing. Herbs do not belong in that week.",
    "Anything you take on a prescription stays with the doctor who gave it. St John's wort alone interferes with antidepressants, birth control, blood thinners and HIV medicine. Licorice and hibiscus move blood pressure. Ginger, ginkgo, turmeric, garlic and white willow thin the blood. One question to a pharmacist is free and it is the whole of this paragraph.",
    "Pregnancy and children. Most of the list is not for pregnancy, and a child is not a small adult for dosing. Goldenseal and comfrey root are named on that tab for babies. And kratom is not in this library at all: it is sold as a herb, it acts on the same receptors as opioids, and it is addictive.",
    "Read that tab today, and again on any day a plant looks like a way out of something that needs a person."],
 note:"These are the page's lines and they outrank every claim on every other tab of it.",
 q:[{q:"What does the page say about an infection?", k:1, a:["Try oregano oil first","It is a doctor, not a tea","Wait three days","Take goldenseal"], w:"Not oregano oil, not goldenseal, not garlic."},
    {q:"What is the rule about a prescription?", k:0, a:["It stays with the doctor who gave it","Herbs can replace it","It can be halved while taking herbs","It is not mentioned"], w:"One free question to a pharmacist covers the whole of it."},
    {q:"Why is kratom not in this library?", k:2, a:["It is expensive","It only grows abroad","It acts on opioid receptors and is addictive","It tastes bad"], w:"People come off it with withdrawal like any opioid."}]},

{d:29, t:"Keeping your own book", s:"Gathering it up",
 p:["You have the whole library now, and the course has been through it. What is left is the habit, and the page is already built for it.",
    "Read a plant before you use it, not after. What it does is the top of its card. The caution is the part under it, and it is never softened by how good the top sounded.",
    "Write down what you find. Every herb card has a What your book says box at the bottom, the My notes tab collects them, and you can add a plant the two books name that is not on the shelf yet. It is kept on the phone and nothing is sent anywhere.",
