<style>
:root{
  --s0:#f5f4f0;--s1:#ededea;--s2:#fff;
  --tp:#1a1a18;--ts:#4a4a46;--tm:#888780;
  --bdr:rgba(0,0,0,.10);--bdr2:rgba(0,0,0,.18);
  --acc:#534AB7;--acc-t:#3C3489;--acc-b:#EEEDFE;
  --ok:#E1F5EE;--ok-t:#085041;
  --warn:#FAEEDA;--warn-t:#633806;
  --red:#FCEBEB;--red-t:#7A1F1F;
  --f:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --s0:#141412;--s1:#1e1e1b;--s2:#272724;
  --tp:#f0efe9;--ts:#b4b2a9;--tm:#888780;
  --bdr:rgba(255,255,255,.09);--bdr2:rgba(255,255,255,.18);
  --acc:#AFA9EC;--acc-t:#AFA9EC;--acc-b:#26215C;
  --ok:#04342C;--ok-t:#5DCAA5;
  --warn:#2e1f05;--warn-t:#EFA527;
  --red:#3a1616;--red-t:#f0a8a8;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0f0c29;font-family:var(--f)}
body{display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:460px;background:var(--s0);min-height:100dvh;color:var(--tp);padding-bottom:60px}
.hdr{position:sticky;top:0;z-index:20;background:var(--s0);border-bottom:1px solid var(--bdr);padding:12px 16px 10px;display:flex;align-items:center;gap:10px}
.hdr h1{font-size:1.0625rem;font-weight:600;line-height:1.2}
.hdr p{font-size:.75rem;color:var(--tm);margin-top:2px}
.back{font-size:1.375rem;color:var(--tm);cursor:pointer;text-decoration:none;padding:2px 4px}
.srch{padding:12px 16px 0}
.srch input{width:100%;font:inherit;font-size:.9375rem;padding:12px 14px;border-radius:12px;border:1px solid var(--bdr2);background:var(--s2);color:var(--tp)}
.srch input:focus{outline:2px solid var(--acc);outline-offset:1px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;font-size:.8125rem;padding:7px 13px;border-radius:999px;border:1px solid var(--bdr2);background:var(--s2);color:var(--ts);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--acc-b);border-color:var(--acc-b);color:var(--acc-t);font-weight:600}
.sec{padding:2px 16px 6px}
.sec-hd{font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tm);font-weight:600;padding:14px 0 8px}
.card{background:var(--s2);border:1px solid var(--bdr);border-radius:14px;margin-bottom:9px;overflow:hidden}
.row{padding:13px 14px;cursor:pointer;display:flex;align-items:flex-start;gap:10px}
.row-txt{flex:1;min-width:0}
.row-txt b{font-size:.9375rem;font-weight:600;display:block}
.row-txt span{font-size:.8125rem;color:var(--tm);display:block;margin-top:3px;line-height:1.45}
.chev{color:var(--tm);font-size:1rem;flex:0 0 auto;padding-top:2px;transition:transform .18s}
.card.open .chev{transform:rotate(90deg)}
.body{display:none;padding:0 14px 14px;border-top:1px solid var(--bdr)}
.card.open .body{display:block}
.lbl{font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;color:var(--tm);font-weight:600;margin:12px 0 4px}
.body p{font-size:.875rem;line-height:1.55;color:var(--ts)}
.body p b{color:var(--tp)}
.note{margin-top:12px}
.note textarea{width:100%;font:inherit;font-size:.875rem;padding:10px;border-radius:10px;border:1px solid var(--bdr2);background:var(--s1);color:var(--tp);min-height:64px;resize:vertical}
.note .saved{font-size:.6875rem;color:var(--tm);margin-top:4px}
.pill{display:inline-block;font-size:.6875rem;padding:3px 9px;border-radius:999px;background:var(--s1);color:var(--ts);border:1px solid var(--bdr);margin:0 4px 4px 0;cursor:pointer}
.calm{background:var(--ok);color:var(--ok-t);border-color:transparent}
.big{padding:14px;border-radius:14px;font-size:.875rem;line-height:1.55;margin-bottom:10px;border:1px solid transparent}
.warnbox{background:var(--warn);color:var(--warn-t)}
.redbox{background:var(--red);color:var(--red-t)}
.okbox{background:var(--ok);color:var(--ok-t)}
.big b{display:block;margin-bottom:5px;font-size:.9375rem}
.txtbtn{display:inline-block;font:inherit;font-size:.8125rem;font-weight:600;color:var(--acc-t);background:var(--acc-b);border:none;border-radius:10px;padding:9px 14px;cursor:pointer;margin-top:10px}
.empty{padding:34px 20px;text-align:center;color:var(--tm);font-size:.875rem;line-height:1.6}
.addf{background:var(--s2);border:1px solid var(--bdr);border-radius:14px;padding:14px;margin-bottom:10px}
.addf label{display:block;font-size:.6875rem;text-transform:uppercase;letter-spacing:.06em;color:var(--tm);font-weight:600;margin:10px 0 4px}
.addf label:first-child{margin-top:0}
.addf input,.addf textarea{width:100%;font:inherit;font-size:.875rem;padding:10px;border-radius:10px;border:1px solid var(--bdr2);background:var(--s1);color:var(--tp)}
.mine-note{font-size:.8125rem;color:var(--tm);white-space:pre-wrap;margin-top:6px;line-height:1.5}
.ft{padding:26px 16px 40px;text-align:center;font-size:.6875rem;color:var(--tm);line-height:1.7}
.hidden{display:none}
</style>

<script>
/* ---------------------------------------------------------------------------
   Everything below is tradition, not treatment.

   The app's own rule applies here too: no medical claims. So every line says
   what people have long used a plant for — history and practice — and never
   that it works, never that it fixes anything, and never a word about how the
   body works. Anything that reads like a claim has to come out.

   The second rule is the one that matters for this house: nothing here tells
   somebody they are finished, and nothing here talks somebody out of a doctor.
   Infections are the line in the sand — an infection needs a doctor, and the
   page says so in the middle of the herb list, not in small print.
--------------------------------------------------------------------------- */

/* n name · a also called · u what people use it for · d the tradition
   h how it is traditionally taken · c the caution that has to travel with it
   t needs it belongs to (used by "By need") */
var HERBS = [
/* ---- sleep, nerves, mood ---- */
{n:'Ashwagandha',a:'winter cherry, Indian ginseng',u:'Stress, poor sleep, low stamina',t:['sleep','mood'],
 d:'Long used in India as a root powder in warm milk at night, for a body worn down by a long stretch of strain. It is a slow herb in that tradition — taken for weeks, not for one bad night.',
 h:'Root powder, warm milk or tea, evening.',c:'Not with thyroid medicine, and not in pregnancy. Ask a pharmacist if you take anything for blood pressure.'},
{n:'Chamomile',a:'German chamomile',u:'Sleep, a nervous stomach, winding down',t:['sleep','digestion'],
 d:'The oldest kitchen remedy there is for a restless night and a churning stomach. One of the few herbs gentle enough that people give it to children in the old books.',
 h:'Dried flowers, tea, 10 minutes covered.',c:'Rare in people allergic to ragweed and daisies. Safe for most.'},
{n:'Lavender',a:'English lavender',u:'Calm, sleep, a tight headache',t:['sleep','mood','skin'],
 d:'Used three ways over the centuries: the flowers in a pillow, a few drops of oil rubbed into the wrists and temples, and the oil in a carrier for the skin. The smell is most of the medicine in the tradition.',
 h:'Tea, or a few drops of oil diluted in a carrier oil.',c:'Never swallow the neat essential oil. Dilute it, always.'},
{n:'Lemon balm',a:'melissa',u:'Calm, sleep, cold sores',t:['sleep','mood','skin'],
 d:'A garden mint, used as a nightly tea for a restless mind, and the crushed leaf or a strong brew dabbed on a cold sore as it first tingles.',
 h:'Fresh or dried leaf tea; cooled strong tea on the lip.',c:'Mild. Ask first if you take thyroid medicine.'},
{n:'Passionflower',a:'maypop',u:'A racing mind at bedtime',t:['sleep'],
 d:'Used in the Americas as a tea for a mind that will not stop, often mixed with chamomile or lemon balm rather than taken alone.',
 h:'Dried leaf and flower, tea, evening.',c:'Not with sedatives or alcohol. Not in pregnancy.'},
{n:'St John\u2019s wort',a:'hypericum',u:'Low mood, low spirits',t:['mood'],
 d:'A yellow-flowering plant used across Europe for a heavy mood. It is also the herb that taught everybody to check interactions — it changes how the liver handles a long list of medicines.',
 h:'Flowering tops, tea or tincture.',c:'Read this one twice. It clashes with antidepressants, birth control, blood thinners, HIV medicine and more. Never mix it with a prescription without asking a pharmacist first.'},
{n:'Valerian',a:'all-heal, garden heliotrope',u:'Getting to sleep',t:['sleep'],
 d:'The root people reach for when the trouble is falling asleep rather than staying asleep. It smells of old socks and works, in the tradition, after a week or two of nightly use rather than one cup.',
 h:'Root, tea or tincture, 30 minutes before bed.',c:'Do not drive after a big dose. Not with alcohol, sedatives or sleeping tablets.'},
{n:'Ginseng',a:'Asian ginseng, Korean ginseng',u:'Energy, stamina, a run-down stretch',t:['energy'],
 d:'A prized root in China and Korea, chewed or brewed for tiredness and for a long convalescence. It is warming, and the old books say not to take it late in the day.',
 h:'Sliced root, tea, or a small piece chewed.',c:'Not with blood thinners or diabetes medicine, and not with high blood pressure. Not if you are already wired.'},
{n:'Ginkgo',a:'maidenhair tree',u:'Memory, cold hands and feet',t:['energy','heart'],
 d:'The seed is the old Chinese remedy; the leaf is the modern one, used for memory in older age and for circulation to the fingers and toes.',
 h:'Leaf, tea or standardised extract.',c:'Thins the blood — stop before surgery and do not take with blood thinners.'},

/* ---- digestion ---- */
{n:'Ginger',a:'root ginger',u:'Nausea, travel sickness, a heavy stomach',t:['digestion','cold','women'],
 d:'The single most useful kitchen root in the tradition: a slice chewed or brewed for a queasy stomach, for sickness on a boat, and for the cramping of a monthly cycle.',
 h:'Fresh slice in hot water, or chewed.',c:'Gentle. Large amounts can thin the blood and burn the stomach.'},
{n:'Peppermint',a:'brandy mint',u:'Gas, bloating, a tension headache',t:['digestion','cold'],
 d:'A tea after a heavy meal, and the oil — well away from the eyes — rubbed on the temples for a headache that sits across the brow.',
 h:'Leaf tea; oil diluted on the temples.',c:'Worsens heartburn for some people. Keep the oil out of the eyes and off the face of a baby.'},
{n:'Fennel seed',a:'sweet fennel',u:'Gas, cramps, bad breath',t:['digestion'],
 d:'A bowl of the seeds on the table after dinner was the ordinary European answer to wind and cramping. Chewed, or brewed as a tea.',
 h:'Seeds chewed, or crushed and brewed.',c:'Gentle. Not the concentrated oil in pregnancy.'},
{n:'Dandelion',a:'lion\u2019s tooth',u:'Water retention, a sluggish digestion, a spring clean',t:['liver','digestion'],
 d:'Every part is used: the young leaf in salad as a bitter tonic, the root roasted as a coffee substitute, and both brewed as the classic spring "cleanse" of the old herbals.',
 h:'Leaf tea, or roasted root as a drink.',c:'Not with a blocked bile duct or gallstones. It is a strong diuretic.'},
{n:'Burdock root',a:'gobo, burr root',u:'Skin, a spring clean',t:['liver','skin'],
 d:'A long taproot eaten as a vegetable in Japan and brewed in the West as one half of the old blood-cleansing pair with dandelion.',
 h:'Root, tea or in soup.',c:'Fine as food. It is a diuretic — drink water.'},
{n:'Milk thistle',a:'St Mary\u2019s thistle',u:'Looking after the liver',t:['liver'],
 d:'The seed is the part used, crushed and brewed, and it is the herb most often named when people talk about settling a liver that has had a hard time of it.',
 h:'Crushed seed, tea or extract.',c:'Do not let this stand in for medical care. A liver that is struggling needs a doctor, not a tea.'},
{n:'Slippery elm',a:'red elm',u:'A sore throat, an acid stomach',t:['digestion','cold'],
 d:'The inner bark, mixed with warm water into a gruel. It coats as it goes down, which is why it turns up for a raw throat and for an acid stomach in the old books.',
 h:'Powder mixed to a paste in warm water.',c:'Take it two hours away from any medicine — it slows how the medicine is taken up.'},
{n:'Senna',a:'Alexandrian senna',u:'Constipation',t:['digestion'],
 d:'A strong laxative leaf and pod, used for a week at most. The old herbals pair it with ginger or fennel to stop the griping.',
 h:'Leaf or pod tea, short term only.',c:'Not for more than a week, not in pregnancy, not for a child, not with a bowel condition. It is a medicine, not a morning drink.'},

/* ---- colds, throat, chest ---- */
{n:'Elderberry',a:'elder, sambucus',u:'Colds and flu, at the first sign',t:['cold'],
 d:'The cooked berry — syrup in autumn, tea through winter — is the European standby for the first day of a cold. The flowers go into a sweat tea for a fever.',
 h:'Cooked berries as syrup; flowers as tea.',c:'Never eat the raw berries, bark or stems — they are poisonous. Cooked berry only.'},
{n:'Echinacea',a:'purple coneflower',u:'A cold coming on',t:['cold'],
 d:'A North American prairie plant. The Plains nations used the root, and it entered the books as the thing to take at the very first tickle of a cold.',
 h:'Root or leaf, tea or tincture, at the first sign.',c:'Avoid with autoimmune conditions. Not long term.'},
{n:'Mullein',a:'verbascum, flannel leaf',u:'A cough, a chesty cold, earache',t:['cold'],
 d:'The soft leaf brewed for a cough that will not clear, the flowers steeped in olive oil for an earache, and the yellow flower spikes smoked for the lungs in the old mountain tradition.',
 h:'Leaf tea; flower oil, warmed, into the ear.',c:'Never put anything in an ear if it is leaking or you think the drum is torn. See a doctor.'},
{n:'Thyme',a:'garden thyme',u:'A cough, a sore throat, a mouth rinse',t:['cold','mouth'],
 d:'A kitchen herb used as medicine too: a strong brew to gargle with for a raw throat, and a steam for a chest that is tight.',
 h:'Brew strong, gargle, or breathe the steam.',c:'Gentle. Do not swallow the neat oil.'},
{n:'Licorice root',a:'sweet root',u:'A raw throat, a cough, an acid stomach',t:['cold','digestion'],
 d:'Chewed as a stick or brewed for a throat that feels scraped, and for a stomach that burns. Both uses are old and both are real in the tradition.',
 h:'Root, chewed or brewed.',c:'Raises blood pressure and drops potassium. Not with blood pressure medicine, not in pregnancy, not long term.'},
{n:'Marshmallow root',a:'marsh mallow',u:'A raw throat, an irritated stomach',t:['cold','digestion'],
 d:'The root soaked in cold water overnight, until the water goes slippery. Cold infusion, not hot — the old books are firm about that.',
 h:'Cold water infusion, sipped.',c:'Gentle. Take it away from other medicine.'},
{n:'Eucalyptus',a:'blue gum',u:'A blocked chest and head',t:['cold'],
 d:'The leaves of an Australian tree, put in a bowl of hot water with a towel over the head. It is the steam that does the work in the tradition.',
 h:'A few drops in hot water, breathed as steam; or in a rub.',c:'Never swallow the oil. Not on the face or chest of a baby or small child.'},
{n:'Sage',a:'garden sage, Dalmatian sage',u:'A sore throat, night sweats, a fuzzy head',t:['cold','mouth','women'],
 d:'A strong brew to gargle with for a throat, and the tea taken when sweats come at night. Also the classic tea for drying up milk at weaning.',
 h:'Brew strong, gargle; or tea.',c:'Not in pregnancy or while breastfeeding if you want to keep the milk. Thujone — do not take it in large amounts.'},
{n:'Yarrow',a:'milfoil, soldier\u2019s woundwort',u:'Fever, a cut that bleeds',t:['cold','skin'],
 d:'Named for Achilles. The leaf on a cut to stop the bleeding, and the flowers as a sweat tea with elder and peppermint for a fever — the three together are an old European standard.',
 h:'Leaf poultice on a cut; flowers as tea.',c:'Not in pregnancy. Not with blood thinners. Ragweed allergy.'},
{n:'Rose hips',a:'rose haw',u:'Vitamin C through winter',t:['cold','energy'],
 d:'Gathered after the first frost and brewed. In the old books it is food as much as medicine — the winter source of what kept gums and joints well.',
 h:'Dried hips, tea. Do not boil hard.',c:'The itchy hairs inside must be strained out.'},
{n:'Hibiscus',a:'roselle, sorrel in the Caribbean',u:'A cooling drink, blood pressure',t:['heart'],
 d:'A deep red drink across Africa and the Caribbean, taken iced on a hot day and drunk regularly by people keeping an eye on their blood pressure.',
 h:'Dried calyces, brewed strong, hot or iced.',c:'Lowers blood pressure — do not take it alongside blood pressure tablets without asking.'},
{n:'Garlic',a:'allium',u:'Colds, the heart and blood',t:['cold','heart'],
 d:'Few plants have been written about more. Eaten raw in the old books for a cold coming on, and eaten daily for the heart and the blood.',
 h:'Raw, crushed and rested 10 minutes; or cooked.',c:'Thins the blood. Stop before surgery. Onions and garlic are not for a dog.'},

/* ---- skin, wounds, joints ---- */
{n:'Aloe vera',a:'aloe',u:'Burns, a rash, dry or cracked skin',t:['skin'],
 d:'The clear gel from the split leaf, on a burn or a rash. It is the most widespread first-aid plant there is and grows on a windowsill almost anywhere.',
 h:'Split a leaf, spread the gel on clean skin.',c:'Do not use on a deep or open wound. The yellow latex just under the skin is a strong laxative — rinse it off.'},
{n:'Calendula',a:'pot marigold',u:'Rashes, grazes, chapped skin',t:['skin'],
 d:'The petals steeped in oil or made into a salve, for skin that is red, cracked or healing over. Not the French marigold of the seed packets.',
 h:'Petal oil or salve, on clean skin.',c:'Ragweed family. Do not put it on a wound that is infected.'},
{n:'Comfrey',a:'knitbone, boneset',u:'Bruises, sprains, a sore joint',t:['joints','skin'],
 d:'Old name knitbone, and used that way — a poultice of the leaf or a root salve on a bruise or a sprain. Externally only.',
 h:'Leaf poultice, or root in oil, on unbroken skin.',c:'Never take comfrey internally. It is damaging to the liver. Not on broken skin.'},
{n:'Turmeric',a:'haldi, Indian saffron',u:'Stiff joints, a puffy ache',t:['joints','liver'],
 d:'A kitchen root that is also the great joint herb of South Asia and the Caribbean. Usually taken with black pepper and a fat, and cooked into food rather than brewed alone.',
 h:'Fresh or powdered root with pepper, in food, or as a golden milk.',c:'Thins the blood. Not with gallstones. Large doses upset the stomach.'},
{n:'White willow',a:'willow bark',u:'Aches, pains, a fever',t:['joints'],
 d:'Willow bark was chewed for pain for thousands of years, and it is where aspirin came from. The old books use it for an aching back and for a fever.',
 h:'Bark, brewed as a bitter tea.',c:'It is aspirin, near enough: not for a child or teenager with a fever, not in pregnancy, not with a stomach ulcer, not with blood thinners.'},
{n:'Cayenne',a:'red pepper, chilli, chili, capsicum, jalapeño',u:'Warmth for cold hands and feet, a sore muscle',t:['heart','joints'],
 d:'A pinch in food to warm the body through, and an oil or salve rubbed into a stiff muscle until it goes hot.',
 h:'Small amounts in food; oil rubbed into the skin.',c:'Never near the eyes, never on broken skin. Wash your hands after. Not on a child.'},
{n:'Neem',a:'Indian lilac, nimtree',u:'Skin problems, scalp, worms',t:['skin','hair'],
 d:'Every part of the tree is used in India — the leaf paste on the skin, the oil on the scalp, and the leaf eaten in the old tradition against intestinal worms in children.',
 h:'Leaf paste or oil on the skin; oil on the scalp.',c:'Not internally in pregnancy or when trying to conceive. Do not swallow neem oil.'},
{n:'Nettle',a:'stinging nettle',u:'Poor blood, stiff joints, hay fever',t:['joints','energy'],
 d:'Gathered with gloves in spring and eaten as greens, or brewed. The old books use it as a strengthening food for someone run down and pale.',
 h:'Young leaf, cooked as greens; or brew the dried leaf.',c:'A diuretic — drink water. Not with blood pressure or diabetes medicine without asking.'},

/* ---- women's, men's, whole-body ---- */
{n:'Raspberry leaf',a:'red raspberry',u:'Monthly cycles, the last weeks of pregnancy',t:['women'],
 d:'The leaf, brewed. It is the one herb the old books give to women in the last weeks before a birth, and for a heavy or cramping cycle.',
 h:'Dried leaf, tea.',c:'Ask a midwife before taking it in pregnancy — this is not one to decide on your own.'},
{n:'Black seed',a:'nigella, black cumin',u:'A bit of everything, colds included',t:['cold','energy'],
 d:'The seed, eaten by the spoonful with honey across the Middle East and Africa, and written about in the old medicine there as good for nearly everything — a claim worth holding loosely.',
 h:'Whole or ground seed, often with honey.',c:'Gentle. Not the neat oil in pregnancy.'},
{n:'Moringa',a:'drumstick tree, miracle tree',u:'Food when food is thin, tiredness',t:['energy'],
 d:'The leaf of a tree eaten as a green vegetable across South Asia and West Africa, used to build somebody back up when they have been ill or eating badly.',
 h:'Dried leaf powder in food or drink.',c:'Fine as food. The root and bark are not for eating.'},
{n:'Parsley',a:'garden parsley',u:'Water retention, breath, a spring tonic',t:['liver','mouth'],
 d:'The leaf eaten by the handful and the root brewed, as the old kitchen answer to a puffy body and a spring clean of the system.',
 h:'Fresh leaf in quantity, or root tea.',c:'Not the oil, and not large amounts in pregnancy.'},
{n:'Clove',a:'cloves',u:'Toothache, the mouth',t:['mouth'],
 d:'The dried flower bud, held against a tooth that is aching, and the whole clove chewed for the breath. The oil is the strongest thing in the kitchen cupboard.',
 h:'Whole clove held on the tooth; oil on a cotton bud.',c:'Never swallow the oil neat and never give it to a child. A toothache that lasts needs a dentist — clove only holds the pain back.'},
{n:'Goldenseal',a:'yellow root',u:'Traditionally for infection and inflammation',t:['cold','skin'],
 d:'A North American root, over-picked and now rare, used in the old books for inflamed tissue and for what they called infections. It is one of the herbs this page will not hand you.',
 h:'Root, or tea.',c:'Not in pregnancy. Not for a newborn — it causes lasting harm to a baby. And it will not clear an infection — a fever, or a wound going red and hot, is a doctor today.'},
{n:'Oregano oil',a:'wild marjoram',u:'Traditionally for infection',t:['cold'],
 d:'The oil of a kitchen herb, taken in drops under the tongue or in a capsule in the old tradition against what was called an infection.',
 h:'Diluted oil, or capsule.',c:'Burns neat. Not internally in pregnancy, not for children. It is not a substitute for an antibiotic when one is needed.'},
{n:"Eleuthero",a:"Siberian ginseng, devil's shrub",u:"Long strain, tiredness, getting through a hard stretch",t:["energy","mood"],d:"A prickly shrub root from Siberia and north-east China, brewed by people who worked outdoors in the cold. The old books put it beside ginseng as the slower, cheaper stand-in.",h:"Root, tea or tincture, morning and early afternoon.",c:"Not late in the day. Not with blood pressure medicine or blood thinners without asking first."},
{n:"American ginseng",a:"wisconsin ginseng",u:"Tiredness, a dry cough, building back up",t:["energy","lungs"],d:"The North American cousin of the Chinese root, and the old books put it as the cooler of the two — for somebody worn out and dry rather than wired and hot. Over-picked and now expensive.",h:"Slice of root chewed, or brewed.",c:"Not with blood thinners or diabetes medicine. Not with caffeine in quantity."},
{n:"Rhodiola",a:"roseroot, arctic root",u:"A tired body, low mood, altitude and cold",t:["energy","mood"],d:"A high-mountain root used across Scandinavia and Russia for the days when the light is short and the work is long. Traditionally taken early, never at night.",h:"Root, tea or capsule, in the morning.",c:"Warming and a little stimulating. Not with antidepressants without asking first."},
{n:"Holy basil",a:"tulsi, sacred basil",u:"Strain, a heavy chest, low spirits",t:["mood","cold","sleep"],d:"Grown at the door of Indian homes and taken as a daily tea for a mind carrying weight and for the chest in cold season. One of the few herbs taken every day rather than in a bad week.",h:"Fresh or dried leaf tea, often with honey.",c:"Gentle. It thins the blood a little — say so before surgery or with warfarin."},
{n:"Schisandra",a:"five-flavour berry, wu wei zi",u:"Tiredness, a spinning mind, a hard stretch",t:["energy","liver","mood"],d:"A red berry from northern China, chewed or brewed, named for tasting sweet, sour, salty, bitter and hot at once. The old texts use it for a body asked to do too much.",h:"Dried berry, tea or chew a few.",c:"Not in pregnancy. It moves liver enzymes — check it against any medicine you take."},
{n:"Maca",a:"Peruvian ginseng",u:"Energy, stamina, the change of life",t:["energy","women"],d:"A root vegetable grown high in the Andes, eaten roasted or powdered. The tradition is stamina and a steady mood rather than a jolt.",h:"Dried root powder, in food or drink.",c:"Gentle. Go slow with thyroid medicine."},
{n:"Gotu kola",a:"Indian pennywort, mandukaparni",u:"Concentration, low mood, slow-healing skin",t:["mood","skin","joints","hair"],d:"A creeping water plant eaten as a green in Sri Lanka and brewed in India, for a clear head and for skin and scars that have been slow to settle.",h:"Leaf, eaten, tea or tincture.",c:"Not in pregnancy. Large long-term doses have upset livers in a few people."},
{n:"Bacopa",a:"brahmi, water hyssop",u:"Memory, study, a foggy head",t:["mood"],d:"A bog plant used in India for memory and for a mind that will not hold still. The old books say it is slow — months, not mornings.",h:"Leaf, powder in warm milk or ghee.",c:"Can loosen the stomach in the first weeks. Not with sedatives."},
{n:"Skullcap",a:"scullcap, mad dog weed",u:"A racing mind, tensed shoulders at night",t:["sleep","mood"],d:"A small mint from North America, brewed as an evening tea for a mind that will not stop talking. Usually paired with valerian or passionflower rather than taken alone.",h:"Dried leaf, tea, evening.",c:"Buy from a tested seller — it has been cut with other plants. Not with sedatives."},
{n:"Catnip",a:"catmint",u:"Sleep, a restless child, a fever",t:["sleep","fever"],d:"The garden mint cats roll in, brewed as a gentle evening tea and, in the old books, as a sweat tea when a fever is climbing. One of the mildest on this list.",h:"Leaf tea, covered, 10 minutes.",c:"Mild. Do not give strong brews to a baby."},
{n:"Milky oat tops",a:"oat straw, wild oats",u:"Worn down nerves, sleep, hair and nails",t:["sleep","hair","energy"],d:"The green tops of the oat plant, harvested milky. The old books use them for a person who is exhausted rather than ill — the long grey tiredness of months.",h:"Dried tops, tea or tincture, daily for weeks.",c:"Gentle and slow. It is food as much as herb."},
{n:"Hops",a:"hop flowers",u:"Sleep, a nervous stomach",t:["sleep","digestion"],d:"The pillow stuffed with hop flowers is the old English answer to sleeplessness; the same flowers give beer its bitter. Drinkers of the old books used a tea, not a pint.",h:"Dried flowers, tea, evening; or in a pillow.",c:"Not with alcohol or sedatives. Skip it if you have ever had a low mood — it has flattened some people."},
{n:"California poppy",a:"golden poppy",u:"Sleep, a restless ache at night",t:["sleep","pain"],d:"The orange state flower, used by the peoples of California for a mild evening calm and for a body that aches and will not settle. Not the opium poppy, and not related to it in strength.",h:"Aerial parts, tea or tincture, evening.",c:"Not with sedatives or pain medicine. Not in pregnancy."},
{n:"Blue vervain",a:"vervain, holy herb",u:"A tight, wound-up mind",t:["sleep","mood"],d:"A roadside plant used in Europe and the Americas for a mind clenched like a fist, often in the same pot as lemon balm and chamomile.",h:"Leaf and flower, tea, evening.",c:"Not in pregnancy — it has been used to start labour and can be harmful. Bitter."},
{n:"Motherwort",a:"lion's ear",u:"A pounding heart from nerves, cycles, after childbirth",t:["heart","women","sleep"],d:"A bitter mint named for the mother, used across Europe for a heart thumping from worry and for the cramping of a monthly cycle. The old books call it the herb of the frightened.",h:"Leaf, tea, or tincture in drops.",c:"Not in pregnancy. Do not use it to rest a heart that is actually unwell — that is a doctor."},
{n:"Wood betony",a:"betony, bishopswort",u:"A heavy head, worry, poor sleep",t:["mood","sleep"],d:"Once grown in every European monastery garden; the saying went that it was good for everything. Practically, it was the tea for a heavy head and a worrying mind.",h:"Leaf, tea, evening.",c:"Mild. Not with blood pressure medicine without asking."},
{n:"Linden",a:"lime flower, basswood",u:"Sleep, a nervous heart, a fever",t:["sleep","heart","fever"],d:"The flowers of the tree in every European square, brewed as the calming evening cup and as a sweat tea when a fever comes on. The smell is part of it.",h:"Flowers and bracts, tea, covered.",c:"Gentle. Not a lot every day if you have a heart condition."},
{n:"Lemon verbena",a:"aloysia, verbena",u:"A heavy meal, winding down",t:["sleep","digestion"],d:"A South American leaf grown in gardens for its smell, brewed after dinner in Spain and Portugal for a full stomach and an easy evening.",h:"Fresh or dried leaf tea.",c:"Gentle. Very large amounts over months have been linked to kidney irritation."},
{n:"Kava",a:"kava kava, awa",u:"Tension, a mind that will not switch off",t:["sleep","mood"],d:"The Pacific island root ground and mixed with water for ceremonies and for settling disputes; the drink makes the mouth numb and the shoulders drop. Taken as a drink, never as a neat oil.",h:"Ground root, mixed in water, strained, drunk.",c:"Real caution: it has hurt livers, and mostly where the wrong part of the plant or a solvent extract was used, or alongside alcohol. Never with alcohol or paracetamol, never for more than a few weeks, never if your liver has been through it. Not while driving."},
{n:"Damiana",a:"mexican holly",u:"Low spirits, low desire, a heavy mood",t:["mood","energy"],d:"A small shrub of Mexico and Central America, brewed as a tea for the mood that sits behind wanting anything at all.",h:"Leaf, tea, often in the evening.",c:"Not with diabetes medicine — it has moved blood sugar in some people."},
{n:"Cacao",a:"raw cocoa, theobroma",u:"Low mood, a tired afternoon",t:["mood","heart"],d:"The ground seed of the cacao tree, taken as a bitter drink long before sugar was added to it. Ceremonial cacao is the old drink, unsweetened and strong.",h:"Ground seed in hot water, unsweetened.",c:"Stimulating — it will keep you awake. Not a small thing if you have a heart rhythm problem."},
{n:"Green tea",a:"camellia, matcha",u:"Energy, a steady head, the heart",t:["energy","heart"],d:"Leaf of the tea bush, steamed rather than fermented, drunk green for centuries in China and Japan. The tradition is a calm alertness rather than a jolt.",h:"Leaf, brewed, 2-3 minutes.",c:"Caffeine. Empty the stomach if you are sensitive. It cuts how well iron tablets are taken up."},
{n:"Yerba mate",a:"mate, ilex",u:"Energy, appetite, a long day",t:["energy","digestion"],d:"A holly of South America, drunk through a metal straw from a shared gourd. Strong in the tradition for labouring and for the long afternoon.",h:"Dried leaf, brewed, drunk warm.",c:"Caffeine and a lot of it. Habitual very hot mate has been linked with throat trouble — let it cool a little."},
{n:"Guarana",a:"paullinia, brazilian cocoa",u:"Deep tiredness, a long shift",t:["energy"],d:"A climbing vine of the Amazon whose seed carries more caffeine than coffee. The old use is a paste grated into water for hunting trips.",h:"Seed powder in water or capsule.",c:"Strong caffeine: heart flutters, anxiety, sleepless nights. Not with a heart condition and not in pregnancy."},
{n:"Kola nut",a:"cola nut, guru nut",u:"Tiredness, a heavy stomach, appetite",t:["energy","digestion"],d:"The West African nut chewed at meetings and offered to guests; the original ingredient the soft drink was named for, long before it stopped being in it.",h:"Small piece chewed, or the powder brewed.",c:"Caffeine. Not with high blood pressure or a racing heart."},
{n:"Cordyceps",a:"cordyceps mushroom",u:"Stamina, breathing, coming back from a long illness",t:["energy","lungs"],d:"A high-altitude mushroom body once gathered from caterpillars in Tibet, grown on grain now, used in the tradition for breath and endurance.",h:"Dried mushroom, tea, soup or capsule.",c:"Ask first if you take blood thinners or have a transplant. Avoid if you have a mushroom allergy."},
{n:"Reishi",a:"lingzhi, the mushroom of immortality",u:"Building back up, a chest that is always catching",t:["energy","cold","heart"],d:"The shiny red shelf mushroom of East Asia, boiled for hours into a bitter tea. It is a long slow tea in the tradition, taken through a season rather than a week.",h:"Dried mushroom, simmered 30 minutes or more.",c:"Bitter. It thins the blood a little — stop before surgery. Not with immune-suppressing medicine."},
{n:"Chaga",a:"birch conk, black mass",u:"Stamina, cold weather, the long haul",t:["energy","cold"],d:"The black crust that grows on northern birches, chipped off and simmered by people who live where winter is serious. It tastes of the wood it grew on.",h:"Chipped conk, simmered long, drunk as tea.",c:"High in oxalates — not for anyone with kidney stones or kidney trouble. It also thins the blood."},
{n:"Lion's mane",a:"hericium, bearded tooth",u:"A foggy head, concentration, low mood",t:["mood"],d:"A white shaggy mushroom that hangs like a beard from dead wood, cooked in food in Japan and China and brewed as a tea for a clear head.",h:"Fresh or dried mushroom, cooked or simmered.",c:"Food-like and well tolerated. Ask first if you are on blood thinners."},
{n:"Turkey tail",a:"coriolus, yun zhi",u:"The body's own defences during a run of illness",t:["cold"],d:"A little striped bracket fungus on every dead stump, brewed in China as the plain daily tea for keeping well rather than for a bad night.",h:"Dried fungus, simmered, drunk daily.",c:"Well tolerated. Ask first if you take immune-suppressing medicine."},
{n:"Astragalus",a:"huang qi, milk vetch",u:"Catching everything going round, poor stamina",t:["cold","energy"],d:"The long sweet root of the Chinese tonic soups, put in the pot with chicken through winter. Taken between illnesses to stay well, not during a cold already going.",h:"Sliced root, simmered in soup or tea.",c:"Traditionally not taken during a fever, only between. Not with immune-suppressing medicine."},
{n:"Shatavari",a:"asparagus root, the woman's root",u:"After childbirth, the change of life, low energy",t:["women","energy"],d:"The root of a wild asparagus used in India as the woman's tonic — cooked in milk and taken in the weeks after a birth and through the years of the change.",h:"Dried root powder in warm milk, or the root cooked.",c:"Not during pregnancy. Ask first if you take a diuretic."},
{n:"Jasmine",a:"jasmine flower",u:"Sleep, low mood, a tight chest",t:["sleep","mood"],d:"The flower worn and smelled to lift a room, and taken as a tea in China for a low mood that sits in the chest. Often the smell is the whole of it.",h:"Dried or fresh flowers, tea.",c:"Mild. Not the neat essential oil by mouth."},
{n:"Rose",a:"rose petal, rugosa",u:"A low mood, grief, the skin",t:["mood","skin","women"],d:"The petals, dried and brewed as a delicate pink tea, used in the old books for the heaviness that follows a loss, and in creams for the skin.",h:"Dried petals, tea; petals in oil for the skin.",c:"Gentle. Skip the commercially sprayed garden flowers."},
{n:"Neroli",a:"orange blossom",u:"Sleeplessness, worry, a churning stomach",t:["sleep","mood","digestion"],d:"Distilled from bitter orange flowers, used in the Mediterranean for a nervous stomach and a restless evening, most often as the smell on a cloth.",h:"A drop of oil on a cloth by the bed; flowers as tea.",c:"Never swallow the essential oil. Dilute for the skin."},
{n:"Rosemary",a:"rosemary leaf",u:"Memory, tiredness, hair and scalp",t:["energy","hair","mouth"],d:"The Mediterranean shrub hung in rooms and rubbed on the head; the old herbals keep it for memory and for the scalp, and the rinse is the oldest hair remedy in Europe.",h:"Leaf tea; strong brew poured over the hair as a rinse.",c:"Do not take large amounts of the oil or the leaf if you are pregnant, or if you have a seizure history."},
{n:"Black pepper",a:"peppercorn",u:"A winter cold, poor digestion, warming up",t:["cold","digestion"],d:"The dried berry that carries the heat in the old cold remedies — a few corns with honey and ginger for a scratchy throat, and a pinch on food to wake a cold stomach.",h:"Ground corns in food; with honey for a throat.",c:"Gentle in food. It sharpens how fast some medicines are absorbed, so keep it small with prescriptions."},
{n:"Cardamom",a:"elachi, green cardamom",u:"A heavy stomach, wind, coffee nerves",t:["digestion","sleep"],d:"The green pod chewed after meals across India and the Gulf for wind and for the acidity that comes with too much coffee. It is the digestif in the pot of chai.",h:"Pods chewed, or crushed into tea and coffee.",c:"Gentle and food-like."},
{n:"Coriander",a:"cilantro, dhania",u:"Wind, bloating, a heavy meal",t:["digestion"],d:"A herb and a seed in the same plant: the leaf in food, the seed brewed as a tea after dinner in the Middle East and India for wind and cramping.",h:"Seed, crushed, brewed; leaf in food.",c:"Gentle. The leaf is a common dislike, not a danger."},
{n:"Caraway",a:"caraway seed",u:"Wind, a colicky baby's mother, a heavy bread",t:["digestion"],d:"The seed baked into bread and sauerkraut in northern Europe for the very reason it is brewed as a tea — wind. One of the great old kitchen digestives.",h:"Seeds chewed, or crushed and brewed.",c:"Gentle. Do not give the neat oil to a baby."},
{n:"Aniseed",a:"anise seed",u:"Wind, a cough, a baby's griping",t:["digestion","lungs"],d:"A sweet Mediterranean seed, chewed after dinner and brewed for a cough that will not clear. The old warm milk with a few seeds is a sleeping drink for children.",h:"Seeds chewed or brewed, often with honey.",c:"Gentle as a tea. Not the concentrated oil for children."},
{n:"Cumin",a:"jeera",u:"Wind, a sluggish digestion, breast milk",t:["digestion","women"],d:"The seed in every Indian tempering pan, brewed as a warm tea for wind and cramping, and given to nursing mothers in the tradition as a warm drink.",h:"Seeds, dry-roasted, brewed as tea.",c:"Gentle in food. Big amounts of the oil are not for pregnancy."},
{n:"Ajwain",a:"carom seed, bishop's weed",u:"Wind, cramping, a sour stomach",t:["digestion"],d:"A tiny seed of the parsley family, kept in Indian kitchens for colic in babies and for the trapped wind that comes with a long journey.",h:"Seeds chewed with a pinch of salt, or brewed.",c:"Strong taste. Not the oil internally for children or in pregnancy."},
{n:"Asafoetida",a:"hing",u:"Wind, bloating, a nervous stomach",t:["digestion"],d:"The hell-smelling resin that turns delicious in hot oil; a pinch goes into the pot to make beans and lentils stop causing wind. A staple of Indian cooking for a delicate stomach.",h:"A pinch fried in oil at the start of cooking.",c:"A pinch is plenty. Not for a liver that is struggling — it is hard on it in quantity."},
{n:"Fenugreek",a:"methi seed",u:"A sour stomach, milk supply, the hair",t:["digestion","women","hair"],d:"The seed of the clover family, soaked overnight and eaten or brewed as a bitter tea. It is a kitchen spice, a nursing-mother's tradition, and the old hair paste with yoghurt.",h:"Soaked seeds eaten, or brewed as tea.",c:"It has moved blood sugar sharply in some people — take care with diabetes medicine. Not in pregnancy."},
{n:"Licorice",a:"liquorice, sweet root",u:"A cough, a sore stomach, a raw throat",t:["lungs","digestion","cold"],d:"The sweet root dug beside rivers in the Middle East and Asia, brewed for a cough and eaten by children as a sweet. In the old Chinese pots it is the herb that carries the rest.",h:"Root tea, or the sticks chewed.",c:"Important: it raises blood pressure and drops potassium — not daily and not in quantity if you have high blood pressure, heart trouble, or take a diuretic. Not in pregnancy."},
{n:"Meadowsweet",a:"queen of the meadow",u:"A sour stomach, an aching joint, a headache",t:["digestion","joints","pain"],d:"A frothy white flower of wet European meadows; the old herbals use it for the burning stomach and for the joints, and it is the plant aspirin was first made from.",h:"Flower and leaf, tea, often with ginger.",c:"Not for anybody who cannot take aspirin, and not for a child with a fever. Not with blood thinners."},
{n:"Gentian",a:"yellow gentian",u:"A poor appetite, a heavy meal",t:["digestion","liver"],d:"The alpine root at the bottom of a bitter aperitif. The bitter on the tongue before eating is the whole point in the tradition: it wakes the appetite and the juices.",h:"A little root in cold water as an aperitif before food.",c:"Not with a stomach ulcer. Very bitter."},
{n:"Angelica",a:"garden angelica, dong quai's cousin",u:"Wind, poor appetite, the change of life",t:["digestion","women","cold"],d:"A tall sweet-smelling plant of the north, candied and brewed as a warming tea for a cold body and a heavy period. It was called the root of the Holy Spirit.",h:"Stem and root, candied or brewed as tea.",c:"It moves blood — not in pregnancy, and not with blood thinners."},
{n:"Artichoke leaf",a:"globe artichoke",u:"A heavy, fatty meal, a sluggish liver",t:["liver","digestion"],d:"The leaf left over after the heart is eaten, brewed as the bitter tea taken before a heavy meal across the Mediterranean.",h:"Dried leaf, tea, before food.",c:"Not with a blocked bile duct or gallstones."},
{n:"Barberry",a:"berberry",u:"A sluggish liver, the bowels, a poor appetite",t:["liver","digestion"],d:"A thorny berry shrub whose yellow root was used as a bitter, and the sour berries cooked into food. The old herbals give it for a liver that feels dull.",h:"Root bark as a bitter tea; berries in food.",c:"Not in pregnancy — it moves the womb and colours a baby's jaundice badly."},
{n:"Yellow dock",a:"curled dock, rumex",u:"Constipation, the skin, a spring clean",t:["digestion","skin","liver"],d:"The dock leaf of every field margin; the root is the old bitter tonic, taken as a spring tea when the bowels and the skin have both gone dull.",h:"Root, decoction or tincture, short term.",c:"Not for more than a few weeks, and not in pregnancy. Not with a history of kidney stones."},
{n:"Triphala",a:"three fruits",u:"Constipation, a sluggish gut, the eyes",t:["digestion"],d:"Three Indian fruits ground together — amla, haritaki and bibhitaki — taken as a powder in warm water at night. The most common daily bowel tonic in the Indian tradition.",h:"Powder in warm water, at night, or in a tablet.",c:"Take it away from other medicine. Not in pregnancy or with diarrhoea."},
{n:"Psyllium husk",a:"ispaghula, plantago",u:"Constipation, the bowels, a heavy stomach",t:["digestion","heart"],d:"The husk of a small plantain seed, soaked into a gel and drunk with plenty of water. The old books use it both ways — for a constipated gut and for a loose one.",h:"One spoon soaked in a large glass of water, then more water.",c:"Always with a full glass of water or it can block the throat. Take it two hours away from any medicine."},
{n:"Flaxseed",a:"linseed",u:"Constipation, a dry skin, the heart",t:["digestion","skin","heart"],d:"A seed that turns to gel in water, cracked fresh and eaten with cereal or drunk in water. In the old northerner's diet it was the everyday answer to a slow bowel.",h:"Freshly ground seed, in water or food, with plenty of water.",c:"Grind it fresh; whole seed passes through. Not with a bowel obstruction. Drink water."},
{n:"Papaya leaf",a:"pawpaw leaf",u:"A stubborn digestion, the blood's own plates",t:["digestion"],d:"The leaf of the fruit tree, brewed bitter in the tropics after a heavy meal and taken in the dengue fever season in the old practice.",h:"Fresh leaf, brewed as a strong bitter tea.",c:"Strong tasting. Not in pregnancy — the unripe fruit and leaf are used to end pregnancies in the old texts."},
{n:"Pineapple",a:"ananás, bromelain",u:"Swelling, a heavy meal, a sore joint",t:["joints","digestion","pain"],d:"The stem of the fruit carries the enzyme used in the old books for swelling after an injury and for a heavy meal. It is food first, medicine second.",h:"Fresh fruit, or the stem extract.",c:"Not with blood thinners. The fresh fruit burns the mouth of some people."},
{n:"Chicory",a:"succory, blue sailors",u:"A sluggish liver, a bitter appetite, coffee substitutes",t:["liver","digestion"],d:"The blue roadside flower whose root, roasted, has stood in for coffee in hard times across Europe. The leaf in salad is the bitter spring green.",h:"Roasted root brewed as a drink; leaf in salad.",c:"Not if you are allergic to ragweed, daisies or dandelion."},
{n:"Wormwood",a:"absinthe, mugwort's sister",u:"The old worm and parasite remedy, a poor appetite",t:["digestion","liver"],d:"The bitterest plant in the European herbals, brewed for what the old books called worms and for a hopeless appetite. It is also the heart of absinthe, and it is not a casual tea.",h:"A short bitter tea, days at most.",c:"Read twice: it is not for pregnancy, not for more than a few days, and not in quantity — the oil is genuinely poisonous. Wormwood does not clear a worm. That is a doctor and a tablet."},
{n:"Black walnut",a:"juglans, walnut hull",u:"The old worm remedy, the skin",t:["digestion","skin"],d:"The hull of the black walnut, tinctured as the bitter brown drops in the old deworming recipes and used as a wash for the skin.",h:"Hull tincture, short term; or a wash for the skin.",c:"Not in pregnancy. Not for more than a few days. A worm needs a doctor, not a nut tincture."},
{n:"Pumpkin seed",a:"pepita",u:"The old worm remedy, the prostate, sleep",t:["digestion","men","sleep"],d:"The green seed eaten by the handful, and by the handful of a hundred in the old recipes against tapeworm. Also the most ordinary kitchen answer for a man's nighttime trips.",h:"Seed eaten raw, or ground in water.",c:"Food-like and safe in handfuls. The worm dose was enormous — for that, see a doctor."},
{n:"Elecampane",a:"inula, horse heal",u:"A deep wet cough",t:["lungs"],d:"A big yellow daisy root of Europe, candied and brewed for the cough that sits deep and rattles. One of the strongest of the old chest roots.",h:"Root, decoction, or candied.",c:"Not in pregnancy. Some people react to it on the skin. A rattle in the chest that will not clear is a doctor."},
{n:"Coltsfoot",a:"tussilago, coughwort",u:"A cough, in the old books",t:["lungs"],d:"The flower that comes before the leaf in early spring, named in Latin for cough and used for centuries in European cough syrups. The name in the old books is the whole of its reputation.",h:"Flower and leaf, brewed, short term only.",c:"Hold this one carefully: it contains substances that strain the liver, so no more than a few days, never in pregnancy, and never for a child. Its place here is history, not a recommendation."},
{n:"Pleurisy root",a:"butterfly weed, pleurisy root",u:"A chest infection's cough, in the old books",t:["lungs","fever"],d:"A North American milkweed root used by the peoples of the plains and then by the settlers for a chest that is hot and painful to breathe.",h:"Root, decoction.",c:"Narrow and strong. A chest that hurts to breathe is a doctor today — this page will not send you to a root for it. Not in pregnancy."},
{n:"Horehound",a:"white horehound",u:"A cough, a settled chest",t:["lungs"],d:"The bitter mint behind the black rock candy in every old-fashioned sweet shop. Boiled with sugar into cough candy, or brewed as a bitter tea.",h:"Leaf, tea, or boiled into candy.",c:"Not in pregnancy. It can move blood sugar."},
{n:"Hyssop",a:"hyssop",u:"A cough, a chest that is tight",t:["lungs","cold"],d:"A small blue-flowered garden herb, brewed as the old European chest tea and sprinkled in the sickroom. The name in the old texts is for a cleansing.",h:"Leaf and flower, tea, often with honey.",c:"Not for a long stretch or in quantity — the oil can cause fits in some people. Not in pregnancy."},
{n:"Wild cherry bark",a:"chokecherry bark",u:"A dry, hacking cough",t:["lungs"],d:"The inner bark of the North American cherry, brewed into the syrup that gives old cough medicine its smell. Syruped with honey in the old books.",h:"Bark, decoction, or syrup.",c:"Not for a child, and not in quantity — it carries cyanide-like compounds. Leave a cough syrup for a child to a pharmacist."},
{n:"Onion",a:"allium cepa",u:"A cold, a cough, a stye",t:["cold","lungs"],d:"The sliced onion by the bed, the onion syrup with honey in the old cough recipes, and the onion poultice on the chest of a child. The oldest kitchen medicine in Europe.",h:"Cut onion in honey overnight, spooned; or brewed.",c:"Gentle as food. It is not an antibiotic."},
{n:"Horseradish",a:"armoracia",u:"A stubborn sinus, a cold in the head",t:["cold","lungs"],d:"The hot root grated fresh — and grated outdoors, by the wisdom of every cook — for the head that is completely blocked. It clears, briefly, in a way nothing else in the kitchen does.",h:"A little fresh-grated root on food.",c:"One of the hottest things here. Not for an ulcer, not for a child, not for thyroid medicine."},
{n:"Pine",a:"scots pine, pine needle",u:"A chest, a stuffy room, winter",t:["lungs","cold"],d:"The needles of the northern pine brewed as a tea in winter and the oil in steam when the chest is heavy. The smell is what the old books use it for.",h:"Needles brewed as tea; oil in hot water, breathed.",c:"Tea in small amounts, not in pregnancy. Never swallow pine oil."},
{n:"Osha",a:"bear root, loveroot",u:"A cold that starts in the chest",t:["cold","lungs"],d:"A high mountain root of the American south-west, chewed by the root for a scratchy throat and brewed when a cold drops into the chest. Chewed at the first sign, in the tradition.",h:"Root chewed, or brewed as a tea.",c:"Not in pregnancy — it has been used to bring on labour. Not a long daily tea."},
{n:"Lomatium",a:"biscuit root, desert parsley",u:"A stubborn chest in the old books",t:["cold","lungs"],d:"A parsley-family root of the dry American west, eaten as food and brewed as tea through the influenza years by the people there.",h:"Root, decoction, short term.",c:"Rashes are common with it in some preparations. Very strong — short runs only, not in pregnancy."},
{n:"Olive leaf",a:"olea europaea",u:"The blood, a cold that lingers",t:["cold","heart"],d:"The leaf of the Mediterranean tree, brewed as a bitter tea for the blood and for a cold that has been hanging on for weeks.",h:"Dried leaf, tea, or extract.",c:"Not with blood pressure medicine or diabetes medicine without asking — it moves both."},
{n:"Andrographis",a:"king of bitters, chiretta",u:"A cold at the very first day",t:["cold","fever"],d:"A bitter Indian weed, taken as soon as a cold starts and only for a few days. The whole tradition with it is 'short and early'.",h:"Leaf, tablet or bitter tea, 3-5 days only.",c:"Not for longer than a week, not in pregnancy, and not with blood pressure medicine."},
{n:"Cat's claw",a:"uña de gato",u:"Joints, the body's defences, an aching muscle",t:["joints","cold","pain"],d:"A hooked vine of the Amazon, brewed as a long tea by the people there for swelling joints and for low fevers.",h:"Inner bark, decoction, long-simmered.",c:"Not with immune-suppressing medicine, not before surgery, and not in pregnancy."},
{n:"Myrrh",a:"commiphora, the resin",u:"A sore throat, the gums, a mouth",t:["mouth","cold","skin"],d:"The fragrant resin of the biblical trade routes — burnt, chewed and tinctured. In the mouth it is the old gum tonic, and it was one of the three gifts for a reason.",h:"A drop of tincture in warm water as a gargle; the resin chewed.",c:"Not internally in pregnancy. A swallow only — the neat oil is a medicine, not a mouthwash."},
{n:"Propolis",a:"bee glue",u:"A sore throat, a mouth, the gums",t:["mouth","cold"],d:"What the bees use to seal and disinfect their hive, scraped off and used by the old beekeepers for the mouth and the throat. Tinctured or chewed as the sticky gum.",h:"A few drops of tincture in water as a gargle.",c:"Not if you react to bee stings or honey. Not in pregnancy for long stretches."},
{n:"Pelargonium",a:"umckaloabo, South African geranium",u:"A cough in the chest in the old practice",t:["lungs","cold"],d:"The root of a South African plant, sent to Europe a century ago and used there for a chest that will not clear.",h:"Root extract, short term.",c:"Not for a long run. A chest that rattles and a fever together is a doctor."},
{n:"Elderflower",a:"elder blow",u:"A fever, a cold, sweating it out",t:["fever","cold"],d:"The flower of the elder bush, brewed hot with yarrow and peppermint as the old European sweat tea at the start of a fever — the one remedy the neighbours all knew.",h:"Flowers, tea, hot, then go to bed.",c:"Gentle. Never use the bark or raw berries."},
{n:"Boneset",a:"thoroughwort",u:"A fever with aching bones",t:["fever","pain"],d:"A North American wetland plant given its name for the breakbone fever it was used for, taken bitter and hot to make a person sweat and sleep.",h:"Leaf, tea, hot, then bed.",c:"Strong and bitter — a day or two only, never in quantity. Contains compounds that can strain the liver."},
{n:"Feverfew",a:"featherfew",u:"A headache that comes back",t:["pain","fever","women"],d:"A small daisy planted at the doors of old European cottages, and chewed a leaf a day by people who got the same headache every week.",h:"Fresh leaf, 1-2 a day, in bread; or a dried tea.",c:"The fresh leaf makes the mouth sore and can upset the stomach. Not with blood thinners and not in pregnancy."},
{n:"Uva ursi",a:"bearberry, kinnikinnick",u:"A burning bladder, in the old books",t:["urinary"],d:"A ground-hugging berry plant of northern hills, brewed as a short strong tea at the first day of burning water. It is one of the herbs this page will not hand over.",h:"Leaf, short strong decoction, days only.",c:"Days only — it damages the liver and the ear in longer runs, and it is not for pregnancy or a child. And plainly: burning water and a fever is a bladder infection, and that is a doctor and a tablet, not a tea."},
{n:"Cranberry",a:"lingonberry's cousin",u:"The waterworks, keeping a bladder clear",t:["urinary"],d:"The tart northern berry, drunk as juice by people who keep getting bladder trouble, and eaten with meat through the winter. The tradition is small amounts daily, for a long time.",h:"Unsweetened juice, or the berries.",c:"Not with warfarin — it moves it. Not for a bladder infection you already have: burning water with a fever is a doctor."},
{n:"Corn silk",a:"maize silk, zea",u:"Burning water, a swollen ankle",t:["urinary"],d:"The golden threads from a cob of corn, thrown away by every cook and brewed by every old herbalist for a bladder that feels raw.",h:"Fresh or dried silk, tea.",c:"Gentle. It is a diuretic — drink water. Burning water with a fever is a doctor."},
{n:"Celery seed",a:"ajmod, marsh celery",u:"An aching joint, the waterworks",t:["joints","urinary","pain"],d:"The seed of the salad plant, brewed as a tea in the old books for a stiff, aching joint and for water backing up.",h:"Seed, crushed and brewed as a tea.",c:"Not for more than a few weeks. Not in pregnancy, and not for a kidney that is already unwell."},
{n:"Couch grass",a:"twitchgrass, dog grass",u:"Burning water, gravel in the old books",t:["urinary"],d:"The hated garden weed, whose white root every old herbal brews for a bladder that stings. One of the gentlest of the water herbs.",h:"Root, decoction.",c:"Gentle. It is a diuretic — drink water."},
{n:"Juniper",a:"juniper berry",u:"The waterworks, an aching joint, a heavy meal",t:["urinary","digestion","joints"],d:"The berry of the gin tree, chewed and brewed as the old water tonic. Gin was invented as medicine, badly.",h:"Berries chewed or brewed, short term.",c:"Short runs only — the oil is hard on the kidneys — and never in pregnancy or with kidney disease."},
{n:"Goldenrod",a:"solidago",u:"The waterworks, a hay-fever head",t:["urinary","cold"],d:"The yellow field flower blamed for hay fever when the grasses do it, brewed in the old books for the waterworks and the heavy head.",h:"Flower and leaf, tea.",c:"Mild. Not with a heart or kidney condition without asking — it is a diuretic."},
{n:"Hydrangea",a:"seven bark",u:"Gravel in the old books, the joints",t:["urinary","joints"],d:"The root of the garden shrub, used by the Cherokee people and then the settlers for what the old books called gravel, and for aching joints.",h:"Root, decoction.",c:"Never in pregnancy. Not a long daily tea."},
{n:"Witch hazel",a:"hamamelis, winterbloom",u:"A graze, an itch, a sting, a bruise",t:["skin","pain"],d:"The bark of the North American shrub, distilled into the bottle in every bathroom cabinet, dabbed on anything that stings or weeps. The old use was the twig as a forked dowsing rod.",h:"Cooled strong tea, or the distilled water, dabbed on.",c:"Dries the skin with long use. Never drink the distilled kind with alcohol in it."},
{n:"Plantain (leaf)",a:"ribwort, broadleaf plantain, not the banana",u:"A sting, a graze, an insect bite, a sore mouth",t:["skin","mouth","cold"],d:"The plant in every path crack, chewed to a poultice and laid on a sting or a scratch. It is the first thing to hand and the most used leaf in the world's old books.",h:"Leaf chewed into a paste, or a wash; leaf tea.",c:"Very gentle. The fresh leaf is also food when young."},
{n:"Chickweed",a:"stellaria, starweed",u:"An itchy skin, a rash, a graze",t:["skin"],d:"The little green mat of spring, eaten as salad and made into a cooling cream for itchy skin. One of the mildest skin herbs in Europe.",h:"Fresh leaf in salad; or infused in oil for the skin.",c:"Gentle and food-like. The cream is for the skin, not for taking."},
{n:"Tea tree",a:"melaleuca",u:"A spot, a fungal itch, a scalp, a mouth rinse",t:["skin","hair","mouth","cold"],d:"The Australian paperbark oil, used by the peoples there for cuts and infections long before it was bottled. On this page it is a wash for the outside of the body, not a drink.",h:"A few drops in water or a carrier oil, on the skin.",c:"Never swallow it. Never neat on the skin in quantity. Keep it away from the eyes, from a baby, and away from pets — it is poisonous to cats and dogs. A cut that goes red and hot is a doctor."},
{n:"Manuka honey",a:"mānuka, medical honey",u:"A graze, a burn, a sore throat, a bed sore",t:["skin","mouth","cold"],d:"Honey gathered from a New Zealand bush, used as a dressing on burns and wounds by the people there, and kept on the shelf for a raw throat. Honey as medicine is older than any herb list.",h:"Spread on a dressing; or a spoonful for the throat.",c:"No honey for a child under one year — it has caused infant deaths. It is not a dressing for a deep or dirty wound: that is a doctor."},
{n:"Oatmeal",a:"colloidal oats, oat bath",u:"An itchy skin, a rash, a sunburn",t:["skin"],d:"Tied in a cloth and squeezed into a lukewarm bath, the oldest cheap remedy for a skin that will not stop itching — chickenpox, eczema, nettle rash, all of it.",h:"A cup in a cloth, squeezed in a lukewarm bath; or a paste.",c:"Lukewarm, not hot, or the itch gets worse."},
{n:"Horsetail",a:"shavegrass, pewterwort",u:"Hair and nails, the waterworks, a slow wound",t:["hair","skin","urinary"],d:"A living fossil reed of wet ditches, high in the minerals of old swamps, brewed for hair and nails and for the waterworks. The old books polished pewter with it.",h:"Leaf-stems, brewed as tea; also a rinse for the hair.",c:"Not for long stretches — it drains thiamine from the body — and not in pregnancy. Not for a child growing."},
{n:"Cranesbill",a:"geranium, alum root",u:"A sore mouth, a loose bowel, a nosebleed",t:["mouth","digestion","skin"],d:"A wild geranium whose root is so astringent it tastes like alum; held in the mouth for a raw gum and taken for a loose bowel in the old books.",h:"Root, brewed; or held in the mouth.",c:"Very drying. Not for more than a few days."},
{n:"Devil's claw",a:"harpagophytum, grapple plant",u:"Stiff, aching joints, a sore back",t:["joints","pain","digestion"],d:"A Namibian desert plant with hooked seed pods, brewed by the San people for an aching back and stiff joints. The root is the part used.",h:"Root, decoction or tablet, with food.",c:"Not with a stomach ulcer, not with blood thinners, not in pregnancy. It can move blood sugar — care with diabetes medicine."},
{n:"Boswellia",a:"frankincense, sala tree",u:"A stiff joint, an aching hip",t:["joints","pain"],d:"The gum resin of the tree that carried the incense trade, chewed and burned for thousands of years and taken in India for stiff joints.",h:"Gum resin, or a standardised tablet, with food.",c:"Not with blood thinners. It can be hard on the stomach. Not in pregnancy."},
{n:"Arnica",a:"leopard's bane",u:"A bruise, a sprain, a sore muscle",t:["pain","joints","skin"],d:"The yellow mountain daisy of Europe, pressed into the oil and salve for a bruise or a sprain — on the outside only, and never on a cut, in any old book you will find.",h:"Diluted tincture or oil on unbroken skin, not on the face.",c:"Never swallow it — it is poisonous by mouth and affects the heart. Never on broken skin. Some people get a rash from it."},
{n:"Wintergreen",a:"teaberry, gaultheria",u:"A sore muscle, a stiff neck",t:["pain","joints"],d:"The little creeping berry of the North American woods, rubbed on as the oil for a sore muscle. Its smell is the smell of every old liniment.",h:"Diluted oil on the skin only.",c:"Never swallow it — it is aspirin-like and poisonous in small amounts, especially to a child. Not with blood thinners. Always dilute."},
{n:"Yucca",a:"soapweed, cassava flower",u:"Stiff joints, a heavy stomach",t:["joints","digestion"],d:"The desert plant of the American south-west, used by the peoples there for food, soap and for joints that have gone stiff with age.",h:"Root, decoction, or the flower eaten.",c:"Not for more than a few weeks, and not with a liver or kidney condition."},
{n:"Mustard",a:"white mustard, black mustard",u:"A congested chest, a stiff joint",t:["cold","pain","joints"],d:"The mustard plaster — flour and warm water on a cloth — laid on the chest of a coughing child and on a stiff back for as long as the skin could bear it, no longer.",h:"Mustard powder plaster, skin watched closely, 10 minutes at most.",c:"It burns skin. Never on the chest of a baby, never over the heart, never while the person sleeps, and never straight on the skin. It is a strong old remedy with a real burn risk."},
{n:"Chasteberry",a:"vitex, monk's pepper",u:"Monthly cycles, tender breasts, the change of life",t:["women"],d:"The little peppery berry of the Mediterranean tree that monks were said to chew to settle themselves. It is the woman's berry in the old books, taken daily for months.",h:"Dried berry, or a tablet, in the morning, for months.",c:"Not with the pill or hormone medicine, not in pregnancy, and not if you are trying to conceive without asking. It works slowly — nothing happens in a week."},
{n:"Dong quai",a:"angelica sinensis, the woman's ginseng",u:"Heavy or missing cycles, low energy after a period",t:["women","energy"],d:"The sweet Chinese root that leads the pots of the old gynaecology texts, given for cycles that have gone heavy, late or absent, and to build the body back up after a birth.",h:"Sliced root, simmered in soup or tea.",c:"Not in pregnancy on any account, and not with blood thinners. Never with a heavy bleed that is unexplained — that is a doctor."},
{n:"Black cohosh",a:"black snakeroot, squawroot",u:"Sweats and upsets at the change of life",t:["women","joints","sleep"],d:"A North American woodland root used by the Cherokee people and then in the settler books for the change of life, and for an aching body at the same time.",h:"Root, tablet or decoction, for a few months.",c:"Rarely it has hurt livers — stop if you feel unwell and say so to a doctor. Not in pregnancy, not while breastfeeding, not for more than six months."},
{n:"Cramp bark",a:"guelder rose, highbush cranberry",u:"A cramping cycle, a tight muscle",t:["women","pain"],d:"The bark of the European guelder rose, brewed for the period that doubles a person over and for muscles that will not let go. The name says what it was for.",h:"Bark, decoction, at the first sign.",c:"Not in pregnancy except under a midwife. Can be hard on the stomach."},
{n:"Wild yam",a:"colic root, dioscorea",u:"A cramping cycle, a colicky stomach",t:["women","digestion"],d:"A North American twining root, brewed for a gripping stomach and a cramping cycle. It is not the source of a hormone cream, whatever the shelf says.",h:"Root, decoction.",c:"Not in pregnancy. Do not expect it to do what a hormone medicine does — it does not."},
{n:"Evening primrose",a:"oenothera, the evening star",u:"Tender breasts, a dry itchy skin",t:["women","skin"],d:"A tall yellow meadow flower of North America whose seed oil was given for tender breasts before a cycle and for a skin that is dry and itchy.",h:"Seed oil, in a capsule or on the skin.",c:"Not with blood thinners or for a seizure history without asking first. It is slow — a couple of months, not a couple of days."},
{n:"Lady's mantle",a:"alchemilla",u:"A heavy cycle, a raw mouth, a graze",t:["women","mouth","skin"],d:"The dew-collecting leaf of alpine meadows, the most-used women's herb of the European herbals for a heavy or dragged-out bleed, and a wash for a sore mouth.",h:"Leaf, tea; or a cooled wash.",c:"Not in pregnancy. It is astringent and drying."},
{n:"Shepherd's purse",a:"capsella, mother's heart",u:"A heavy cycle, a bleeding graze, a nosebleed",t:["women","skin"],d:"The flat-seeded weed of every path, named for the purse it resembles, brewed for a bleed that is too long and too heavy — and for the same reason on a cut.",h:"Leaf and seed, tea; or a cooled wash.",c:"Not in pregnancy. Bleeding that is heavy or that will not stop is a doctor — this only holds it back a little."},
{n:"Red clover",a:"purple clover",u:"The change of life, a dry cough, the skin",t:["women","skin","lungs"],d:"The field flower of every meadow, brewed as a sweet tea through the change of life and used in the old books for a dry, tickling cough and a dull skin.",h:"Flowers, tea, or in a syrup.",c:"Not with blood thinners or hormone medicine. Not in pregnancy."},
{n:"Alfalfa",a:"lucerne, buffalo herb",u:"Building back up, the change of life, a poor appetite",t:["women","energy","digestion"],d:"The deep-rooted fodder plant, brewed as a green tea by people who took it as their spring tonic. The roots go down thirty feet, which is why it is full of what the topsoil lost.",h:"Leaf, tea; or the sprouted seeds in food.",c:"Not with blood thinners. Not the seeds in large amounts if you have lupus."},
{n:"Saw palmetto",a:"serenoa, sabal",u:"The nighttime trips, the hairline",t:["men","hair"],d:"The berry of the low fan palm of Florida, used by the peoples there for a man's waterworks, and later in the books for hair that is thinning at the crown.",h:"Ripe berry, tablet or decoction, taken daily for months.",c:"Talk to a doctor anyway: the nighttime trips can be a prostate that needs looking at, not a berry. It thins the blood a little — stop before surgery."},
{n:"Pygeum",a:"African cherry, prunus africana",u:"The waterworks in an older man",t:["men","urinary"],d:"The bark of a mountain tree of Africa, brewed by the people there for the same thing the palm berry was used for across an ocean.",h:"Bark extract, or a tablet.",c:"The tree is now threatened, so buy carefully. Not with blood thinners. Same warning: have the prostate looked at."},
{n:"Nettle root",a:"stinging nettle root",u:"The waterworks in an older man",t:["men","urinary"],d:"The root of the nettle — not the leaf — dug in autumn and brewed for the same older man's waterworks. In the old books the root and the leaf are two different medicines.",h:"Dried root, decoction, months at a time.",c:"Not with blood pressure medicine or a diuretic. It is a long slow run, not a week."},
{n:"Tribulus",a:"puncture vine, gokshura",u:"Stamina, drive, the old men's books",t:["men","energy"],d:"A thorny creeper of dry ground, used in India for stamina and in the old athletes' books. The name comes from the caltrop shape of its seed.",h:"Fruit and root, powder or tablet, daily.",c:"Not with diabetes or blood pressure medicine without asking. Not in pregnancy. It has not been shown to raise anything measurable — the tradition is all it has."},
{n:"Horny goat weed",a:"epimedium, yin yang huo",u:"Drive, an aching back and knees",t:["men","energy","joints"],d:"A Chinese woodland plant with flowers like little mitres, taken for the low back and knees that ache with age, and for drive — which is how it got its English name.",h:"Leaf, tea, or a tablet, daily.",c:"Not with blood thinners. Not with a heart condition or high blood pressure without asking first."},
{n:"Amla",a:"Indian gooseberry, amalaki",u:"The hair, digestion, the whole body over time",t:["hair","energy","digestion"],d:"The sour green berry of the Indian tree, eaten fresh, candied, and boiled into the hair oil that every grandmother in India uses. The most-used berry of the old Indian tonics.",h:"Fresh or dried berry; oil for the hair.",c:"Gentle and food-like. It has moved blood sugar — care with diabetes medicine."},
{n:"Bhringraj",a:"false daisy, king of hair",u:"The hair and the scalp",t:["hair","liver","sleep"],d:"A little white daisy of wet Indian ground, boiled into coconut oil as the hair oil of the old books, and brewed as a bitter tea for a tired liver.",h:"Made into oil for the scalp; leaf brewed as tea.",c:"Not internally in pregnancy. The oil is for the scalp, not to be swallowed."},
{n:"Stinging nettle leaf",a:"nettles, common nettle",u:"An aching joint, hay fever, low iron, the hair",t:["joints","cold","hair","energy","urinary"],d:"The spring green picked with gloves and eaten as soup, brewed as the deep green tea for a body that is tired and aching. The sting itself was used on purpose — the old flogging with nettles for a stiff joint.",h:"Young leaf, cooked as soup or brewed as tea; the root is a different medicine.",c:"Not with a diuretic or blood pressure medicine. Not with blood thinners. Nettle soup is food; the tea is where the caution lives."},
{n:"Hawthorn",a:"may tree, whitethorn",u:"The heart, the blood, an old chest",t:["heart"],d:"The thorn tree of every old English hedge, whose leaf, flower and berry were brewed for a heart that is worn — the single most-used heart herb in the European herbals.",h:"Leaf, flower and berry, tea, taken daily for months.",c:"If you take heart medicine, blood pressure medicine or a blood thinner, ask a pharmacist before you add this — it changes how some of them work, and it is not a substitute for any of them. Chest pain is a hospital, not a tea."},
{n:"Bilberry",a:"whortleberry, European blueberry",u:"The eyes, tired sight, the blood",t:["eyes","heart"],d:"The little dark mountain berry, eaten by wartime pilots who swore it helped them see at dusk — a story that turned into a whole industry. The old books used it for the eyes and the bowels.",h:"Ripe berries, or the extract.",c:"Not with blood thinners or diabetes medicine without asking first. The jam is the safest form of it."},
{n:"Eyebright",a:"euphrasia",u:"The eyes, a gritty, tired feeling",t:["eyes","cold"],d:"The little white-and-yellow meadow flower, named for the eyes and brewed as a tea and used as a cooled wash on them in the European herbals.",h:"Leaf and flower, tea, or a cooled wash on closed eyes.",c:"A wash on the outside only, and never in the eye itself. Not internally for a long run. Any real change in sight or a red painful eye is an optician or a doctor."},
{n:"Butcher's broom",a:"knee holly, Ruscus",u:"Heavy, aching legs, the veins",t:["heart","pain"],d:"A shrub that looks like holly but is not, brewed in the old books for legs that ache and swell by the end of the day. Butchers used it to scrub their blocks, hence the name.",h:"Root, decoction or tablet.",c:"Not with blood pressure medicine or a diuretic. A leg that is hot, red and swollen on one side is an emergency — hospital, not a tea."},
{n:"Horse chestnut",a:"conker, buckeye",u:"Heavy aching legs, a swollen ankle",t:["heart","pain","joints"],d:"The tree of the village conker game, its seed tinctured and taken for legs that feel heavy and swollen. The outside of the conker was used as a bruise rub.",h:"Seed extract, standardised, or a gel on the legs.",c:"Never the raw seed — it is poisonous as it comes. Not with blood thinners. One leg hot and swollen, suddenly: hospital."},
{n:"Mullein flower oil",a:"mullein ear oil",u:"An ear that aches",t:["cold","pain"],d:"The yellow flowers of the mullein stalk steeped in warm olive oil, dropped into an aching ear — the old household ear remedy of Europe and North America.",h:"Warm (not hot) flower oil, a few drops in the ear.",c:"Never if the ear is running or the drum might be burst, never on a child without a doctor looking first, and never with warm oil straight from a flame. An ear that hurts a child at night with a fever is a doctor."},
{n:"Agrimony",a:"cocklebur, church steeples",u:"A loose stomach, a sore throat gargle, an old liver tea",t:["digestion","liver","mouth"],d:"A yellow wayside spike of the English hedgerows, brewed as a drying tea for a loose stomach and used as a gargle for a raw throat. The old books had it on the liver shelf as well.",h:"Leaf, tea, cooled to gargle or drunk warm.",c:"A drying, astringent plant — short stretches, not months. Not in pregnancy. It can make a chest tighter for someone who already wheezes."},
{n:"Atractylodes",a:"bai zhu, Atractylodes macrocephala",u:"A heavy, slow digestion; the tiredness that comes after eating",t:["digestion","energy"],d:"A white root of the Chinese tradition, boiled for a stomach that feels heavy and slow and for the drag of tiredness that follows a meal.",h:"Root, decoction.",c:"Drying and warming — not for someone who is hot, dry and thirsty all the time. Not in pregnancy without a practitioner."},
{n:"Avocado leaf",a:"Persea americana leaf",u:"Blood sugar, the kidneys, an old tea of the Caribbean",t:["urinary","digestion"],d:"The leaf of the tree people grow for the fruit, brewed in the Caribbean and West Indies as a tea for water and for blood sugar after a meal.",h:"Leaf, tea.",c:"Lowers blood sugar, so it stacks with diabetes medicine. Not a daily brew for months. Not in pregnancy — it has been used to bring a period on."},
{n:"Açaí",a:"acai berry, Euterpe oleracea",u:"Food, colour, the antioxidants sold on the label",t:["energy","heart"],d:"A small dark palm berry of the Amazon, eaten as food there long before it was sold as a powder. It is pressed and drunk fresh where it grows.",h:"Eaten as fruit or pressed juice. The powder is a food, not a dose.",c:"It is food. The pills and bowls sold as a weight-loss miracle are not what the berry is. No reason to take it instead of eating."},
{n:"Babool",a:"babul, Acacia nilotica",u:"Gums, teeth, an old toothbrush",t:["mouth"],d:"The pods and twigs of an African and Indian acacia, chewed as a tooth stick and brewed as a rinse for the gums.",h:"Twig chewed into a brush; bark or pod tea as a rinse.",c:"It is a rinse and a brush, not a cure for a bad tooth — pain at night with a swollen face is a dentist today. Swallowing a lot of the bark upsets the stomach."},
{n:"Basil",a:"sweet basil, Genovese basil",u:"A heavy stomach, a tense evening",t:["digestion","mood"],d:"The kitchen basil of the Mediterranean, dropped into hot water as a tea when the stomach is heavy and the evening is wound tight. The household books kept it beside mint.",h:"A handful of fresh leaf in hot water, or the dried leaf, five minutes.",c:"Culinary amounts are food. The essential oil is not to be swallowed — it is strong enough to burn."},
{n:"Bay leaf",a:"laurel, bay laurel, Laurus nobilis",u:"A heavy stomach, blood sugar, a pot of stew",t:["digestion","joints"],d:"The leaf of the Mediterranean laurel, put in the pot for the taste and brewed alone as a tea for a stomach that feels heavy.",h:"Leaf, tea; or in cooking, where it is taken out before serving.",c:"Take the whole leaf out of the pot — swallowed whole it can scratch the throat. The oil is not for swallowing."},
{n:"Bee balm",a:"bergamot, wild bergamot, Oswego tea",u:"A raw throat, a cold coming on",t:["cold","fever"],d:"A North American mint the Oswego people brewed for a sore throat long before gardens grew it under the name bergamot. The crushed leaf smells of citrus.",h:"Leaf, fresh or dried, brewed and drunk warm.",c:"It is a mint, so it loosens the valve at the top of the stomach — keep it away from a reflux you already have. A throat that is closing, or a throat with a fever that will not come down, is a doctor."},
{n:"Beetroot",a:"beet, beetroot juice",u:"Blood pressure, stamina, a tired body",t:["heart","energy"],d:"The red root of the garden, eaten as food everywhere and drunk as juice by athletes for the work it does on the blood vessels in the tradition.",h:"Cooked as food, or the juice.",c:"It lowers blood pressure — with tablets for blood pressure it can go too low, and it can make you dizzy standing up. It turns urine and stool red, which is harmless. High in oxalate, so a kidney that makes stones should go easy."},
{n:"Bitter melon",a:"bitter gourd, karela, Momordica charantia",u:"Blood sugar, a heavy stomach",t:["digestion","energy"],d:"A knobbly green gourd of Asia and the Caribbean, cooked as food and brewed as a tea for a slow stomach and for blood sugar.",h:"Unripe fruit in cooking; or the sliced fruit steeped as a tea.",c:"It lowers blood sugar and stacks with diabetes medicine. Not in pregnancy. The seeds and the ripe skin are not the usual material — the unripe fruit is. Food amounts are food."},
{n:"Bitter orange",a:"Seville orange peel, Citrus aurantium, neroli's fruit",u:"Digestion, a blocked nose, appetite",t:["digestion","cold"],d:"The peel of the sour orange that neroli and marmalade come from, brewed for a sluggish digestion and a nose that is blocked.",h:"Dried peel, tea.",c:"It is a stimulant and it pushes up blood pressure and heart rate — not with heart medicine, not with a MAOI, not before surgery, not with a heart condition. It has been in slimming pills that caused real harm."},
{n:"Blackberry leaf",a:"bramble leaf, Rubus fruticosus",u:"A loose stomach, a sore throat, the gums",t:["digestion","mouth"],d:"The leaf of the bramble, gathered in autumn after the fruit and brewed as a drying tea for a loose stomach and a gargle for a rough throat and soft gums.",h:"Leaf, tea; cooled to rinse the mouth.",c:"Gentle as a tea. Not in quantity in pregnancy — the leaf has been used to bring labour on, which is exactly why it is a midwife's call."},
