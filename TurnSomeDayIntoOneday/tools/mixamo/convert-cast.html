<script type="module">
import * as THREE from 'three';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';
import {MeshoptSimplifier} from './three/mo/package/meshopt_simplifier.module.js';
import {mergeVertices} from 'three/addons/utils/BufferGeometryUtils.js';
const TEXCACHE=new Map();
function shrink(tex,size){const img=tex.image;if(!img||!img.width)return null;if(TEXCACHE.has(img))return TEXCACHE.get(img);const c=document.createElement('canvas');const s=Math.min(size,img.width);c.width=s;c.height=Math.round(img.height*s/img.width);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.flipY=tex.flipY;t.wrapS=tex.wrapS;t.wrapT=tex.wrapT;TEXCACHE.set(img,t);return t;}
// a character with skin gets the boxer's moves: same Mixamo skeleton, the bone prefix renamed to match
window.convert=async function(file){
  const base=await new Promise((res,rej)=>new FBXLoader().load((window.DIR||'./fighters/')+file+'.fbx',res,undefined,rej));base.scale.setScalar(0.01);
  const moves=await new Promise((res,rej)=>new GLTFLoader().load(window.MOVES||'./fighter-all.glb',res,undefined,rej));
  const bones=new Set();let hips='';base.traverse(o=>{if(o.isBone){bones.add(o.name);if(/Hips$/.test(o.name)&&!hips)hips=o.name;}});
  const prefix=hips.replace(/Hips$/,'');
  const clips=moves.animations.map(c=>{const tracks=c.tracks.map(t=>{const [bone,prop]=t.name.split('.');const nb=bone.replace(/_\d+$/,'').replace(/^mixamorig\d*/,prefix);if(!bones.has(nb))return null;return new t.constructor(nb+'.'+prop,t.times,t.values);}).filter(Boolean);return new THREE.AnimationClip(c.name,c.duration,tracks);});
  base.animations=clips;
  await new Promise(r=>setTimeout(r,1500));
  let verts=0;base.traverse(o=>{if(!o.isSkinnedMesh)return;verts+=o.geometry.attributes.position.count;const list=Array.isArray(o.material)?o.material:[o.material];
    const nm=list.map(m=>{const map=m.map?shrink(m.map,window.TEX||256):null;return new THREE.MeshStandardMaterial({name:m.name||'',color:map?0xffffff:(m.color||0x888888),map,roughness:.8,metalness:0,transparent:!!m.transparent&&m.opacity<1,alphaTest:m.alphaTest||0,side:THREE.FrontSide});});
    o.material=Array.isArray(o.material)?nm[0]:nm[0];
    for(const k of ['uv1','uv2','color','tangent'])if(o.geometry.attributes[k])o.geometry.deleteAttribute(k);});
  await MeshoptSimplifier.ready;let after=0;
  base.traverse(o=>{if(!o.isSkinnedMesh)return;let g=mergeVertices(o.geometry,1e-4);
    const pos=g.attributes.position.array,idx=g.index?new Uint32Array(g.index.array):new Uint32Array(Array.from({length:pos.length/3},(_,i)=>i));
    const target=Math.floor(idx.length*(window.RATIO||0.25)/3)*3;
    const [newIdx]=MeshoptSimplifier.simplify(idx,pos,3,target,0.01,['LockBorder']);
    const [remap,unique]=MeshoptSimplifier.compactMesh(newIdx);
    const ng=new THREE.BufferGeometry();
    for(const name of ['position','normal','uv','skinIndex','skinWeight']){const a=g.attributes[name];if(!a)continue;const sz=a.itemSize,arr=new a.array.constructor(unique*sz);for(let i=0;i<a.count;i++){const r=remap[i];if(r===0xffffffff||r>=unique)continue;for(let k=0;k<sz;k++)arr[r*sz+k]=a.array[i*sz+k];}ng.setAttribute(name,new THREE.BufferAttribute(arr,sz,a.normalized));}
    ng.setIndex(new THREE.BufferAttribute(new Uint32Array(newIdx),1));o.geometry=ng;after+=unique;});
  const glb=await new Promise((res,rej)=>new GLTFExporter().parse(base,res,rej,{binary:true,animations:window.NOANIM?[]:clips}));
  const u8=new Uint8Array(glb);let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
  window.B64=btoa(s);return {file,prefix,bones:bones.size,verts,after,clips:clips.length,tracks:clips[0].tracks.length,size:glb.byteLength};
};
window.READY=true;
</script>
