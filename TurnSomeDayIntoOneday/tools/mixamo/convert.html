<script type="module">
import * as THREE from 'three';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';
import {MeshoptSimplifier} from './three/mo/package/meshopt_simplifier.js';
import {mergeVertices} from 'three/addons/utils/BufferGeometryUtils.js';
window.THREE=THREE;
const loader=new FBXLoader();
const files=window.FILES||[];
async function load(f){return new Promise((res,rej)=>loader.load('./mix/'+encodeURIComponent(f)+'.fbx',res,undefined,rej));}
window.convert=async function(){
  const base=await load('Fighting Idle');
  base.scale.setScalar(0.01);
  const names=[];
  const clips=[];
  function slim(c){
    // gloves cover the hands: drop finger tracks; bones never move, only turn: drop position tracks except the hips
    c.tracks=c.tracks.filter(t=>{const [bone,prop]=t.name.split('.');if(/Hand(Thumb|Index|Middle|Ring|Pinky)/.test(bone))return false;if(prop==='position'&&!/Hips$/.test(bone))return false;if(prop==='scale')return false;return true;});
    // halve the frame rate on anything longer than two seconds
    if(c.duration>2)c.tracks=c.tracks.map(t=>{const n=t.times.length,keep=[];for(let i=0;i<n;i+=2)keep.push(i);if(!keep.includes(n-1))keep.push(n-1);const vs=t.getValueSize();const times=new Float32Array(keep.length),vals=new Float32Array(keep.length*vs);keep.forEach((k,j)=>{times[j]=t.times[k];for(let v=0;v<vs;v++)vals[j*vs+v]=t.values[k*vs+v];});return new t.constructor(t.name,times,vals);});
    return c;}
  function take(obj,name){const c=obj.animations&&obj.animations[0];if(!c)return;c.name=name;clips.push(slim(c));names.push(name+' '+c.duration.toFixed(2)+'s '+c.tracks.length+' tracks');}
  take(base,'idle');
  for(const f of files){if(f==='Fighting Idle')continue;const o=await load(f);take(o,f.toLowerCase().replace(/\s+/g,'_'));}
  base.animations=clips;
  // no textures: the fighters are lit shapes in the game, black for the boss, a colour for you
  let meshes=0,bones=0,verts=0;base.traverse(o=>{if(o.isSkinnedMesh){meshes++;verts+=o.geometry.attributes.position.count;o.material=new THREE.MeshStandardMaterial({color:0x888888,roughness:.5,metalness:.1});for(const k of ['uv','uv1','uv2','color','tangent'])if(o.geometry.attributes[k])o.geometry.deleteAttribute(k);}if(o.isBone)bones++;});
  window.VERTS=verts;
  // cut the triangle count to a phone-sized mesh, keeping skin weights on every surviving vertex
  await MeshoptSimplifier.ready;
  let after=0;
  base.traverse(o=>{if(!o.isSkinnedMesh)return;let g=mergeVertices(o.geometry,1e-4);
    const pos=g.attributes.position.array,idx=g.index?new Uint32Array(g.index.array):new Uint32Array(Array.from({length:pos.length/3},(_,i)=>i));
    const target=Math.floor(idx.length*(window.RATIO||0.18)/3)*3;
    const [newIdx]=MeshoptSimplifier.simplify(idx,pos,3,target,0.02,['LockBorder']);
    const [remap,unique]=MeshoptSimplifier.compactMesh(newIdx);
    const ng=new THREE.BufferGeometry();
    for(const name of ['position','normal','skinIndex','skinWeight']){const a=g.attributes[name];if(!a)continue;const sz=a.itemSize,arr=new a.array.constructor(unique*sz);for(let i=0;i<a.count;i++){const r=remap[i];if(r===0xffffffff||r>=unique)continue;for(let k=0;k<sz;k++)arr[r*sz+k]=a.array[i*sz+k];}ng.setAttribute(name,new THREE.BufferAttribute(arr,sz,a.normalized));}
    ng.setIndex(new THREE.BufferAttribute(new Uint32Array(newIdx),1)); // compactMesh already remapped newIdx in place
    o.geometry=ng;after+=unique;});
  window.AFTER=after;
  const exporter=new GLTFExporter();
  const glb=await new Promise((res,rej)=>exporter.parse(base,res,rej,{binary:true,animations:clips}));
  window.RESULT={names,meshes,bones,verts:window.VERTS,after:window.AFTER,size:glb.byteLength};
  const u8=new Uint8Array(glb);let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
  window.B64=btoa(s);
  return window.RESULT;
};
window.READY=true;
</script>
