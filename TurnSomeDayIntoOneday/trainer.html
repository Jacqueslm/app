/* ---------- the cardio player ---------- */

function pickPlyo(pool, n) {
  var copy = pool.slice();
  for (var i = copy.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = copy[i]; copy[i] = copy[j]; copy[j] = t;
  }
  return copy.slice(0, n);
}

function buildSegments(kind, minutes) {
  var c = CARDIO[kind];
  var segs = [], i;
  if (c.plyo) {
    var moves = pickPlyo(c.moves, 4);
    var rotations = lv().rotations, last = lv().last;
    for (i = 0; i < rotations; i++) {
      for (var m = 0; m < 4; m++) {
        segs.push({ kind: 'work', label: moves[m], secs: (m === 3 ? last : 20), round: i + 1 });
        segs.push({ kind: 'rest', label: 'Rest', secs: REST });
      }
    }
    return { segs: segs, plyoMoves: moves, rotations: rotations };
  }
  var left = minutes * 60, k = 0;
  while (left > 0) {
    var secs = Math.min(c.block, left);
    segs.push({ kind: 'work', label: c.moves[k % c.moves.length], secs: secs, round: 0 });
    left -= secs; k++;
  }
  return { segs: segs, plyoMoves: c.moves, rotations: segs.length };
}

function startRun() {
  var c = CARDIO[setup.kind];
  var built = buildSegments(setup.kind, setup.minutes);
  var total = 0;
  built.segs.forEach(function (s) { total += s.secs; });
  run = {
    id: uid(), kind: setup.kind, name: c.name, date: today(), dayId: setup.dayId,
    started: Date.now(), minutes: c.plyo ? Math.round(total / 60) : setup.minutes,
    segs: built.segs, i: 0, left: built.segs[0].secs, total: total,
    elapsed: 0, paused: false, rotations: built.rotations, moves: built.plyoMoves,
    log: []
  };
  setup = null;
  save();
  renderRun();
  run.timer = setInterval(tickRun, 1000);
}

function tickRun() {
  if (!run || run.paused) return;
  run.left--; run.elapsed++;
  if (run.left <= 0) {
    beep();
    run.log.push({ move: run.segs[run.i].label, secs: run.segs[run.i].secs, rest: run.segs[run.i].kind === 'rest' });
    run.i++;
    if (run.i >= run.segs.length) { finishRun(); return; }
    run.left = run.segs[run.i].secs;
  }
  paintRun();
}

function paintRun() {
  if (!run) return;
  var seg = run.segs[run.i] || { label: 'Done', secs: 1, kind: 'work' };
  var el = document.getElementById('runMove');
  // On another tab the runner keeps its clock but must not paint over that
  // screen - switching back to Today re-renders it from the same state.
  if (!el) { if (view === 'today') renderRun(); return; }
  el.textContent = seg.label;
  var cl = document.getElementById('runClock');
  if (cl) cl.textContent = mmss(run.left);
  var ph = document.getElementById('runPhase');
  if (ph) {
    ph.textContent = seg.kind === 'rest' ? 'Rest' : (run.kind === 'plyo' ? 'Go · round ' + seg.round : 'Go');
  }
  var tot = document.getElementById('runTotal');
  if (tot) tot.textContent = mmss(run.total - run.elapsed) + ' left';
  var nxt = document.getElementById('runNext');
  if (nxt) {
    var n = run.segs[run.i + 1];
    nxt.innerHTML = n ? 'Next: <b>' + esc(n.kind === 'rest' ? 'Rest ' + n.secs + 's' : n.label) + '</b>' : 'Last one';
  }
  var bar = document.getElementById('runBar');
  if (bar) {
    var doneSecs = 0;
    for (var i = 0; i < run.i; i++) doneSecs += run.segs[i].secs;
    bar.style.width = Math.round(Math.min(100, ((doneSecs + (seg.secs - run.left)) / run.total) * 100)) + '%';
  }
  var dots = document.getElementById('runDots');
  if (dots && run.kind === 'plyo') {
    dots.innerHTML = run.moves.map(function (m, i) {
      var cls = 'dot';
      if (i < (run.i % 4)) cls += ' on';
      if (i === (run.i % 4)) cls += ' now';
      return '<span class="' + cls + '" title="' + esc(m) + '"></span>';
    }).join('');
  }
}

function renderRun() {
  var seg = run.segs[run.i] || { label: 'Done', kind: 'work' };
  var html = '<div class="card tight"><div class="row">' +
      '<div class="grow"><b>' + esc(run.name) + '</b>' +
        '<div class="muted tiny">' + (run.kind === 'plyo'
          ? run.rotations + ' rotations · 10s rest'
          : run.minutes + ' minutes · one clock') + '</div></div>' +
      '<button class="btn sm danger" id="runStop">Stop</button>' +
    '</div></div>' +
    '<div class="card"><div class="big">' +
      '<div class="tphase" id="runPhase"></div>' +
      '<div class="nm2" id="runMove"></div>' +
      '<div class="tclock" id="runClock">' + mmss(run.left) + '</div>' +
      '<div class="nextup" id="runNext"></div>' +
      '<div class="barbig"><i id="runBar"></i></div>' +
      (run.kind === 'plyo' ? '<div class="dots" id="runDots"></div>' : '') +
    '</div>' +
    '<div class="row" style="margin-top:16px">' +
      '<button class="btn grow" id="runPause">' + (run.paused ? 'Resume' : 'Pause') + '</button>' +
      '<button class="btn grow ghost" id="runSkip">Skip</button>' +
    '</div>' +
    '<div class="muted tiny mono" style="text-align:center;margin-top:10px" id="runTotal"></div></div>';

  els.app.innerHTML = html;
  document.getElementById('runStop').onclick = function () { finishRun(); };
  document.getElementById('runPause').onclick = function () {
    run.paused = !run.paused;
    renderRun();
  };
  document.getElementById('runSkip').onclick = function () {
    run.i++;
    if (run.i >= run.segs.length) { finishRun(); return; }
    run.left = run.segs[run.i].secs;
    renderRun();
  };
  paintRun();
}

function finishRun() {
  if (!run) return;
  if (run.timer) clearInterval(run.timer);
  var mins = Math.max(1, Math.round(run.elapsed / 60));
  var rec = {
    id: run.id, date: run.date, kind: 'cardio', cardio: run.kind,
    dayName: run.name, minutes: mins, rotations: run.rotations,
    durationSec: run.elapsed, rounds: run.rotations,
    complete: run.i >= run.segs.length,
    entries: [{ name: run.name, target: mins + ' min', note: '', sets: [] }],
    notes: run.kind === 'plyo' ? 'Moves: ' + run.moves.join(', ') : ''
  };
  S.sessions.push(rec);

  // the same step-on the lifts do: the marker moves past the cardio day just done
  var idx = -1;
  S.program.forEach(function (d, i) { if (d.id === run.dayId) idx = i; });
  if (idx > -1) S.meta.next = (idx + 1) % S.program.length;

  run = null;
  save();
  toast(mins + ' minutes logged');
  view = 'progress';
  renderAll();
}

/* ---------- rendering: plan ---------- */

function renderPlan() {
  var html = '<h2 style="font-size:19px;margin:4px 0 6px">The plan</h2>' +
    '<p class="muted small" style="margin:0 0 14px">Six days, then round again. Rounds are 3 at ' +
      'beginner and 5 at advanced — leave a day at 0 and it follows the level. Rest is always ' +
      REST + ' seconds.</p>';

  S.program.forEach(function (day, di) {
    html += '<div class="card">' +
      '<div class="row"><div class="grow">' +
        '<input value="' + esc(day.name) + '" data-dayname="' + di + '" style="font-weight:700">' +
        '<div style="height:8px"></div>' +
        '<input value="' + esc(day.focus || '') + '" placeholder="what it is" data-dayfocus="' + di + '">' +
      '</div>' +
      '<button class="btn sm ghost" data-delday="' + di + '" title="Delete day">✕</button></div>';

    if (day.kind === 'cardio') {
      html += '<div class="muted tiny" style="margin-top:10px">A cardio day — whichever of the five ' +
        'you feel like. Ten-second rests are not used here.</div>';
    } else {
      // The rest is taps, not a number box. There is no way to type 90 again:
      // the short rest is what keeps the intensity in the resistance work, so
      // the page offers the by 10 and nothing longer than 20.
      html += '<div style="margin-top:10px"><label>Rounds (0 follows the level)</label>' +
        '<div class="stepper" data-rounds="' + di + '"><button data-rm="1">−</button>' +
        '<div class="val" data-rval2="1">' + (day.rounds > 0 ? day.rounds : lv().rounds) + '</div>' +
        '<button data-rp="1">+</button></div>' +
        '<div style="height:12px"></div>' +
        '<label>Rest between moves</label><div class="row wrap">' +
        [0, REST, 15, 20].map(function (r) {
          var on = (typeof day.rest === 'number' ? day.rest : REST) === r;
          return '<button class="btn sm' + (on ? ' primary' : '') + '" data-setrest="' + di + ':' + r + '">' +
            (r === 0 ? 'none' : r + 's') + '</button>';
        }).join('') +
        '</div></div>';

      day.moves.forEach(function (m, mi) {
        html += '<div class="ex">' +
          '<div class="row"><div class="grow"><b style="font-size:15px">' + esc(m.name) + '</b>' +
          (isTimed(m.reps) ? '<span class="pill" style="margin-left:8px">timed</span>' : '') + '</div>' +
          '<button class="btn sm ghost" data-delmove="' + di + '-' + mi + '" title="Remove">✕</button></div>' +
          '<div class="row" style="margin-top:8px">' +
            '<div class="grow"><label>' + (isTimed(m.reps) ? 'Hold (s)' : 'Reps') + '</label>' +
              '<div class="stepper" data-mreps="' + di + '-' + mi + '"><button data-mm="1">−</button>' +
              '<div class="val" data-mval="1">' + esc(m.reps) + '</div><button data-mp="1">+</button></div></div>' +
          '</div>' +
        '</div>';
      });

      html += '<div class="row" style="margin-top:12px">' +
        '<button class="btn sm" data-addmove="' + di + '">+ Move</button>' +
        '<button class="btn sm ghost" data-swap="' + di + '">Shuffle the moves</button>' +
      '</div>';
    }
    html += '</div>';
  });

  html += '<button class="btn wide" id="addDay">+ Add a lifting day</button>' +
    '<div style="height:10px"></div>' +
    '<button class="btn wide ghost" id="restoreProgram">Put the starter plan back</button>';

  els.app.innerHTML = html;

  var textBinds = [
    ['data-dayname', function (v, i) { S.program[+i].name = v; }],
    ['data-dayfocus', function (v, i) { S.program[+i].focus = v; }]
  ];
  textBinds.forEach(function (b) {
    els.app.querySelectorAll('[' + b[0] + ']').forEach(function (inp) {
      inp.oninput = function () { b[1](inp.value, inp.getAttribute(b[0])); save(); };
    });
  });

  els.app.querySelectorAll('[data-rounds]').forEach(function (box) {
    var i = +box.getAttribute('data-rounds');
    var val = box.querySelector('[data-rval2]');
    box.querySelector('[data-rm]').onclick = function () {
      S.program[i].rounds = Math.max(0, (S.program[i].rounds > 0 ? S.program[i].rounds : lv().rounds) - 1);
      save(); renderPlan();
    };
    box.querySelector('[data-rp]').onclick = function () {
      S.program[i].rounds = Math.min(10, (S.program[i].rounds > 0 ? S.program[i].rounds : lv().rounds) + 1);
      save(); renderPlan();
    };
    if (val) val.textContent = (S.program[i].rounds > 0 ? S.program[i].rounds : lv().rounds);
  });

  // Every move in the plan gets a + and a - so the reps (or the hold) change
  // with a thumb. There is no number to type anywhere in this screen.
  els.app.querySelectorAll('[data-mreps]').forEach(function (box) {
    var p = box.getAttribute('data-mreps').split('-');
    var di = +p[0], mi = +p[1];
    var move = S.program[di].moves[mi];
    var timed = isTimed(move.reps);
    box.querySelector('[data-mm]').onclick = function () {
      var n = Math.max(timed ? 5 : 1, (timed ? secsOf(move.reps) : repNum(move.reps)) - (timed ? 5 : 1));
      move.reps = timed ? n + 's' : String(n);
      save(); renderPlan();
    };
    box.querySelector('[data-mp]').onclick = function () {
      var n = (timed ? secsOf(move.reps) : repNum(move.reps)) + (timed ? 5 : 1);
      move.reps = timed ? n + 's' : String(n);
      save(); renderPlan();
    };
  });
  els.app.querySelectorAll('[data-delmove]').forEach(function (b) {
    b.onclick = function () {
      var p = b.getAttribute('data-delmove').split('-');
      S.program[+p[0]].moves.splice(+p[1], 1);
      save(); renderPlan();
    };
  });
  els.app.querySelectorAll('[data-addmove]').forEach(function (b) {
    b.onclick = function () {
      var di = +b.getAttribute('data-addmove');
      openPickMove(function (name) {
        S.program[di].moves.push({ name: name, reps: isHoldMove(name) ? '30s' : String(lv().reps) });
        save(); renderPlan();
      });
    };
  });
  els.app.querySelectorAll('[data-swap]').forEach(function (b) {
    b.onclick = function () {
      var list = S.program[+b.getAttribute('data-swap')].moves;
      for (var i = list.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = list[i]; list[i] = list[j]; list[j] = t;
      }
      save(); renderPlan();
      toast('Shuffled');
    };
  });
  els.app.querySelectorAll('[data-setrest]').forEach(function (b) {
    b.onclick = function () {
      var p = b.getAttribute('data-setrest').split(':');
      S.program[+p[0]].rest = +p[1];
      save(); renderPlan();
      toast(+p[1] === 0 ? 'No rest on that day' : p[1] + ' seconds between moves');
    };
  });
  els.app.querySelectorAll('[data-delday]').forEach(function (b) {
    b.onclick = function () {
      if (S.program.length <= 1) { toast('Keep at least one day'); return; }
      if (!confirm('Delete this day from the plan?')) return;
      S.program.splice(+b.getAttribute('data-delday'), 1);
      if (S.meta.next >= S.program.length) S.meta.next = 0;
      save(); renderPlan();
    };
  });

  document.getElementById('addDay').onclick = function () {
    S.program.push({
      id: uid(), kind: 'lift', name: 'New day', focus: 'home', rounds: 0, moves: [
        { name: 'DB Goblet Squat', reps: String(lv().reps) },
        { name: 'Push-Up', reps: String(lv().reps) },
        { name: 'DB Bent-Over Row', reps: String(lv().reps) }
      ]
    });
    save(); renderPlan();
  };
  document.getElementById('restoreProgram').onclick = function () {
    if (!confirm('Replace the whole plan with the starter one?')) return;
    S.program = defaultProgram();
    S.meta.next = 0;
    save(); renderPlan();
  };
}

/* ---------- rendering: progress ---------- */

var progPick = null;

function renderProgress() {
  var names = [], seen = {};
  S.sessions.forEach(function (s) {
    (s.entries || []).forEach(function (e) {
      if (s.kind === 'cardio') return;
      if (!seen[e.name]) { seen[e.name] = 1; names.push(e.name); }
    });
  });
  names.sort(function (a, b) { return a.localeCompare(b); });
  if (!progPick || names.indexOf(progPick) < 0) progPick = names[0] || null;

  if (!S.sessions.length) {
    els.app.innerHTML = '<div class="empty">Nothing logged yet.<br>Finish a session and it shows up here.</div>';
    return;
  }

  var week = weekMinutes();
  var html = '<h2 style="font-size:19px;margin:4px 0 12px">Progress</h2>';

  html += '<div class="grid3" style="margin-bottom:14px">' +
    '<div class="stat"><div class="k">Sessions</div><div class="v">' + S.sessions.length + '</div></div>' +
    '<div class="stat"><div class="k">Minutes</div><div class="v">' + week + '</div></div>' +
    '<div class="stat"><div class="k">Level</div><div class="v" style="font-size:16px">' + LEVELS[level()].label + '</div></div>' +
  '</div>';

  var m = S.measures.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  var bw = m.filter(function (x) { return num(x.weight) > 0; });
  if (bw.length >= 2) {
    var first = num(bw[0].weight), last = num(bw[bw.length - 1].weight), diff = last - first;
    html += '<div class="grid3" style="margin-bottom:14px">' +
      '<div class="stat"><div class="k">Body weight</div><div class="v">' + fmt(last) + '</div></div>' +
      '<div class="stat"><div class="k">Change</div><div class="v" style="color:' + (diff < 0 ? 'var(--ok)' : 'var(--warn)') + '">' + (diff > 0 ? '+' : '') + fmt(diff) + '</div></div>' +
      '<div class="stat"><div class="k">Weeks in</div><div class="v">' + Math.max(1, Math.round(daysBetween(bw[0].date, bw[bw.length - 1].date) / 7)) + '</div></div>' +
    '</div>';
  }

  if (names.length) {
    html += '<div class="card"><label>Move</label><select id="progSel">' +
      names.map(function (n) { return '<option' + (n === progPick ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') +
      '</select>';
    var h = historyFor(progPick);
    if (h.length) {
      var lastP = h[h.length - 1], prevP = h.length > 1 ? h[h.length - 2] : null;
      html += '<div class="grid3" style="margin:12px 0">' +
        '<div class="stat"><div class="k">Top set</div><div class="v">' + fmt(lastP.top) + '<span class="small muted"> ' + unit() + '</span></div></div>' +
        '<div class="stat"><div class="k">Reps</div><div class="v">' + fmt(lastP.reps) + '</div></div>' +
        '<div class="stat"><div class="k">Sessions</div><div class="v">' + h.length + '</div></div>' +
      '</div>';
      if (prevP) {
        var dd = lastP.top - prevP.top;
        html += '<div class="small ' + (dd > 0 ? '' : 'muted') + '" style="margin:-4px 0 10px">' +
          (dd > 0 ? '▲ up ' + fmt(dd) + ' ' + unit() + ' from last time'
                  : (dd < 0 ? '▼ down ' + fmt(-dd) + ' ' + unit() + ' — one bad day is not a trend'
                            : 'Same as last time — time to add a little, or take the step up')) +
        '</div>';
      }
      html += '<canvas id="liftChart" height="170"></canvas>' +
        '<div class="tiny muted" style="margin-top:6px">Heaviest set per session.</div>';
    } else {
      html += '<div class="empty">No sets logged for this move yet.</div>';
    }
    html += '</div>';
  }

  html += '<div class="card"><b>History</b><div style="height:10px"></div>';
  pastSessions().slice(0, 40).forEach(function (s) {
    var sets = 0, vol = 0;
    (s.entries || []).forEach(function (e) {
      var d = (e.sets || []).filter(function (x) { return x.done; });
      sets += d.length;
      d.forEach(function (x) { vol += num(x.weight) * num(x.reps); });
    });
    html += '<div class="ex" data-hist="' + esc(s.id) + '" style="cursor:pointer">' +
      '<div class="row"><div class="grow"><b>' + esc(s.dayName || 'Session') + '</b>' +
      '<div class="muted tiny">' + esc(niceDate(s.date)) + ' · ' +
        (s.kind === 'cardio' ? (s.minutes || 0) + ' min' : sets + ' sets' + (s.rounds ? ' · ' + s.rounds + ' rounds' : '')) +
      '</div></div>' +
      (s.kind === 'cardio' ? '' : '<div class="mono" style="font-weight:700">' + fmt(vol) + '<span class="tiny muted"> ' + unit() + '</span></div>') +
      '</div></div>';
  });
  html += '</div>';

  els.app.innerHTML = html;
  var sel = document.getElementById('progSel');
  if (sel) sel.onchange = function () { progPick = sel.value; renderProgress(); };
  var cv = document.getElementById('liftChart');
  if (cv && progPick) drawLine(cv, historyFor(progPick).map(function (p) { return { x: p.date, y: p.top }; }));
  els.app.querySelectorAll('[data-hist]').forEach(function (el) {
    el.onclick = function () { showHistory(el.getAttribute('data-hist')); };
  });
}

function weekMinutes() {
  var total = 0;
  S.sessions.forEach(function (s) { total += Math.round((s.durationSec || 0) / 60); });
  return total;
}

function drawLine(canvas, pts) {
  if (!pts || !pts.length) return;
  var dpr = window.devicePixelRatio || 1;
  var w = canvas.clientWidth || 320, h = 170;
  canvas.width = w * dpr; canvas.height = h * dpr;
  var ctx = canvas.getContext && canvas.getContext('2d');
  // a chart is a nicety. If the browser will not give us a canvas, the screen
  // still works and the rest of the page still wires up.
  if (!ctx) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  var padL = 44, padR = 10, padT = 12, padB = 24;
  var xs = pts.map(function (p) { return new Date(p.x).getTime(); });
  var ys = pts.map(function (p) { return p.y; });
  var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
  var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
  if (minX === maxX) { minX -= 86400000; maxX += 86400000; }
  var span = (maxY - minY) || 1;
  minY = Math.max(0, minY - span * 0.15); maxY = maxY + span * 0.15;

  function X(t) { return padL + (t - minX) / (maxX - minX) * (w - padL - padR); }
  function Y(v) { return padT + (1 - (v - minY) / (maxY - minY)) * (h - padT - padB); }

  ctx.strokeStyle = '#2a323d'; ctx.lineWidth = 1;
  ctx.font = '11px sans-serif'; ctx.fillStyle = '#8d97a6';
  for (var i = 0; i <= 3; i++) {
    var v = minY + (maxY - minY) * (i / 3), y = Y(v);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillText(fmt(v), 4, y + 4);
  }
  if (pts.length > 1) {
    ctx.strokeStyle = '#ff6b2c'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
    ctx.beginPath();
    pts.forEach(function (p, i) {
      var x = X(new Date(p.x).getTime()), y = Y(p.y);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
  }
  pts.forEach(function (p) {
    ctx.fillStyle = '#ff6b2c';
    ctx.beginPath(); ctx.arc(X(new Date(p.x).getTime()), Y(p.y), 3.5, 0, Math.PI * 2); ctx.fill();
  });
  ctx.fillStyle = '#8d97a6';
  ctx.fillText(niceDate(pts[0].x), padL, h - 6);
  var lbl = niceDate(pts[pts.length - 1].x);
  ctx.fillText(lbl, w - padR - ctx.measureText(lbl).width, h - 6);
}

function showHistory(id) {
  var s = null;
  S.sessions.forEach(function (x) { if (x.id === id) s = x; });
  if (!s) return;
  var html = '<h3 style="font-size:18px">' + esc(s.dayName) + '</h3>' +
    '<div class="muted tiny" style="margin:4px 0 14px">' + esc(niceDate(s.date)) +
    (s.durationSec ? ' · ' + Math.round(s.durationSec / 60) + ' min' : '') +
    (s.rounds ? ' · ' + s.rounds + ' rounds' : '') + '</div>';

  if (s.kind === 'cardio') {
    html += '<div class="big" style="padding:6px 0 14px"><div class="tclock">' + (s.minutes || 0) + '</div>' +
      '<div class="tphase">minutes</div></div>';
  }
  (s.entries || []).forEach(function (e) {
    var d = (e.sets || []).filter(function (x) { return x.done; });
    if (!d.length) return;
    html += '<div class="ex"><b>' + esc(e.name) + '</b><div class="mono small" style="margin-top:5px">' +
      d.map(function (x) {
        return (num(x.weight) ? fmt(num(x.weight)) + ' ' + unit() + ' × ' : '') + fmt(num(x.reps));
      }).join('&nbsp;&nbsp;·&nbsp;&nbsp;') +
      '</div>' + (e.note ? '<div class="tiny muted" style="margin-top:4px">' + esc(e.note) + '</div>' : '') + '</div>';
  });
  if (s.notes) html += '<div class="card tight small" style="margin-top:14px">' + esc(s.notes) + '</div>';
  html += '<div style="height:16px"></div><button class="btn wide danger" id="delSess">Delete this session</button>' +
    '<div style="height:10px"></div><button class="btn wide" id="closeSheet">Close</button>';
  openSheet(html);
  document.getElementById('closeSheet').onclick = closeSheet;
  document.getElementById('delSess').onclick = function () {
    if (!confirm('Delete this session for good?')) return;
    S.sessions = S.sessions.filter(function (x) { return x.id !== id; });
    save(); closeSheet(); renderProgress();
  };
}

/* ---------- rendering: you ---------- */

function renderClient() {
  var c = S.client;
  var ms = S.measures.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  var html = '<h2 style="font-size:19px;margin:4px 0 12px">You</h2>';

  html += '<div class="card">' +
    '<div class="grid2">' +
      '<div><label>Name</label><input value="' + esc(c.name) + '" data-c="name" placeholder="optional"></div>' +
      '<div><label>Units</label><select id="unitSel">' +
        '<option value="lb"' + (unit() === 'lb' ? ' selected' : '') + '>Pounds (lb)</option>' +
        '<option value="kg"' + (unit() === 'kg' ? ' selected' : '') + '>Kilograms (kg)</option>' +
      '</select></div>' +
    '</div><div style="height:12px"></div>' +
    '<label>Where you are</label>' +
    '<div class="lvl" id="lvl2">' +
      '<button data-lvl2="beginner"' + (level() === 'beginner' ? ' class="on"' : '') + '>Beginner<span class="sub">3 rounds</span></button>' +
      '<button data-lvl2="advanced"' + (level() === 'advanced' ? ' class="on"' : '') + '>Advanced<span class="sub">5 rounds</span></button>' +
    '</div>' +
    '<div style="height:12px"></div>' +
    '<label>Goal</label><input value="' + esc(c.goal) + '" data-c="goal" placeholder="e.g. five rounds without stopping">' +
    '<div style="height:12px"></div>' +
    '<label>Notes</label><textarea data-c="notes" placeholder="anything to remember">' + esc(c.notes) + '</textarea>' +
  '</div>';

  html += '<div class="card">' +
    '<b>Body &amp; tape</b>' +
    '<div class="muted tiny" style="margin:3px 0 12px">Same morning each time, before eating. Blank boxes are simply not recorded.</div>' +
    '<div class="grid2">' +
      '<div><label>Date</label><input type="date" id="mDate" value="' + today() + '"></div>' +
      '<div><label>Weight (' + unit() + ')</label><input id="mWeight" inputmode="decimal" placeholder="—"></div>' +
    '</div><div style="height:10px"></div>' +
    '<div class="grid3">' +
      '<div><label>Waist</label><input id="mWaist" inputmode="decimal" placeholder="—"></div>' +
      '<div><label>Chest</label><input id="mChest" inputmode="decimal" placeholder="—"></div>' +
      '<div><label>Hips</label><input id="mHips" inputmode="decimal" placeholder="—"></div>' +
    '</div><div style="height:12px"></div>' +
    '<button class="btn primary wide" id="addMeasure">Save measurement</button>';

  if (ms.length) {
    html += '<div class="sep"></div>';
    ms.slice(0, 12).forEach(function (x) {
      var bits = [];
      if (num(x.weight)) bits.push(fmt(x.weight) + ' ' + unit());
      if (num(x.waist)) bits.push('waist ' + fmt(x.waist));
      if (num(x.chest)) bits.push('chest ' + fmt(x.chest));
      if (num(x.hips)) bits.push('hips ' + fmt(x.hips));
      html += '<div class="ex row"><div class="grow"><b>' + esc(niceDate(x.date)) + '</b>' +
        '<div class="muted tiny">' + esc(bits.join(' · ')) + '</div></div>' +
        '<button class="btn sm ghost" data-delmeasure="' + esc(x.date) + '">✕</button></div>';
    });
  }
  html += '<div id="measureChart"></div></div>';

  html += '<div class="card">' +
    '<b>Backup</b>' +
    '<div class="muted tiny" style="margin:3px 0 12px">Everything lives in this browser only. A file now and then is the difference between keeping the log and losing it.</div>' +
    '<div class="row wrap">' +
      '<button class="btn" id="exportBtn">Save a backup file</button>' +
      '<button class="btn ghost" id="importBtn">Load a backup</button>' +
      '<button class="btn ghost" id="printBtn">Print the plan</button>' +
    '</div>' +
    '<div style="height:12px"></div><div class="tiny muted" id="storeInfo"></div>' +
    '<div style="height:12px"></div>' +
    '<button class="btn danger wide" id="wipe">Erase everything</button>' +
  '</div>';

  els.app.innerHTML = html;

  els.app.querySelectorAll('[data-c]').forEach(function (inp) {
    inp.oninput = function () {
      S.client[inp.getAttribute('data-c')] = inp.value;
      save(); paintHeader();
    };
  });
  els.app.querySelectorAll('[data-lvl2]').forEach(function (b) {
    b.onclick = function () {
      S.client.level = b.getAttribute('data-lvl2');
      save(); paintHeader(); renderClient();
      toast(LEVELS[level()].label + ' — ' + LEVELS[level()].rounds + ' rounds');
    };
  });
  document.getElementById('unitSel').onchange = function () {
    S.unit = this.value; save(); paintHeader(); renderClient();
    toast('Units switched to ' + unit());
  };
  document.getElementById('addMeasure').onclick = function () {
    var rec = {
      date: document.getElementById('mDate').value || today(),
      weight: num(document.getElementById('mWeight').value),
      waist: num(document.getElementById('mWaist').value),
      chest: num(document.getElementById('mChest').value),
      hips: num(document.getElementById('mHips').value)
    };
    if (!rec.weight && !rec.waist && !rec.chest && !rec.hips) { toast('Nothing to save'); return; }
    S.measures = S.measures.filter(function (x) { return x.date !== rec.date; });
    S.measures.push(rec);
    save(); renderClient(); toast('Measurement saved');
  };
  els.app.querySelectorAll('[data-delmeasure]').forEach(function (b) {
    b.onclick = function () {
      var d = b.getAttribute('data-delmeasure');
      S.measures = S.measures.filter(function (x) { return x.date !== d; });
      save(); renderClient();
    };
  });
  document.getElementById('exportBtn').onclick = exportBackup;
  document.getElementById('importBtn').onclick = importBackup;
  document.getElementById('printBtn').onclick = function () { window.print(); };
  document.getElementById('wipe').onclick = function () {
    if (!confirm('Delete every session, measurement and note? This cannot be undone.')) return;
    if (!confirm('Really erase everything?')) return;
    try { localStorage.removeItem(KEY); } catch (e) {}
    S = load(); draft = null; run = null;
    renderAll(); toast('Everything cleared');
  };

  var info = document.getElementById('storeInfo');
  var bytes = 0;
  try { bytes = (localStorage.getItem(KEY) || '').length; } catch (e) {}
  info.textContent = S.sessions.length + ' sessions · ' + S.measures.length + ' measurements · ' +
    Math.round(bytes / 1024) + ' KB';

  renderMeasureChart();
}

function renderMeasureChart() {
  var pts = S.measures.slice()
    .filter(function (x) { return num(x.weight) > 0; })
    .sort(function (a, b) { return a.date < b.date ? -1 : 1; })
    .map(function (x) { return { x: x.date, y: num(x.weight) }; });
  if (pts.length < 2) return;
  var host = document.getElementById('measureChart');
  if (!host) return;
  var cv = document.createElement('canvas');
  cv.height = 150;
  cv.style.marginTop = '14px';
  host.appendChild(cv);
  drawLine(cv, pts);
}

function exportBackup() {
  try {
    var blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'trainer-' + (S.client.name ? S.client.name.replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '-' : '') + today() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
    toast('Backup file saved');
  } catch (e) { toast('Could not save the file'); }
}

function importBackup() {
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = function () {
    var f = inp.files && inp.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var o = JSON.parse(rd.result);
        if (!o || !o.client) throw new Error('not a backup');
        if (!confirm('Load this backup? It replaces what is in this browser now.')) return;
        S = o;
        if (!Array.isArray(S.program) || !S.program.length) S.program = defaultProgram();
        if (!Array.isArray(S.sessions)) S.sessions = [];
        if (!Array.isArray(S.measures)) S.measures = [];
        if (!S.unit) S.unit = 'lb';
        if (!S.meta) S.meta = { next: 0, plyo: null };
        S.client.setup = true;
        save(); draft = null; run = null; renderAll(); toast('Backup loaded');
      } catch (e) { toast('That file could not be read'); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ---------- sheets ---------- */

function openSheet(html) {
  els.sheetInner.innerHTML = html;
  els.sheet.classList.remove('hide');
}
function closeSheet() { els.sheet.classList.add('hide'); els.sheetInner.innerHTML = ''; }

// Taps only. The old page asked for a search box first, which is the typing he
// complained about; the keyboard is still there at the top, but nothing needs it.
function openPickMove(cb) {
  var html = '<h3 style="font-size:17px;margin-bottom:12px">Add a move</h3>' +
    '<input id="libSearch" placeholder="search" autocomplete="off">' +
    '<div style="height:12px"></div>' +
    '<div id="libList"></div>' +
    '<div style="height:14px"></div><button class="btn wide ghost" id="libClose">Cancel</button>';
  openSheet(html);

  function paint(q) {
    q = (q || '').trim().toLowerCase();
    var out = '';
    Object.keys(LIB).forEach(function (group) {
      var list = LIB[group].filter(function (n) { return !q || n.toLowerCase().indexOf(q) >= 0; });
      if (!list.length) return;
      out += '<div class="muted tiny" style="margin:10px 0 6px;text-transform:uppercase;letter-spacing:.6px">' + esc(group) + '</div>';
      out += '<div class="row wrap">' + list.map(function (n) {
        return '<button class="btn sm" data-pick="' + esc(n) + '">' + esc(n) + '</button>';
      }).join('') + '</div>';
    });
    document.getElementById('libList').innerHTML = out || '<div class="empty">Nothing matches.</div>';
    els.sheetInner.querySelectorAll('[data-pick]').forEach(function (b) {
      b.onclick = function () { closeSheet(); cb(b.getAttribute('data-pick')); };
    });
  }
  paint('');
  var s = document.getElementById('libSearch');
  s.oninput = function () { paint(s.value); };
  document.getElementById('libClose').onclick = closeSheet;
}

/* ---------- routing ---------- */

function paintHeader() {
  if (!S) return;
  els.whoami.textContent = S.client.setup
    ? (S.client.name ? S.client.name + ' · ' : '') + LEVELS[level()].label + ' · ' + LEVELS[level()].rounds +
      ' rounds, ' + REST + 's rest'
    : 'Home workouts · dumbbells, push-up bars, a pull-up bar';
  els.unitChip.textContent = unit();
}

function renderAll() {
  paintHeader();
  Array.prototype.forEach.call(els.tabs.querySelectorAll('button'), function (b) {
    b.classList.toggle('on', b.getAttribute('data-go') === view);
  });
  if (view === 'today') renderToday();
  else if (view === 'plan') renderPlan();
  else if (view === 'progress') renderProgress();
  else renderClient();
}

/* ---------- boot ---------- */

function boot() {
  els = {
    app: document.getElementById('app'),
    tabs: document.getElementById('tabs'),
    whoami: document.getElementById('whoami'),
    unitChip: document.getElementById('unitChip'),
    rest: document.getElementById('rest'),
    sheet: document.getElementById('sheet'),
    sheetInner: document.getElementById('sheetInner'),
    toast: document.getElementById('toast')
  };

  S = load();
  if (!localStorage.getItem(KEY)) save();

  els.tabs.addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('button[data-go]') : null;
    if (!b) return;
    var go = b.getAttribute('data-go');
    if (go === view) return;
    if ((draft || run) && go !== 'today' && !confirm('Leave this workout? It stays open on Today.')) return;
    view = go;
    window.scrollTo(0, 0);
    renderAll();
  });

  document.getElementById('restAdd').onclick = function () { addRest(REST); };
  document.getElementById('restStop').onclick = function () { stopRest(); if (draft) renderToday(); };
  els.sheet.addEventListener('click', function (ev) { if (ev.target === els.sheet) closeSheet(); });

  window.addEventListener('beforeunload', function (ev) {
    if (draft || run) { ev.preventDefault(); ev.returnValue = ''; }
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && view === 'today' && (draft || run) && !hold) renderToday();
  });

  renderAll();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
