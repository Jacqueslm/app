<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>The Trainer — home workouts, the by 10 way</title>
<style>
  :root{
    --bg:#0d0f12; --panel:#161a20; --panel2:#1d232b; --line:#2a323d;
    --text:#e9ecf1; --muted:#8d97a6; --accent:#ff6b2c; --accent-dim:#7a3a1c;
    --ok:#3ecf8e; --warn:#f5b942;
    --r:14px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(74px + var(--safe-b));
    overflow-wrap:break-word;
  }
  h1,h2,h3{margin:0;line-height:1.2}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  textarea{resize:vertical;min-height:70px}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 5px}

  /* ---------- top bar ---------- */
  .top{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:12px;
    padding:14px 16px 12px;
    background:linear-gradient(180deg,rgba(13,15,18,.96),rgba(13,15,18,.82));
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);
    display:grid;place-items:center;font-weight:800;color:#0d0f12;font-size:15px;flex:none}
  .brand b{font-size:16px;letter-spacing:.2px;display:block}
  .brand span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .top .spacer{flex:1}
  .chip{font-size:12px;color:var(--muted);border:1px solid var(--line);
    padding:5px 10px;border-radius:999px;white-space:nowrap}

  /* ---------- layout ---------- */
  main{padding:16px;max-width:820px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:16px;margin:0 0 14px}
  .card.tight{padding:12px}
  .row{display:flex;gap:10px;align-items:center}
  .row.wrap{flex-wrap:wrap}
  .grow{flex:1;min-width:0}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .tiny{font-size:12px}
  .mono{font-variant-numeric:tabular-nums}
  .sep{height:1px;background:var(--line);margin:14px 0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media(max-width:420px){.grid3{grid-template-columns:1fr 1fr}}

  /* ---------- buttons ---------- */
  .btn{background:var(--panel2);border:1px solid var(--line);border-radius:11px;
    padding:11px 14px;font-weight:600;font-size:14px;display:inline-flex;
    align-items:center;justify-content:center;gap:7px;transition:.15s}
  .btn:hover{border-color:#3b4453}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);color:#17110d;border-color:transparent}
  .btn.ghost{background:transparent}
  .btn.danger{color:#ff7b7b;border-color:#4a2626}
  .btn.wide{width:100%}
  .btn.sm{padding:8px 11px;font-size:13px;border-radius:9px}
  .btn.tall{padding:15px 14px;font-size:16px}
  .btn:disabled{opacity:.4;cursor:default}

  /* ---------- tab bar ---------- */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;
    grid-template-columns:repeat(4,1fr);
    background:rgba(13,15,18,.96);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    padding-bottom:var(--safe-b)}
  .tabs button{padding:11px 4px 9px;color:var(--muted);font-size:11px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;gap:3px}
  .tabs button .ic{font-size:17px;line-height:1}
  .tabs button.on{color:var(--accent)}

  /* ---------- program / days ---------- */
  .daybox{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);
    border-radius:var(--r);background:var(--panel);margin-bottom:10px}
  .daybox b{font-size:15px}
  .ex{padding:12px 0;border-bottom:1px solid var(--line)}
  .ex:last-child{border-bottom:0}
  .ex .nm{font-weight:650;font-size:15px}
  .tgt{color:var(--accent);font-size:13px;font-weight:600}

  /* ---------- level switch ---------- */
  .lvl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .lvl button{padding:13px 8px;border:1px solid var(--line);border-radius:11px;
    background:var(--panel2);font-weight:700;font-size:14px;text-align:center}
  .lvl button .sub{display:block;font-weight:500;font-size:11px;color:var(--muted);margin-top:2px}
  .lvl button.on{background:var(--accent);color:#17110d;border-color:transparent}
  .lvl button.on .sub{color:rgba(23,17,13,.7)}

  /* ---------- steppers ---------- */
  .stepper{display:grid;grid-template-columns:46px 1fr 46px;gap:8px;align-items:center}
  .stepper button{height:46px;border:1px solid var(--line);border-radius:11px;
    background:var(--panel2);font-size:22px;font-weight:700;line-height:1}
  .stepper .val{text-align:center;font-size:19px;font-weight:750;font-variant-numeric:tabular-nums}
  .stepper .val small{display:block;font-size:11px;color:var(--muted);font-weight:500}

  /* ---------- the player ---------- */
  .big{text-align:center;padding:6px 4px 2px}
  .big .nm2{font-size:27px;font-weight:750;line-height:1.15;margin:8px 0 4px}
  .tclock{font-size:66px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .tphase{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
  .barbig{height:10px;background:#0f1318;border-radius:99px;overflow:hidden;margin-top:16px}
  .barbig i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:12px 0 0}
  .dot{width:9px;height:9px;border-radius:99px;background:var(--line)}
  .dot.on{background:var(--ok)}
  .dot.now{background:var(--accent)}
  .nextup{font-size:13px;color:var(--muted);margin-top:4px}
  .nextup b{color:var(--text)}

  /* ---------- set rows ---------- */
  .setrow{display:grid;grid-template-columns:34px 1fr 1fr 46px;gap:8px;align-items:center;
    margin-bottom:8px}
  .setno{text-align:center;font-weight:700;color:var(--muted);font-size:14px}
  .setrow input{text-align:center;padding:11px 6px}
  .setno.done,.setrow .done{color:var(--ok)}
  .hdrow{display:grid;grid-template-columns:34px 1fr 1fr 46px;gap:8px;
    font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;
    margin-bottom:6px;text-align:center}
  .last{background:var(--panel2);border-radius:10px;padding:8px 11px;font-size:13px;
    color:var(--muted);margin-bottom:10px}
  .last b{color:var(--text)}

  /* ---------- rest timer ---------- */
  .rest{position:fixed;left:12px;right:12px;bottom:calc(78px + var(--safe-b));z-index:25;
    background:var(--panel2);border:1px solid var(--accent-dim);border-radius:14px;
    padding:12px 14px;display:flex;align-items:center;gap:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .rest .t{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:74px}
  .bar{height:6px;background:#0f1318;border-radius:99px;overflow:hidden;flex:1}
  .bar i{display:block;height:100%;background:var(--accent);width:100%}

  /* ---------- misc ---------- */
  .pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.4px;
    padding:3px 8px;border-radius:99px;background:var(--panel2);color:var(--muted);
    text-transform:uppercase}
  .stat{background:var(--panel2);border-radius:12px;padding:11px 12px}
  .stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .stat .v{font-size:19px;font-weight:750;margin-top:3px}
  canvas{width:100%;display:block}
  .empty{text-align:center;color:var(--muted);padding:26px 14px;font-size:14px}
  .sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);
    display:flex;align-items:flex-end;justify-content:center}
  .sheet .inner{background:var(--panel);border:1px solid var(--line);
    border-radius:18px 18px 0 0;width:100%;max-width:820px;max-height:86vh;overflow:auto;
    padding:18px 16px calc(22px + var(--safe-b))}
  .hide{display:none !important}
  .toast{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(90px + var(--safe-b));z-index:50;background:#fff;color:#111;
    padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .banner{background:linear-gradient(180deg,rgba(255,107,44,.16),rgba(255,107,44,.06));
    border:1px solid var(--accent-dim);border-radius:var(--r);padding:14px;margin:0 0 14px}
  @media print{
    .tabs,.top .chip,.rest,.no-print{display:none !important}
    body{background:#fff;color:#000;padding:0}
    .card{border-color:#ccc;background:#fff}
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="mark">T</div>
    <div class="grow">
      <b>The Trainer</b>
      <span id="whoami">Home workouts · dumbbells, push-up bars, a pull-up bar</span>
    </div>
  </div>
  <div class="spacer"></div>
  <span class="chip" id="unitChip">lb</span>
</header>

<main id="app"></main>

<nav class="tabs" id="tabs">
  <button data-go="today"><span class="ic">▶</span>Today</button>
  <button data-go="plan"><span class="ic">☰</span>Plan</button>
  <button data-go="progress"><span class="ic">↗</span>Progress</button>
  <button data-go="client"><span class="ic">☺</span>You</button>
</nav>

<div id="rest" class="rest hide">
  <div class="t">0:00</div>
  <div class="bar"><i></i></div>
  <button class="btn sm" id="restAdd">+10s</button>
  <button class="btn sm ghost" id="restStop">skip</button>
</div>

<div id="sheet" class="sheet hide"><div class="inner" id="sheetInner"></div></div>
<div id="toast" class="toast hide"></div>

<script>
"use strict";

/* =========================================================================
   The Trainer.

   REBUILT 9 Oct 2026 on Jacques's own words, because the first version was a
   gym program in a home-workout app:

     "the workout are based on the by 10 rest cycle 10 second rest between
      exercises it could be 3 sets rest 10 seconds 4 or 5 sets etc ... at home
      workout only dumbells push up bars and pullup bar beginners and advanced
      no in between a person just increases as they advance through the regiman
      through is a full body stretch day workouts are design to be short and
      effective eliminating all the unnecessary rest which keeps intensity in
      the resistance training"

   So: every rest in the resistance work is TEN SECONDS. Nothing else. That is
   the whole point of the thing - the short rest is what keeps the intensity
   up, so the page never asks for a rest of 90 seconds or 3 minutes again.

   Levels are two, and only two: BEGINNER (3 rounds) and ADVANCED (5 rounds).
   There is no in-between, and nothing to type - one tap switches the whole
   regimen. Advancing through the regimen is the app's job, so it counts the
   sessions and offers the step up when the rounds are all being finished.

   Cardio:
     "cardio has choices 20-40 minutes otions jump rope, sweat step,
      plyometrics, kickboxing or dancing"
     "the by 10 only works on the plyometrics as far as cardio 4 moves each 3
      moves done for 20 seconds last move done for 30 second to 1 minute then
      repeat the rotation its about 8-10 rotations"
     "plyo is based on p-90x format as far as exercises kick boxing too
      everything else is original"

   So the by-10 cycle is used in exactly two places: the resistance work and
   the plyometric rotation. It is deliberately NOT applied to the jump rope,
   the sweat step, the kickboxing or the dancing - those are one continuous
   clock, as he said. Plyo is four moves: the first three for 20 seconds each,
   the last for 30 seconds (beginner) or 60 (advanced), then the four repeat,
   8 rotations for beginners and 10 for advanced.

   "its too much typing in that app automate most of the options."

   So the page is built to be used with a thumb and nothing else:
     - the level is two big buttons
     - the next workout is one button, and it already knows which one is next
     - every weight and rep is filled in from last time before the screen opens
     - one tap logs a round and starts the ten-second rest by itself
     - timed moves (a plank, a stretch) run their own countdown
     - the cardio choices are taps, and the player runs the whole rotation
     - the plan is edited with + and - buttons; the only keyboard left is the
       optional note at the end

   Everything lives in this one file and in this browser's local storage. No
   server, no account, works with no signal.
   ========================================================================= */

var KEY = 'coachlog.v1';     // kept from the first version, so the log survives
var PROG_VERSION = 2;        // bumped when the regimen itself is replaced
var REST = 10;               // the by 10. Seconds. Everywhere in the lifts.

/* ---------- the two levels, and only two ---------- */

var LEVELS = {
  beginner: { label: 'Beginner', rounds: 3, reps: 10, rotations: 8,  last: 30, cardio: 20 },
  advanced: { label: 'Advanced', rounds: 5, reps: 12, rotations: 10, last: 60, cardio: 30 }
};

/* ---------- the moves. Home only: dumbbells, push-up bars, a pull-up bar ---------- */

var LIB = {
  'Dumbbells': [
    'DB Goblet Squat', 'DB Sumo Squat', 'DB Romanian Deadlift', 'DB Reverse Lunge',
    'DB Split Squat', 'DB Calf Raise', 'DB Floor Press', 'DB Shoulder Press',
    'DB Lateral Raise', 'DB Front Raise', 'DB Rear Delt Fly', 'DB Bent-Over Row',
    'DB One-Arm Row', 'DB Renegade Row', 'DB Pullover', 'DB Curl', 'Hammer Curl',
    'DB Overhead Triceps Extension', 'DB Kickback', 'DB Shrug'
  ],
  'Push-up bars': ['Push-Up', 'Wide Push-Up', 'Close Push-Up', 'Deep Push-Up'],
  'Pull-up bar': ['Pull-Up', 'Chin-Up', 'Hanging Knee Raise', 'Hanging Leg Raise', 'Hanging Hold'],
  'Bodyweight': [
    'Glute Bridge', 'Hip Thrust', 'Plank', 'Side Plank', 'Dead Bug', 'Superman',
    'Bird Dog', 'Hollow Hold', 'Mountain Climber'
  ],
  'Stretch': [
    "Chest Opener", 'Cat-Cow', "Child's Pose", 'Downward Dog', 'Hip Flexor Stretch',
    'Figure-4 Glute Stretch', 'Seated Hamstring Stretch', 'Quad Stretch', 'Calf Stretch',
    'Thread the Needle', 'Supine Twist', 'Neck & Shoulder Rolls', 'Pigeon', 'Torso Side Bend'
  ]
};

/* ---------- cardio. Plyo and kickboxing follow the p-90-x shape; the rest are original ---------- */

var CARDIO = {
  rope: {
    name: 'Jump Rope', block: 120, note: 'One bell a minute. Keep the rope moving, no long breaks.',
    moves: ['Basic Bounce', 'Alternating Foot', 'High Knees', 'Boxer Skip', 'Side Swing',
            'Criss-Cross', 'Running in Place', 'Speed Step', 'Heel Taps', 'Double Under']
  },
  step: {
    name: 'Sweat Step', block: 120, note: 'One bell a minute. Same lead leg for a block, then swap.',
    moves: ['Basic Step', 'V-Step', 'Knee Lift', 'Kick Step', 'Hamstring Curl', 'L-Step',
            'Repeater Knee', 'Over the Top', 'Stomp', 'Side Tap']
  },
  plyo: {
    name: 'Plyometrics', plyo: true,
    note: 'Four moves. Three for 20 seconds, the last for 30 to a minute. Then round again.',
    moves: ['Jump Squat', 'Run Squat Lunge', 'Squat Reach Jump', 'Airborne Heisman', 'Swing Kick',
            'Jump Knee Tuck', 'Mary Katherine Lunge', 'Leapfrog Squat', 'Twist Combo',
            'Rock Star Hop', 'Gap Jump', 'Squat Jacks', 'Hot Foot', 'Slalom Jump']
  },
  kick: {
    name: 'Kickboxing', block: 60, note: 'A bell a move. Hands up, and land every strike soft.',
    moves: ['Jab & Cross', 'Hook & Uppercut', 'Ball Kick', 'Step Drag Kick', 'Knee Kick',
            'Back Kick', 'Side Kick', 'High Block', 'Downward Block', 'Three-Kick Combo',
            'Elbow Series', 'Vertical Punches']
  },
  dance: {
    name: 'Dancing', block: 120, note: 'A bell a move. Whatever the music is doing, keep the feet moving.',
    moves: ['Two-Step', 'Step Touch', 'Grapevine', 'Body Roll', 'Hip Sway', 'Arm Sweep',
            'Side Slide', 'Drop & Recover', 'Free Style', 'Cool-Down Sway']
  }
};

var CARDIO_ORDER = ['plyo', 'rope', 'kick', 'step', 'dance'];
var MINUTES = [20, 25, 30, 35, 40];

/* ---------- the regimen: three lifts, two cardio days, one stretch day ---------- */

function defaultProgram() {
  return [
    { id: 'd1', kind: 'lift', name: 'Full Body A', focus: 'Squat · push · pull', rounds: 0, moves: [
      { name: 'DB Goblet Squat', reps: '10' },
      { name: 'Push-Up', reps: '10' },
      { name: 'DB Bent-Over Row', reps: '10' },
      { name: 'DB Romanian Deadlift', reps: '10' },
      { name: 'DB Shoulder Press', reps: '10' },
      { name: 'DB Reverse Lunge', reps: '10/leg' },
      { name: 'Plank', reps: '30s' },
      { name: 'DB Curl', reps: '10' }
    ]},
    { id: 'd2', kind: 'cardio', name: 'Cardio', focus: 'Jump rope, sweat step, plyo, kickboxing or dancing' },
    { id: 'd3', kind: 'lift', name: 'Full Body B', focus: 'Pull · press · core', rounds: 0, moves: [
      { name: 'DB Sumo Squat', reps: '10' },
      { name: 'Pull-Up', reps: '5' },
      { name: 'DB Floor Press', reps: '10' },
      { name: 'DB One-Arm Row', reps: '10/arm' },
      { name: 'DB Lateral Raise', reps: '12' },
      { name: 'Glute Bridge', reps: '12' },
      { name: 'Hanging Knee Raise', reps: '8' },
      { name: 'DB Overhead Triceps Extension', reps: '12' }
    ]},
    { id: 'd4', kind: 'cardio', name: 'Cardio', focus: 'Jump rope, sweat step, plyo, kickboxing or dancing' },
    { id: 'd5', kind: 'lift', name: 'Full Body C', focus: 'Legs · core', rounds: 0, moves: [
      { name: 'DB Split Squat', reps: '10/leg' },
      { name: 'DB Calf Raise', reps: '15' },
      { name: 'Deep Push-Up', reps: '10' },
      { name: 'DB Renegade Row', reps: '8/arm' },
      { name: 'DB Front Raise', reps: '12' },
      { name: 'Hip Thrust', reps: '12' },
      { name: 'Dead Bug', reps: '10/side' },
      { name: 'Mountain Climber', reps: '30s' }
    ]},
    { id: 'd6', kind: 'stretch', name: 'Full Body Stretch', focus: 'Hold each one, breathe out, no rush',
      rounds: 1, rest: 0, moves: [
      { name: 'Chest Opener', reps: '30s' },
      { name: 'Cat-Cow', reps: '30s' },
      { name: 'Child\'s Pose', reps: '30s' },
      { name: 'Downward Dog', reps: '30s' },
      { name: 'Hip Flexor Stretch', reps: '30s' },
      { name: 'Figure-4 Glute Stretch', reps: '30s' },
      { name: 'Seated Hamstring Stretch', reps: '30s' },
      { name: 'Quad Stretch', reps: '30s' },
      { name: 'Calf Stretch', reps: '30s' },
      { name: 'Thread the Needle', reps: '30s' },
      { name: 'Supine Twist', reps: '30s' },
      { name: 'Neck & Shoulder Rolls', reps: '30s' }
    ]}
  ];
}

/* ---------- state ---------- */

var S = null;          // saved data
var view = 'today';    // today | plan | progress | client
var draft = null;      // the lift (or stretch) being run, round by round
var run = null;        // the cardio player: {segs,i,left,paused,...}
var setup = null;      // the cardio being set up: {kind, minutes}
var hold = null;       // a running timed move: {id,left,total,e,s,auto}
var rest = null;       // {left, total, id}
var els = {};

function uid() { return Math.random().toString(36).slice(2, 10); }

function today() {
  var d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function pad(n) { return (n < 10 ? '0' : '') + n; }

function fresh() {
  return {
    progVersion: PROG_VERSION,
    client: { name: '', goal: '', level: 'beginner', startDate: today(), notes: '', setup: false },
    unit: 'lb',
    program: defaultProgram(),
    sessions: [],
    measures: [],
    meta: { created: today(), next: 0, plyo: null }
  };
}

function load() {
  var o;
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return fresh();
    o = JSON.parse(raw);
    if (!o || typeof o !== 'object') return fresh();
  } catch (e) { return fresh(); }

  var base = fresh();

  // Read the version the SAVE carries before any default is filled in. fresh()
  // holds the CURRENT version, so filling first would stamp an old save as new
  // and the rebuild below would never happen - which is exactly what happened
  // the first time this was written.
  var hadVersion = o.progVersion;

  for (var k in base) { if (!(k in o)) o[k] = base[k]; }
  if (!o.client || typeof o.client !== 'object') o.client = base.client;
  for (var c in base.client) { if (!(c in o.client)) o.client[c] = base.client[c]; }
  if (!o.meta || typeof o.meta !== 'object') o.meta = base.meta;
  if (typeof o.meta.next !== 'number') o.meta.next = 0;
  if (!Array.isArray(o.sessions)) o.sessions = [];
  if (!Array.isArray(o.measures)) o.measures = [];
  if (!o.unit) o.unit = 'lb';
  // Somebody already set this up before the rebuild: do not make them do it
  // again just because there is a new question on the first screen.
  if (o.client.name) o.client.setup = true;

  // The regimen itself was replaced on 9 Oct 2026. The LOG is kept - every
  // session and every measurement stays - but the plan is the new home one.
  // Guarded by the version so this happens once and his own edits stick.
  if (hadVersion !== PROG_VERSION || !Array.isArray(o.program) || !o.program.length) {
    o.program = defaultProgram();
  }
  o.progVersion = PROG_VERSION;
  return o;
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Could not save — storage full?'); }
}

/* ---------- small helpers ---------- */

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function num(v) { var n = parseFloat(v); return isFinite(n) ? n : 0; }
function fmt(v) {
  if (!isFinite(v)) return '—';
  var r = Math.round(v * 10) / 10;
  return (Math.abs(r - Math.round(r)) < 0.05) ? String(Math.round(r)) : r.toFixed(1);
}
function unit() { return S.unit === 'kg' ? 'kg' : 'lb'; }
function wStep() { return S.unit === 'kg' ? 2.5 : 5; }
function niceDate(iso) {
  if (!iso) return '';
  var p = iso.split('-');
  var d = new Date(+p[0], (+p[1]) - 1, +p[2]);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
function mmss(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  return Math.floor(sec / 60) + ':' + pad(sec % 60);
}
function clockWord(sec) { return mmss(sec); }

function toast(msg) {
  els.toast.textContent = msg;
  els.toast.classList.remove('hide');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { els.toast.classList.add('hide'); }, 2100);
}

/* A move is "timed" when its reps read as seconds: '30s'. */
function isTimed(reps) { return /^\d+\s*(s|sec|secs|seconds)?$/i.test(String(reps)) && /s/i.test(String(reps)); }
function isHoldMove(name) { return LIB['Stretch'].indexOf(name) >= 0; }
function isDB(name) { return /^DB /.test(String(name)); }
function secsOf(reps) {
  var m = String(reps).match(/(\d+)/);
  return m ? +m[1] : 30;
}
function repNum(reps) {
  var m = String(reps).match(/(\d+)/);
  return m ? +m[1] : 10;
}
function level() { return S.client.level === 'advanced' ? 'advanced' : 'beginner'; }
function lv() { return LEVELS[level()]; }
function roundsFor(day) {
  if (day.kind === 'stretch') return 1;
  return day.rounds > 0 ? day.rounds : lv().rounds;
}
function restFor(day) {
  if (day.kind === 'stretch') return 0;
  return typeof day.rest === 'number' ? day.rest : REST;
}
function dayById(id) {
  for (var i = 0; i < S.program.length; i++) if (S.program[i].id === id) return S.program[i];
  return null;
}
function nextDay() {
  var i = S.meta.next || 0;
  if (i < 0 || i >= S.program.length) i = 0;
  return S.program[i];
}

/* ---------- history lookups ---------- */

function pastSessions() {
  return S.sessions.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
}

// the most recent time this move was done, ignoring the session in progress
function lastTime(name) {
  var list = pastSessions();
  for (var i = 0; i < list.length; i++) {
    if (draft && list[i].id === draft.id) continue;
    var e = findEntry(list[i], name);
    if (e && e.sets && e.sets.length) return { date: list[i].date, entry: e };
  }
  return null;
}

function findEntry(session, name) {
  var n = String(name).toLowerCase();
  var list = session.entries || [];
  for (var i = 0; i < list.length; i++) {
    if (String(list[i].name).toLowerCase() === n) return list[i];
  }
  return null;
}

function lastWeight(name) {
  var lt = lastTime(name);
  if (!lt) return isDB(name) ? 20 : 0;
  var w = 0;
  (lt.entry.sets || []).forEach(function (s) { if (num(s.weight) > w) w = num(s.weight); });
  return w;
}

function historyFor(name) {
  var out = [];
  var list = S.sessions.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  for (var i = 0; i < list.length; i++) {
    var e = findEntry(list[i], name);
    if (!e) continue;
    var top = 0, vol = 0, reps = 0;
    for (var j = 0; j < (e.sets || []).length; j++) {
      var st = e.sets[j];
      if (!st || !st.done) continue;
      var w = num(st.weight), r = num(st.reps);
      if (w > top) { top = w; reps = r; }
      vol += w * r;
    }
    if (top > 0) out.push({ date: list[i].date, top: top, reps: reps });
  }
  return out;
}

/* ---------- the by-10 rest timer ---------- */

function startRest(seconds) {
  stopRest();
  if (!seconds) return;
  rest = { left: seconds, total: seconds };
  els.rest.classList.remove('hide');
  paintRest();
  rest.id = setInterval(function () {
    rest.left--;
    if (rest.left <= 0) { beep(); stopRest(); if (draft && view === 'today') renderToday(); return; }
    paintRest();
  }, 1000);
}
function addRest(sec) {
  if (!rest) return;
  rest.left += sec;
  rest.total = Math.max(rest.total, rest.left);
  paintRest();
}
function stopRest() {
  if (rest && rest.id) clearInterval(rest.id);
  var had = !!rest;
  rest = null;
  els.rest.classList.add('hide');
  return had;
}
function paintRest() {
  if (!rest) return;
  var t = Math.max(0, rest.left);
  els.rest.querySelector('.t').textContent = mmss(t);
  var pct = rest.total ? Math.max(0, Math.min(100, (rest.left / rest.total) * 100)) : 0;
  els.rest.querySelector('.bar i').style.width = pct + '%';
}

function beep(long) {
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    var ctx = new AC(), o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = long ? 660 : 880;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + (long ? 0.8 : 0.45));
    o.connect(g); g.connect(els.audioSink || ctx.destination);
    o.start(); o.stop(ctx.currentTime + (long ? 0.85 : 0.5));
    setTimeout(function () { try { ctx.close(); } catch (e) {} }, 1200);
  } catch (e) {}
  if (navigator.vibrate) { try { navigator.vibrate(long ? 420 : 220); } catch (e) {} }
}

/* ---------- rendering: today ---------- */

function renderToday() {
  if (!S.client.setup) { renderStart(); return; }
  if (draft) { renderLift(); return; }
  if (run) { renderRun(); return; }
  if (setup) { renderCardioSetup(); return; }

  var html = '';

  // One button, already knowing which day is next. This is the whole reason
  // the app counts rounds itself: he should not have to choose.
  var d = nextDay();
  if (d) {
    html += '<div class="card">' +
      '<span class="pill">Next up</span>' +
      '<h2 style="font-size:22px;margin:10px 0 4px">' + esc(d.name) + '</h2>' +
      '<div class="muted small">' + esc(dayLine(d)) + '</div>' +
      '<div style="height:14px"></div>' +
      '<button class="btn primary wide tall" data-go-day="' + esc(d.id) + '">' +
        (d.kind === 'cardio' ? 'Pick the cardio ▸' : 'Start ▸') + '</button>' +
    '</div>';
  }

  if (readyToAdvance()) {
    html += '<div class="banner">' +
      '<b style="font-size:15px">Rounds finished every time.</b>' +
      '<div class="muted small" style="margin:4px 0 12px">Five rounds is the next step, ' +
      'and every rest stays at ten seconds.</div>' +
      '<button class="btn wide" id="stepUp">Move up to Advanced</button>' +
    '</div>';
  }

  html += levelSwitch();

  html += '<h3 style="font-size:15px;margin:4px 0 10px">Or pick another day</h3>';
  S.program.forEach(function (day, i) {
    html += '<button class="btn wide ghost" style="justify-content:space-between;margin-bottom:8px;text-align:left" data-go-day="' + esc(day.id) + '">' +
      '<span><b>' + esc(day.name) + '</b><span class="muted tiny" style="display:block">' + esc(dayLine(day)) + '</span></span>' +
      '<span class="tgt">▸</span>' +
    '</button>';
  });

  var last = pastSessions()[0];
  if (last) {
    html += '<div class="muted tiny" style="margin:6px 0 0">' +
      'Last: ' + esc(last.dayName || 'Session') + ' · ' + esc(niceDate(last.date)) +
      (last.kind === 'cardio' ? ' · ' + (last.minutes || 0) + ' min' : '') + '</div>';
  }

  els.app.innerHTML = html;

  els.app.querySelectorAll('[data-go-day]').forEach(function (b) {
    b.onclick = function () { beginDay(b.getAttribute('data-go-day')); };
  });
  wireLevelSwitch();
  var su = document.getElementById('stepUp');
  if (su) su.onclick = function () {
    S.client.level = 'advanced';
    save(); paintHeader(); renderToday();
    toast('Advanced — five rounds');
  };
}

function dayLine(day) {
  if (day.kind === 'cardio') return '20–40 minutes · ' + lv().cardio + ' to start';
  if (day.kind === 'stretch') return day.moves.length + ' stretches · 30s each, no rest between';
  return day.moves.length + ' moves · ' + roundsFor(day) + ' rounds · ' + REST + 's rest';
}

function levelSwitch() {
  var out = '<div class="card"><label>Where you are</label><div class="lvl">';
  ['beginner', 'advanced'].forEach(function (k) {
    var L = LEVELS[k];
    out += '<button data-lvl="' + k + '"' + (level() === k ? ' class="on"' : '') + '>' +
      L.label + '<span class="sub">' + L.rounds + ' rounds</span></button>';
  });
  out += '</div><div class="muted tiny" style="margin-top:10px">Two levels, no in-between. ' +
    'Every rest is ten seconds either way — the rounds are what change.</div></div>';
  return out;
}

function wireLevelSwitch() {
  els.app.querySelectorAll('[data-lvl]').forEach(function (b) {
    b.onclick = function () {
      var k = b.getAttribute('data-lvl');
      if (k === level()) return;
      S.client.level = k;
      save(); paintHeader(); renderToday();
      toast(LEVELS[k].label + ' — ' + LEVELS[k].rounds + ' rounds');
    };
  });
}

// Has he finished every round of the last two lift sessions, at beginner?
function readyToAdvance() {
  if (level() !== 'beginner') return false;
  if (!S.client.setup) return false;
  var lifts = S.sessions.filter(function (s) { return s.kind !== 'cardio' && s.kind !== 'stretch'; });
  if (lifts.length < 2) return false;
  var lastTwo = lifts.slice(-2);
  return lastTwo.every(function (s) { return s.complete === true; });
}

/* ---------- first run: taps, not typing ---------- */

function renderStart() {
  els.app.innerHTML =
    '<div class="card">' +
      '<span class="pill">Home only</span>' +
      '<h2 style="margin:10px 0 6px;font-size:22px">Dumbbells, push-up bars, a pull-up bar</h2>' +
      '<p class="muted small" style="margin:0 0 16px">Three lifting days, two cardio days, one ' +
        'full body stretch day. Ten seconds rest between moves, and the rounds go up as you get ' +
        'stronger. Nothing to work out and nothing to type.</p>' +
      '<label>What to call you (optional)</label>' +
      '<input id="onboardName" placeholder="first name" autocomplete="off" value="' + esc(S.client.name) + '">' +
      '<div style="height:16px"></div>' +
      '<label>Start at</label>' +
      '<div class="lvl" id="onboardLvl">' +
        '<button data-lvl="beginner"' + (level() === 'beginner' ? ' class="on"' : '') + '>Beginner<span class="sub">3 rounds</span></button>' +
        '<button data-lvl="advanced"' + (level() === 'advanced' ? ' class="on"' : '') + '>Advanced<span class="sub">5 rounds</span></button>' +
      '</div>' +
      '<div style="height:18px"></div>' +
      '<button class="btn primary wide tall" id="onboardGo">Start</button>' +
    '</div>';

  var pick = level();
  els.app.querySelectorAll('#onboardLvl [data-lvl]').forEach(function (b) {
    b.onclick = function () {
      pick = b.getAttribute('data-lvl');
      els.app.querySelectorAll('#onboardLvl [data-lvl]').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
    };
  });
  document.getElementById('onboardGo').onclick = function () {
    var v = document.getElementById('onboardName').value.trim();
    S.client.name = v;
    S.client.level = pick;
    S.client.setup = true;
    if (!S.client.startDate) S.client.startDate = today();
    save();
    paintHeader(); renderToday();
    toast('Set up — tap Start when you are ready');
  };
}

/* ---------- starting a day ---------- */

function beginDay(id) {
  var day = dayById(id);
  if (!day) return;
  if (day.kind === 'cardio') {
    var k = CARDIO[S.meta.plyo] ? S.meta.plyo : 'plyo';
    setup = { kind: k, minutes: lv().cardio, dayId: day.id };
    renderToday();
    return;
  }
  startLift(day);
}

function startLift(day) {
  var rounds = roundsFor(day);
  var entries = day.moves.map(function (m) {
    var sets = [];
    for (var r = 0; r < rounds; r++) {
      sets.push({
        weight: isDB(m.name) ? lastWeight(m.name) : '',
        reps: isTimed(m.reps) ? secsOf(m.reps) : repNum(m.reps),
        done: false
      });
    }
    return {
      name: m.name, target: m.reps, rest: restFor(day),
      timed: isTimed(m.reps), note: '', sets: sets
    };
  });
  var queue = [];
  for (var r = 0; r < rounds; r++) {
    entries.forEach(function (e, ei) { queue.push({ e: ei, s: r }); });
  }
  draft = {
    id: uid(), kind: day.kind === 'stretch' ? 'stretch' : 'lift',
    date: today(), dayId: day.id, dayName: day.name,
    started: Date.now(), rounds: rounds, rest: restFor(day),
    entries: entries, queue: queue, qi: 0, notes: ''
  };
  save();
  stopRest(); stopHold();
  renderToday();
}

/* ---------- the lift player ---------- */

function currentStep() {
  if (!draft || draft.qi >= draft.queue.length) return null;
  var q = draft.queue[draft.qi];
  return { e: q.e, s: q.s, entry: draft.entries[q.e], set: draft.entries[q.e].sets[q.s] };
}

function renderLift() {
  var d = draft;
  var html = '<div class="card tight">' +
    '<div class="row"><div class="grow"><b>' + esc(d.dayName) + '</b>' +
    '<div class="muted tiny mono" id="elapsed">0:00 elapsed · ' + esc(niceDate(d.date)) + '</div></div>' +
    '<button class="btn sm danger" id="quitDraft">Stop</button></div></div>';

  var cur = currentStep();
  if (!cur) { renderLiftDone(html); return; }

  var roundNo = cur.s + 1;

  html += '<div class="card">' +
    '<div class="row"><span class="pill">Round ' + roundNo + ' of ' + d.rounds + '</span>' +
    '<span class="grow"></span><span class="muted tiny">move ' + (cur.e + 1) + ' of ' + d.entries.length + '</span></div>' +
    '<div class="big">' +
      '<div class="nm2">' + esc(cur.entry.name) + '</div>' +
      '<div class="muted small">' +
        (cur.entry.timed ? 'hold ' + cur.set.reps + ' seconds' : cur.set.reps + ' reps') +
        (d.rest ? ' · rest ' + d.rest + 's' : ' · no rest, straight on') +
      '</div>' +
      (cur.entry.timed ? '<div class="tclock" id="holdClock">' + fmtHMS(cur.set.reps) + '</div>' : '') +
    '</div>';

  var lt = lastTime(cur.entry.name);
  if (lt) {
    var line = (lt.entry.sets || []).filter(function (s) { return s.done; })
      .map(function (s) { return (num(s.weight) ? fmt(num(s.weight)) + ' × ' : '') + fmt(num(s.reps)); }).join('  ·  ');
    html += '<div class="last"><b>Last time</b> (' + esc(niceDate(lt.date)) + '): ' + (line ? esc(line) : 'nothing logged') + '</div>';
  }

  html += '<div class="grid2" style="margin-top:12px">';
  if (isDB(cur.entry.name)) {
    html += '<div><label>Weight (' + unit() + ')</label><div class="stepper" data-weight="' + cur.e + '-' + cur.s + '">' +
      '<button data-wminus="1">−</button><div class="val" data-wval="1">' + fmt(num(cur.set.weight)) + '</div>' +
      '<button data-wplus="1">+</button></div></div>';
  } else {
    html += '<div><label>Weight</label><div class="muted small" style="padding:13px 0">' +
      (cur.entry.timed ? 'Bodyweight hold' : 'Bodyweight') + '</div></div>';
  }
  html += '<div><label>' + (cur.entry.timed ? 'Hold (seconds)' : 'Reps') + '</label>' +
    '<div class="stepper" data-reps="' + cur.e + '-' + cur.s + '">' +
      '<button data-rminus="1">−</button><div class="val" data-rval="1">' + fmt(num(cur.set.reps)) + '</div>' +
      '<button data-rplus="1">+</button></div></div>';
  html += '</div>';

  html += '<div style="height:16px"></div>';
  if (rest) {
    html += '<button class="btn primary wide tall" id="skipRest">Resting — tap to go now</button>';
  } else if (cur.entry.timed) {
    html += '<button class="btn primary wide tall" id="liftDone">Done — rest ' + d.rest + 's</button>';
    html += '<div style="height:10px"></div><button class="btn wide ghost" id="holdToggle">Restart the hold</button>';
  } else {
    html += '<button class="btn primary wide tall" id="liftDone">Done — rest ' + d.rest + 's</button>';
  }
  html += '</div>';

  // the round strip
  html += '<div class="card tight"><div class="muted tiny" style="margin-bottom:8px">This round</div>' +
    '<div class="dots">';
  d.entries.forEach(function (e, i) {
    var cls = 'dot';
    var st = e.sets[cur.s];
    if (st && st.done) cls += ' on';
    if (i === cur.e) cls += ' now';
    html += '<span class="' + cls + '" title="' + esc(e.name) + '"></span>';
  });
  html += '</div><div class="nextup">Up next: <b>' + esc(nextName()) + '</b></div></div>';

  html += '<div class="card tight"><label>Note (optional)</label>' +
    '<input id="sessNotes" placeholder="anything worth remembering" value="' + esc(d.notes || '') + '"></div>';

  els.app.innerHTML = html;
  wireLift();
  startElapsed();

  // A timed move runs itself: the countdown starts, the bell goes, the set is
  // logged and the rest begins. He should be able to put the phone down.
  if (!rest && cur.entry.timed && !hold) startHold(cur, false);
  if (hold) paintHold();
}

function nextName() {
  var n = draft.qi + 1;
  if (n >= draft.queue.length) return 'the finish';
  var q = draft.queue[n];
  return draft.entries[q.e].name + ' (round ' + (q.s + 1) + ')';
}

function wireLift() {
  var cur = currentStep();
  if (!cur) return;

  els.app.querySelectorAll('[data-wminus]').forEach(function (b) {
    b.onclick = function () {
      cur.set.weight = Math.max(0, num(cur.set.weight) - wStep());
      save(); paintValues();
    };
  });
  els.app.querySelectorAll('[data-wplus]').forEach(function (b) {
    b.onclick = function () {
      cur.set.weight = num(cur.set.weight) + wStep();
      save(); paintValues();
    };
  });
  els.app.querySelectorAll('[data-rminus]').forEach(function (b) {
    b.onclick = function () {
      cur.set.reps = Math.max(1, num(cur.set.reps) - (cur.entry.timed ? 5 : 1));
      save(); paintValues(); paintHold();
    };
  });
  els.app.querySelectorAll('[data-rplus]').forEach(function (b) {
    b.onclick = function () {
      cur.set.reps = num(cur.set.reps) + (cur.entry.timed ? 5 : 1);
      save(); paintValues(); paintHold();
    };
  });

  var done = document.getElementById('liftDone');
  if (done) done.onclick = function () { completeStep(); };
  var sk = document.getElementById('skipRest');
  if (sk) sk.onclick = function () { stopRest(); renderLift(); };
  // Timed moves run themselves. The only manual thing is starting the hold
  // again if he moved before it ended, so there is no way to leave the move
  // sitting still by accident.
  var ht = document.getElementById('holdToggle');
  if (ht) ht.onclick = function () {
    var c = currentStep();
    if (c) startHold(c, true);
  };
  var q = document.getElementById('quitDraft');
  if (q) q.onclick = function () {
    if (!confirm('Stop here? What you have done so far is kept.')) return;
    finishLift(true);
  };
  var sn = document.getElementById('sessNotes');
  if (sn) sn.oninput = function () { draft.notes = sn.value; save(); };
}

function paintValues() {
  var cur = currentStep();
  if (!cur) return;
  var wv = els.app.querySelector('[data-wval]');
  var rv = els.app.querySelector('[data-rval]');
  if (wv) wv.textContent = fmt(num(cur.set.weight));
  if (rv) rv.textContent = fmt(num(cur.set.reps));
}

/* A timed move: its own countdown, in the page, with the bell at zero. */
function startHold(cur, manual) {
  stopHold();
  var secs = Math.max(1, num(cur.set.reps));
  hold = { id: uid(), left: secs, total: secs, e: cur.e, s: cur.s, auto: !manual };
  if (manual) beep();
  paintHold();
  hold.timer = setInterval(function () {
    hold.left--;
    if (hold.left <= 0) {
      beep();
      var keep = hold; hold = null;
      clearInterval(keep.timer);
      if (keep.auto) completeStep();
      else renderLift();
      return;
    }
    paintHold();
  }, 1000);
}
function stopHold() {
  if (hold && hold.timer) clearInterval(hold.timer);
  hold = null;
}
function paintHold() {
  var el = document.getElementById('holdClock');
  if (!el || !hold) return;
  el.textContent = fmtHMS(hold.left);
  var bar = document.getElementById('holdBar');
  if (bar) bar.style.width = Math.round((1 - hold.left / hold.total) * 100) + '%';
}
function fmtHMS(sec) {
  sec = Math.max(0, Math.round(num(sec)));
  if (sec < 60) return String(sec);
  return Math.floor(sec / 60) + ':' + pad(sec % 60);
}

function completeStep() {
  var cur = currentStep();
  if (!cur) return;
  stopHold();
  cur.set.done = true;
  if (isDB(cur.entry.name) && !num(cur.set.weight)) cur.set.weight = 20;
  save();
  draft.qi++;
  if (draft.qi >= draft.queue.length) { renderLift(); return; }
  if (draft.rest) startRest(draft.rest);
  renderLift();
}

function renderLiftDone(html) {
  var done = 0, total = 0;
  draft.entries.forEach(function (e) {
    e.sets.forEach(function (s) { total++; if (s.done) done++; });
  });
  html += '<div class="card"><div class="big">' +
    '<div class="tphase">Last round</div>' +
    '<div class="nm2">' + esc(draft.dayName) + ' done</div>' +
    '<div class="muted small">' + done + ' of ' + total + ' sets logged</div>' +
    '</div><div style="height:16px"></div>' +
    '<button class="btn primary wide tall" id="saveLift">Save it</button>' +
    '<div style="height:10px"></div>' +
    '<button class="btn wide ghost" id="quitDraft">Throw it away</button></div>' +
    '<div class="card tight"><label>Note (optional)</label>' +
    '<input id="sessNotes" value="' + esc(draft.notes || '') + '" placeholder="how it felt"></div>';
  els.app.innerHTML = html;
  document.getElementById('saveLift').onclick = function () { finishLift(false); };
  document.getElementById('quitDraft').onclick = function () {
    if (!confirm('Throw this session away?')) return;
    draft = null; stopRest(); stopHold(); renderToday();
  };
  var sn = document.getElementById('sessNotes');
  if (sn) sn.oninput = function () { draft.notes = sn.value; save(); };
}

function finishLift(stopped) {
  if (!draft) return;
  var logged = 0, complete = true, any = false;
  draft.entries.forEach(function (e) {
    var d = (e.sets || []).filter(function (s) { return s.done; });
    if (d.length) logged++;
    (e.sets || []).forEach(function (s) { if (!s.done) complete = false; });
    if (e.sets && e.sets.length) any = true;
  });
  if (!any || !logged) { toast('Nothing logged yet'); return; }

  var rec = {
    id: draft.id, date: draft.date, kind: draft.kind, dayId: draft.dayId,
    dayName: draft.dayName,
    durationSec: Math.floor((Date.now() - draft.started) / 1000),
    rounds: draft.rounds,
    complete: !stopped && complete,
    entries: draft.entries.map(function (e) {
      return {
        name: e.name, target: e.target, rest: e.rest, note: e.note || '',
        sets: (e.sets || []).map(function (s) { return { weight: s.weight, reps: s.reps, done: !!s.done }; })
      };
    }),
    notes: draft.notes || ''
  };
  S.sessions.push(rec);

  // The regimen advances itself: finishing every round moves the marker on.
  var idx = -1;
  S.program.forEach(function (d, i) { if (d.id === draft.dayId) idx = i; });
  if (idx > -1) S.meta.next = (idx + 1) % S.program.length;

  draft = null;
  stopRest(); stopHold();
  save();
  toast('Saved · ' + logged + ' moves');
  view = 'progress';
  renderAll();
}

function startElapsed() {
  clearInterval(startElapsed._t);
  startElapsed._t = setInterval(function () {
    var el = document.getElementById('elapsed');
    if (!el || !draft) { clearInterval(startElapsed._t); return; }
    var s = Math.floor((Date.now() - draft.started) / 1000);
    el.textContent = mmss(s) + ' elapsed · ' + niceDate(draft.date);
  }, 1000);
}
