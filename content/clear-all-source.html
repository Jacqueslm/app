<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  #stage{position:relative;width:1080px;height:1920px;background:
    radial-gradient(120% 80% at 50% 0%, #101426 0%, #07080f 55%, #05060b 100%)}
  /* faint stars so the wallpaper isn't flat */
  .star{position:absolute;border-radius:50%;background:#8b93c9;opacity:.18}
  #clock{position:absolute;top:210px;width:100%;text-align:center;color:#e9ecff;font-size:210px;font-weight:200;letter-spacing:2px}
  #date{position:absolute;top:150px;width:100%;text-align:center;color:#aab1e0;font-size:44px;font-weight:400}
  #lock{position:absolute;top:80px;width:100%;text-align:center;color:#aab1e0;font-size:40px}
  .notif{position:absolute;left:60px;width:960px;border-radius:36px;padding:34px 38px;
    background:rgba(44,46,58,.92);backdrop-filter:blur(6px);display:flex;gap:28px;align-items:flex-start;
    box-shadow:0 18px 40px rgba(0,0,0,.45)}
  .icon{width:86px;height:86px;border-radius:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:#fff}
  .icon.addiction{background:linear-gradient(135deg,#3a0d0d,#7a1420);border:1px solid #a03040}
  .icon.dayone{background:#534AB7;border:3px solid #7ee8a2}
  .n-body{flex:1;min-width:0}
  .n-top{display:flex;justify-content:space-between;color:#c7cdf4;font-size:32px;margin-bottom:8px}
  .n-app{font-weight:600;letter-spacing:.5px}
  .n-when{color:#8f96c4;font-size:30px}
  .n-text{color:#f0f2ff;font-size:38px;line-height:1.3;font-weight:500}
  .n-text .sub{color:#b9bfe6;font-weight:400}
  #clearall{position:absolute;left:50%;transform:translateX(-50%);bottom:560px;background:rgba(70,73,90,.9);
    color:#e7eaff;font-size:36px;font-weight:600;padding:22px 54px;border-radius:44px}
  #endcard{position:absolute;inset:0;background:#0f0c29;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  #ec-mark{width:190px;height:190px;border-radius:56px;background:#534AB7;border:6px solid #7ee8a2;display:flex;align-items:center;justify-content:center;margin-bottom:70px}
  #ec-mark svg{width:120px;height:120px}
  #ec-big{color:#fff;font-size:88px;font-weight:700;line-height:1.15;max-width:900px}
  #ec-green{color:#7ee8a2;font-size:54px;font-weight:600;margin-top:56px}
  #ec-brand{position:absolute;bottom:130px;width:100%;color:#6672a0;font-size:36px;letter-spacing:6px;font-weight:600}
</style></head><body>
<div id="stage">
  <div id="lock">&#128274;</div>
  <div id="date">Tuesday, August 18</div>
  <div id="clock">3:12</div>
  <div class="notif" id="n1" style="top:640px">
    <div class="icon addiction">A</div>
    <div class="n-body"><div class="n-top"><span class="n-app">Addiction</span><span class="n-when">now</span></div>
    <div class="n-text">Missed call (6)</div></div>
  </div>
  <div class="notif" id="n2" style="top:850px">
    <div class="icon addiction">A</div>
    <div class="n-body"><div class="n-top"><span class="n-app">Addiction</span><span class="n-when">now</span></div>
    <div class="n-text">You up?</div></div>
  </div>
  <div class="notif" id="n3" style="top:1060px">
    <div class="icon addiction">A</div>
    <div class="n-body"><div class="n-top"><span class="n-app">Addiction</span><span class="n-when">now</span></div>
    <div class="n-text">We both know how tonight ends.</div></div>
  </div>
  <div class="notif" id="d1" style="top:430px;background:rgba(38,41,64,.97);border:2px solid rgba(126,232,162,.55)">
    <div class="icon dayone"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l3-2.5c.8-.6 1.9-.6 2.6.1l1 1"/><path d="M21 12l-3-2.5c-.8-.6-1.9-.6-2.6.1l-2.6 2.3c-.6.5-.6 1.4 0 2l.2.2c.6.6 1.6.6 2.2 0"/><path d="M9.6 10.6l2.3 2.1c.6.6.6 1.5 0 2.1-.6.6-1.5.6-2.1 0l-1-.9"/><path d="M3 12v4a1 1 0 0 0 1 1h1M21 12v4a1 1 0 0 1-1 1h-1"/></svg></div>
    <div class="n-body"><div class="n-top"><span class="n-app" style="color:#7ee8a2">Day One</span><span class="n-when">now</span></div>
    <div class="n-text">Day 47. Still yours.<br><span class="sub">The counter didn't blink. Neither should you.</span></div></div>
  </div>
  <div id="clearall">Clear All</div>
  <div id="endcard">
    <div id="ec-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l3-2.5c.8-.6 1.9-.6 2.6.1l1 1"/><path d="M21 12l-3-2.5c-.8-.6-1.9-.6-2.6.1l-2.6 2.3c-.6.5-.6 1.4 0 2l.2.2c.6.6 1.6.6 2.2 0"/><path d="M9.6 10.6l2.3 2.1c.6.6.6 1.5 0 2.1-.6.6-1.5.6-2.1 0l-1-.9"/><path d="M3 12v4a1 1 0 0 0 1 1h1M21 12v4a1 1 0 0 1-1 1h-1"/></svg></div>
    <div id="ec-big">One notification<br>answers all of theirs.</div>
    <div id="ec-green">Free. Link in bio.</div>
    <div id="ec-brand">TURN SOMEDAY INTO DAY ONE</div>
  </div>
</div>
<script>
// Deterministic timeline: seek(ms) lays out every element for that instant.
// Rendered frame-by-frame, so playback timing is exact - never realtime luck.
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>1-Math.pow(1-t,3);            // easeOutCubic
const easeIn=t=>t*t*t;
// star field, fixed seed
(function(){const st=$('stage');let s=42;const rnd=()=>((s=s*16807%2147483647)/2147483647);
for(let i=0;i<60;i++){const d=document.createElement('div');d.className='star';
d.style.left=(rnd()*1060)+'px';d.style.top=(rnd()*900)+'px';
const sz=1+rnd()*3;d.style.width=sz+'px';d.style.height=sz+'px';st.prepend(d);}})();

function slideIn(el,t0,ms){ // notification drops in with a settle
  const t=clamp((ms-t0)/450,0,1);
  if(t<=0){el.style.opacity=0;el.style.transform='translateY(-60px) scale(.96)';return;}
  const e=ease(t);
  el.style.opacity=e;
  el.style.transform=`translateY(${(1-e)*-60}px) scale(${.96+.04*e})`;
}
function swipeOut(el,t0,ms){ // cleared: shoot right and fade
  if(ms<t0)return false;
  const t=clamp((ms-t0)/380,0,1),e=easeIn(t);
  el.style.transform=`translateX(${e*1100}px)`;
  el.style.opacity=1-t;
  return true;
}
window.seek=function(ms){
  // base lockscreen fade-in 0-800
  const base=clamp(ms/800,0,1);
  for(const id of ['clock','date','lock'])$(id).style.opacity=ease(base);
  slideIn($('n1'),1200,ms);
  slideIn($('n2'),3100,ms);
  slideIn($('n3'),5000,ms);
  slideIn($('d1'),7800,ms);
  // Clear All pill appears at 9.6s
  const ca=clamp((ms-9600)/300,0,1);
  $('clearall').style.opacity=ms<10600?ease(ca):clamp(1-(ms-10600)/250,0,1);
  // the addiction notifs get swiped 10.0 / 10.3 / 10.6 - Day One stays
  if(ms>=10000)swipeOut($('n1'),10000,ms);
  if(ms>=10300)swipeOut($('n2'),10300,ms);
  if(ms>=10600)swipeOut($('n3'),10600,ms);
  // Day One drifts to visual center once the others are gone (11.2-12.0)
  const dr=clamp((ms-11200)/800,0,1),de=ease(dr);
  $('d1').style.transform=`translateY(${(1-ease(clamp((ms-7800)/450,0,1)))*-60}px) translateY(${de*420}px) scale(${1+de*.06})`;
  // end card 12.4-13.0 fade in, holds to 15
  const ec=clamp((ms-12400)/600,0,1);
  $('endcard').style.opacity=ec;
  $('endcard').style.pointerEvents='none';
  // end card text lands staggered
  $('ec-big').style.opacity=clamp((ms-12800)/400,0,1);
  $('ec-big').style.transform=`translateY(${(1-ease(clamp((ms-12800)/400,0,1)))*40}px)`;
  $('ec-green').style.opacity=clamp((ms-13400)/400,0,1);
  $('ec-brand').style.opacity=clamp((ms-13800)/400,0,1)*.9;
};
seek(0);
</script></body></html>
