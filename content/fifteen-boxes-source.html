<!-- Fifteen Boxes - the shopping-addiction slideshow.
     Seven Manus stills, cut on the narration's own silent beats, subtitles
     burned in, Static Between Stars underneath. The stills were embedded as
     base64 when this rendered; stripped here so the repo does not carry them
     twice. To re-render: drop the seven frames back into the src slots in
     order, screenshot seek(ms) at 24fps, then mux the track. -->
<!-- Fifteen Boxes - the shopping-addiction slideshow.
     Seven Manus stills, cut on the narration's own silent beats (measured at
     4.0s, 7.0s and 12.0s), slow push-in on each, end card fading in over the
     last frame rather than replacing it. Stills are embedded base64 here; the
     repo copy has them stripped, same as she-came-back-source.html. -->
<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0f0c29;
  font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
#st{position:relative;width:1080px;height:1920px;overflow:hidden}
img{position:absolute;top:50%;left:50%;width:1080px;height:1920px;object-fit:cover;
  transform:translate(-50%,-50%);opacity:0;will-change:transform}
/* Watermark: bottom-right, every frame, lifted 210px. House rule 16. */
#wm{position:absolute;bottom:210px;right:56px;width:104px;height:104px;border-radius:30px;
  background:rgba(83,74,183,.92);border:4px solid #7ee8a2;display:flex;align-items:center;
  justify-content:center;box-shadow:0 8px 26px rgba(0,0,0,.45);z-index:99}
#wm svg{width:64px;height:64px}
#sub{position:absolute;left:50%;bottom:400px;transform:translateX(-50%);width:920px;
  text-align:center;color:#fff;font-size:56px;font-weight:800;line-height:1.25;
  text-shadow:0 3px 14px rgba(0,0,0,.95),0 0 40px rgba(0,0,0,.8);z-index:90;opacity:0}
#sub .g{color:#7ee8a2}
/* End card layout is fixed by endcard-template.html and not re-decided here. */
#end{position:absolute;inset:0;background:#0f0c29;display:flex;flex-direction:column;
  align-items:center;text-align:center;opacity:0;z-index:80}
#mark{width:210px;height:210px;border-radius:62px;background:#534AB7;border:7px solid #7ee8a2;
  display:flex;align-items:center;justify-content:center;margin-top:430px}
#mark svg{width:132px;height:132px}
#tag{color:#fff;font-size:52px;font-weight:600;line-height:1.35;max-width:880px;margin-top:52px}
#tag .g{color:#7ee8a2}
#mid{display:flex;flex-direction:column;align-items:center;width:100%;margin-top:120px}
#rule{width:120px;height:3px;background:rgba(126,232,162,.45);margin:0 auto 56px;border-radius:2px}
#big{color:#fff;font-size:86px;font-weight:700;line-height:1.15;max-width:900px}
#green{color:#7ee8a2;font-size:54px;font-weight:600;margin-top:48px}
#brand{position:absolute;bottom:120px;width:100%;color:#6672a0;font-size:34px;letter-spacing:6px;font-weight:600}
</style></head><body><div id="st">
<img id="i0" src="FRAME_GOES_HERE">
<img id="i1" src="FRAME_GOES_HERE">
<img id="i2" src="FRAME_GOES_HERE">
<img id="i3" src="FRAME_GOES_HERE">
<img id="i4" src="FRAME_GOES_HERE">
<img id="i5" src="FRAME_GOES_HERE">
<img id="i6" src="FRAME_GOES_HERE">
<div id="wm"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l3-2.5c.8-.6 1.9-.6 2.6.1l1 1"/><path d="M21 12l-3-2.5c-.8-.6-1.9-.6-2.6.1l-2.6 2.3c-.6.5-.6 1.4 0 2l.2.2c.6.6 1.6.6 2.2 0"/><path d="M9.6 10.6l2.3 2.1c.6.6.6 1.5 0 2.1-.6.6-1.5.6-2.1 0l-1-.9"/><path d="M3 12v4a1 1 0 0 0 1 1h1M21 12v4a1 1 0 0 1-1 1h-1"/></svg></div>
<div id="sub"></div>
<div id="end">
  <div id="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l3-2.5c.8-.6 1.9-.6 2.6.1l1 1"/><path d="M21 12l-3-2.5c-.8-.6-1.9-.6-2.6.1l-2.6 2.3c-.6.5-.6 1.4 0 2l.2.2c.6.6 1.6.6 2.2 0"/><path d="M9.6 10.6l2.3 2.1c.6.6.6 1.5 0 2.1-.6.6-1.5.6-2.1 0l-1-.9"/><path d="M3 12v4a1 1 0 0 0 1 1h1M21 12v4a1 1 0 0 1-1 1h-1"/></svg></div>
  <div id="tag">An app for <span class="g">you</span><br>and the one who <span class="g">supports you</span></div>
  <div id="mid">
    <div id="rule"></div>
    <div id="big">Nobody repossesses<br>a habit.</div>
    <div id="green">It's free. Link in bio.</div>
  </div>
  <div id="brand">TURN SOMEDAY INTO DAY ONE</div>
</div>
</div><script>
const TL=[[0, 2.0], [2.0, 4.0], [4.0, 5.9], [5.9, 7.4], [7.4, 9.4], [9.4, 11.8], [11.8, 15.07]];
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>1-Math.pow(1-t,3);
window.seek=function(ms){
  const t=ms/1000;
  for(let n=0;n<TL.length;n++){
    const el=document.getElementById('i'+n), s=TL[n][0], e=TL[n][1];
    if(t>=s-0.001 && t<e){
      const p=(t-s)/(e-s);
      el.style.opacity=1;
      el.style.transform='translate(-50%,-50%) scale('+(1+0.085*p)+')';
    } else el.style.opacity=0;
  }
  // Subtitles, one line per voice segment. Timings follow the measured energy
  // map of the narration, so each line appears as it is spoken and drops in
  // the silences rather than lingering over them.
  const SUBS=[
    [0.20,3.90,'Fifteen boxes she never opened.'],
    [4.40,6.90,'A card that stopped working.'],
    [7.40,9.00,'A room they emptied.'],
    [9.05,11.85,'Nobody repossesses a habit. You have to hand it back yourself.'],
    [12.40,13.30,'She did. <span class="g">Day one.</span>'],
  ];
  const sub=document.getElementById('sub');
  let line=null;
  for(const [a,b,txt] of SUBS){ if(t>=a&&t<b){line=[a,b,txt];break;} }
  if(line){
    if(sub.innerHTML!==line[2])sub.innerHTML=line[2];
    // quick fade at each edge so lines slip in and out instead of popping
    sub.style.opacity=Math.min(1,(t-line[0])/0.18,(line[1]-t)/0.18);
  } else sub.style.opacity=0;
  // The end card fades in OVER the last frame instead of replacing it, so the
  // shot the whole piece is for stays on screen while the words arrive.
  const ec=cl((t-13.3)/0.5,0,1);
  document.getElementById('end').style.opacity=ec;
  document.getElementById('big').style.opacity=cl((t-13.6)/0.4,0,1);
  document.getElementById('green').style.opacity=cl((t-14.1)/0.4,0,1);
  document.getElementById('brand').style.opacity=cl((t-14.4)/0.4,0,1)*0.9;
};seek(0);
</script></body></html>
