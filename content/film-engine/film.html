<!doctype html><meta charset="utf-8">
<style>
*{margin:0;padding:0}html,body{background:#0b0a1a;overflow:hidden}
canvas{display:block;width:1080px;height:1920px}
</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Data-driven film engine. Deterministic seek(ms) so Playwright can capture
// frame-exact, and the same code can run live in the app off a canvas stream.
const D = JSON.parse(decodeURIComponent(location.hash.slice(1) || '%7B%7D'));
const C = document.getElementById('c'), X = C.getContext('2d');
const W = 1080, H = 1920;
const ease = t => t<0?0:t>1?1:1-Math.pow(1-t,3);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

function bg(t){
  const g=X.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#141034');g.addColorStop(.55,'#0e0b24');g.addColorStop(1,'#080614');
  X.fillStyle=g;X.fillRect(0,0,W,H);
  // slow drifting light
  const gg=X.createRadialGradient(W*.5,H*(.36-t*.02),40,W*.5,H*.36,760);
  gg.addColorStop(0,'rgba(126,232,162,.10)');gg.addColorStop(1,'rgba(126,232,162,0)');
  X.fillStyle=gg;X.fillRect(0,0,W,H);
  // ridge silhouettes
  for(let L=0;L<3;L++){
    X.fillStyle=['rgba(38,32,86,.55)','rgba(28,24,64,.7)','rgba(18,16,44,.9)'][L];
    X.beginPath();X.moveTo(0,H);
    const base=H*(.70+L*.07), amp=70-L*16;
    for(let px=0;px<=W;px+=W/40){
      const u=px/W*6.28;
      X.lineTo(px, base + Math.sin(u*1.6+L)*amp + Math.sin(u*3.4+L*2)*amp*.4);
    }
    X.lineTo(W,H);X.closePath();X.fill();
  }
}
function grain(){
  X.globalAlpha=.05;
  for(let i=0;i<900;i++){X.fillStyle=i%2?'#fff':'#000';X.fillRect((i*173)%W,(i*397)%H,2,2);}
  X.globalAlpha=1;
}
function mark(cx,cy,s){
  X.save();X.translate(cx,cy);X.scale(s,s);
  X.fillStyle='#534AB7';X.strokeStyle='#7ee8a2';X.lineWidth=4;
  X.beginPath();X.roundRect(-52,-52,104,104,30);X.fill();X.stroke();
  X.strokeStyle='#fff';X.lineWidth=3.4;X.lineCap='round';X.lineJoin='round';
  const p=new Path2D("M-30 2 l9 -7.5 c2.4 -1.8 5.7 -1.8 7.8 .3 l3 3 M30 2 l-9 -7.5 c-2.4 -1.8 -5.7 -1.8 -7.8 .3 l-7.8 6.9 c-1.8 1.5 -1.8 4.2 0 6 l.6 .6 c1.8 1.8 4.8 1.8 6.6 0 M-12 -2 l6.9 6.3 c1.8 1.8 1.8 4.5 0 6.3 -1.8 1.8 -4.5 1.8 -6.3 0 l-3 -2.7");
  X.stroke(p);X.restore();
}
function txt(s,y,size,color,weight,alpha){
  X.globalAlpha=alpha===undefined?1:alpha;
  X.fillStyle=color||'#fff';X.textAlign='center';
  X.font=(weight||600)+' '+size+'px Arial, Helvetica, sans-serif';
  X.fillText(s,W/2,y);X.globalAlpha=1;
}
function seek(ms){
  const t=ms/1000;
  X.clearRect(0,0,W,H);bg(t);
  const beats=D.beats||[];
  // headline number rises and holds
  const a1=ease((t-0.25)/0.9);
  if(t<3.6){
    const y=720+(1-a1)*40;
    txt(D.big||'', y, 300, '#fff', 800, a1);
    txt(D.bigLabel||'', y+96, 46, '#7ee8a2', 700, ease((t-0.8)/0.8));
    txt(D.kicker||'', 500, 40, 'rgba(255,255,255,.62)', 600, ease((t-0.45)/0.8));
  }
  // stat beats, one at a time
  beats.forEach((b,i)=>{
    const start=3.6+i*1.55, end=start+1.55;
    if(t<start||t>end+0.25)return;
    const a=ease((t-start)/0.45)*(1-ease((t-(end-0.2))/0.35));
    txt(b.v, 840, 210, '#fff', 800, a);
    txt(b.k, 960, 42, '#7ee8a2', 700, a);
    if(b.sub)txt(b.sub, 1030, 34, 'rgba(255,255,255,.55)', 500, a);
  });
  // closing line + mark
  const cl=3.6+beats.length*1.55;
  if(t>cl-0.1){
    const a=ease((t-cl)/0.7);
    mark(W/2,700,1.5*a+0.001);
    (D.close||'').split('|').forEach((line,i)=>{
      txt(line, 940+i*74, 56, '#fff', 700, ease((t-cl-0.25-i*0.18)/0.6));
    });
    txt(D.cta||'It\'s free. Link in bio.', 1180, 42, '#7ee8a2', 700, ease((t-cl-0.8)/0.6));
    txt('TURN SOMEDAY INTO DAY ONE', 1700, 30, 'rgba(255,255,255,.42)', 700, a);
  }
  grain();
}
window.seek=seek;window.FILM_LEN=(3.6+((D.beats||[]).length)*1.55+2.6)*1000;
seek(0);
</script>
