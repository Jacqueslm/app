<!-- She Came Back - the timeline that built the video.
     The seven Manus stills were embedded as base64 when this rendered;
     they are stripped here so the repo does not carry 7.6MB twice (the
     finished mp4 is beside this file). To re-render: drop the stills back
     into the src slots in order, then screenshot seek(ms) at 24fps. -->
<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0}html,body{width:1080px;height:1920px;overflow:hidden;background:#0f0c29}
#st{position:relative;width:1080px;height:1920px;overflow:hidden}
img{position:absolute;top:50%;left:50%;width:1080px;height:1920px;object-fit:cover;
transform:translate(-50%,-50%);opacity:0;will-change:transform}
#wm{position:absolute;bottom:210px;right:56px;width:104px;height:104px;border-radius:30px;
background:rgba(83,74,183,.92);border:4px solid #7ee8a2;display:flex;align-items:center;justify-content:center;
box-shadow:0 8px 26px rgba(0,0,0,.45);z-index:99}
#wm svg{width:64px;height:64px}
</style></head><body><div id="st"><img id="i0" src="FRAME_GOES_HERE"><img id="i1" src="FRAME_GOES_HERE"><img id="i2" src="FRAME_GOES_HERE"><img id="i3" src="FRAME_GOES_HERE"><img id="i4" src="FRAME_GOES_HERE"><img id="i5" src="FRAME_GOES_HERE"><img id="i6" src="FRAME_GOES_HERE"><img id="i7" src="FRAME_GOES_HERE">
<div id="wm"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l3-2.5c.8-.6 1.9-.6 2.6.1l1 1"/><path d="M21 12l-3-2.5c-.8-.6-1.9-.6-2.6.1l-2.6 2.3c-.6.5-.6 1.4 0 2l.2.2c.6.6 1.6.6 2.2 0"/><path d="M9.6 10.6l2.3 2.1c.6.6.6 1.5 0 2.1-.6.6-1.5.6-2.1 0l-1-.9"/><path d="M3 12v4a1 1 0 0 0 1 1h1M21 12v4a1 1 0 0 1-1 1h-1"/></svg></div>
</div><script>
const TL=[[0, 2.451], [2.451, 4.534], [4.534, 6.985], [6.985, 9.314], [9.314, 11.642], [11.642, 14.46], [14.46, 16.911], [16.911, 19.73]];
window.seek=function(ms){
  const t=ms/1000;
  for(let n=0;n<TL.length;n++){
    const el=document.getElementById('i'+n), [s,e]=TL[n];
    if(t>=s-0.001 && t<e){
      const p=(t-s)/(e-s);
      el.style.opacity=1;
      // slow push-in; the end card holds still
      const z = (n===TL.length-1) ? 1 : (1+0.09*p);
      el.style.transform='translate(-50%,-50%) scale('+z+')';
    } else el.style.opacity=0;
  }
};seek(0);
</script></body></html>
