<!-- A15 "The relief" - trauma bonding (33,100/mo, KD 62; KEYWORDS.md line 443,
     "biggest untapped term for her"). No photos: the mechanism IS the visual.
     A tension line, zoomed into one cycle - the spikes end, the line goes calm
     and green, and on beat 3 the camera pulls back to show it does that over
     and over. The relief is the hook, and the reveal is that it repeats.
     Rendered frame-by-frame via window.seek(ms); see tools/render-film.js. -->
<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0f0c29;
  font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0f0c29}
canvas{position:absolute;top:0;left:0;width:1080px;height:1920px}
#sub{position:absolute;left:50%;bottom:400px;transform:translateX(-50%);width:940px;
  text-align:center;color:#fff;font-size:56px;font-weight:800;line-height:1.28;
  text-shadow:0 3px 14px rgba(0,0,0,.95),0 0 40px rgba(0,0,0,.8);z-index:90;opacity:0}
#sub .g{color:#7ee8a2}
#wm{position:absolute;bottom:210px;right:56px;width:104px;height:104px;border-radius:30px;
  background:rgba(83,74,183,.92);border:4px solid #7ee8a2;display:flex;align-items:center;
  justify-content:center;box-shadow:0 8px 26px rgba(0,0,0,.45);z-index:99}
#wm svg{width:64px;height:64px}
#end{position:absolute;inset:0;background:#0f0c29;display:flex;flex-direction:column;
  align-items:center;text-align:center;opacity:0;z-index:80}
#mark{width:210px;height:210px;border-radius:62px;background:#534AB7;border:7px solid #7ee8a2;
  display:flex;align-items:center;justify-content:center;margin-top:430px}
#mark svg{width:132px;height:132px}
#tag{color:#fff;font-size:52px;font-weight:600;line-height:1.35;max-width:880px;margin-top:52px}
#tag .g{color:#7ee8a2}
#mid{display:flex;flex-direction:column;align-items:center;width:100%;margin-top:120px}
#rule{width:120px;height:3px;background:rgba(126,232,162,.45);margin:0 auto 56px;border-radius:2px}
#big{color:#fff;font-size:86px;font-weight:700;line-height:1.15;max-width:900px}
#green{color:#7ee8a2;font-size:54px;font-weight:600;margin-top:48px}
#brand{position:absolute;bottom:120px;width:100%;color:#6672a0;font-size:34px;letter-spacing:6px;font-weight:600}
</style></head><body><div id="st">
<canvas id="cv" width="1080" height="1920"></canvas>
<div id="sub"></div>
<div id="wm"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l3-2.5c.8-.6 1.9-.6 2.6.1l1 1"/><path d="M21 12l-3-2.5c-.8-.6-1.9-.6-2.6.1l-2.6 2.3c-.6.5-.6 1.4 0 2l.2.2c.6.6 1.6.6 2.2 0"/><path d="M9.6 10.6l2.3 2.1c.6.6.6 1.5 0 2.1-.6.6-1.5.6-2.1 0l-1-.9"/><path d="M3 12v4a1 1 0 0 0 1 1h1M21 12v4a1 1 0 0 1-1 1h-1"/></svg></div>
<div id="end">
  <div id="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l3-2.5c.8-.6 1.9-.6 2.6.1l1 1"/><path d="M21 12l-3-2.5c-.8-.6-1.9-.6-2.6.1l-2.6 2.3c-.6.5-.6 1.4 0 2l.2.2c.6.6 1.6.6 2.2 0"/><path d="M9.6 10.6l2.3 2.1c.6.6.6 1.5 0 2.1-.6.6-1.5.6-2.1 0l-1-.9"/><path d="M3 12v4a1 1 0 0 0 1 1h1M21 12v4a1 1 0 0 1-1 1h-1"/></svg></div>
  <div id="tag">An app for <span class="g">you</span><br>and the one who <span class="g">supports you</span></div>
  <div id="mid"><div id="rule"></div>
    <div id="big">You're not crazy.<br>It's a trauma bond.</div>
    <div id="green">It's free. Link in bio.</div></div>
  <div id="brand">TURN SOMEDAY INTO DAY ONE</div>
</div></div><script>
window.FILM_LEN=15200;
const CV=document.getElementById('cv'),X=CV.getContext('2d');
const MIDY=790, CYCLE=520, SPIKE=0.28, A_SPIKE=300, A_CALM=13;

// deterministic - seek() must give the same frame every time it is called
function hash(n){const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s);}
function isSpike(wx){const u=(((wx%CYCLE)+CYCLE)%CYCLE)/CYCLE;return u<SPIKE;}
function waveY(wx){
  const u=(((wx%CYCLE)+CYCLE)%CYCLE)/CYCLE;
  if(u<SPIKE){
    const k=u/SPIKE, env=Math.pow(Math.sin(Math.PI*k),0.7);
    const seg=Math.floor(wx/7), r=hash(seg)*2-1, r2=hash(seg*3.7+11)*2-1;
    return -(r*0.72+r2*0.28)*A_SPIKE*env;
  }
  const k=(u-SPIKE)/(1-SPIKE), settle=Math.exp(-k*7);
  return Math.sin(wx*0.10)*A_CALM*(1+settle*9)+Math.sin(wx*0.31)*A_CALM*0.35;
}

const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeIO=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
// camera keyframes: [t, worldX, zoom]
const CAM=[[0,55,1.90],[4.2,330,1.85],[8.4,430,1.80],[12.6,915,0.42]];
function cam(t){
  if(t<=CAM[0][0])return[CAM[0][1],CAM[0][2]];
  for(let i=1;i<CAM.length;i++){
    if(t<=CAM[i][0]){
      const a=CAM[i-1],b=CAM[i],p=easeIO((t-a[0])/(b[0]-a[0]));
      return[a[1]+(b[1]-a[1])*p, a[2]+(b[2]-a[2])*p];
    }
  }
  const L=CAM[CAM.length-1];return[L[1],L[2]];
}

function draw(t){
  X.fillStyle='#0f0c29';X.fillRect(0,0,1080,1920);
  const[cx,zoom]=cam(t);
  const halfW=540/zoom, x0=cx-halfW, x1=cx+halfW;
  const step=Math.max(0.5,1.6/zoom);
  // group consecutive samples by spike/calm so each stretch gets its own colour
  let runs=[],cur=null;
  for(let wx=x0;wx<=x1;wx+=step){
    const sp=isSpike(wx);
    if(!cur||cur.sp!==sp){ if(cur)cur.pts.push([wx,waveY(wx)]); cur={sp:sp,pts:[]};runs.push(cur); }
    cur.pts.push([wx,waveY(wx)]);
  }
  const toS=(wx,wy)=>[540+(wx-cx)*zoom, MIDY+wy*zoom];
  // faint baseline
  X.strokeStyle='rgba(102,114,160,.16)';X.lineWidth=2;
  X.beginPath();X.moveTo(0,MIDY);X.lineTo(1080,MIDY);X.stroke();
  X.lineCap='round';X.lineJoin='round';
  for(const r of runs){
    if(r.pts.length<2)continue;
    X.beginPath();
    for(let i=0;i<r.pts.length;i++){
      const[sx,sy]=toS(r.pts[i][0],r.pts[i][1]);
      i?X.lineTo(sx,sy):X.moveTo(sx,sy);
    }
    if(r.sp){ X.strokeStyle='rgba(255,255,255,.93)';X.lineWidth=Math.max(2,5.5*zoom);
              X.shadowColor='rgba(255,255,255,.30)';X.shadowBlur=18*zoom; }
    else    { X.strokeStyle='#7ee8a2';X.lineWidth=Math.max(2.4,6.5*zoom);
              X.shadowColor='rgba(126,232,162,.55)';X.shadowBlur=30*zoom; }
    X.stroke();
  }
  X.shadowBlur=0;
  // vignette keeps the text half readable
  const g=X.createLinearGradient(0,MIDY+200,0,1920);
  g.addColorStop(0,'rgba(15,12,41,0)');g.addColorStop(1,'rgba(15,12,41,.92)');
  X.fillStyle=g;X.fillRect(0,MIDY+200,1080,1920-MIDY-200);
}

const SUBS=[
  [0.15,4.00,"The bad night ends.<br>They're sorry. They're gentle again."],
  [4.35,8.20,"And the relief feels<br>exactly like <span class='g'>love</span>."],
  [8.55,12.40,"That's the bond.<br>Not the good days &mdash; the<br><span class='g'>relief</span> after the bad ones."],
];
window.seek=function(ms){
  const t=ms/1000;
  draw(t);
  const sub=document.getElementById('sub');
  let line=null;
  for(const L of SUBS){ if(t>=L[0]&&t<L[1]){line=L;break;} }
  if(line){ if(sub.innerHTML!==line[2])sub.innerHTML=line[2];
    sub.style.opacity=Math.min(1,(t-line[0])/0.22,(line[1]-t)/0.22); }
  else sub.style.opacity=0;
  const ec=cl((t-12.60)/0.55,0,1);
  document.getElementById('end').style.opacity=ec;
  document.getElementById('wm').style.opacity=1-ec;
  document.getElementById('big').style.opacity=cl((t-12.95)/0.42,0,1);
  document.getElementById('green').style.opacity=cl((t-13.50)/0.42,0,1);
  document.getElementById('brand').style.opacity=cl((t-13.90)/0.42,0,1)*0.9;
};seek(0);
</script></body></html>
