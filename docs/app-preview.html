<title>Turn Someday Into Day One — App Preview</title>
<style>
  :root {
    --bg: #f5f6f8;
    --fg: #14151a;
    --muted: #5b5f6b;
    --card-bg: #ffffff;
    --border: #e2e4e9;
    --accent: #5b52e8;
    --shadow: 0 1px 3px rgba(20,21,26,0.08), 0 1px 2px rgba(20,21,26,0.06);
  }
  :root[data-theme="dark"] {
    --bg: #0f1015;
    --fg: #f1f2f5;
    --muted: #9aa0ac;
    --card-bg: #1a1b22;
    --border: #2a2c36;
    --accent: #8b83ff;
    --shadow: 0 1px 3px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.4);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1015;
      --fg: #f1f2f5;
      --muted: #9aa0ac;
      --card-bg: #1a1b22;
      --border: #2a2c36;
      --accent: #8b83ff;
      --shadow: 0 1px 3px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    max-width: 1100px;
    margin: 0 auto;
    padding: 48px 24px 24px;
  }
  header h1 {
    font-size: 28px;
    margin: 0 0 8px;
  }
  header p {
    color: var(--muted);
    font-size: 15px;
    margin: 0;
    max-width: 640px;
    line-height: 1.5;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 8px 24px 64px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 24px;
  }
  .card {
    margin: 0;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
  }
  .card img {
    width: 100%;
    display: block;
    background: #0b0c11;
  }
  .card figcaption {
    padding: 14px 16px 18px;
  }
  .card h3 {
    margin: 0 0 4px;
    font-size: 15px;
    font-weight: 600;
  }
  .card p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.45;
  }
  footer {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px 48px;
    color: var(--muted);
    font-size: 12px;
  }
</style>
